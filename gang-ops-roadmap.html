<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gang Operations Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Fraunces:opsz,wght@9..144,400..800&display=swap">
<style>
/* ============================================================
   THE GANG OPERATIONS HUB
   Palette and type pulled from thegangfitness.com
   ============================================================ */
:root{
  /* brand */
  --cream:#FFFAF3;
  --ink:#0F0B09;
  --wine:#840728;
  --red:#E40224;
  --pink:#FF54BF;
  --sky:#D9E7FF;

  /* warm neutrals biased toward the wine */
  --paper:#FFFFFF;
  --sand:#F6EEE3;
  --shell:#F0E4D5;
  --line:#E6D8C7;
  --line-soft:#F0E6DA;
  --stone:#8B7A6D;
  --stone-dk:#5E4F45;

  /* semantic */
  --ok:#2E6B4F;
  --warn:#C25E00;
  --crit:var(--red);

  --r-sm:8px;
  --r-md:14px;
  --r-lg:20px;
  --r-pill:999px;

  --shadow:0 1px 2px rgba(15,11,9,.04), 0 8px 24px -16px rgba(15,11,9,.22);
  --shadow-lift:0 2px 6px rgba(15,11,9,.06), 0 20px 44px -24px rgba(15,11,9,.32);

  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --ui:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;

  --rail:230px;
  color-scheme: light;
}

*,*::before,*::after{box-sizing:border-box;}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--ui);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
a{color:var(--red);}

:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px;}

h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance;letter-spacing:-.01em;}

summary{list-style:none;cursor:pointer;}
summary::-webkit-details-marker{display:none;}
summary::marker{content:"";}

.eyebrow{
  font-family:var(--ui);
  font-stretch:118%;
  font-size:.66rem;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--stone);
}

.num{font-variant-numeric:tabular-nums;}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:flex;min-height:100vh;}

.rail{
  width:var(--rail);
  flex:0 0 var(--rail);
  border-right:1px solid var(--line);
  background:var(--cream);
  padding:26px 18px 20px;
  display:flex;
  flex-direction:column;
  gap:26px;
  position:sticky;
  top:0;
  height:100vh;
}

.brand{display:flex;align-items:center;gap:11px;padding:0 6px;}
.brand-mark{
  width:38px;height:38px;flex:0 0 38px;
  border-radius:var(--r-pill);
  background:var(--wine);
  color:var(--cream);
  display:grid;place-items:center;
  font-family:var(--ui);
  font-stretch:120%;
  font-weight:700;
  font-size:.74rem;
  letter-spacing:.06em;
}
.brand-name{
  font-family:var(--display);
  font-size:1.02rem;
  font-weight:600;
  line-height:1.12;
  letter-spacing:-.015em;
}
.brand-name small{display:block;font-family:var(--ui);font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);margin-top:3px;font-stretch:115%;}

.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;
  border-radius:var(--r-pill);
  text-align:left;
  font-size:.9rem;
  font-weight:500;
  color:var(--stone-dk);
  transition:background .13s ease,color .13s ease;
}
.nav-item:hover{background:var(--sand);color:var(--ink);}
.nav-item[aria-current="page"]{background:var(--wine);color:var(--cream);font-weight:600;}
.nav-item[aria-current="page"] .nav-count{background:rgba(255,250,243,.22);color:var(--cream);}
.nav-count{
  font-size:.68rem;font-weight:700;
  background:var(--shell);color:var(--stone-dk);
  border-radius:var(--r-pill);
  padding:1px 7px;
  font-variant-numeric:tabular-nums;
}
.nav-count--alert{background:var(--red);color:#fff;}

.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;}
.who{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:10px 12px;
  background:var(--paper);
}
.who label{display:block;margin-bottom:5px;}
.who select{
  width:100%;
  border:none;background:none;
  font-family:var(--display);
  font-size:1rem;font-weight:600;
  padding:0;
}
.rail-link{
  font-size:.8rem;color:var(--stone);
  padding:6px 12px;border-radius:var(--r-pill);text-align:left;
}
.rail-link:hover{color:var(--ink);background:var(--sand);}
.rail-link[aria-current="page"]{color:var(--ink);background:var(--sand);font-weight:600;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 34px 90px;}

/* ============================================================
   PAGE HEADER
   ============================================================ */
.pagehead{
  border-bottom:1px solid var(--line);
  background:var(--cream);
  padding:26px 0 20px;
  margin-bottom:26px;
}
.pagehead .wrap{padding-bottom:0;}
.pagehead-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.pagehead h1{font-size:2.1rem;line-height:1.1;}
.pagehead .sub{color:var(--stone-dk);font-size:.92rem;margin-top:6px;}

.status-line{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  font-family:var(--display);
  font-size:2.6rem;
  font-weight:600;
  line-height:1.04;
  letter-spacing:-.025em;
}
.status-line .of{
  font-family:var(--ui);
  font-stretch:118%;
  font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--red);
  border:1px solid currentColor;
  border-radius:var(--r-pill);
  padding:5px 12px;
  align-self:center;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border-radius:var(--r-pill);
  padding:9px 17px;
  font-size:.82rem;font-weight:600;
  font-stretch:106%;
  border:1px solid transparent;
  transition:background .13s ease,color .13s ease,border-color .13s ease,transform .08s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn--primary{background:var(--wine);color:var(--cream);}
.btn--primary:hover{background:#6C0620;}
.btn--red{background:var(--red);color:#fff;}
.btn--red:hover{background:#C10120;}
.btn--ghost{border-color:var(--line);color:var(--stone-dk);background:var(--paper);}
.btn--ghost:hover{border-color:var(--ink);color:var(--ink);}
.btn--quiet{color:var(--stone-dk);padding:7px 12px;}
.btn--quiet:hover{background:var(--sand);color:var(--ink);}
.btn--danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 34%,transparent);background:var(--paper);}
.btn--danger:hover{background:color-mix(in srgb,var(--red) 9%,var(--paper));}
.btn--sm{padding:6px 13px;font-size:.75rem;}
.btn[disabled]{opacity:.42;pointer-events:none;}

/* ============================================================
   CYCLE RIBBON  (Between Programs -> Week 1..14)
   ============================================================ */
.ribbon{
  display:flex;align-items:stretch;gap:4px;
  margin-top:20px;
  overflow-x:auto;
  padding-bottom:6px;
  scrollbar-width:thin;
}
.seg{
  flex:1 1 0;
  min-width:30px;
  height:38px;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--stone);
  font-size:.72rem;font-weight:600;
  font-variant-numeric:tabular-nums;
  display:grid;place-items:center;
  position:relative;
  transition:border-color .13s ease,background .13s ease,color .13s ease;
}
.seg--bp{flex:0 0 118px;min-width:118px;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;font-stretch:112%;}
.seg:hover{border-color:var(--ink);color:var(--ink);}
.seg--past{background:var(--shell);border-color:var(--shell);color:var(--stone-dk);}
.seg--now{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 16px -8px var(--red);}
.seg--sel{border-color:var(--ink);color:var(--ink);border-width:2px;}
.seg--now.seg--sel{border-color:var(--ink);}
.seg .dot{
  position:absolute;top:5px;right:5px;
  width:5px;height:5px;border-radius:50%;
  background:var(--red);
}
.seg--now .dot{background:#fff;}
.ribbon-legend{display:flex;gap:16px;margin-top:8px;}
.ribbon-legend span{font-size:.68rem;color:var(--stone);display:flex;align-items:center;gap:6px;}
.ribbon-legend i{width:9px;height:9px;border-radius:3px;display:block;}

/* ============================================================
   STAT TILES
   ============================================================ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px;}
.stat{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--paper);
  padding:15px 16px 14px;
  position:relative;
  overflow:hidden;
}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stone);opacity:.28;}
.stat--done::before{background:var(--ok);opacity:1;}
.stat--left::before{background:var(--wine);opacity:1;}
.stat--over::before{background:var(--red);opacity:1;}
.stat-n{font-family:var(--display);font-size:2.1rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.stat--over .stat-n{color:var(--red);}
.stat-l{margin-top:7px;}

/* ============================================================
   SECTIONS + CARDS
   ============================================================ */
.section{margin-bottom:34px;}
.section-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-bottom:9px;margin-bottom:12px;
  border-bottom:1px solid var(--line);
}
.section-head h2{font-size:1.22rem;}
.section-head .count{color:var(--stone);font-size:.8rem;font-variant-numeric:tabular-nums;}
.section--alert .section-head{border-bottom-color:color-mix(in srgb,var(--red) 40%,transparent);}
.section--alert .section-head h2{color:var(--red);}

.card{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--paper);
  overflow:hidden;
}

.empty{
  border:1px dashed var(--line);
  border-radius:var(--r-md);
  padding:26px 22px;
  text-align:center;
  color:var(--stone);
  font-size:.88rem;
  background:color-mix(in srgb,var(--sand) 50%,transparent);
}
.empty strong{display:block;font-family:var(--display);font-size:1.05rem;color:var(--stone-dk);margin-bottom:4px;font-weight:600;}

/* ============================================================
   TASK ROW
   ============================================================ */
.tasklist{display:flex;flex-direction:column;}
.task{
  display:flex;align-items:flex-start;gap:13px;
  padding:13px 15px;
  border-bottom:1px solid var(--line-soft);
  background:var(--paper);
  transition:background .12s ease;
}
.tasklist .task:last-child{border-bottom:none;}
.task:hover{background:var(--sand);}
.task--done{background:color-mix(in srgb,var(--sand) 55%,var(--paper));}
.task--done:hover{background:var(--sand);}
.task--over{box-shadow:inset 3px 0 0 var(--red);}

.check{
  flex:0 0 21px;width:21px;height:21px;margin-top:1px;
  border:1.5px solid var(--stone);
  border-radius:6px;
  display:grid;place-items:center;
  transition:background .12s ease,border-color .12s ease;
}
.check:hover{border-color:var(--wine);background:color-mix(in srgb,var(--wine) 8%,transparent);}
.check svg{width:13px;height:13px;opacity:0;transition:opacity .12s ease;}
.task--done .check{background:var(--wine);border-color:var(--wine);}
.task--done .check svg{opacity:1;stroke:var(--cream);}

.task-main{flex:1;min-width:0;}
.task-title{
  font-size:.94rem;font-weight:500;line-height:1.35;
  cursor:pointer;
  word-break:break-word;
}
.task--done .task-title{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--stone) 70%,transparent);color:var(--stone);}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;}
.task-note{margin-top:6px;font-size:.8rem;color:var(--stone);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.task-open{
  flex:0 0 auto;align-self:center;
  color:var(--stone);font-size:1rem;
  padding:4px 6px;border-radius:var(--r-sm);
}
.task-open:hover{background:var(--shell);color:var(--ink);}

/* chips */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.68rem;font-weight:600;
  padding:3px 9px;
  border-radius:var(--r-pill);
  white-space:nowrap;
  font-stretch:104%;
}
.chip--cat{background:color-mix(in srgb,var(--c) 11%,transparent);color:var(--c);}
.chip--cat i{width:6px;height:6px;border-radius:50%;background:var(--c);}
.chip--owner{background:var(--shell);color:var(--stone-dk);}
.chip--owner[data-owner="Unassigned"]{background:transparent;border:1px dashed var(--line);color:var(--stone);}
.chip--owner[data-owner="Shared"]{background:var(--sky);color:#1E3D6B;}
.chip--due{background:transparent;color:var(--stone);border:1px solid var(--line);font-variant-numeric:tabular-nums;}
.chip--due.is-over{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 7%,transparent);}
.chip--st{border:1px solid transparent;}
.chip--st[data-st="not_started"]{background:transparent;border-color:var(--line);color:var(--stone);}
.chip--st[data-st="in_progress"]{background:color-mix(in srgb,var(--pink) 15%,transparent);color:#B0117A;}
.chip--st[data-st="waiting"]{background:var(--sky);color:#1E3D6B;}
.chip--st[data-st="complete"]{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok);}
.chip--recur{background:color-mix(in srgb,var(--wine) 9%,transparent);color:var(--wine);}
.chip--hand{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn);}

/* ============================================================
   FILTER BAR
   ============================================================ */
.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
.filter{
  padding:6px 14px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:var(--paper);
  font-size:.78rem;font-weight:600;color:var(--stone-dk);
  transition:all .12s ease;
}
.filter:hover{border-color:var(--ink);color:var(--ink);}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream);}
.filter-label{margin-right:3px;}

/* ============================================================
   WEEK GROUPS (Program view)
   ============================================================ */
.stage{border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);margin-bottom:11px;overflow:hidden;}
.stage--now{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 10%,transparent);}
.stage--bp{background:color-mix(in srgb,var(--sand) 60%,var(--paper));}
.stage-head{
  display:flex;align-items:center;gap:14px;
  width:100%;padding:14px 16px;text-align:left;
}
.stage-head:hover{background:var(--sand);}
.stage-num{
  flex:0 0 auto;min-width:74px;
  font-family:var(--ui);font-stretch:116%;
  font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--stone);
}
.stage--now .stage-num{color:var(--red);}
.stage-title{flex:1;font-family:var(--display);font-size:1.06rem;font-weight:600;}
.stage-bar{flex:0 0 92px;height:5px;border-radius:var(--r-pill);background:var(--shell);overflow:hidden;}
.stage-bar i{display:block;height:100%;background:var(--wine);border-radius:var(--r-pill);}
.stage-meta{flex:0 0 auto;font-size:.76rem;color:var(--stone);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}
.stage-caret{color:var(--stone);transition:transform .16s ease;}
.stage[open] .stage-caret{transform:rotate(90deg);}
.stage-body{border-top:1px solid var(--line-soft);}
.stage-add{padding:10px 15px;border-top:1px solid var(--line-soft);}
.runup{padding:11px 15px 8px;background:var(--sand);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}
.stage-body > .runup:first-child{border-top:none;}

/* ============================================================
   PEOPLE / RESPONSIBILITIES
   ============================================================ */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:30px;}
.person{
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);
  padding:17px 17px 15px;
  display:flex;flex-direction:column;gap:12px;
}
.person-top{display:flex;align-items:center;gap:11px;}
.avatar{
  width:40px;height:40px;flex:0 0 40px;border-radius:var(--r-pill);
  display:grid;place-items:center;
  font-family:var(--ui);font-stretch:118%;
  font-weight:700;font-size:.82rem;
  background:var(--wine);color:var(--cream);
}
.avatar[data-owner="Shared"]{background:var(--sky);color:#1E3D6B;}
.avatar[data-owner="Unassigned"]{background:transparent;border:1.5px dashed var(--line);color:var(--stone);}
.person-name{font-family:var(--display);font-size:1.16rem;font-weight:600;}
.person-sub{font-size:.76rem;color:var(--stone);}
.load{height:7px;border-radius:var(--r-pill);background:var(--shell);overflow:hidden;display:flex;}
.load i{display:block;height:100%;}
.person-nums{display:flex;gap:16px;}
.person-nums div{flex:1;}
.person-nums b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.person-nums span{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);font-weight:600;}
.person-nums .over b{color:var(--red);}
.catbars{display:flex;flex-direction:column;gap:5px;}
.catbar{display:flex;align-items:center;gap:9px;font-size:.76rem;}
.catbar-n{margin-left:auto;color:var(--stone);font-variant-numeric:tabular-nums;}
.catbar-t{flex:1;height:6px;border-radius:var(--r-pill);background:var(--shell);overflow:hidden;}
.catbar-t i{display:block;height:100%;background:var(--c);border-radius:var(--r-pill);}

/* ============================================================
   MODAL / DRAWER
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(15,11,9,.32);
  backdrop-filter:blur(2px);
  z-index:60;
  display:flex;justify-content:flex-end;
  animation:fade .16s ease;
}
.scrim--center{align-items:center;justify-content:center;padding:22px;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes popin{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}

.drawer{
  width:min(520px,100%);
  background:var(--cream);
  height:100%;
  overflow-y:auto;
  border-left:1px solid var(--line);
  animation:slidein .18s ease;
  display:flex;flex-direction:column;
}
.modal{
  width:min(560px,100%);
  max-height:calc(100vh - 44px);
  overflow-y:auto;
  background:var(--cream);
  border-radius:var(--r-lg);
  border:1px solid var(--line);
  box-shadow:var(--shadow-lift);
  animation:popin .16s ease;
}
@media (prefers-reduced-motion:reduce){
  .scrim,.drawer,.modal{animation:none;}
  *{transition-duration:.01ms !important;}
}
.dhead{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:20px 22px 16px;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--cream);z-index:2;
}
.dhead h2{font-size:1.35rem;line-height:1.22;}
.dbody{padding:20px 22px;display:flex;flex-direction:column;gap:18px;flex:1;}
.dfoot{
  padding:15px 22px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  position:sticky;bottom:0;background:var(--cream);
}
.dfoot .spacer{flex:1;}
.x{width:32px;height:32px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--stone);flex:0 0 32px;}
.x:hover{background:var(--shell);color:var(--ink);}

/* ============================================================
   FORM
   ============================================================ */
.field{display:flex;flex-direction:column;gap:6px;}
.field > label{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);font-stretch:112%;}
.inp,.sel,.ta{
  width:100%;
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  background:var(--paper);
  padding:9px 11px;
  font-size:.9rem;
  transition:border-color .12s ease,box-shadow .12s ease;
}

   timing wins without creating a second copy of the same job. */

  { match:"Open public registration", weeksBefore:8,
    note:"Jo's SOP: open new client registration for the remaining spots at week minus 8, alongside the waitlist email." },
  { match:"Send the end of program feedback survey", week:8,

<script>
/* ============================================================
   THE GANG OPERATIONS HUB — read only roadmap
   A plain view of the operating system. Nothing to click but the
   filters. Read it, note what you want changed, send it back.
   ============================================================ */
(function(){
"use strict";

const WEEKS   = 14;
const ONGOING = 99;
const OWNERS  = ["Jo","Sam","Stacey","Shared","Unassigned"];

/* The program this plan is written against. */
const PROGRAM = { name:"Winter 2027", start:"2027-01-04", end:"2027-04-11" };

/* ------------------------------------------------------------
   utilities
   ------------------------------------------------------------ */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function parseISO(s){ const a=String(s).split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function fmt(iso){ return parseISO(iso).toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"}); }
function fmtLong(iso){ return parseISO(iso).toLocaleDateString("en-CA",{month:"long",day:"numeric",year:"numeric"}); }
function initials(n){ const p=String(n).trim().split(/\s+/); return (p.length>1?p[0][0]+p[1][0]:String(n).slice(0,2)).toUpperCase(); }
function plural(n,one,many){ return n+" "+(n===1?one:(many||one+"s")); }

function cat(id){ return SEED_CATEGORIES.find(c=>c.id===id) || {id:id,name:"Uncategorised",color:"#8B7A6D"}; }

function stageKey(week,weeksBefore){
  if(week===ONGOING) return "ongoing";
  if(week===0) return "b"+(weeksBefore==null?"x":weeksBefore);
  return "w"+week;
}
function stageRank(week,weeksBefore){
  if(week===ONGOING) return -1000;
  if(week===0) return -(weeksBefore==null?0:weeksBefore) - 1;   /* furthest out first */
  return week;
}
function stageTitle(week,weeksBefore){
  if(week===ONGOING) return "Ongoing";
  if(week===0) return weeksBefore==null ? "Between programs" : weeksBefore+" week"+(weeksBefore===1?"":"s")+" out";
  return "Week "+week;
}
function stageWhen(week,weeksBefore){
  if(week===ONGOING) return "every day, the whole program";
  if(week===0){
    if(weeksBefore==null) return "no fixed timing";
    return "by "+fmt(addDays(PROGRAM.start,-weeksBefore*7));
  }
  return fmt(addDays(PROGRAM.start,(week-1)*7))+" to "+fmt(addDays(PROGRAM.start,(week-1)*7+6));
}
function timingText(week,weeksBefore){
  if(week===ONGOING) return "Every day";
  if(week===0) return weeksBefore==null ? "Between programs" : weeksBefore+" wk before start";
  return "Week "+week;
}

/* ------------------------------------------------------------
   data
   ------------------------------------------------------------ */
/* Numbered in the order the plan runs, so the numbers read 1 to 189 down
   the page and stay put as a reference when you regroup or filter. */
const ITEMS = SEED_TEMPLATE.map(r=>({
  title:r[0], cat:r[1], week:r[2],
  weeksBefore:(r[3]==null?null:r[3]), notes:r[4]||"",
  owner:"Unassigned"
}))
.sort((a,b)=>
  stageRank(a.week,a.weeksBefore)-stageRank(b.week,b.weeksBefore) ||
  String(a.title).localeCompare(String(b.title)))
.map((it,i)=>Object.assign(it,{n:i+1}));

const UI = { q:"", cat:"all", owner:"all", by:"stage" };

function filtered(){
  const q=UI.q.trim().toLowerCase();
  return ITEMS.filter(it=>{
    if(UI.cat!=="all" && it.cat!==UI.cat) return false;
    if(UI.owner!=="all" && it.owner!==UI.owner) return false;
    if(q && (it.title+" "+it.notes+" "+cat(it.cat).name).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}

/* ------------------------------------------------------------
   pieces
   ------------------------------------------------------------ */
function catChip(id){
  const c=cat(id);
  return '<span class="chip chip--cat" style="--c:'+esc(c.color)+'"><i></i>'+esc(c.name)+'</span>';
}
function ownerChip(o){
  return '<span class="chip chip--owner" data-owner="'+esc(o)+'">'+esc(o)+'</span>';
}
function row(it, showTiming){
  return '<div class="row">'+
    '<span class="row-n">'+it.n+'</span>'+
    '<span class="row-main">'+
      '<span class="row-title">'+esc(it.title)+'</span>'+
      '<span class="row-chips">'+
        catChip(it.cat)+ownerChip(it.owner)+
        (showTiming?'<span class="chip chip--due">'+esc(timingText(it.week,it.weeksBefore))+'</span>':"")+
      '</span>'+
      (it.notes?'<span class="row-note">'+esc(it.notes)+'</span>':"")+
    '</span>'+
  '</div>';
}

function groupsByStage(list){
  const map={};
  list.forEach(it=>{
    const k=stageKey(it.week,it.weeksBefore);
    if(!map[k]) map[k]={ id:k, rank:stageRank(it.week,it.weeksBefore),
                         title:stageTitle(it.week,it.weeksBefore),
                         when:stageWhen(it.week,it.weeksBefore), items:[] };
    map[k].items.push(it);
  });
  return Object.keys(map).map(k=>map[k]).sort((a,b)=>a.rank-b.rank);
}
function groupsByOwner(list){
  return OWNERS.map(o=>({
    id:"o-"+o.toLowerCase(), title:o,
    when:o==="Unassigned"?"nobody owns these yet":"",
    items:list.filter(it=>it.owner===o)
  })).filter(g=>g.items.length);
}
function groupsByCategory(list){
  return SEED_CATEGORIES.map(c=>({
    id:"c-"+c.id, title:c.name, when:"",
    items:list.filter(it=>it.cat===c.id)
  })).filter(g=>g.items.length);
}

function ribbon(){
  const counts={};
  ITEMS.forEach(it=>{ if(it.week!==ONGOING) counts[it.week]=(counts[it.week]||0)+1; });
  let out='<div class="ribbon">';
  out+='<button class="seg seg--bp" disabled title="'+(counts[0]||0)+' responsibilities">Between</button>';
  for(let w=1;w<=WEEKS;w++){
    out+='<button class="seg" disabled title="'+(counts[w]||0)+' responsibilities">'+w+'</button>';
  }
  out+='</div>';
  return out;
}

/* ------------------------------------------------------------
   render
   ------------------------------------------------------------ */
function head(){
  const byOwner={};
  OWNERS.forEach(o=>byOwner[o]=ITEMS.filter(it=>it.owner===o).length);
  const between=ITEMS.filter(it=>it.week===0).length;
  const during=ITEMS.filter(it=>it.week>=1&&it.week<=WEEKS).length;
  const ongoing=ITEMS.filter(it=>it.week===ONGOING).length;

  return '<header class="masthead">'+
    '<div class="eyebrow">The Gang Fitness &middot; operations</div>'+
    '<h1>The operating plan</h1>'+
    '<p class="lede">Every recurring responsibility that runs a program, in the order it happens. '+
      'The eight week run-up first, then the fourteen weeks themselves, plus the jobs that run every day throughout. '+
      'Nothing here is owned yet, on purpose.</p>'+
    '<div class="programline">'+
      '<span class="tag">'+esc(PROGRAM.name)+'</span>'+
      '<span>'+fmtLong(PROGRAM.start)+' to '+fmtLong(PROGRAM.end)+'</span>'+
      '<span>&middot;</span><span>'+ITEMS.length+' responsibilities across '+SEED_CATEGORIES.length+' areas</span>'+
    '</div>'+
    ribbon()+
    '<div class="tiles">'+
      '<div class="tile"><b>'+ongoing+'</b><span class="eyebrow">Every day</span></div>'+
      '<div class="tile"><b>'+between+'</b><span class="eyebrow">Before it starts</span></div>'+
      '<div class="tile"><b>'+during+'</b><span class="eyebrow">During the 14 weeks</span></div>'+
      '<div class="tile"><b>'+ITEMS.length+'</b><span class="eyebrow">Total</span></div>'+
    '</div>'+
    '<div class="owners">'+
      OWNERS.map(o=>'<div class="ownercard"><span class="av" data-o="'+esc(o)+'">'+
        esc(o==="Unassigned"?"?":(o==="Shared"?"WE":initials(o)))+'</span>'+
        '<span><b>'+byOwner[o]+'</b><span>'+esc(o)+'</span></span></div>').join("")+
    '</div>'+
  '</header>';
}

function toolbar(n){
  return '<div class="toolbar"><div class="page"><div class="toolbar-in">'+
    '<input class="search" id="q" placeholder="Search the plan&hellip;" value="'+esc(UI.q)+'">'+
    '<select class="sel" id="fby" style="width:auto;min-width:140px">'+
      [["stage","Group by stage"],["cat","Group by area"],["owner","Group by owner"]]
        .map(o=>'<option value="'+o[0]+'"'+(UI.by===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+
    '</select>'+
    '<select class="sel" id="fcat" style="width:auto;min-width:150px"><option value="all">Every area</option>'+
      SEED_CATEGORIES.map(c=>'<option value="'+esc(c.id)+'"'+(UI.cat===c.id?" selected":"")+'>'+esc(c.name)+'</option>').join("")+
    '</select>'+
    '<select class="sel" id="fowner" style="width:auto;min-width:130px"><option value="all">Everyone</option>'+
      OWNERS.map(o=>'<option value="'+esc(o)+'"'+(UI.owner===o?" selected":"")+'>'+esc(o)+'</option>').join("")+
    '</select>'+
    '<span class="count">'+plural(n,"responsibility","responsibilities")+'</span>'+
  '</div></div></div>';
}

function body(){
  const list=filtered();
  if(!list.length){
    return '<div class="empty"><strong>Nothing matches</strong>Clear the filters to see the rest of the plan.</div>';
  }
  const groups = UI.by==="owner" ? groupsByOwner(list)
               : UI.by==="cat"   ? groupsByCategory(list)
               : groupsByStage(list);

  const jump = groups.length>3 ?
    '<nav class="jump">'+groups.map(g=>'<a href="#'+esc(g.id)+'">'+esc(g.title)+' <span>'+g.items.length+'</span></a>').join("")+'</nav>' : "";

  return jump + groups.map(g=>
    '<section class="group" id="'+esc(g.id)+'">'+
      '<div class="groupbar"><h2>'+esc(g.title)+'</h2>'+
        (g.when?'<span class="when">'+esc(g.when)+'</span>':"")+
        '<span class="n">'+g.items.length+'</span></div>'+
      '<div class="rowlist">'+g.items.map(it=>row(it, UI.by!=="stage")).join("")+'</div>'+
    '</section>'
  ).join("") + foot();
}

function foot(){
  return '<div class="foot">'+
    'This is a read only picture of the plan. Nothing on this page saves or changes anything. '+
    'Read it, write down what you want added, removed, reworded, retimed or reassigned, and send that to Quinton.'+
    '<div style="margin-top:12px"><button class="btn btn--ghost btn--sm" id="printbtn">Print or save as PDF</button></div>'+
  '</div>';
}

function render(){
  const y=window.scrollY;
  document.getElementById("root").innerHTML =
    '<div class="page page--top">'+head()+'</div>'+
    toolbar(filtered().length)+
    '<div class="page">'+body()+'</div>';
  window.scrollTo(0,y);
}

/* ------------------------------------------------------------
   events
   ------------------------------------------------------------ */
document.addEventListener("change",function(ev){
  const t=ev.target;
  if(t.id==="fby")    { UI.by=t.value;    render(); }
  if(t.id==="fcat")   { UI.cat=t.value;   render(); }
  if(t.id==="fowner") { UI.owner=t.value; render(); }
});

let qTimer=null;
document.addEventListener("input",function(ev){
  if(ev.target.id!=="q") return;
  UI.q=ev.target.value;
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{
    const v=UI.q;
    render();
    const el=document.getElementById("q");
    if(el){ el.focus(); el.value=v; el.setSelectionRange(v.length,v.length); }
  },250);
});

document.addEventListener("click",function(ev){
  if(ev.target && ev.target.id==="printbtn") window.print();
});

render();
})();
</script>
