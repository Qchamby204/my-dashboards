<script>
'use strict';
/* ================= DATA ================= */
const WARM=[];
const COLD=[];
/* ================= MODEL ================= */
const G={avgHH:500000,fee:0.011,payout:0.45,bonus:5000,roToResp:2.47,respToMeet:10,meetToWon:10};
G.hhFirstYear=aum=>(aum*G.fee*G.payout+G.bonus)*0.5;
const EV={messaged:15.15,replied:37.38,meeting:373.80};
EV.won=G.hhFirstYear(G.avgHH);
const GOAL={won:10};
GOAL.meetings=GOAL.won*G.meetToWon;                 // 100
GOAL.responses=GOAL.meetings*G.respToMeet;          // 1000
GOAL.contacts=Math.round(GOAL.responses*G.roToResp);// 2470
const SEASON_END=new Date(2026,11,31,23,59,59);
const TIERS={0:{name:"Never messaged"},1:{name:"Said “later”"},2:{name:"You owe a reply"},3:{name:"Meeting discussed"},4:{name:"Fizzled"},5:{name:"Never replied"},6:{name:"Rest"},7:{name:"Said no"}};
const DEF_TPL={
 t0:`Hi {first}, how's your summer been? We've been connected on here for a while and never actually met, figured it's about time. Would love to grab a coffee if you're free in the next couple weeks.`,
 t1:`Hi {first}, been a while since we chatted. How's your summer been? If you're up for that coffee sometime I'd love to catch up.`,
 t2:`Hi {first}, just saw your message sitting in my inbox, sorry for the slow reply. How's your summer going?`,
 t3:`Hi {first}, we talked about grabbing a coffee and it never happened. Still up for it? I'm around the next couple weeks.`,
 t4:`Hi {first}, been a while! How's your summer been?`,
 t5:`Hi {first}, how's your summer been? No worries if my last note got buried, just wanted to say hi.`,
 t6:`(Wait for a trigger event, a new role, promotion, or post, then: “Congrats on the new role, {first}!” Nothing else.)`,
 t7:`Happy holidays {first}, hope the year has treated you well!`,
 fu_messaged:`Hi {first}, just bumping this up, I know summer gets busy. How's yours been?`,
 fu_replied:`Hi {first}, good hearing from you last time. How's the rest of your summer been?`,
 fu_meeting:`Hi {first}, looking forward to it. Are we still good for our chat?`
};
/* ---- message rotation ----
   One angle gets stale fast. Each situation carries a few variants: the
   editable template above is always option one, these ride alongside it.
   Voice rule: reads like a text to a friend. Short, casual, zero sales
   energy, no em dashes. Seasonal (summer) so an August sweep feels timely. */
const VAR_BASE_L={t0:'Summer hello',t1:'Catch up',t2:'Sorry, slow reply',t3:'That coffee',t4:'Been a while',t5:'Just saying hi',t6:'Trigger only',t7:'Holiday note',fu_messaged:'Bump',fu_replied:'How\'s summer',fu_meeting:'Still on?'};
const ALT_TPL={
 t0:[
  {l:'Their world',needCo:true,t:`Hi {first}, we've never actually met but I've been meaning to say hi. How are things at {co} these days?`},
  {l:'Simple hello',t:`Hi {first}, realized we've been connected on here for ages and never said hello. What's keeping you busy this summer?`}
 ],
 t1:[
  {l:'What\'s new',t:`Hi {first}, what's going on in your world these days? Feels like it's been forever.`},
  {l:'Coffee ask',t:`Hi {first}, I know the timing wasn't right when we last talked, no stress at all. I'd love to catch up over a coffee if you're free in the next couple weeks.`}
 ],
 t2:[
  {l:'How\'ve you been',t:`Hi {first}, my apologies, your last note slipped by me. How have you been?`}
 ],
 t3:[
  {l:'Still owe you',t:`Hi {first}, I still owe you that coffee. Free sometime in the next couple weeks?`}
 ],
 t4:[
  {l:'Your world',t:`Hi {first}, what's going on in your world these days?`},
  {l:'Thought of you',t:`Hi {first}, thought of you today. How's the summer treating you?`},
  {l:'Their business',needCo:true,t:`Hi {first}, been too long! How are things going at {co}?`}
 ],
 t5:[
  {l:'Checking in',t:`Hi {first}, just checking in. What's new in your world?`}
 ],
 fu_messaged:[
  {l:'Float it up',t:`Hi {first}, floating this back up in case it got buried. No rush at all.`}
 ],
 fu_replied:[
  {l:'Coffee ask',t:`Hi {first}, I'd love to catch up over a coffee if you're free in the next couple weeks. How's your calendar looking?`},
  {l:'Your world',t:`Hi {first}, what's going on in your world these days? Feels like it's time for a proper catch-up.`}
 ],
 fu_meeting:[
  {l:'Confirm',t:`Hi {first}, just confirming we're still on. Anything you want me to make sure we cover?`}
 ]
};
function msgKeyFor(c){
  const s=stg(c);
  if(s==='pool') return 't'+(c.tier!==null?c.tier:0);
  return 'fu_'+(DEF_TPL['fu_'+s]?s:'messaged');
}
function variantsFor(c){
  const k=msgKeyFor(c), out=[];
  if(stg(c)==='pool'&&c.msg) out.push({l:'Prepared for them',t:c.msg});
  out.push({l:VAR_BASE_L[k]||'Template',t:tpl(k)});
  (ALT_TPL[k]||[]).forEach(v=>{ if(v.needCo&&!(c.co||'').trim()) return; out.push(v); });
  return out.map(v=>({l:v.l,t:fill(v.t,c)}));
}
const TPL_LABEL={t0:'Warm · Never messaged',t1:'Warm · Said “later”',t2:'Warm · You owe a reply',t3:'Warm · Meeting discussed',t4:'Warm · Fizzled',t5:'Warm · Never replied',t6:'Warm · Rest (trigger only)',t7:'Warm · Said no (annual)',fu_messaged:'Follow-up · after first message',fu_replied:'Follow-up · they replied, book the call',fu_meeting:'Follow-up · meeting confirm'};
const tpl=k=>((S.tpl||{})[k])||DEF_TPL[k];
const fill=(t,c)=>String(t).split('{first}').join(c.first||'there').split('{co}').join((c.co||'your business').trim());

const POS_WORDS=['sure','happy','love to','interested','looking forward',"let's",'sounds good','absolutely','yes','of course','keen','open to','would be great'];
const NEG_WORDS=['already have','not interested','no thank','all set','not looking','have an advisor','no need','unsubscribe'];
function senti(s){ s=(s||'').toLowerCase(); if(!s) return 'mid'; if(NEG_WORDS.some(k=>s.includes(k))) return 'neg'; if(POS_WORDS.some(k=>s.includes(k))) return 'pos'; return 'mid'; }
const first=n=>(n||'').replace(/^(Dr\.?|Mr\.?|Ms\.?|Mrs\.?)\s+/i,'').split(/[ ,]/)[0];
const normUrl=u=>(u||'').trim().toLowerCase().replace(/\/+$/,'');
/* ================= UNIFY + DEDUP ================= */
const STAGE_ORDER={pool:0,messaged:1,replied:2,meeting:3,won:4,lost:4,parked:0};
const COLD_STAGE={pipeline:'pool',reached_out:'messaged',responded:'replied',meeting_set:'meeting',won:'won',lost:'lost'};
const CONTACTS=[]; const BYUID={}; const URLIX={};
(function build(){
  const coldByUrl={};
  COLD.forEach(r=>{ const u=normUrl(r.url); if(u) coldByUrl[u]=r; });
  const merged=new Set();
  COLD.forEach(r=>{
    const u0=normUrl(r.url);
    if(u0 && URLIX[u0]) return; // intra-dataset duplicate
    const self=u0.includes('quinton-chambers');
    const anon=!((r.name||'').trim()) || (r.name||'').trim().toLowerCase()==='linkedin member' || self;
    const c={uid:'c'+r.id, name:r.name||'Unknown', first:r.first_name||first(r.name), title:r.position||'', co:r.company||'',
      url:r.url||'', email:r.email||'', src:'cold', tier:null, score:r.score||0, intel:r.intel||'', news:(r.news&&r.news!=='No recent coverage found')?r.news:'',
      msg:r.message||'', lastmsg:'', theirs:false, peer:false, mq:null, senti:senti(r.sentiment), sentiRaw:r.sentiment||'', lastDate:r.last_date||'',
      base: anon?'parked':(COLD_STAGE[r.stage]||'pool')};
    CONTACTS.push(c); BYUID[c.uid]=c; if(c.url) URLIX[normUrl(c.url)]=c.uid;
  });
  WARM.forEach(r=>{
    const u=normUrl(r.url);
    const self=u.includes('quinton-chambers');
    if(u && URLIX[u]){ // url already owned by a surviving contact
      const c=BYUID[URLIX[u]];
      if(c && c.src==='cold' && c.tier===null){ // merge warm context into the cold record
        c.tier=r.p; c.lastmsg=r.lastmsg||''; c.theirs=!!r.theirs; c.peer=!!r.peer; c.mq=r.mq;
        if(!c.title) c.title=r.title||''; if(!c.co) c.co=r.co||'';
        c.warmId=r.id; merged.add(r.id);
      }
      return; // duplicate either way
    }
    if(self){
      const c={uid:'w'+r.id,name:r.name,first:first(r.name),title:r.title||'',co:r.co||'',url:r.url||'',email:'',src:'warm',tier:r.p,score:null,intel:'',news:'',msg:'',lastmsg:'',theirs:false,peer:true,mq:r.mq,senti:'mid',sentiRaw:'',lastDate:'',base:'parked'};
      CONTACTS.push(c); BYUID[c.uid]=c; URLIX[u]=c.uid; return;
    }
    const c={uid:'w'+r.id, name:r.name, first:first(r.name), title:r.title||'', co:r.co||'', url:r.url||'', email:'',
      src:'warm', tier:r.p, score:null, intel:'', news:'', msg:'', lastmsg:r.lastmsg||'', theirs:!!r.theirs, peer:!!r.peer,
      mq:r.mq, senti:'mid', sentiRaw:'', lastDate:'', base: r.p===7?'parked':'pool'};
    CONTACTS.push(c); BYUID[c.uid]=c; if(c.url) URLIX[normUrl(c.url)]=c.uid;
  });
})();
/* ================= VETTING (industry peers + pitchers) ================= */

document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('tplOv').style.display==='grid'){ if(e.target&&e.target.tagName==='TEXTAREA'){e.target.blur();return;} closeTpl(); } });
/* ================= VIEWS ================= */
const TABSDEF=[['today','Today'],['pipe','Pipeline'],['score','Scoreboard'],['base','Database']];
let tab='today', q='', dbStage='', dbSrc='', page=0;
function nav(t){ tab=t; page=0; render(); window.scrollTo(0,0); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2400); }
function statBar(){
  const t=today(); const sT=sendsToday();
  let bars=''; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const n=S.log.filter(a=>(a.to==='messaged'||a.to==='followup')&&dayKey(a.ts)===dayKey(d)).length; bars+='<i title="'+dayKey(d)+': '+n+'" style="height:'+Math.min(24,2+n)+'px"></i>'; }
  return '<div class="statbar">'
   +'<span class="s">Today <b>'+sT+'</b>/'+S.set.target+' sends</span>'
   +'<span class="s">🔥 <b>'+streak()+'</b>-day streak</span>'
   +'<span class="s green">≈ <b>'+fmt$(evToday())+'</b> EV today</span>'
   +'<span class="s">🌐 Pool <b>'+freshQueue().length.toLocaleString()+'</b> untouched</span>'
   +'<span class="spark" title="sends · last 14 days">'+bars+'</span></div>';
}
function pageToday(){
  const due=fuDue(), reps=replyQueue(), fresh=freshQueue();
  const remaining=Math.max(0,S.set.target-sendsToday());
  const posN=reps.filter(c=>c.senti==='pos').length;
  let h='<div class="planstrip"><b class="gold">THE SYSTEM</b><span>❶ Clear follow-ups</span><span>→</span><span>❷ Work the replies (💚 first)</span><span>→</span><span>❸ Send '+S.set.target+' fresh</span><span style="margin-left:auto" class="mut">15–30 min. Everything else is optional.</span></div>';
  h+=statBar();
  h+='<div class="card" style="text-align:center;border-color:rgba(201,168,76,.45);padding:24px">'
    +'<div style="font-size:15px;color:#8a93a8">One button. It queues everything below in the right order.</div>'
    +'<button class="btn primary" style="font-size:16px;padding:14px 34px;margin-top:12px" onclick="runDay()">▶ Run my day ('+Math.min(due.length+Math.min(reps.length,S.set.replyN)+remaining, due.length+Math.min(reps.length,S.set.replyN)+fresh.length)+' cards)</button></div>';
  h+='<div class="qgrid">';
  h+='<div class="qcard" onclick="rQ=fuDue();rI=0;if(rQ.length){document.getElementById(\'runner\').classList.add(\'active\');renderRun();}else toast(\'No follow-ups due\')">'
    +'<div class="qn '+(due.length?'red':'green')+'">'+due.length+'</div><div class="ql">❶ Follow-ups due</div><div class="qs">People mid-conversation. Letting these slip is where pipelines die. Clear to zero daily.</div></div>';
  h+='<div class="qcard" onclick="rQ=replyQueue().slice(0,S.set.replyN);rI=0;if(rQ.length){document.getElementById(\'runner\').classList.add(\'active\');renderRun();}else toast(\'Reply backlog clear\')">'
    +'<div class="qn amber">'+reps.length+'</div><div class="ql">❷ Replies to work <span class="green">('+posN+' 💚 positive)</span></div><div class="qs">They already responded — highest-value contacts you own. Worked '+S.set.replyN+' at a time, warmest first.</div></div>';
  h+='<div class="qcard" onclick="rQ=freshQueue().slice(0,Math.max(0,S.set.target-sendsToday()));rI=0;if(rQ.length){document.getElementById(\'runner\').classList.add(\'active\');renderRun();}else toast(\'Daily target already hit ✓\')">'
    +'<div class="qn blue">'+remaining+'</div><div class="ql">❸ Fresh sends left today</div><div class="qs">Best targets first: warm “said later / owe reply / meeting discussed”, then top-scored cold with intel. Industry peers, big-bank staff & pitchers auto-removed.</div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-top:14px"><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center"><b class="gold" style="font-size:12px;letter-spacing:.08em">SETTINGS</b>'
    +'<label class="mut" style="font-size:12.5px">Daily sends <input type="number" min="5" max="100" value="'+S.set.target+'" style="width:64px" onchange="S.set.target=Math.max(1,parseInt(this.value)||20);save();render()"></label>'
    +'<label class="mut" style="font-size:12.5px">Replies per session <input type="number" min="1" max="50" value="'+S.set.replyN+'" style="width:60px" onchange="S.set.replyN=Math.max(1,parseInt(this.value)||10);save();render()"></label>'
    +'<label class="mut" style="font-size:12.5px">Auto follow-up (days) <input type="number" min="2" max="30" value="'+S.set.fuDays+'" style="width:56px" onchange="S.set.fuDays=Math.max(1,parseInt(this.value)||7);save()"></label>'
    +'<label class="mut" style="font-size:12.5px"><input type="checkbox" '+(S.set.peers?'checked':'')+' onchange="S.set.peers=this.checked;save();render()"> include industry peers</label>'
    +'</div></div>';
  return h;
}
function daysSince(c){
  const last=[...S.log].reverse().find(a=>a.uid===c.uid);
  const d=last?dayKey(last.ts):(c.lastDate||null);
  if(!d) return '';
  const n=Math.floor((Date.now()-new Date(d+'T00:00:00'))/86400000);
  return n<=0?'today':n+'d ago';
}
function rowHTML(c,showStage){
  const s=stg(c);
  const due=fu(c)&&fu(c)<=today();
  return '<div class="row">'
   +'<div class="who"><b>'+(c.url?'<a href="'+esc(c.url)+'" target="_blank" style="text-decoration:none;color:#e0e0e0">'+esc(c.name)+' ↗</a>':esc(c.name))+'</b>'
   +' '+(c.tier!==null?'<span class="badge b-warm">W'+c.tier+'</span>':'<span class="badge b-cold">COLD</span>')
   +(c.src==='cold'&&c.score?'<span class="badge b-score">'+c.score+'</span>':'')
   +(s==='replied'&&c.senti!=='mid'?'<span class="badge b-'+c.senti+'">'+(c.senti==='pos'?'💚':'🔴')+'</span>':'')
   +(c.pitched?'<span class="badge b-neg">⚠</span>':'')
   +(due?'<span class="badge b-due">⏰</span>':'')
   +'<div class="t">'+esc([c.title,c.co].filter(Boolean).join(' · '))+(daysSince(c)?' · <span class="mut">'+daysSince(c)+'</span>':'')+'</div></div>'
   +(showStage?'<select onchange="setStage(\''+c.uid+'\',this.value)">'+['pool','messaged','replied','meeting','won','lost','parked'].map(o=>'<option value="'+o+'"'+(o===s?' selected':'')+'>'+o+'</option>').join('')+'</select>':'')
   +'<input type="date" value="'+esc(fu(c))+'" title="follow-up" onchange="setFu(\''+c.uid+'\',this.value)">'
   +'<input type="text" value="'+esc(note(c))+'" placeholder="note…" style="flex:1;min-width:120px" onchange="setNote(\''+c.uid+'\',this.value)">'
   +'<button class="btn ghost" style="padding:6px 12px" onclick="runOne(\''+c.uid+'\')">▶ Work</button>'
   +'</div>';
}
function setStage(uid,v){ const prev=S.stage[uid]||BYUID[uid].base; S.stage[uid]=v; if(v!==prev&&['messaged','replied','meeting','won','lost'].includes(v)) logAct(uid,v==='messaged'?'messaged':v); if(v==='won'&&!S.aum[uid]) S.aum[uid]=G.avgHH; save(); render(); }
function setFu(uid,v){ S.fu[uid]=v||''; save(); render(); }
function setNote(uid,v){ S.note[uid]=v; save(); }
function setAum(uid,v){ S.aum[uid]=Math.max(0,parseInt(v)||G.avgHH); save(); render(); }
function pagePipe(){
  const groups=[['⏰ Overdue follow-ups',CONTACTS.filter(c=>fu(c)&&fu(c)<today()&&['messaged','replied','meeting'].includes(stg(c))).sort((a,b)=>fu(a)<fu(b)?-1:1),'red'],
    ['📅 Meetings booked',CONTACTS.filter(c=>stg(c)==='meeting'),'green'],
    ['💬 In conversation (replied)',replyQueue().concat(CONTACTS.filter(c=>stg(c)==='replied'&&fu(c)&&fu(c)>today())),'amber'],
    ['📨 Awaiting reply (messaged)',CONTACTS.filter(c=>stg(c)==='messaged').sort((a,b)=>(fu(a)||'9')< (fu(b)||'9')?-1:1),'blue']];
  let h=statBar();
  groups.forEach(([title,list,col])=>{
    const evSum=list.reduce((s,c)=>s+(EV[stg(c)]||0),0);
    h+='<div class="secH"><h3 class="'+col+'">'+title+' · '+list.length+'</h3><span class="mut" style="font-size:12px">≈ '+fmt$(evSum)+' EV</span></div>';
    if(!list.length){ h+='<div class="card mut" style="padding:12px;font-size:12.5px">Empty — good.</div>'; return; }
    h+='<div class="card" style="padding:6px 14px">'+list.slice(0,60).map(c=>rowHTML(c,false)).join('')+(list.length>60?'<div class="mut" style="padding:8px;text-align:center;font-size:12px">+'+(list.length-60)+' more — see Database</div>':'')+'</div>';
  });
  const won=CONTACTS.filter(c=>stg(c)==='won');
  h+='<div class="secH"><h3 class="green">🏆 Won · '+won.length+'</h3></div><div class="card" style="padding:6px 14px">';
  if(!won.length) h+='<div class="mut" style="padding:10px;font-size:12.5px">First household pending. The math says it comes.</div>';
  won.forEach(c=>{ const a=S.aum[c.uid]||G.avgHH;
    h+='<div class="row"><div class="who"><b>'+esc(c.name)+'</b><div class="t">'+esc(c.co||'')+'</div></div>'
     +'<label class="mut" style="font-size:12px">AUM $ <input type="number" value="'+a+'" style="width:110px" onchange="setAum(\''+c.uid+'\',this.value)"></label>'
     +'<span class="green" style="font-size:12.5px;font-weight:700">'+fmt$(G.hhFirstYear(a))+' first-yr</span></div>'; });
  h+='</div>';
  return h;
}
function pageScore(){
  const counts={pool:0,messaged:0,replied:0,meeting:0,won:0,lost:0,parked:0};
  CONTACTS.forEach(c=>counts[stg(c)]++);
  const contacted=counts.messaged+counts.replied+counts.meeting+counts.won+counts.lost;
  const responses=counts.replied+counts.meeting+counts.won;
  const meetings=counts.meeting+counts.won;
  const wonAUM=CONTACTS.filter(c=>stg(c)==='won').reduce((s,c)=>s+(S.aum[c.uid]||G.avgHH),0);
  const needPerDay=Math.max(0,(GOAL.contacts-contacted)/daysLeft());
  const bar=(v,g,col)=>'<div style="display:flex;justify-content:space-between;font-size:12.5px"><span>'+v.toLocaleString()+' / '+g.toLocaleString()+'</span><span class="mut">'+Math.min(100,Math.round(v/g*100))+'%</span></div><div class="bar"><i style="width:'+Math.min(100,v/g*100)+'%;background:'+col+'"></i></div>';
  let h=statBar();
  h+='<div class="card" style="text-align:center;border-color:rgba(201,168,76,.4)">'
    +'<div class="mut" style="font-size:12px;letter-spacing:.1em">THE ONLY NUMBER THAT MATTERS</div>'
    +'<div style="font-size:44px;font-weight:800;color:#c9a84c;line-height:1.15">'+Math.ceil(needPerDay)+' <span style="font-size:16px;color:#8a93a8">sends/day</span></div>'
    +'<div class="mut" style="font-size:12.5px">keeps you on course for <b class="green">'+GOAL.won+' households won</b> by Dec 31 ('+daysLeft()+' days left) · at the historical 40.5% response rate</div></div>';
  h+='<div class="card"><h3 class="gold" style="font-size:13px;margin-bottom:10px">SEASON GOALS · model-derived from '+GOAL.won+' households</h3>';
  h+='<div style="margin-bottom:8px"><b class="blue" style="font-size:12.5px">Contacted</b>'+bar(contacted,GOAL.contacts,'linear-gradient(90deg,#1a2744,#8bb4e0)')+'</div>';
  h+='<div style="margin-bottom:8px"><b style="color:#7dd8a0;font-size:12.5px">Responses</b>'+bar(responses,GOAL.responses,'linear-gradient(90deg,#1a3326,#7dd8a0)')+'</div>';
  h+='<div style="margin-bottom:8px"><b class="amber" style="font-size:12.5px">Meetings</b>'+bar(meetings,GOAL.meetings,'linear-gradient(90deg,#3d2e10,#e6c872)')+'</div>';
  h+='<div style="margin-bottom:8px"><b class="green" style="font-size:12.5px">Households won</b>'+bar(counts.won,GOAL.won,'linear-gradient(90deg,#1a3d1a,#5fe05f)')+'</div>';
  h+='<div><b class="gold" style="font-size:12.5px">AUM captured</b>'+bar(wonAUM,GOAL.won*G.avgHH,'linear-gradient(90deg,#3d3010,#c9a84c)')+'</div></div>';
  const rr=contacted?responses/contacted:0, mr=responses?meetings/responses:0, wr=meetings?counts.won/meetings:0;
  h+='<div class="card"><h3 class="gold" style="font-size:13px;margin-bottom:8px">FUNNEL · actual vs model</h3><table class="funnel" style="width:100%">'
    +'<tr><td>Contacted → Response</td><td><b>'+(rr*100).toFixed(1)+'%</b></td><td class="mut">model '+(100/G.roToResp).toFixed(1)+'%</td></tr>'
    +'<tr><td>Response → Meeting</td><td><b>'+(mr*100).toFixed(1)+'%</b></td><td class="mut">model '+(100/G.respToMeet).toFixed(0)+'%</td></tr>'
    +'<tr><td>Meeting → Won</td><td><b>'+(wr*100).toFixed(1)+'%</b></td><td class="mut">model '+(100/G.meetToWon).toFixed(0)+'%</td></tr>'
    +'<tr><td>Pipeline EV (open stages)</td><td colspan="2"><b class="green">'+fmt$(counts.messaged*EV.messaged+counts.replied*EV.replied+counts.meeting*EV.meeting)+'</b></td></tr></table>'
    +'<div class="mut" style="font-size:11px;margin-top:8px">EV = first-year after-tax value × stage conversion odds. Response→meeting is your leverage point: '+counts.replied+' replies are sitting in stage ❷.</div></div>';
  return h;
}
function pageBase(){
  let list=CONTACTS.filter(c=>{
    if(dbStage&&stg(c)!==dbStage) return false;
    if(dbSrc==='warm'&&c.tier===null) return false;
    if(dbSrc==='cold'&&c.src!=='cold') return false;
    if(!S.set.peers&&c.peer&&!dbStage) return false;
    if(q){ const s=(c.name+' '+c.title+' '+c.co).toLowerCase(); if(!s.includes(q.toLowerCase())) return false; }
    return true;
  }).sort((a,b)=>rankOf(b)-rankOf(a));
  let h='<div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    +'<input type="text" id="dbq" placeholder="Search name, title, company…" value="'+esc(q)+'" style="flex:1;min-width:220px" oninput="dbSearch(this.value)">'
    +'<select onchange="dbStage=this.value;page=0;render()"><option value="">All stages</option>'+['pool','messaged','replied','meeting','won','lost','parked'].map(o=>'<option'+(dbStage===o?' selected':'')+'>'+o+'</option>').join('')+'</select>'
    +'<select onchange="dbSrc=this.value;page=0;render()"><option value="">Warm + cold</option><option value="warm"'+(dbSrc==='warm'?' selected':'')+'>Warm only</option><option value="cold"'+(dbSrc==='cold'?' selected':'')+'>Cold only</option></select>'
    +'<span class="mut" style="font-size:12px">'+list.length.toLocaleString()+' contacts</span></div>';
  const show=list.slice(0,(page+1)*100);
  h+='<div class="card" style="padding:6px 14px">'+show.map(c=>rowHTML(c,true)).join('')+'</div>';
  if(show.length<list.length) h+='<div style="text-align:center"><button class="btn ghost" onclick="page++;render(true)">Show 100 more ('+(list.length-show.length).toLocaleString()+' left)</button></div>';
  return h;
}
let _dq=null; function dbSearch(v){ q=v; page=0; clearTimeout(_dq); _dq=setTimeout(()=>render(true),160); }
function render(keep){
  document.getElementById('tabs').innerHTML=TABSDEF.map(([id,l])=>{
    let extra=''; if(id==='today'){const n=fuDue().length; if(n) extra=' <span class="red">('+n+')</span>';}
    return '<button class="tab'+(tab===id?' active':'')+'" onclick="nav(\''+id+'\')">'+l+extra+'</button>';
  }).join('');
  document.getElementById('subCounts').textContent=CONTACTS.length.toLocaleString()+' unique contacts · '+CONTACTS.filter(c=>c.tier!==null).length.toLocaleString()+' warm · '+CONTACTS.filter(c=>c.tier===null).length.toLocaleString()+' cold';
  var _bp=document.getElementById('barPill');
  if(_bp){ var _s=sendsToday(), _t=S.set.target; _bp.innerHTML='<span>'+_s+'/'+_t+'</span><span style="width:6px;height:6px;border-radius:99px;background:'+(_s>=_t?'#5fe05f':'#c9a84c')+'"></span>'; }
  const y=window.scrollY;
  document.getElementById('main').innerHTML=({today:pageToday,pipe:pagePipe,score:pageScore,base:pageBase})[tab]();
  if(keep) window.scrollTo(0,y);
}
/* ================= EXPORT ================= */
function exportBackup(){
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'chambers-hq',version:1,exportedAt:new Date().toISOString(),state:S})],{type:'application/json'}));
    a.download='chambers_hq_backup_'+today()+'.json'; a.click(); toast('Backup exported ✓');
  }catch(e){ toast('Export failed'); }
}
function importBackup(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=e=>{ try{ const o=JSON.parse(e.target.result); if(o&&o.state){ S=o.state; S.set=Object.assign({target:20,replyN:10,fuDays:7,peers:false},S.set||{}); save(); render(); toast('Backup restored ✓'); } else toast('Not a Chambers HQ backup'); }catch(err){ toast('Could not read that file'); } };
  rd.readAsText(f); inp.value='';
}
function exportCSV(){
  const rows=[['Name','LinkedIn','Source','Tier','Score','Title','Company','Stage','FollowUp','Sentiment','Note','AUM']];
  CONTACTS.forEach(c=>rows.push([c.name,c.url,c.tier!==null?'warm':'cold',c.tier??'',c.score??'',c.title,c.co,stg(c),fu(c),c.sentiRaw,note(c),S.aum[c.uid]||'']));
  const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='chambers_hq_'+today()+'.csv'; a.click();
}
/* ================= BOOT ================= */
load(); render();

/* Ask the browser to treat this data as persistent. Browsers evict storage from
   sites you have not visited recently, and all eight tools live in that storage.
   This is a request, not a guarantee, which is why the Vault backup still matters. */
(function(){
  try{
    if(navigator.storage && navigator.storage.persist && navigator.storage.persisted){
      navigator.storage.persisted().then(function(already){
        if(!already) navigator.storage.persist();
      }).catch(function(){});
    }
  }catch(e){}
})();
