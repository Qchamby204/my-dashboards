  <line x1="25" y1="32" x2="32" y2="26" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="39" y1="32" x2="32" y2="26" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="24" y1="38" x2="32" y2="32" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="40" y1="38" x2="32" y2="32" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
