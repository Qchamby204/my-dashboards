<style>
:root{
  --ink:#0b0d13; --panel:#12151d; --panel2:#171b26; --border:#242a3a; --border2:#2e3548;
  --text:#e8e6df; --dim:#8b90a0; --faint:#5c6172;
  --gold:#e6b450; --gold-soft:rgba(230,180,80,.14);
  --cyan:#22d3ee; --cyan-soft:rgba(34,211,238,.12);
  --green:#4ade80; --green-soft:rgba(74,222,128,.12);
  --am:#a78bfa; --am-soft:rgba(167,139,250,.12);
  --rose:#f87171; --rose-soft:rgba(248,113,113,.12);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:'Outfit',sans-serif;font-size:15px;line-height:1.5;
  background-image:radial-gradient(1100px 500px at 50% -220px, rgba(230,180,80,.07), transparent 65%);
  min-height:100vh;padding-bottom:70px}
.wrap{max-width:1060px;margin:0 auto;
  padding:0 max(14px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
h1,h2,.cz{font-family:'Cinzel',serif}
.mono{font-family:'Space Mono',monospace}

/* App chrome. The blurred fill runs up under the Dynamic Island so the clock,
   signal, wifi and battery never sit on top of content. */
.homebtn{display:grid;place-items:center;width:33px;height:33px;border-radius:10px;flex-shrink:0;
  border:1px solid rgba(240,183,62,.35);background:rgba(240,183,62,.10);color:#f0b73e;
  font-size:15px;line-height:1;text-decoration:none;margin-right:9px}
.homebtn:active{transform:scale(.93)}
.appbar{position:sticky;top:0;z-index:50;
  margin:0 calc(-1 * max(14px,env(safe-area-inset-left)));
  padding:calc(env(safe-area-inset-top,0px) + 11px) max(14px,env(safe-area-inset-left)) 11px max(14px,env(safe-area-inset-right));
  background:rgba(11,13,19,.90);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:9px}
.appbar-title{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.09em;white-space:nowrap;line-height:1.1}
.appbar-sub{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-top:2px;white-space:nowrap}
.appbar-pill{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;
  background:var(--gold-soft);border:1px solid rgba(230,180,80,.35);font-family:'Space Mono',monospace;
  font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;flex-shrink:0}
.iconbtn{width:33px;height:33px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--dim);font-size:14px;display:grid;place-items:center;flex-shrink:0}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:'Outfit',sans-serif;font-size:14px;color:var(--text);background:var(--ink);
  border:1px solid var(--border);border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(230,180,80,.45);outline-offset:1px;border-color:var(--gold)}
textarea{resize:vertical;min-height:64px;line-height:1.45}
::placeholder{color:var(--faint)}

/* ---------- header (legacy; the sticky app bar replaces it) ---------- */
header{display:none}
.brand h1{font-size:26px;letter-spacing:.14em;color:var(--gold);font-weight:600;text-shadow:0 0 26px rgba(230,180,80,.35)}
.brand .sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.hbtns{display:flex;gap:8px}
.ghost{border:1px solid var(--border);border-radius:9px;padding:7px 12px;font-size:12px;color:var(--dim);letter-spacing:.04em}
.ghost:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- assembly rail (signature) ---------- */
.rail-card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:var(--r);
  padding:18px 16px 14px;margin-bottom:12px;position:relative;overflow:hidden}
.rail-card .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.rail{display:flex;align-items:flex-start;position:relative;justify-content:space-between}
.rail::before{content:"";position:absolute;top:17px;left:8%;right:8%;height:2px;
  background:linear-gradient(90deg,var(--faint),var(--gold) 55%,var(--green));opacity:.5}
.ember{position:absolute;top:14px;left:8%;width:8px;height:8px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 12px 4px rgba(230,180,80,.55);animation:travel 6s linear infinite}
@keyframes travel{0%{left:8%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:calc(92% - 8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.ember{display:none}.toast{transition:none}}
.stage{position:relative;z-index:1;text-align:center;flex:1;cursor:pointer;border-radius:10px;padding:2px 0 6px}
.stage:hover .node{border-color:var(--gold)}
.node{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
  background:var(--ink);border:2px solid var(--border2);font-weight:700;font-size:15px}
.stage.active .node{border-color:var(--gold);box-shadow:0 0 14px rgba(230,180,80,.4);color:var(--gold)}
.stage .nm{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stage.pub .node{border-color:rgba(74,222,128,.6);color:var(--green)}

.season{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.scell{background:var(--ink);border:1px solid var(--border);border-radius:11px;padding:10px 8px;text-align:center;cursor:pointer}
.scell .v{font-size:20px;font-weight:700}
.scell .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.scell .g{font-size:10px;color:var(--dim)}
.c-gold{color:var(--gold)}.c-cyan{color:var(--cyan)}.c-green{color:var(--green)}.c-am{color:var(--am)}.c-rose{color:var(--rose)}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:45;
  margin:0 calc(-1 * max(14px,env(safe-area-inset-left))) 14px;
  padding:9px max(14px,env(safe-area-inset-left));
  background:rgba(11,13,19,.93);backdrop-filter:saturate(140%) blur(12px);-webkit-backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--border);border-radius:999px;padding:8px 15px;font-size:12.5px;
  letter-spacing:.06em;color:var(--dim);background:var(--panel)}
.tab.on{color:var(--gold);border-color:var(--gold);background:var(--gold-soft);font-weight:600}

/* ---------- shared ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--dim);margin-bottom:10px;line-height:1.55}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--gold);color:#1a1405;border-radius:9px;padding:9px 15px;font-weight:600;font-size:13px}
.btn:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.line{background:none;border:1px solid var(--border2);color:var(--dim);font-weight:500}
.btn.line:hover{border-color:var(--gold);color:var(--gold)}
.btn.danger{background:none;border:1px solid var(--border);color:var(--rose)}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.08em;padding:2px 9px;border-radius:999px;border:1px solid var(--border2);color:var(--dim)}
.chip.gold{color:var(--gold);border-color:rgba(230,180,80,.4);background:var(--gold-soft)}
.chip.green{color:var(--green);border-color:rgba(74,222,128,.4);background:var(--green-soft)}
.chip.cyan{color:var(--cyan);border-color:rgba(34,211,238,.4);background:var(--cyan-soft)}
.chip.am{color:var(--am);border-color:rgba(167,139,250,.4);background:var(--am-soft)}
.bar{height:5px;background:var(--ink);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:99px;transition:width .3s}
.empty{border:1px dashed var(--border2);border-radius:11px;padding:20px;text-align:center;color:var(--faint);font-size:13px}
.dropzone{border:1.5px dashed var(--border2);border-radius:11px;padding:18px 12px;text-align:center;color:var(--dim);font-size:13px;cursor:pointer;transition:border-color .15s,color .15s}
.dropzone.drag,.dropzone:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.step{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:none}
.snum{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid var(--border2);color:var(--dim);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Cinzel',serif;font-size:15px}
.step.live .snum{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(230,180,80,.3)}
.step .st{font-weight:600;font-size:14.5px}
.step .sd{font-size:12.5px;color:var(--dim);margin:3px 0 8px;line-height:1.5}
.next-card{border:1px solid var(--gold);background:linear-gradient(180deg,rgba(230,180,80,.12),rgba(230,180,80,.04))}

/* vault items */
.vitem{border:1px solid var(--border);border-radius:12px;background:var(--panel2);margin-bottom:10px;overflow:hidden}
.vhead{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
.vhead .t{flex:1;min-width:0}
.vhead .t .ti{font-weight:600;font-size:14.5px;line-height:1.3}
.vhead .t .kw{font-size:11.5px;color:var(--dim);margin-top:2px}
.vbody{padding:0 12px 12px;border-top:1px solid var(--border)}
.optrow{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.optrow:last-child{border-bottom:none}
.tickbox{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;
  font-size:13px;color:transparent;cursor:pointer;margin-top:2px}
.tickbox.done{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.optrow .ol{font-size:12px;font-weight:600;letter-spacing:.05em}
.optrow .og{font-size:11.5px;color:var(--faint);margin:1px 0 6px;line-height:1.4}
.field{flex:1;min-width:0}
.mini{font-size:11px;color:var(--dim)}

/* cadence */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:8px 4px;text-align:center}
.day.today{border-color:var(--gold)}
.day .dn{font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.day .dd{font-size:13px;font-weight:700;margin:2px 0 6px}
.pip{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border2);margin:4px auto;display:flex;
  align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--faint)}
.pip.on.p-l{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);font-weight:700}
.pip.on.p-s{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.pip.p-f{border-style:dashed}
.pip.on.p-f{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.pip.on.p-e{border-color:var(--am);color:var(--am);background:var(--am-soft)}
.pip.on.p-c{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--dim)}
.longslot{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:8px}

/* metrics table */
.mtable{width:100%;border-collapse:collapse;font-size:12.5px}
.mtable th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:left;padding:6px 6px;border-bottom:1px solid var(--border)}
.mtable td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.mtable input{padding:5px 6px;font-size:12.5px;border-radius:7px}
.rollup{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}

/* funnel */
.fstages{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.fs{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 4px;text-align:center}
.fs .v{font-size:18px;font-weight:700;color:var(--gold)}
.fs .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.lead{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.lead:last-child{border-bottom:none}
.lead .ln{flex:1;min-width:120px;font-weight:600;font-size:13.5px}
.lead select{width:auto;font-size:12px;padding:5px 8px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--panel2);
  border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .3s;z-index:99;box-shadow:0 6px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .season{grid-template-columns:repeat(2,1fr)}
  .fstages{grid-template-columns:repeat(3,1fr)}
  .rail .nm{font-size:8.5px}
  .brand h1{font-size:22px}
}
</style>

<script>
/* ============ storage (localStorage on GitHub Pages, in-memory fallback in preview) ============ */
const store=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage;}
catch(e){const m={};return{getItem:k=>m[k]??null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}};}})();
const KEY='herald:v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

/* ============ optimization checklist template ============ */
const OPT=[
 {k:'title', l:'Title', g:'Front-loaded exact-match keyword, under 60 characters. Score it in vidIQ: 80+ is publish-ready, below 70 means the framing is wrong, reframe before filming. Never publish an unscored title.'},
 {k:'desc',  l:'Description', g:'First two lines are the mini-ad shown in search: hook plus value with the primary keyword. Then 150 to 300 words weaving secondary keywords, timestamps, the clarity call CTA link, and 3 to 5 hashtags at the bottom.'},
 {k:'thumb', l:'Thumbnail', g:'The proven pattern: bold text, a specific dollar figure, your face. 3 to 5 words max, readable at phone size. Score against the live thumbnail in vidIQ and only swap if the new one scores strictly higher.'},
 {k:'broll', l:'Assets / B-roll', g:'Charts, screen shares, props. One visual change every 15 to 30 seconds for retention.'},
 {k:'emph',  l:'Points to emphasize', g:'The 2 or 3 moments worth clipping into shorts. Flag them in the script.'},
 {k:'tags',  l:'SEO tags', g:'Primary keyword, close variants, 5 to 10 related terms. Validate in vidIQ before locking.'},
 {k:'blog',  l:'Companion blog post', g:'For SEO and AEO: question-based headings, the direct answer in the first sentence of each section, FAQ block, video embedded, booking CTA. Not a transcript dump.'},
 {k:'cta',   l:'CTA', g:'One next step only: verbal, pinned comment, end screen, description link. All four point to the same place.'}
];
const STAGES=['draft','approved','produced','scheduled','published'];
const STAGE_L={draft:'Draft',approved:'Approved',produced:'Filmed / Edited',scheduled:'Scheduled',published:'Published'};
const PUBC=[
 {k:'p1',l:'vidIQ SEO score checked at upload, suggestions fixed'},
 {k:'p2',l:'Title, description, and tags pasted from the vault'},
 {k:'p3',l:'Thumbnail uploaded, readable at phone size'},
 {k:'p4',l:'End screen and cards point to the next video in the cluster'},
 {k:'p5',l:'Added to the right playlist for its vertical'},
 {k:'p6',l:'Pinned comment posted: open loop plus one specific, low-friction question'},
 {k:'p7',l:'Companion blog post live on the site, video embedded'},
 {k:'p8',l:'Publish time set to the consistent weekly slot'},
 {k:'p9',l:'Shorts clipped from emphasis points and queued'},
 {k:'p10',l:'Short posted natively to LinkedIn, link in comments'}
];
const VERTS=['Business Owners','Physicians','Life Transitions','General'];
const FSTAGES=['New','Contacted','Booked','Met','Proposal','Client'];

/* ============ seeds ============ */
function seedCapture(){return[
 {id:uid(),l:'VSL live on the contact page, above the scheduler',d:false},
 {id:uid(),l:'Acuity set to a 15-minute intro call with 3 qualifying questions',d:false},
 {id:uid(),l:'Every video description carries one CTA link to the VSL page',d:false},
 {id:uid(),l:'Pinned comment with the booking link on every video',d:false},
 {id:uid(),l:'Business Owner Playbook wired as secondary capture for not-ready viewers',d:false},
 {id:uid(),l:'Retirement Roadmap wired as secondary capture for not-ready viewers',d:false},
 {id:uid(),l:'LinkedIn featured section links to the VSL page',d:false},
 {id:uid(),l:'YouTube banner, about section, and channel links point to the booking page',d:false}
];}
function seedRoadmap(){return[
 {id:uid(),t:'Salary vs Dividends Canada 2026: How Business Owners Should Pay Themselves',v:'Business Owners',i:'High intent, evergreen head term',p:1},
 {id:uid(),t:'Canadian Departure Tax Explained: What Happens When You Leave Canada',v:'Life Transitions',i:'Low competition, high intent. Document already written, fastest to produce',p:1},
 {id:uid(),t:'When to Take CPP: 60 vs 65 vs 70',v:'Life Transitions',i:'Highest search volume in the niche, discovery engine',p:1},
 {id:uid(),t:'CPP vs OAS: The Difference Every Canadian Retiree Needs to Know',v:'Life Transitions',i:'Comparison intent, ranks fast, feeds CPP video',p:2},
 {id:uid(),t:'Corporate Investing in Canada: The Passive Income Grind Explained',v:'Business Owners',i:'Niche expertise proof, low competition',p:2},
 {id:uid(),t:'OAS Clawback: How to Avoid It',v:'Life Transitions',i:'Problem-aware search, strong CTA fit',p:2},
 {id:uid(),t:'Retirement Planning for Business Owners in Canada',v:'Business Owners',i:'Head term for your core vertical',p:2},

function blankOpt(){const o={};OPT.forEach(x=>o[x.k]={t:'',d:false});return o;}
function blankMetrics(){return{ctr:'',avd:'',ret:'',likes:'',com:'',subs:'',leads:''};}

function defaultState(){return{
 videos:[],cadence:{},weeks:{},leads:[],capture:seedCapture(),roadmap:seedRoadmap(),sys:{once:{},w:{},m:{}},
 goals:{leads:50,booked:20}
};}
let S=load();
function load(){try{const r=store.getItem(KEY);if(r){const s=Object.assign(defaultState(),JSON.parse(r));delete s.vsl;(s.videos||[]).forEach(v=>{if(v.status==='optimized')v.status='approved';if(!v.pub)v.pub={};if(!v.opt.blog)v.opt.blog={t:'',d:false};});Object.values(s.cadence||{}).forEach(d=>{if('s' in d){d.m=d.s;delete d.s;}});return s;}}catch(e){}return defaultState();}
function save(){store.setItem(KEY,JSON.stringify(S));renderRail();}

/* Destructive actions were one-way. Snapshot first, then keep Undo on screen. */
var __undoT=null;
function undoToast(msg, restore){
  var t=document.getElementById('undoToast');
  if(!t){ t=document.createElement('div'); t.id='undoToast'; document.body.appendChild(t); }
  var sheetOpen=!!document.getElementById('syncSheet');
  t.style.cssText="position:fixed;left:50%;bottom:"+(sheetOpen?"calc(50vh)":"calc(24px + env(safe-area-inset-bottom))")+";transform:translateX(-50%);z-index:140;"
   +"background:rgba(20,23,38,.97);border:1px solid rgba(240,183,62,.5);color:#f6e2ad;padding:10px 16px;border-radius:12px;"
   +"font-family:'Outfit',sans-serif;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.55);display:flex;align-items:center;gap:12px;max-width:92vw";
  t.textContent='';
  var s=document.createElement('span'); s.textContent=msg; t.appendChild(s);
  var b=document.createElement('button'); b.textContent='Undo';
  b.style.cssText="background:rgba(240,183,62,.16);border:1px solid rgba(240,183,62,.5);color:#f0b73e;font-family:inherit;"
   +"font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer;flex-shrink:0";
  b.onclick=function(){ try{ restore(); }catch(e){} t.remove(); };
  t.appendChild(b);
  clearTimeout(__undoT); __undoT=setTimeout(function(){ if(t&&t.parentNode) t.remove(); },7000);
}

/* iOS silently blocks confirm() in home-screen apps, so native dialogs are
   banned here. Deletion is immediate; the Undo toast is the safety net. */
function delScript(id){
  var v=(S.videos||[]).filter(function(x){return x.id===id;})[0]; if(!v) return;
  var snap=JSON.stringify(S.videos);
  S.videos=S.videos.filter(function(x){return x.id!==id;}); save(); renderAll();
  undoToast('Deleted: '+String(v.title||'Untitled').slice(0,26), function(){ try{ S.videos=JSON.parse(snap); save(); renderAll(); }catch(e){} });
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1900);}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='herald-backup-'+todayISO()+'.json';a.click();toast('Backup exported');}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(defaultState(),JSON.parse(r.result));save();renderAll();toast('Backup restored');}catch(e){toast('Import failed: not a valid backup');}};r.readAsText(f);ev.target.value='';}
</script>
<script>
/* ============ DEVICE SYNC ============
   Herald data lives in this browser only, so desktop and phone are separate
   silos. This moves the whole Herald across as text: copy on the device you
   just worked on, paste on the other. Herald only, so it never touches the
   other tools' data on the receiving device. No native dialogs anywhere,
   because iOS silently blocks them in home-screen apps. */
let syncPending=null;
function openSync(){
 const el=document.getElementById('syncSheet');
 if(el){el.remove();syncPending=null;return;}
 const d=document.createElement('div');
 d.id='syncSheet';
 d.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:120;background:#12141f;border-top:1px solid var(--border2);"
  +"border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -14px 40px rgba(0,0,0,.6);max-height:82vh;overflow:auto";
 d.innerHTML=syncHTML();
 document.body.appendChild(d);
}
function syncHTML(){
 const n=(S.videos||[]).length, l=(S.leads||[]).length;
 return `
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
  <h2 style="margin:0;font-size:15px">Sync this Herald</h2>
  <button class="btn sm line" onclick="openSync()">Close</button>
 </div>
 <div class="hint" style="margin-bottom:10px">Herald data lives in each browser, so your computer and phone do not sync on their own. Copy here, paste there. This moves the Herald only, so nothing else on the other device is touched.</div>
 <div style="font-size:11px;color:var(--dim);margin-bottom:10px">This device holds <b style="color:var(--gold)">${n} script${n===1?'':'s'}</b> and <b style="color:var(--gold)">${l} lead${l===1?'':'s'}</b>.</div>
 <button class="btn" style="width:100%;margin-bottom:12px" onclick="copyHerald()">&#10697; Copy this Herald</button>
 <div class="ol" style="font-size:10px;letter-spacing:.16em;color:var(--faint);margin-bottom:6px">OR LOAD ONE FROM THE OTHER DEVICE</div>
 <textarea id="syncPaste" rows="3" placeholder="Paste the copied Herald here" style="width:100%;font-family:monospace;font-size:10px"></textarea>
 <button class="btn sm line" style="width:100%;margin-top:8px" onclick="loadHerald()">Load pasted Herald</button>
 ${syncPending?`<div style="margin-top:12px;padding:12px;border-radius:12px;background:rgba(240,98,138,.08);border:1px solid rgba(240,98,138,.45)">
   <div style="font-size:12px;color:#f0a0b8;line-height:1.5;margin-bottom:9px">Replace this Herald with the pasted one?<br>
   Incoming: <b>${syncPending.n} scripts</b>, <b>${syncPending.l} leads</b>. This device right now: <b>${n} scripts</b>, <b>${l} leads</b>.<br>
   This <b>overwrites</b> the Herald on this device. Undo is available right after.</div>
   <div class="row">
    <button class="btn" style="flex:1" onclick="applyHerald()">Yes, replace</button>
    <button class="btn sm line" style="flex:1" onclick="cancelSync()">Cancel</button>
   </div></div>`:''}
 <div id="syncMsg" style="font-size:11px;color:var(--dim);margin-top:10px;min-height:14px;line-height:1.5"></div>
 <div style="font-size:10px;color:var(--faint);margin-top:8px;line-height:1.5">Rule of thumb: copy on the device you just worked on, load on the other, and never edit both between syncs. A load replaces, it does not merge.</div>`;
}
function cancelSync(){syncPending=null;refreshSync();syncMsg('Cancelled. Nothing changed on this device.',true);}
function syncMsg(t,good){const m=document.getElementById('syncMsg');if(m){m.textContent=t;m.style.color=good?'var(--green)':'var(--rose)';}}
function refreshSync(){const el=document.getElementById('syncSheet');if(el)el.innerHTML=syncHTML();}
function copyHerald(){
 const txt=JSON.stringify({app:'herald',v:1,at:new Date().toISOString(),state:S});
 const done=()=>syncMsg('\u2713 Copied. Now open the Herald on the other device, tap the same button, and paste it in.',true);
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopyH(txt,done));
 } else fallbackCopyH(txt,done);
}
function fallbackCopyH(txt,done){
 const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-9999px';
 document.body.appendChild(ta);ta.focus();ta.select();
 try{document.execCommand('copy');done();}catch(e){syncMsg('Copy failed. Use the file backup arrows instead.',false);}
 ta.remove();
}
function loadHerald(){
 const el=document.getElementById('syncPaste');
 const raw=(el&&el.value||'').trim();
 if(!raw){syncMsg('Paste the copied Herald into the box first.',false);return;}
 let st=null;
 try{const o=JSON.parse(raw);st=(o&&o.state)?o.state:((o&&Array.isArray(o.videos))?o:null);}catch(e){}
 if(!st||!Array.isArray(st.videos)){syncMsg('That text is not a Herald backup.',false);return;}
 syncPending={state:st,n:st.videos.length,l:(st.leads||[]).length};
 refreshSync();
}
function applyHerald(){
 if(!syncPending)return;
 const before=JSON.stringify(S);
 /* the sheet covers the bottom of the screen, so the toast must clear it */
 const inc=syncPending;
 S=Object.assign(defaultState(),inc.state);
 syncPending=null;save();renderAll();refreshSync();
 syncMsg('\u2713 This Herald now matches the other device: '+inc.n+' scripts, '+inc.l+' leads.',true);
 undoToast('Herald replaced ('+inc.n+' scripts)',()=>{try{S=JSON.parse(before);save();renderAll();refreshSync();}catch(e){}});
}

/* ============ rail + season ============ */
function counts(){const c={draft:0,approved:0,produced:0,scheduled:0,published:0};S.videos.forEach(v=>c[v.status]=(c[v.status]||0)+1);return c;}
function publishStreak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const day=S.cadence[k];if(day&&(day.m||day.e)){n++;d.setDate(d.getDate()-1);}else{if(n===0&&k===todayISO()){d.setDate(d.getDate()-1);const k2=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(S.cadence[k2]&&(S.cadence[k2].m||S.cadence[k2].e)){continue;}}break;}}return n;}
function renderRail(){
 const c=counts();
 document.getElementById('rail').innerHTML=STAGES.map(s=>
  `<div class="stage ${c[s]>0?'active':''} ${s==='published'?'pub':''}" onclick="vaultFilter='${s}';go('vault')">
    <div class="node mono">${c[s]}</div><div class="nm">${STAGE_L[s]}</div></div>`).join('');
 const sched=S.videos.filter(v=>v.sched&&v.status!=='published').length;
 const bp=document.getElementById('barPill');
 if(bp) bp.innerHTML='<span>'+c.published+'</span><span style="font-size:9px;letter-spacing:.08em;color:var(--faint);font-weight:600"> LIVE</span>';
 document.getElementById('season').innerHTML=`
  <div class="scell" onclick="go('metrics')"><div class="v c-cyan mono">${c.published}</div><div class="k">Published</div></div>
  <div class="scell" onclick="go('cadence')"><div class="v c-gold mono">${publishStreak()}</div><div class="k">Day streak</div></div>
  <div class="scell" onclick="go('calendar')"><div class="v c-green mono">${sched}</div><div class="k">On the calendar</div></div>
  <div class="scell" onclick="vaultFilter='draft';go('vault')"><div class="v c-am mono">${c.draft}</div><div class="k">Drafts</div></div>`;
}

let cur='vault';let vaultFilter='';let openVid=null;
let selMode=false;const selIds=new Set();let confirmDel=false;
function go(t){cur=t;renderAll();window.scrollTo({top:0});}

/* ============ VAULT ============ */
function optPct(v){const n=OPT.filter(o=>v.opt[o.k]&&v.opt[o.k].d).length;return Math.round(100*n/OPT.length);}
function renderVault(){
 let list=S.videos.slice().reverse();
 if(vaultFilter)list=list.filter(v=>v.status===vaultFilter);
 return `
 <div class="card">
  <h2>Add a script</h2>

  <div class="row" style="margin-bottom:8px">

  </div>

   <button class="btn" onclick="addVideo()">Add to vault</button>
  </div>
 </div>
 <div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:10px">

    <button class="btn sm line" onclick="selMode=!selMode;selIds.clear();confirmDel=false;renderAll()">${selMode?'Done':'Select'}</button>
    <select onchange="vaultFilter=this.value;renderAll()" style="width:auto;font-size:12px;padding:5px 8px">
     <option value="">All stages</option>${STAGES.map(s=>`<option value="${s}" ${vaultFilter===s?'selected':''}>${STAGE_L[s]}</option>`).join('')}
    </select>

function vaultItem(v){
 const pct=optPct(v),open=openVid===v.id&&!selMode,sel=selIds.has(v.id);
 return `<div class="vitem" style="${sel?'border-color:var(--rose)':''}">

   <div class="t"><div class="ti">${esc(v.title)}</div>
    <div class="kw">${esc(v.kw||'no keyword set')} · <span class="chip ${v.fmt==='short'?'am':'cyan'}">${v.fmt==='short'?'Short':'Long form'}</span> <span class="chip">${esc(v.vert)}</span></div>

  </div>
  ${['scheduled','published'].includes(v.status)?`

  </div>`:''}
  <div class="row" style="margin-top:10px;justify-content:space-between">

 </div>`;

function vById(id){return S.videos.find(v=>v.id===id);}
function fmtSched(ds){try{return new Date(ds+'T12:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'});}catch(e){return ds;}}
function toggleSel(id){if(selIds.has(id))selIds.delete(id);else selIds.add(id);confirmDel=false;renderAll();}
function selectAllShown(){let list=S.videos.slice();if(vaultFilter)list=list.filter(v=>v.status===vaultFilter);list.forEach(v=>selIds.add(v.id));confirmDel=false;renderAll();}
function delSel(){if(!selIds.size){toast('Nothing selected');return;}
 if(!confirmDel){confirmDel=true;renderAll();return;}
 const n=selIds.size;S.videos=S.videos.filter(v=>!selIds.has(v.id));selIds.clear();selMode=false;confirmDel=false;
 save();renderAll();toast(n+' script'+(n===1?'':'s')+' deleted');}
function addVideo(t,kw,fmt,vert){
 const ti=t||document.getElementById('nv-title').value.trim();if(!ti){toast('Give it a title first');return;}
 const _sc=(document.getElementById('nv-script')||{}).value||'';
 S.videos.push({id:uid(),title:ti,kw:kw??document.getElementById('nv-kw').value.trim(),
  fmt:fmt||document.getElementById('nv-fmt').value,vert:vert||document.getElementById('nv-vert').value,
  status:'draft',opt:blankOpt(),metrics:blankMetrics(),flow:false,pub:{},script:_sc.trim()});
 if(document.getElementById('nv-script'))document.getElementById('nv-script').value='';
 save();renderAll();toast('Added to the vault');}
function tOpt(id,k){const v=vById(id);v.opt[k].d=!v.opt[k].d;if(OPT.every(o=>v.opt[o.k].d)&&v.status==='draft'){toast('Optimization complete. Send to marketing for approval');}save();renderAll();}
function wOpt(id,k,val){vById(id).opt[k].t=val;save();}
function spawnShort(id){const v=vById(id);const e=v.opt.emph&&v.opt.emph.t?': '+v.opt.emph.t.split('\n')[0].slice(0,50):'';
 S.videos.push({id:uid(),title:'Short'+e+' (from: '+v.title.slice(0,40)+')',kw:v.kw,fmt:'short',vert:v.vert,status:'draft',parentId:v.id,opt:blankOpt(),metrics:blankMetrics(),flow:false,pub:{}});
 save();renderAll();toast('Short drafted from emphasis points');}

const MODES=[['auto','Auto'],['one','One script'],['head','Split on headings'],['bold','Split on bold lines'],['scriptn','Split on "Script N" lines'],['dashes','Split on ---']];
function cleanName(n){return n.replace(/\.[^.]+$/,'').replace(/_+/g,' ').replace(/\s+/g,' ').trim();}
function looksLikePath(t){return /^\/|\/Users\/|\\|^[A-Z]:\\/.test(t);}
function words(s){return (s||'').trim()?s.trim().split(/\s+/).length:0;}
function medianWords(items){const w=items.map(x=>words(x.body)).sort((a,b)=>a-b);return w.length?w[Math.floor(w.length/2)]:0;}
function htmlToText(html){const d=document.createElement('div');d.innerHTML=html;
 return [...d.children].map(el=>el.textContent.trim()).filter(Boolean).join('\n\n');}

/* field extraction: pulls title, hook, clip points, and CTA out of structured scripts */
const ACRO=['RRSP','TFSA','CPP','OAS','CCPC','RESP','FHSA','IPP','LCGE','RDTOH','CDA','SBD','GIC','GICs','ETF','DIY','HST','GST','CFP','CIM'];
function titleCaseIf(t){

  t=t.toLowerCase().replace(/(^|[\s\-("'“‘])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\bi\b/g,'I');
  ACRO.forEach(a=>{t=t.replace(new RegExp('\\b'+a+'\\b','gi'),a);});
 }return t;}
const SECWORDS=/^(hook|setup|close|final thoughts|conclusion|call to action|cta|credibility bridge|nuance beat|proof of value|re-?engagement device|section\s*\d+|reason\s*\d+|point\s*\d+|intro|outro|seo keywords|suggested video description|notes?\b|required disclaimer|disclaimer|sources|on-screen card|target keyword|thumbnail|b-?roll|assets|blog post|emphasis|clip points|[a-z]\s*:\s*\S)/i;
const isBracket=l=>/^\[.{2,60}\]/.test(l);
const isSecMarker=l=>{if(l.length>=70)return false;const core=l.replace(/^#+\s*/,'').replace(/^\[/,'').replace(/\]$/,'').trim();return SECWORDS.test(core);};

 if(/^script\s*\d+$/i.test(item.title||'')&&lines.length&&lines[0].length<110&&!isSecMarker(lines[0])){t=lines.shift();}
 if(lines.length&&/^script\s*\d+\s*[:\-]/i.test(lines[0])&&lines[0].length<130){t=lines[0].replace(/^script\s*\d+\s*[:\-]\s*/i,'').trim();lines.shift();}
 t=titleCaseIf(t);
 while(lines.length&&((/\|/.test(lines[0])&&lines[0].length<130)||/^segment\s*:/i.test(lines[0])))lines.shift();
 const secs=[];let curS={n:'',raw:'',c:[]};
 lines.forEach(l=>{
  if(isSecMarker(l)){secs.push(curS);const raw=l.replace(/^#+\s*/,'').replace(/^\[/,'').replace(/\]$/,'').replace(/\s*\(.*\)\s*$/,'').trim();curS={n:raw.toLowerCase(),raw,c:[]};}
  else if(isBracket(l)){/* stage direction like [CUT TO...] or [On camera...]: skip */}
  else curS.c.push(l);});
 secs.push(curS);
 const find=re=>secs.filter(s=>re.test(s.n));
 const secText=(re,sep)=>{const s=find(re)[0];return s?s.c.map(x=>x.replace(/^[-•*]\s*/,'')).join(sep||'\n').trim():'';};
 const hookS=find(/^(hook|intro)\b/)[0];
 const ctaS=find(/^(close|call to action|cta|final thoughts|conclusion)\b/)[0];
 let emph=find(/^(reason|point)\s*\d+/).map(s=>s.c[0]).filter(x=>x&&x.length<120);
 if(!emph.length){const es=find(/^(emphasis|clip points)/)[0];if(es)emph=es.c.map(x=>x.replace(/^[-•*]\s*/,'')).filter(Boolean).slice(0,8);}
 if(!emph.length)emph=find(/^on-screen card/).map(s=>s.c[0]).filter(x=>x&&x.length<140);
 if(!emph.length)emph=find(/^[a-z]\s*:\s*\S/).map(s=>titleCaseIf(s.raw)).filter(x=>x&&x.length<80);
 if(t)item.title=t;
 item.extract={
  hook:hookS?firstSent(hookS.c.join(' '),2):'',
  cta:ctaS?firstSent(ctaS.c.join(' '),3):'',
  emph,
  tags:secText(/^seo keywords/,' ').replace(/\.\s*$/,''),
  desc:secText(/^suggested video description/),
  kw:(find(/^target keyword/)[0]||{c:[]}).c[0]||'',
  thumb:secText(/^thumbnail/),
  broll:secText(/^(b-?roll|assets)/),

 return item;}

function splitHtml(html,pred){const div=document.createElement('div');div.innerHTML=html;
 const out=[];let cur=null;
 [...div.children].forEach(el=>{const t=el.textContent.trim();if(!t)return;
  if(pred(el,t)){if(cur&&(cur.title||cur.body))out.push(cur);cur={title:t.replace(/^title\s*:\s*/i,'').trim().slice(0,120),body:''};}
  else{if(!cur)cur={title:'',body:''};cur.body+=(cur.body?'\n\n':'')+t;}});
 if(cur&&(cur.title||cur.body))out.push(cur);return out;}
const isHead=lv=>(el,t)=>new RegExp('^H[1-'+lv+']$').test(el.tagName)&&t.length<=120;
const isBoldP=(el,t)=>t.length<=120&&el.tagName==='P'&&el.children.length===1&&/^(STRONG|B)$/.test(el.children[0].tagName)&&el.children[0].textContent.trim()===t;
const isScriptN=(el,t)=>/^(script|video)\s*\d+/i.test(t)&&t.length<=120;

function parseHtmlMode(html,mode,name){
 if(mode==='one')return[{title:cleanName(name),body:htmlToText(html)}];
 if(mode==='head')return splitHtml(html,isHead(4));
 if(mode==='bold')return splitHtml(html,(el,t)=>isHead(4)(el,t)||isBoldP(el,t));
 if(mode==='scriptn')return splitHtml(html,isScriptN);
 if(mode==='dashes'){return parseTextMode(htmlToText(html),'dashes',name);}
 /* auto: split only on H1/H2 headings that are NOT known script sections, keep the split only if pieces look like real scripts */
 let items=splitHtml(html,(el,t)=>isHead(2)(el,t)&&!SECWORDS.test(t));
 if(items.length<2){const sn=splitHtml(html,isScriptN);if(sn.length>=2)items=sn;}
 if(items.length<2||medianWords(items)<30){const fh=firstNonMetaHeading(html);items=[{title:fh||cleanName(name),body:htmlToText(html)}];}
 return items;}
function firstNonMetaHeading(html){const div=document.createElement('div');div.innerHTML=html;
 for(const el of div.children){if(/^H[1-2]$/.test(el.tagName)){const t=el.textContent.trim();if(t&&!SECWORDS.test(t))return t.slice(0,120);}}
 return'';}
function singleText(txt,name){
 const ls=txt.split('\n');const first=(ls[0]||'').trim();const core=first.replace(/^#+\s*/,'').trim();
 const markers=ls.filter(l=>isSecMarker(l.trim())).length;
 if(core&&core.length<120&&!looksLikePath(core)&&!isSecMarker(first)&&(first.startsWith('#')||markers>=2))
  return{title:core,body:ls.slice(1).join('\n').trim()};
 return{title:cleanName(name),body:txt};}
function parseTextMode(txt,mode,name){
 txt=(txt||'').trim();if(!txt)return[];
 if(looksLikePath(txt.split('\n')[0])&&txt.split('\n').filter(Boolean).length<=2)return[];
 const mk=blocks=>blocks.map(b=>{b=b.trim();if(!b)return null;const lines=b.split('\n');
  let title=lines[0].replace(/^#+\s*/,'').replace(/^title\s*:\s*/i,'').trim();
  let body=lines.slice(1).join('\n').trim();
  if(title.length>120||looksLikePath(title)){body=b;title='';}
  return{title,body};}).filter(Boolean);
 if(mode==='one')return[singleText(txt,name)];
 if(mode==='dashes')return mk(txt.split(/\n\s*-{3,}\s*\n/));
 if(mode==='scriptn')return mk(txt.split(/(?=^(?:script|video)\s*\d+)/gim));
 if(mode==='head'||mode==='bold')return mk(txt.split(/(?=^#{1,4}\s)/gm));
 /* auto */
 if(/\n\s*-{3,}\s*\n/.test(txt))return mk(txt.split(/\n\s*-{3,}\s*\n/));
 const sn=(txt.match(/^(?:script|video)\s*\d+/gim)||[]).length;
 if(sn>=2){const items=mk(txt.split(/(?=^(?:script|video)\s*\d+)/gim));if(medianWords(items)>=30)return items;}
 return[singleText(txt,name)];}

function parseGroup(g){
 let items=g.kind==='html'?parseHtmlMode(g.src,g.mode,g.name):parseTextMode(g.src,g.mode,g.name);
 if(!items.length)items=[{title:cleanName(g.name),body:g.kind==='html'?htmlToText(g.src):g.src.trim()}];
 if(items.length>1)items=items.filter(x=>words(x.body)>=15);
 items.forEach(enrich);
 items.forEach((x,i)=>{if(!x.title||looksLikePath(x.title))x.title=cleanName(g.name)+(items.length>1?' · part '+(i+1):'');x.title=x.title.slice(0,120);});
 g.items=items;}

   ${days.map((d,i)=>{const c=get(d.k);const sl=SLOTS[i];const cls=sl.k==='long'?'p-l':sl.k==='lib'?'p-f':'p-s';return `
    <div class="day ${d.today?'today':''}"><div class="dn">${d.dn}</div><div class="dd mono">${d.dd}</div>
     <div class="pip ${cls} ${c.m?'on':''}" title="${sl.ti}" onclick="tDay('${d.k}','m')">${sl.l}</div>
     ${i<5?`<div class="pip p-e ${c.e?'on':''}" title="LinkedIn engagement block: comment substantively on 5 target prospects" onclick="tDay('${d.k}','e')">E</div>
     <div class="pip p-c ${c.c?'on':''}" title="10 connects sent, no pitch" onclick="tDay('${d.k}','c')">C</div>`:''}
    </div>`;}).join('')}
  </div>
  <div class="legend"><span><span class="c-gold">■</span> L = long form</span><span><span class="c-green">■</span> S = short</span><span><span class="c-gold">◌</span> F = library short, optional</span><span><span class="c-am">■</span> E = engagement block</span><span><span class="c-cyan">■</span> C = connects</span></div>
 </div>`;
}
function tDay(k,f){const c=S.cadence[k]||(S.cadence[k]={});c[f]=!c[f];save();renderAll();if(f==='m'&&c.m)toast('Logged. Streak: '+publishStreak());}

/* ============ METRICS ============ */
function num(x){const n=parseFloat(x);return isNaN(n)?0:n;}
function renderMetrics(){
 const pub=S.videos.filter(v=>v.status==='published');
 const avg=(k)=>{const xs=pub.map(v=>num(v.metrics[k])).filter(x=>x>0);return xs.length?(xs.reduce((a,b)=>a+b,0)/xs.length):0;};
 const sum=(k)=>pub.reduce((a,v)=>a+num(v.metrics[k]),0);
 const srch=avg('srch');
 return `
 <div class="card">
  <h2>Channel rollup</h2>
  <div class="hint">Where to pull these, all in YouTube Studio, Analytics, click into the video: CTR on the Reach tab. Average view duration and the retention curve on the Engagement tab (retention % = average percentage viewed). Search % under Traffic sources. Subs gained on the video's Overview. Update weekly during the Systems block.</div>
  <div class="rollup">
   <div class="scell"><div class="v c-gold mono">${avg('ctr').toFixed(1)}%</div><div class="k">Avg CTR · aim 5+</div></div>
   <div class="scell"><div class="v c-cyan mono">${avg('ret').toFixed(0)}%</div><div class="k">Avg retention</div></div>
   <div class="scell"><div class="v ${srch>=20?'c-green':'c-rose'} mono">${srch.toFixed(0)}%</div><div class="k">Search traffic · aim 20+</div></div>
   <div class="scell"><div class="v c-am mono">${sum('subs')}</div><div class="k">Subs gained</div></div>
   <div class="scell"><div class="v c-green mono">${sum('leads')}</div><div class="k">Leads from video</div></div>
  </div>
  <div class="hint">Benchmark diagnostics: CTR under 5% means repackage the title and thumbnail. 30-second retention under 70% means fix the hook. Midpoint retention under 50% means add a pattern interrupt. Search traffic under 20% means the SEO titles and descriptions are not working. Subs under 1 per 100 views means the CTA is too weak or too late. Comments under 1 per 50 views means the end question is not specific enough. Good numbers but no leads means the CTA path is broken, not the content.</div>
 </div>
 <div class="card">
  <h2>vidIQ analytics prompts</h2>
  <div class="hint">Tap to copy, paste to vidIQ. Weekly pull feeds this table; the deep dive runs 7 days after each publish; the audit anchors the monthly zoom-out.</div>
  <div class="row">
   <button class="btn sm line" onclick="copyText(VIDIQ.analytics,'Weekly analytics prompt copied')">Weekly pull</button>
   <button class="btn sm line" onclick="copyText(VIDIQ.deep,'Deep dive prompt copied. Swap in the video title')">Per-video deep dive</button>
   <button class="btn sm line" onclick="copyText(VIDIQ.audit,'Monthly audit prompt copied')">Monthly audit</button>
  </div>
 </div>
 <div class="card">
  <h2>Per video</h2>
  ${pub.length?`<div style="overflow-x:auto"><table class="mtable"><tr><th style="min-width:140px">Video</th><th>CTR %</th><th>Avg view (min)</th><th>Retention %</th><th>Search %</th><th>Likes</th><th>Comments</th><th>Subs</th><th>Leads</th></tr>
  ${pub.map(v=>`<tr><td style="font-weight:600">${esc(v.title.slice(0,44))}</td>
   ${['ctr','avd','ret','srch','likes','com','subs','leads'].map(k=>`<td><input type="number" step="0.1" style="width:60px" value="${esc(v.metrics[k]??'')}" onchange="vById('${v.id}').metrics.${k}=this.value;save();"></td>`).join('')}</tr>`).join('')}
  </table></div>`:'<div class="empty">No published videos yet. Mark a vault script as Published and it appears here for tracking.</div>'}
 </div>`;
}

/* ============ boot ============ */
/* ============ CONTENT CALENDAR ============
   Every script (long or short) can carry a sched date. The calendar is the
   month view of those dates: what goes out, and when. */
let calYM=(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};})();
let calSel=null;
const ST_LABEL={draft:'Draft',approved:'Approved',produced:'Filmed',scheduled:'Scheduled',published:'Published'};
const ST_ORDER=['draft','approved','produced','scheduled','published'];
function isoD(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function schedOn(ds){return S.videos.filter(v=>v.sched===ds);}
function calNav(dir){calYM.m+=dir;if(calYM.m<0){calYM.m=11;calYM.y--;}if(calYM.m>11){calYM.m=0;calYM.y++;}calSel=null;renderAll();}
function calPick(ds){calSel=(calSel===ds?null:ds);renderAll();}
function schedFromPicker(){
 const sel=document.getElementById('calPickScript'),dt=document.getElementById('calPickDate');
 if(!sel||!sel.value){toast('Nothing to schedule');return;}
 if(!dt||!dt.value){toast('Pick a date first');dt&&dt.focus();return;}
 const ds=dt.value;
 calYM={y:+ds.slice(0,4),m:+ds.slice(5,7)-1};
 calSel=ds;
 schedVid(sel.value,ds);
}
function schedVid(id,ds){const v=vById(id);if(!v)return;v.sched=ds||undefined;save();renderAll();if(ds)toast('On the calendar: '+ds);}
function unschedVid(id){const v=vById(id);if(!v)return;const was=v.sched;v.sched=undefined;save();renderAll();
 undoToast('Taken off '+(was||'the calendar'),()=>{try{v.sched=was;save();renderAll();}catch(e){}});}
function renderCalendar(){
 const y=calYM.y,m=calYM.m;
 const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=first.getDay();
 const today=(()=>{const d=new Date();return isoD(d.getFullYear(),d.getMonth(),d.getDate());})();
 const monthName=first.toLocaleDateString('en-CA',{month:'long',year:'numeric'});
 let cells='';
 for(let i=0;i<lead;i++)cells+='<div></div>';
 for(let d=1;d<=days;d++){
  const ds=isoD(y,m,d),items=schedOn(ds);
  const longs=items.filter(v=>v.fmt!=='short').length,shorts=items.filter(v=>v.fmt==='short').length;
  const isToday=ds===today,isSel=ds===calSel;
  cells+=`<div onclick="calPick('${ds}')" style="min-height:46px;border-radius:9px;padding:4px 3px;cursor:pointer;text-align:center;
   border:1px solid ${isSel?'rgba(255,255,255,.5)':isToday?'rgba(69,200,216,.55)':'rgba(120,130,180,.12)'};
   background:${isSel?'rgba(255,255,255,.07)':items.length?'rgba(255,255,255,.03)':'transparent'}">
   <div style="font-size:10.5px;font-family:'Space Mono',monospace;color:${isToday?'#45c8d8':'#8a93a8'}">${d}</div>
   <div style="display:flex;gap:2px;justify-content:center;margin-top:3px;flex-wrap:wrap">
    ${Array(Math.min(longs,3)).fill('<span style="width:6px;height:6px;border-radius:2px;background:#e6c872"></span>').join('')}
    ${Array(Math.min(shorts,4)).fill('<span style="width:5px;height:5px;border-radius:99px;background:#b79bff"></span>').join('')}
   </div></div>`;
 }
 const selItems=calSel?schedOn(calSel):[];
 const unsched=S.videos.filter(v=>!v.sched&&v.status!=='published').slice().reverse();
 return `
 <div class="card">
  <h2 style="margin-top:0">Schedule a script</h2>
  <div class="hint">Pick a script, pick a day, done. Or tap any day in the grid below and use Schedule here. Either way it lands on the calendar and in the month list.</div>
  ${unsched.length?`<div class="row">
   <select id="calPickScript" style="flex:1;min-width:150px">${unsched.map(v=>`<option value="${v.id}">${v.fmt==='short'?'[S] ':'[L] '}${esc(v.title.slice(0,48))}</option>`).join('')}</select>
   <input type="date" id="calPickDate" style="width:auto">
   <button class="btn sm" onclick="schedFromPicker()">Schedule</button>
  </div>`:'<div class="empty">Everything unpublished already has a date. Add a script in the vault and it will appear here.</div>'}
 </div>
 <div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
   <button class="btn sm line" onclick="calNav(-1)">&#8249; prev</button>
   <h2 style="margin:0">${monthName}</h2>
   <button class="btn sm line" onclick="calNav(1)">next &#8250;</button>
  </div>
  <div class="hint">One square, one day. <span style="color:#e6c872">&#9632;</span> long form &middot; <span style="color:#b79bff">&#9679;</span> short. Tap a day to see it, schedule to it, or clear it.</div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:9px;letter-spacing:.08em;color:#6b7280;text-align:center;margin-bottom:4px">
   <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
 </div>
 ${calSel?`<div class="card">
  <h3 style="margin-top:0">${new Date(calSel+'T12:00').toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})}</h3>
  ${selItems.length?selItems.map(v=>`
   <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(120,130,180,.1)">
    <div style="min-width:0">
     <span class="chip" style="font-size:9px;background:${v.fmt==='short'?'rgba(157,123,255,.16);color:#c9b3ff':'rgba(230,200,114,.14);color:#e6c872'}">${v.fmt==='short'?'Short':'Long'}</span>
     <span style="font-size:12.5px">${esc(v.title.slice(0,52))}</span>
     <span style="font-size:10px;color:#8a93a8"> &middot; ${ST_LABEL[v.status]||v.status}</span></div>
    <button class="btn sm line" onclick="unschedVid('${v.id}')" style="flex-shrink:0">clear</button>
   </div>`).join(''):'<div class="empty">Nothing scheduled this day yet.</div>'}
  ${unsched.length?`<div class="row" style="margin-top:10px">
   <select id="calAssign" style="flex:1;min-width:160px">${unsched.map(v=>`<option value="${v.id}">${v.fmt==='short'?'[S] ':'[L] '}${esc(v.title.slice(0,48))}</option>`).join('')}</select>
   <button class="btn" onclick="schedVid(document.getElementById('calAssign').value,'${calSel}')">Schedule here</button>
  </div>`:''}
 </div>`:''}
 <div class="card">
  <h3 style="margin-top:0">This month, in order</h3>
  ${(()=>{const monthItems=S.videos.filter(v=>v.sched&&v.sched.slice(0,7)===isoD(y,m,1).slice(0,7)).sort((a,b)=>a.sched<b.sched?-1:1);
   return monthItems.length?monthItems.map(v=>`
    <div style="display:flex;gap:9px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(120,130,180,.08)">
     <span class="mono" style="font-size:10.5px;color:#8a93a8;width:44px;flex-shrink:0">${v.sched.slice(5)}</span>
     <span class="pill" style="flex-shrink:0;background:${v.fmt==='short'?'rgba(157,123,255,.16);color:#c9b3ff':'rgba(230,200,114,.14);color:#e6c872'}">${v.fmt==='short'?'S':'L'}</span>
     <span style="font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.title)}</span>
    </div>`).join(''):'<div class="empty">Nothing on the calendar this month. Tap a day above and schedule a script to it.</div>';})()}
 </div>`;
}

function renderAll(){renderTabs();renderRail();
 const map={vault:renderVault,calendar:renderCalendar,cadence:renderCadence,metrics:renderMetrics};
 if(!map[cur])cur='vault';   /* retired tabs fall back to the vault */
 const v=document.getElementById('view');
 v.innerHTML=map[cur]();}
renderAll();

/* Ask the browser to treat this data as persistent. Browsers evict storage from
   sites you have not visited recently, and all eight tools live in that storage.
   This is a request, not a guarantee, which is why the Vault backup still matters. */
(function(){
  try{
    if(navigator.storage && navigator.storage.persist && navigator.storage.persisted){
      navigator.storage.persisted().then(function(already){
        if(!already) navigator.storage.persist();
      }).catch(function(){});
    }
  }catch(e){}
})();

</script>
