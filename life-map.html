<style>
:root{
  --bg:#0c0e1a; --card:#141830; --card2:#1a1f3a; --line:rgba(120,130,180,.16);
  --gold:#f0b73e; --gold2:#f6cf6a; --green:#2fd180; --rose:#f0628a; --blue:#4ea3e0; --violet:#9d7bff; --amber:#f0683e;
  --txt:#eef0fb; --muted:#8089a8; --dim:#6f7798;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:
   radial-gradient(1100px 600px at 50% -10%,rgba(240,183,62,.07),transparent 60%),
   var(--bg);
  color:var(--txt);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;
  padding:0;-webkit-font-smoothing:antialiased}
#app{max-width:640px;margin:0 auto;
  padding:0 max(14px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}

/* App chrome. The blurred fill runs up under the Dynamic Island so the clock,
   signal, wifi and battery never sit on top of content. */
.homebtn{display:grid;place-items:center;width:33px;height:33px;border-radius:10px;flex-shrink:0;
  border:1px solid rgba(240,183,62,.35);background:rgba(240,183,62,.10);color:#f0b73e;
  font-size:15px;line-height:1;text-decoration:none;margin-right:9px}
.homebtn:active{transform:scale(.93)}
.appbar{position:sticky;top:0;z-index:50;
  margin:0 calc(-1 * max(14px,env(safe-area-inset-left))) 12px;
  padding:calc(env(safe-area-inset-top,0px) + 11px) max(14px,env(safe-area-inset-left)) 11px max(14px,env(safe-area-inset-right));
  background:rgba(12,14,26,.90);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.appbar-title{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:#f3f4fb;letter-spacing:.04em;white-space:nowrap;line-height:1.1}
.appbar-sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:2px;white-space:nowrap}
.appbar-pill{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;
  background:rgba(240,183,62,.1);border:1px solid rgba(240,183,62,.35);
  font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;flex-shrink:0}
.cinzel{font-family:'Cinzel',serif}
.mono{font-family:'Space Mono',monospace}
.eyebrow{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:linear-gradient(180deg,rgba(26,31,58,.9),rgba(20,24,48,.9));border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px)}
.btn{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit}
.tap{transition:transform .1s,filter .15s}
.tap:active{transform:scale(.94)}
.row{border-radius:10px;transition:background .15s}
.row:active{background:rgba(255,255,255,.03)}
.bartrack{width:100%;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.22,.61,.36,1)}
input,select,textarea{font-family:inherit;outline:none;color-scheme:dark}
.num{width:56px;background:transparent;border:none;color:var(--txt);text-align:center;font-family:'Space Mono',monospace;font-size:13px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.overlay{position:fixed;inset:0;background:rgba(6,7,14,.86);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fadeUp{animation:fu .28s cubic-bezier(.22,.61,.36,1)}
@keyframes fu{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(80px);
  background:rgba(20,23,38,.97);border:1px solid rgba(240,183,62,.45);color:var(--txt);padding:11px 18px;border-radius:99px;
  font-size:12.5px;z-index:80;opacity:0;transition:.28s;white-space:nowrap;box-shadow:0 12px 32px rgba(0,0,0,.5);pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:600;white-space:nowrap}
a{color:inherit}
</style>

/* ===================== dates + periods ===================== */
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isoToTs(iso){ if(!iso) return NaN; var p=String(iso).split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setHours(0,0,0,0); return d.getTime(); }
function todayTs(){ var d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function daysUntil(iso){ var t=isoToTs(iso); if(isNaN(t)) return null; return Math.round((t-todayTs())/86400000); }
function fmtDay(iso){ var t=isoToTs(iso); if(isNaN(t)) return ""; return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function periodKey(cad){
  var d=new Date(), y=d.getFullYear();
  if(cad==="Daily") return d.toDateString();
  if(cad==="Weekly"){ var t=new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate()-((t.getDay()+6)%7)); return "W"+t.toDateString(); }
  if(cad==="Monthly") return "M"+y+"-"+d.getMonth();
  if(cad==="Quarterly") return "Q"+y+"-"+Math.floor(d.getMonth()/3);
  return "Y"+y;
}
function isChecked(c){ return S.checks[c.id]===periodKey(c.cad); }

/* ===================== model helpers ===================== */
var STATUSES=["Not started","In progress","Done"];
var PRIS=["High","Med","Low"];
var CADS=["Daily","Weekly","Monthly","Quarterly","Annual"];
function priColor(p){ return p==="High"?"var(--rose)":p==="Med"?"var(--gold)":"var(--muted)"; }
function statusColor(s){ return s==="Done"?"var(--green)":s==="In progress"?"var(--blue)":"var(--muted)"; }
function areaBy(name){ for(var i=0;i<AREAS.length;i++){ if(AREAS[i].name===name) return AREAS[i]; } return {name:name,icon:"\u2727",desc:""}; }
function openProjects(){ return S.projects.filter(function(p){ return p.status!=="Done"; }); }
function isOverdue(p){ var d=daysUntil(p.due); return p.status!=="Done" && d!==null && d<0; }
function isDueSoon(p){ var d=daysUntil(p.due); return p.status!=="Done" && d!==null && d>=0 && d<=14; }

/* ---- time-tagged (parked) tasks ----
   A task tagged for a future month stays off Today, Coming up and the default
   open list until ~3 weeks before that month starts. A due date within 14 days
   always wakes it — deadlines outrank parking. */
var WAKE_DAYS=21;
function monthKeyOf(ts){ var d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function parkTs(p){ if(!p||!p.park) return null; var m=String(p.park).split("-"); if(m.length<2) return null;
  var d=new Date(+m[0],+m[1]-1,1); d.setHours(0,0,0,0); var t=d.getTime(); return isNaN(t)?null:t; }
function isParked(p){
  if(!p.park||p.status==="Done") return false;
  var pt=parkTs(p); if(pt==null) return false;
  if(p.due){ var d=daysUntil(p.due); if(d!==null&&d<=14) return false; }
  return todayTs() < pt - WAKE_DAYS*86400000;
}
function fmtMonth(key){ var m=String(key).split("-"); return new Date(+m[0],+m[1]-1,1).toLocaleDateString(undefined,{month:"short",year:"numeric"}); }
function fmtMonShort(key){ var m=String(key).split("-"); return new Date(+m[0],+m[1]-1,1).toLocaleDateString(undefined,{month:"short"}); }
function monthsAhead(from,n){ var out=[],d=new Date(); d.setDate(1); d.setHours(0,0,0,0); if(from) d.setMonth(d.getMonth()+from);
  for(var i=0;i<n;i++){ out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); d.setMonth(d.getMonth()+1); }
  return out; }
function choresDue(){ return S.chores.filter(function(c){ return !isChecked(c); }); }
function choresDueByCad(cad){ return S.chores.filter(function(c){ return c.cad===cad && !isChecked(c); }); }

/* ---- assign a bucket chore to today ----
   Weekly/monthly/quarterly/annual chores live in their buckets; tap "Today"
   on one to pull it onto today's list. Ticking it there completes it for the
   whole cycle. Left unticked, it slides back to its bucket at midnight —
   assigning is a plan for today, not a new deadline. */
function plannedToday(c){ return !!(S.planned && S.planned[c.id]===todayISO()); }
function plannedChores(){ return S.chores.filter(function(c){ return c.cad!=="Daily" && plannedToday(c); }); }
function planToggle(id){
  var c=S.chores.find(function(x){ return x.id===id; }); if(!c) return;
  if(!S.planned) S.planned={};
  if(S.planned[c.id]===todayISO()){ delete S.planned[c.id]; toast("Off today’s list"); }
  else { S.planned[c.id]=todayISO(); toast("✓ On today’s list: "+c.chore.slice(0,32)); }
  save(); render();
}

/* Focus = what actually deserves attention right now, ranked. */
function focusItems(){
  var out=[];
  S.projects.forEach(function(p){
    if(p.status==="Done") return;
    if(isParked(p)) return;
    var d=daysUntil(p.due), score=0, why="";
    /* Anything due today or already overdue lives in the Today panel, so Focus
       shows what is coming next instead of repeating the same rows. */
    if(d!==null && d<=0) return;
    if(d!==null && d<=14){ score=70-d; why=(d===1?"due tomorrow":"due in "+d+"d"); }
    else if(p.pri==="High"){ score=50; why="high priority"; }
    else return;
    if(p.pri==="High") score+=12; else if(p.pri==="Med") score+=4;
    if(p.status==="In progress") score+=6;
    out.push({p:p,score:score,why:why});
  });
  out.sort(function(a,b){ return b.score-a.score; });
  return out;
}

/* ===================== stats ===================== */
function stats(){
  var total=S.projects.length;
  var done=S.projects.filter(function(p){ return p.status==="Done"; }).length;
  var prog=S.projects.filter(function(p){ return p.status==="In progress"; }).length;
  var open=total-done;
  var hi=S.projects.filter(function(p){ return p.status!=="Done" && p.pri==="High" && !isParked(p); }).length;
  var over=S.projects.filter(isOverdue).length;
  var soon=S.projects.filter(isDueSoon).length;
  var parked=S.projects.filter(isParked).length;
  var ck=S.chores.filter(isChecked).length;
  return {total:total,done:done,open:open,prog:prog,hi:hi,over:over,soon:soon,parked:parked,
          pct: total?Math.round(done/total*100):0, choreDone:ck, choreTotal:S.chores.length,
          chorePct: S.chores.length?Math.round(ck/S.chores.length*100):0};
}
function doneInLastDays(n){
  var cut=todayTs()-(n-1)*86400000;
  return (S.log||[]).filter(function(e){ return e.t==="proj" && isoToTs(e.d)>=cut; }).length;
}

   yours today. Daily chores plus anything the calendar says is due now, all

function niceToday(){
  try{ return new Date().toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric"}); }
  catch(e){ return todayISO(); }
}
function todayItems(){
  var daily=S.chores.filter(function(c){ return c.cad==="Daily"; });
  var dueNow=S.projects.filter(function(p){
    if(p.status==="Done") return false;
    var d=daysUntil(p.due);
    return d!==null && d<=0;
  }).sort(function(a,b){ return (daysUntil(a.due)||0)-(daysUntil(b.due)||0); });
  var planned=plannedChores();
  var otherDue=S.chores.filter(function(c){ return c.cad!=="Daily" && !isChecked(c) && !plannedToday(c); });
  return {daily:daily, dueNow:dueNow, otherDue:otherDue, planned:planned};
}
function todayPanel(){

  h+='<div class="mono" style="font-size:11px;color:var(--dim);text-align:right">'
    +(todays.length?dailyDone+'/'+todays.length+' chores':'')
    +(T.dueNow.length?'<br><span style="color:var(--amber)">'+T.dueNow.length+' due</span>':'')+'</div>';
  h+='</div>';

  if(allClear){
    h+='<div style="font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5">'

/* ===================== UI: the horizon =====================
   Tasks over time without the clutter of a calendar grid. One cell per month;
   a pile-up on one day is just a bigger number, never a mess. Tap a cell to
   see exactly what lands there. Due dates and parked months both count. */
function horizonData(){
  var months=monthsAhead(0,12);
  var buckets={over:[],later:[]}; months.forEach(function(k){ buckets[k]=[]; });
  var dateless=0, t0=todayTs();
  S.projects.forEach(function(p){
    if(p.status==="Done") return;
    var ts=null,kind="";
    if(p.due){ ts=isoToTs(p.due); kind="due"; }
    else if(p.park){ ts=parkTs(p); kind="park"; }
    if(ts==null||isNaN(ts)){ dateless++; return; }
    var e={p:p,ts:ts,kind:kind};
    if(kind==="due"&&ts<t0){ buckets.over.push(e); return; }
    var k=monthKeyOf(ts);
    if(buckets[k]) buckets[k].push(e);
    else if(ts>t0) buckets.later.push(e);
    else buckets[months[0]].push(e);   /* parked for a month already past → live now */
  });
  return {months:months,buckets:buckets,dateless:dateless};
}
function horizonView(){
  var H=horizonData();
  function cell(key,label,sub,list,accent){
    var on=view.hSel===key, n=list.length;
    return '<button class="btn tap" data-act="hmon" data-key="'+key+'" style="flex-shrink:0;width:56px;padding:9px 4px 8px;border-radius:12px;text-align:center;'
      +'background:'+(on?"rgba(240,183,62,.12)":n?"rgba(255,255,255,.03)":"rgba(255,255,255,.012)")+';'
      +'border:1px solid '+(on?"rgba(240,183,62,.55)":(accent&&n?accent:"var(--line)"))+';opacity:'+(n?1:.45)+'">'
      +'<div class="eyebrow" style="font-size:8px;color:'+(on?"var(--gold)":(key==="over"&&n?"var(--amber)":"var(--muted)"))+'">'+label+'</div>'
      +'<div style="font-size:7px;color:var(--dim);min-height:8px">'+(sub||"")+'</div>'
      +'<div class="mono" style="font-size:16px;font-weight:700;margin-top:2px;color:'+(n?(key==="over"?"var(--amber)":"var(--txt)"):"var(--dim)")+'">'+n+'</div>'
      +'</button>';
  }
  var h='<div class="scroll-x" style="display:flex;gap:6px;padding-bottom:4px">';
  if(H.buckets.over.length) h+=cell("over","Late","",H.buckets.over,"rgba(240,104,62,.45)");
  H.months.forEach(function(k,i){
    var yr=(i===0||k.slice(5,7)==="01")?"’"+k.slice(2,4):"";
    h+=cell(k,fmtMonShort(k),yr,H.buckets[k]);
  });
  if(H.buckets.later.length) h+=cell("later","Later","",H.buckets.later);
  h+='</div>';

  var sel=view.hSel?H.buckets[view.hSel]:null;
  if(sel&&sel.length){
    var title=view.hSel==="over"?"Running late":view.hSel==="later"?"A year-plus out":fmtMonth(view.hSel);
    var rows=sel.slice().sort(function(a,b){ return a.ts-b.ts; });
    h+='<div class="fadeUp" style="margin-top:11px;padding-top:11px;border-top:1px solid var(--line)">';
    h+='<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="eyebrow" style="font-size:9px;color:var(--gold)">'+title+'</span><span class="mono" style="font-size:10px;color:var(--dim)">'+sel.length+'</span></div>';
    rows.slice(0,8).forEach(function(e){
      var p=e.p,a=areaBy(p.area);
      h+='<div class="row" data-act="edit" data-id="'+p.id+'" style="display:flex;align-items:center;gap:9px;padding:8px 4px;border-bottom:1px solid rgba(120,130,180,.06);cursor:pointer">';
      h+='<span style="font-size:14px;flex-shrink:0">'+a.icon+'</span>';
      h+='<div style="flex:1;min-width:0"><div style="font-size:12.5px;color:var(--txt);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.task)+'</div>';
      h+='<div style="font-size:9px;color:var(--dim);margin-top:1px">'+esc(p.area)+'</div></div>';
      h+=(e.kind==="park"
        ?'<span class="chip" style="flex-shrink:0;color:var(--violet);background:rgba(157,123,255,.1);border:1px solid rgba(157,123,255,.3)">⏸ parked</span>'
        :'<span class="chip" style="flex-shrink:0;color:'+(view.hSel==="over"?"var(--amber)":"var(--muted)")+';background:rgba(255,255,255,.04);border:1px solid var(--line)">'+fmtDay(p.due)+'</span>');
      h+='</div>';
    });
    if(rows.length>8) h+='<div style="font-size:10px;color:var(--dim);text-align:center;margin-top:7px">and '+(rows.length-8)+' more — filter Projects to dig in</div>';
    h+='</div>';
  } else if(view.hSel){
    h+='<div style="font-size:11px;color:var(--dim);font-style:italic;margin-top:10px;text-align:center">Nothing lands here yet.</div>';
  } else {

  }
  if(H.dateless) h+='<div style="font-size:9.5px;color:var(--dim);margin-top:10px;text-align:center">'+H.dateless+' open task'+(H.dateless===1?"":"s")+' with no date live on the board below.</div>';
  return h;

/* ===================== UI: momentum ===================== */
function momentumView(st){
  var h='';
  var w4=doneInLastDays(28), w1=doneInLastDays(7);
  function tile(v,l,c){ return '<div style="flex:1;text-align:center;padding:10px 4px;border-radius:11px;background:rgba(255,255,255,.025);border:1px solid rgba(120,130,180,.1)"><div class="mono" style="font-size:17px;font-weight:700;color:'+(c||"var(--txt)")+'">'+v+'</div><div class="eyebrow" style="font-size:8px;margin-top:3px">'+l+'</div></div>'; }
  h+='<div style="display:flex;gap:7px">'+tile(w1,"Done (7d)","var(--green)")+tile(w4,"Done (28d)","var(--green)")+tile(st.chorePct+"%","Chores cycle","var(--gold)")+'</div>';

  // 12-week bars of completions
  var weeks=12, buckets=new Array(weeks).fill(0), t0=todayTs();
  (S.log||[]).forEach(function(e){
    if(e.t!=="proj") return;
    var ts=isoToTs(e.d); if(isNaN(ts)) return;
    var wk=Math.floor((t0-ts)/(7*86400000));
    if(wk>=0 && wk<weeks) buckets[weeks-1-wk]++;
  });
  var mx=Math.max.apply(null,buckets.concat([1]));
  h+='<div style="margin-top:14px"><div class="eyebrow" style="font-size:9px;color:var(--muted);margin-bottom:7px">Completions \u00b7 last 12 weeks</div>';
  h+='<div style="display:flex;align-items:flex-end;gap:3px;height:56px">';
  buckets.forEach(function(b,i){
    var pct=Math.max(3,Math.round(b/mx*100));
    h+='<div title="'+b+'" style="flex:1;height:'+pct+'%;border-radius:4px 4px 2px 2px;background:'+(b?"linear-gradient(180deg,#f6cf6a,#e2a32f)":"rgba(255,255,255,.05)")+'"></div>';
  });
  h+='</div><div style="display:flex;justify-content:space-between;margin-top:5px"><span style="font-size:8.5px;color:var(--dim)">12 wks ago</span><span style="font-size:8.5px;color:var(--dim)">this week</span></div></div>';

  if(!(S.log||[]).length) h+='<div style="font-size:10.5px;color:var(--dim);margin-top:10px;line-height:1.5;font-style:italic">Mark projects Done and this fills in. It only counts completions from here forward, so the first bars start now.</div>';

  // area leaderboard: most open
  var rows=AREAS.map(function(a){
    var ps=S.projects.filter(function(p){ return p.area===a.name && p.status!=="Done"; });
    return {a:a,n:ps.length};
  }).filter(function(r){ return r.n>0; }).sort(function(x,y){ return y.n-x.n; }).slice(0,5);
  if(rows.length){
    h+='<div style="margin-top:16px"><div class="eyebrow" style="font-size:9px;color:var(--muted);margin-bottom:7px">Heaviest areas \u00b7 most open</div>';
    var top=rows[0].n;
    rows.forEach(function(r){
      h+='<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--txt)">'+r.a.icon+' '+esc(r.a.name)+'</span><span class="mono" style="color:var(--muted);font-size:10px">'+r.n+'</span></div>';
      h+='<div class="bartrack" style="height:4px;margin-top:3px"><div class="fill" style="width:'+Math.round(r.n/top*100)+'%;background:linear-gradient(90deg,#e2a32f,#f6cf6a)"></div></div></div>';
    });
    h+='</div>';
  }
  return h;
}

/* ===================== actions ===================== */

/* Destructive actions were one-way. Snapshot first, then keep Undo on screen. */
var __undoT=null;
function undoToast(msg, restore){
  var t=document.getElementById('undoToast');
  if(!t){ t=document.createElement('div'); t.id='undoToast'; document.body.appendChild(t); }
  t.style.cssText="position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:95;"
   +"background:rgba(20,23,38,.97);border:1px solid rgba(240,183,62,.5);color:#f6e2ad;padding:10px 16px;border-radius:12px;"
   +"font-family:'Outfit',sans-serif;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.55);display:flex;align-items:center;gap:12px;max-width:92vw";
  t.textContent='';
  var s=document.createElement('span'); s.textContent=msg; t.appendChild(s);
  var b=document.createElement('button'); b.textContent='Undo';
  b.style.cssText="background:rgba(240,183,62,.16);border:1px solid rgba(240,183,62,.5);color:#f0b73e;font-family:inherit;"
   +"font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer;flex-shrink:0";
  b.onclick=function(){ try{ restore(); }catch(e){} t.remove(); };
  t.appendChild(b);
  clearTimeout(__undoT); __undoT=setTimeout(function(){ if(t&&t.parentNode) t.remove(); },7000);
}

function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("on"); },2200); }

function advance(id){
  var p=S.projects.find(function(x){ return x.id===id; }); if(!p) return;
  var i=STATUSES.indexOf(p.status); if(i<0) i=0;
  var next=STATUSES[(i+1)%STATUSES.length];
  p.status=next;
  if(next==="Done"){ p.doneAt=todayISO(); S.log=S.log||[]; S.log.push({t:"proj",id:p.id,d:todayISO()}); toast("\u2713 Done: "+p.task.slice(0,38)); }
  else { delete p.doneAt; S.log=(S.log||[]).filter(function(e){ return !(e.t==="proj"&&e.id===p.id); }); }
  save(); render();
}
function tick(id){
  var c=S.chores.find(function(x){ return x.id===id; }); if(!c) return;
  var k=periodKey(c.cad);
  if(S.checks[c.id]===k){ delete S.checks[c.id]; }
  else { S.checks[c.id]=k; toast("\u2713 "+c.chore.slice(0,38)); }
  save(); render();
}

app.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]"); if(!el) return;
  var act=el.dataset.act, id=el.dataset.id, key=el.dataset.key;
  if(act==="f") return;
  if(act==="jumpChores"){
    view.open["chores"]=true; render();
    setTimeout(function(){
      var t=document.querySelector('[data-act="section"][data-key="chores"]');
      if(t) t.scrollIntoView({behavior:window.matchMedia?.("(prefers-reduced-motion: reduce)").matches?"instant":"smooth",block:"start"});
    },70);
    return;
  }
  if(act==="section"){ view.open[key]=!view.open[key]; render(); }
  else if(act==="hmon"){ view.hSel=(view.hSel===el.dataset.key)?null:el.dataset.key; render(); }
  else if(act==="qaPick"){ view.qa.pick=!view.qa.pick; render(); }
  else if(act==="qaArea"){ view.qa.area=el.dataset.area; view.qa.pick=false; render(); }
  else if(act==="qaWhen"){ view.qa.when=el.dataset.w||""; render(); }
  else if(act==="qaAdd"){ quickAdd(); }
  else if(act==="advance"){ advance(id); }
  else if(act==="tick"){ tick(id); }
  else if(act==="plan"){ planToggle(id); }
  else if(act==="focusAll"){ view.focusAll=!view.focusAll; render(); }
  else if(act==="area"){ view.fArea=el.dataset.area; view.fStatus="_open"; view.open.proj=true; render();
    var pc=document.querySelector('[data-act="section"][data-key="proj"]'); if(pc) pc.scrollIntoView({behavior:window.matchMedia?.("(prefers-reduced-motion: reduce)").matches?"instant":"smooth",block:"start"}); }
  else if(act==="edit"){ var p=S.projects.find(function(x){ return x.id===id; }); if(p){ view.editor=Object.assign({kind:"proj"},p); render(); } }
  else if(act==="editc"){ var c=S.chores.find(function(x){ return x.id===id; }); if(c){ view.editor=Object.assign({kind:"chore"},c); render(); } }
  else if(act==="add"){ view.editor=(el.dataset.kind==="chore")?{kind:"chore",cad:"Weekly"}:{kind:"proj",area:(view.fArea||AREAS[0].name),pri:"Med",status:"Not started"}; render(); }
  else if(act==="closeEditor"){ view.editor=null; render(); }
  else if(act==="saveEditor"){ saveEditor(); }

function validateLifeMapRecords(input){
  const object=x=>x&&typeof x==='object'&&!Array.isArray(x);
  let raw=input;
  if(raw?.app==='atlas-connected-transfer')raw=raw.apps?.find(x=>x.kind==='life-map')?.state;
  if(!object(raw)||!Array.isArray(raw.projects))throw Error('Choose a Life Map backup.');
  const text=JSON.stringify(raw);if(new TextEncoder().encode(text).length>1500000)throw Error('Choose a Life Map backup smaller than 1.5 MB.');
  const walk=(x,depth=0)=>{if(depth>30)throw Error('This backup is too deeply nested.');if(object(x)||Array.isArray(x))for(const [k,v] of Object.entries(x)){if(['__proto__','prototype','constructor'].includes(k))throw Error('This backup contains an unsupported field.');walk(v,depth+1);}};walk(raw);
  const copy=JSON.parse(text),out={...copy,projects:copy.projects,chores:copy.chores??[],checks:copy.checks??{},planned:copy.planned??{},log:copy.log??[]};
  const date=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&Number.isFinite(Date.parse(x+'T12:00:00Z'))&&new Date(x+'T12:00:00Z').toISOString().slice(0,10)===x;
  const id=x=>typeof x==='string'&&/^[a-zA-Z0-9:_-]{1,200}$/.test(x);
  const string=(x,max,required=false)=>typeof x==='string'&&x.length<=max&&(!required||!!x.trim());
  if(out.projects.length>1000||!Array.isArray(out.chores)||out.chores.length>2000||!object(out.checks)||!object(out.planned)||!Array.isArray(out.log)||out.log.length>10000)throw Error('This backup has invalid record lists.');
  for(const [kind,rows] of [['project',out.projects],['chore',out.chores]]){
    const seen=new Set();for(const r of rows){if(!object(r)||!id(r.id)||seen.has(r.id))throw Error('The backup contains invalid or duplicate '+kind+' IDs.');seen.add(r.id);
      if(!string(kind==='project'?r.task:r.chore,300,true)||!string(r.notes??'',20000))throw Error('A '+kind+' title or note is invalid.');
      if(kind==='project'){
        if(!string(r.area??'',120)||!string(r.sub??'',500)||!['Not started','In progress','Waiting','Done'].includes(r.status)||r.pri&&!['High','Med','Low'].includes(r.pri))throw Error('A project has invalid details.');
        if(r.due&&!date(r.due)||r.doneAt&&!date(r.doneAt)||r.park&&(!/^\d{4}-\d{2}$/.test(r.park)||!date(r.park+'-01')))throw Error('A project date is invalid.');
      }else if(!['Daily','Weekly','Monthly','Quarterly','Annual'].includes(r.cad)||!string(r.zone??'',300)||!string(r.who??'',300))throw Error('A chore has invalid details.');
    }
  }
  // Workflow fields are optional: existing records open without rewriting or seeding.
  const flag=(r,k)=>r[k]===undefined||typeof r[k]==='boolean';
  const optionalDates=(r,fields)=>fields.every(k=>r[k]==null||r[k]===''||date(r[k]));
  const link=x=>{try{return typeof x==='string'&&x.length<=3000&&['http:','https:'].includes(new URL(x).protocol);}catch{return false;}};
  const checklist=x=>x===undefined||Array.isArray(x)&&x.length<=100&&new Set(x.map(c=>c.id)).size===x.length&&x.every(c=>object(c)&&id(c.id)&&string(c.text,500,true)&&typeof c.done==='boolean');
  for(const p of out.projects){
    if(!optionalDates(p,['plan','planWeek','showAfter','followUp','createdAt','updatedAt'])||!['inbox','someday','archived'].every(k=>flag(p,k))||!string(p.waitingFor??'',300)||p.parentId&&!id(p.parentId)||!checklist(p.checklist))throw Error('A task has invalid planning or checklist details.');
    if(p.tags!==undefined&&(!Array.isArray(p.tags)||p.tags.length>10||p.tags.some(t=>!string(t,40,true))))throw Error('Use up to ten short context tags.');
    if(p.links!==undefined&&(!Array.isArray(p.links)||p.links.length>10||p.links.some(x=>!link(x))))throw Error('Task links must start with https:// or http://.');
  }
  if(out.groups!==undefined){
    if(!Array.isArray(out.groups)||out.groups.length>500)throw Error('Choose up to 500 projects.');
    const ids=new Set();for(const g of out.groups){if(!object(g)||!id(g.id)||ids.has(g.id)||!string(g.title,300,true)||!string(g.area??'',120)||!string(g.notes??'',20000)||!flag(g,'archived'))throw Error('A project group is invalid.');ids.add(g.id);}
  }
  const groupIds=new Set((out.groups||[]).map(g=>g.id));
  if(out.projects.some(p=>p.parentId&&!groupIds.has(p.parentId)))throw Error('A task refers to a missing project.');
  for(const c of out.chores){
    if(!flag(c,'archived')||!optionalDates(c,['nextDue']))throw Error('A chore schedule is invalid.');
    if(c.repeat!==undefined&&c.repeat!==null){const r=c.repeat;if(!object(r)||!['fixed','after'].includes(r.mode)||!['day','week','month','year'].includes(r.unit)||!Number.isInteger(r.every)||r.every<1||r.every>365||!date(r.anchor))throw Error('Choose a valid repeat schedule and start date.');}
  }
  if(out.choreHistory!==undefined){
    if(!Array.isArray(out.choreHistory)||out.choreHistory.length>10000)throw Error('Chore history exceeds 10,000 entries. Export an archive first.');
    const ids=new Set();for(const h of out.choreHistory){if(!object(h)||!id(h.id)||ids.has(h.id)||!id(h.choreId)||!date(h.date)||!string(h.occurrence,120,true)||!['done','skipped'].includes(h.status))throw Error('A chore history entry is invalid.');ids.add(h.id);}
  }
  if(out.templates!==undefined){
    if(!Array.isArray(out.templates)||out.templates.length>50)throw Error('Keep up to 50 project templates.');
    const ids=new Set();for(const t of out.templates){if(!object(t)||!id(t.id)||ids.has(t.id)||!string(t.title,300,true)||!string(t.area??'',120)||!string(t.notes??'',20000)||!Array.isArray(t.tasks)||t.tasks.length>100)throw Error('A project template is invalid.');ids.add(t.id);for(const p of t.tasks){if(!object(p)||!string(p.task,300,true)||!string(p.notes??'',20000)||p.pri&&!['High','Med','Low'].includes(p.pri)||p.tags&&(!Array.isArray(p.tags)||p.tags.length>10||p.tags.some(x=>!string(x,40,true)))||p.links&&(!Array.isArray(p.links)||p.links.length>10||p.links.some(x=>!link(x)))||p.checklist&&(!Array.isArray(p.checklist)||p.checklist.length>100||p.checklist.some(x=>!object(x)||!string(x.text,500,true))))throw Error('A template task is invalid.');}}
  }
  if(out.preferences!==undefined){const p=out.preferences;if(!object(p)||p.hideEmpty!==undefined&&typeof p.hideEmpty!=='boolean'||p.areaOrder!==undefined&&(!Array.isArray(p.areaOrder)||p.areaOrder.length>100||p.areaOrder.some(x=>!string(x,120,true))))throw Error('Area display settings are invalid.');}
  if(Object.entries(out.checks).some(([k,v])=>!id(k)||!string(v,100))||Object.entries(out.planned).some(([k,v])=>!id(k)||!date(v))||out.log.some(x=>!object(x)||!id(x.id)||x.t!=='proj'||!date(x.d)))throw Error('The backup contains invalid activity records.');
  return out;
}

/* Pure Life Map workflow rules. No storage, network, seeding, or migrations. */
function createLifeMapWorkflow(){
  const DAY=86400000,clone=x=>JSON.parse(JSON.stringify(x));
  const validDate=s=>typeof s==='string'&&/^\d{4}-\d\d-\d\d$/.test(s)&&Number.isFinite(Date.parse(s+'T12:00:00Z'))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;
  const stamp=s=>Date.parse(s+'T12:00:00Z'),iso=t=>new Date(t).toISOString().slice(0,10);
  const plus=(s,n)=>iso(stamp(s)+n*DAY);
  const week=s=>plus(s,-((new Date(stamp(s)).getUTCDay()+6)%7));
  const days=(a,b)=>Math.round((stamp(b)-stamp(a))/DAY);
  function addPeriod(date,unit,n=1){
    if(!validDate(date)||!Number.isInteger(n)||n<1)throw Error('Choose a valid repeat interval.');
    if(unit==='day'||unit==='week')return plus(date,n*(unit==='week'?7:1));
    const d=new Date(stamp(date)),day=d.getUTCDate();d.setUTCDate(1);
    if(unit==='month')d.setUTCMonth(d.getUTCMonth()+n);else if(unit==='year')d.setUTCFullYear(d.getUTCFullYear()+n);else throw Error('Choose days, weeks, months, or years.');
    const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));return iso(d.getTime());
  }
  function resolveDate(text,today){
    const t=text.trim().toLowerCase();if(t==='today')return today;if(t==='tomorrow')return plus(today,1);if(validDate(t))return t;
    const weekdays=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const target=weekdays.indexOf(t.replace(/^next /,''));
    if(target>=0){const delta=(target-new Date(stamp(today)).getUTCDay()+7)%7;return plus(today,delta||7);}
    const months=['january','february','march','april','may','june','july','august','september','october','november','december'];
    const m=t.match(/^([a-z]+)\s+(\d{1,2})(?:,?\s+(\d{4}))?$/);

  saveEditor=function(){
    const e=view.editor;if(!e||!['proj','chore','group'].includes(e.kind))return false;

    const current=(S[collection]||[]).find(p=>p.id===e.id);

    try{
      if(e.kind==='proj'){
        for(const k of ['task','area','sub','pri','due','park','notes','plan','planWeek','showAfter','parentId','waitingFor','followUp'])row[k]=String(e[k]??row[k]??'');
        row.task=row.task.trim();row.pri=row.pri||'Med';for(const k of ['inbox','someday','archived'])if(e[k]!==undefined)row[k]=!!e[k];
        row.status=e.status||row.status||'Not started';row.tags=e.tagsText!==undefined?e.tagsText.split(',').map(x=>x.trim()).filter(Boolean):e.tags||row.tags||[];
        row.links=e.linksText!==undefined?e.linksText.split(/\r?\n/).map(x=>x.trim()).filter(Boolean):e.links||row.links||[];
        row.checklist=(e.checklist||row.checklist||[]).filter(c=>c.text?.trim()).map(c=>({id:c.id||uid(),text:c.text.trim(),done:!!c.done}));
        if(row.parentId){const g=group(row.parentId);if(!g)throw Error('Choose an existing project.');row.area=g.area||row.area;row.inbox=false;}
        if(!row.task)throw Error('Describe the task first.');if(row.showAfter)row.park='';
      }else if(e.kind==='chore'){
        for(const k of ['chore','cad','zone','who','notes'])row[k]=String(e[k]??row[k]??'');row.chore=row.chore.trim();row.cad=row.cad||'Weekly';if(!row.chore)throw Error('Name the chore first.');
        const mode=e.repeatMode??e.repeat?.mode??'cycle';
        if(mode==='cycle'){delete row.repeat;delete row.nextDue;}
        else {row.repeat={mode,unit:e.repeatUnit??e.repeat?.unit??'week',every:Number(e.repeatEvery??e.repeat?.every??1),anchor:e.repeatAnchor??e.repeat?.anchor??date};
          if(JSON.stringify(row.repeat)!==JSON.stringify(current?.repeat))row.nextDue=row.repeat.anchor;

    },e.kind==='group'?'Project saved':e.kind==='chore'?'Chore saved':'Task saved',e.kind==='group'?'project_updated':e.kind==='chore'?'chore_updated':!current?'task_captured':'task_updated',clearEdit);

  function handle(action,el){
    const id=el.dataset.id;
    if(action==='close'){closeEditor();return;}
    if(action==='quick-add'){const text=document.getElementById('qaTxt')?.value||view.qa.txt;if(text.includes('\n')){view.qa.txt=text;captureSheet();}else quickAdd();return;}
    if(action==='save-capture')return quickAdd();if(action==='add-another')return quickAdd(true);
    if(action==='capture')return captureSheet();if(action==='capture-today')return captureSheet('today');
    if(action==='capture-when'){view.qa.when=el.dataset.when;storeDraft();render();return;}
    if(action==='keep-wording'){view.qa.parse=false;storeDraft();render();return;}
    if(action==='accept-area'){view.qa.area=el.dataset.area;storeDraft();render();return;}
    if(action==='complete')return advance(id);
    if(action==='edit-task'){const p=project(id);if(p)openEditor('proj',p);return;}
    if(action==='edit-chore'){const c=chore(id);if(c)openEditor('chore',c);return;}
    if(action==='edit-group'){const g=group(id);if(g)openEditor('group',g);return;}
    if(action==='new-task')return newTask(el.dataset.group||groupFilter);
    if(action==='new-group')return openEditor('group',{title:'',area:view.fArea||''});
    if(action==='new-chore')return openEditor('chore',{chore:'',cad:'Weekly'});
    if(action==='task-menu')return openEditor('menu',{id});
    if(action==='chore-menu')return openEditor('chore-menu',{id});
    if(action==='save-editor')return saveEditor();if(action==='delete-editor')return delEditor();
    if(action==='plan')return planTask(id,el.dataset.when);

/* Input, focus and safe-area behavior shared by the public and private Life Map. */
(()=>{
  if(window.LifeMapInteractions)return;window.LifeMapInteractions=true;
  const originalRender=render;let editorOpen=false,opener=null,lastTrigger=null;
  const keys=['act','lm','id','key','k','field','area','w','index','group'];
  function identity(el){if(!el?.closest?.('#app'))return null;return {id:el.id||'',tag:el.tagName,data:Object.fromEntries(keys.filter(k=>el.dataset?.[k]!==undefined).map(k=>[k,el.dataset[k]])),start:el.selectionStart,end:el.selectionEnd};}
  function find(saved){if(!saved)return null;if(saved.id){const el=document.getElementById(saved.id);if(el&&app.contains(el))return el;}if(!Object.keys(saved.data).length)return null;return [...app.querySelectorAll('[data-act],[data-lm]')].find(el=>el.tagName===saved.tag&&keys.every(k=>el.dataset[k]===saved.data[k]))||null;}
  function focus(el,saved){el?.focus?.({preventScroll:true});if(el&&saved&&typeof saved.start==='number')try{el.setSelectionRange(saved.start,saved.end);}catch{}}
  function decorate(){
    for(const el of app.querySelectorAll('[data-act="advance"],[data-act="tick"],[data-act="plan"],[data-act="edit"],[data-act="editc"]')){
      const a=el.dataset.act,id=el.dataset.id,item=(['tick','plan','editc'].includes(a)?S.chores:S.projects).find(x=>x.id===id);if(!item)continue;const title=item.task||item.chore;let label='Edit '+title;
      if(a==='advance')label=(item.status==='Done'?'Reopen ':'Complete ')+title;
      if(a==='tick'){label=(isChecked(item)?'Mark incomplete: ':'Complete ')+title;el.setAttribute('aria-pressed',String(isChecked(item)));}
      if(a==='plan'){label=(plannedToday(item)?'Remove from Today: ':'Add to Today: ')+title;el.setAttribute('aria-pressed',String(plannedToday(item)));}
      el.setAttribute('aria-label',label);if(el.tagName!=='BUTTON'&&!el.querySelector('button,input,select,textarea,a[href]')){el.setAttribute('role','button');el.tabIndex=0;el.dataset.lmKeyboard='true';}
    }
    for(const el of app.querySelectorAll('[data-act="f"],[data-lm="field"]')){const key=el.dataset.k||el.dataset.field;el.id='lm-field-'+key;if(!el.closest('label'))el.setAttribute('aria-label',key);}
    for(const [a,label]of [['q','Search tasks'],['fArea','Filter by area'],['fStatus','Task view'],['fPri','Priority']])app.querySelector('[data-act="'+a+'"]')?.setAttribute('aria-label',label);
    const t=document.getElementById('toast');if(t){t.setAttribute('role','status');t.setAttribute('aria-live','polite');}
  }
  // Document capture runs before the board's action dispatcher stops propagation.
  document.addEventListener('pointerdown',e=>{lastTrigger=identity(e.target.closest?.('[data-act],[data-lm]'));},true);
  app.addEventListener('click',e=>{lastTrigger=identity(e.target.closest?.('[data-act],[data-lm]'));},true);
  render=function(){
    const active=identity(document.activeElement),opening=!!view.editor&&!editorOpen;
    if(opening)opener=active||lastTrigger;
    const oldDialog=app.querySelector('.overlay[role="dialog"]'),scroll=oldDialog?.querySelector('.lm-sheet-body')?.scrollTop||0;
    const help=[...app.querySelectorAll('details[open]')].map(el=>el.className+'|'+(el.querySelector('summary')?.getAttribute('aria-label')||el.querySelector('summary')?.textContent||''));
    originalRender();decorate();
    for(const el of app.querySelectorAll('details')){const key=el.className+'|'+(el.querySelector('summary')?.getAttribute('aria-label')||el.querySelector('summary')?.textContent||'');if(help.includes(key))el.open=true;}
    const dialog=app.querySelector('.overlay[role="dialog"]');
    if(dialog){dialog.tabIndex=-1;
      if(dialog.tagName!=='DIALOG')for(const child of app.children)if(child!==dialog)child.inert=true;
      if(opening)focus(dialog.querySelector('#lm-capture-text,#lm-search,[data-field="task"],[data-field="title"],[data-field="chore"]')||dialog);
      else {const field=find(active);if(field)focus(field,active);const body=dialog.querySelector('.lm-sheet-body');if(body)body.scrollTop=scroll;}
    }else if(editorOpen){focus(find(opener));opener=null;}else focus(find(active),active);
    editorOpen=!!view.editor;
  };
  document.addEventListener('keydown',e=>{
    if(e.target?.dataset?.lmKeyboard==='true'&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click();return;}
    const dialog=app.querySelector('.overlay[role="dialog"]');if(!dialog||document.getElementById('uiDlg'))return;

    if(e.key!=='Tab')return;
    const controls=[...dialog.querySelectorAll('button:not(:disabled),input:not([type="hidden"]):not(:disabled),select:not(:disabled),textarea:not(:disabled),summary,a[href],[tabindex="0"]')].filter(el=>el.getClientRects().length&&!el.closest('[inert]'));
    if(!controls.length){e.preventDefault();focus(dialog);return;}
    const first=controls[0],last=controls.at(-1),active=document.activeElement;
    if(e.shiftKey&&(active===first||!controls.includes(active))){e.preventDefault();focus(last);}else if(!e.shiftKey&&(active===last||!controls.includes(active))){e.preventDefault();focus(first);}
  },true);
  function viewport(){if(!document.documentElement?.style)return;const v=window.visualViewport;document.documentElement.style.setProperty('--lm-viewport-height',(v?.height||window.innerHeight||800)+'px');document.documentElement.style.setProperty('--lm-viewport-top',(v?.offsetTop||0)+'px');}
  window.visualViewport?.addEventListener('resize',viewport);window.visualViewport?.addEventListener('scroll',viewport);window.addEventListener('resize',viewport);viewport();
})();

// Browser-local records. The original store and a first-change backup stay private.
function createLifeMapLocalStore(storage,validate){
  const key='lifemap_v1',backup='lifemap:before-github:v1';
  let expected,raw=null,blocked=false,error='',saved=false;
  function load(){
    try{raw=storage.getItem(key);expected=raw;const value=raw===null?{projects:[],chores:[],checks:{},log:[],planned:{}}:JSON.parse(raw);const checked=validate(value);blocked=false;error='';saved=raw!==null;return {...value,...checked};}
    catch{blocked=true;error='Saved records could not be read. Download the recovery copy before restoring a backup.';return {projects:[],chores:[],checks:{},log:[],planned:{}};}
  }
  function save(value,restore=false){
    if(blocked&&!restore)return false;
    try{
      validate(value);const text=JSON.stringify(value),current=storage.getItem(key);
      if(expected===undefined||current!==expected){error='This board changed in another tab. Download your current work before reopening the page.';return false;}
      if(current!==null&&storage.getItem(backup)===null){storage.setItem(backup,current);if(storage.getItem(backup)!==current)throw Error();}
      storage.setItem(key,text);if(storage.getItem(key)!==text)throw Error();
      expected=text;raw=text;blocked=false;error='';saved=true;return true;
    }catch{error='Changes could not be saved in this browser. Retry or download a backup before closing.';return false;}
  }
  return {load,save,get blocked(){return blocked;},get error(){return error;},get raw(){return raw;},get saved(){return saved;}};
}

/* Compose the same dashboard over the existing GitHub browser store. */
(()=>{
  const local=createLifeMapLocalStore({getItem:k=>localStorage.getItem(k),setItem:(k,v)=>localStorage.setItem(k,v)},validateLifeMapRecords);
  const shell=document.createElement('section');shell.className='lm-local-status';
  const status=document.createElement('p');status.setAttribute('role','status');
  const retry=document.createElement('button');retry.textContent='Retry saving';retry.onclick=()=>{save();render();};
  const backup=document.createElement('button');backup.textContent='Download backup';backup.onclick=()=>exportData();

  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.hidden=true;input.onchange=()=>{if(input.files[0])importData(input.files[0]);};restore.onclick=()=>input.click();

  const help=document.createElement('p');help.textContent='This browser is a separate local copy. Use Export backup at the bottom of the private Life Map, then Import backup here. Restoring replaces this browser’s board after confirmation. The private copy stays available.';
  const link=document.createElement('a');link.href='https://atlas-os-quinton.qchambers123018.chatgpt.site/apps/life-map';link.textContent='Open private Life Map';link.target='_blank';link.rel='noopener';
  const helpBody=document.createElement('div');helpBody.className='atlas-info-body';helpBody.append(help,link);earlier.append(summary,helpBody);shell.append(status,earlier,retry,backup,restore,input);app.after(shell);
  function feedback(){status.textContent=local.error||(view.editor||view.qa.txt.trim()?'Draft on this device. Use Save or Add to log it.':local.saved?'Saved in this browser':'No saved projects yet');retry.hidden=!local.error||local.blocked;backup.hidden=restore.hidden=!local.error;shell.className='lm-local-status'+(local.error?' lm-save-error':'');}
  const draw=render;render=function(){draw();feedback();app.inert=local.blocked;};
  document.addEventListener('input',feedback);

  const originalExport=exportData;
  exportData=function(){if(!local.blocked)return originalExport();const url=URL.createObjectURL(new Blob([local.raw??'No readable browser copy was available.'],{type:'text/plain'})),a=document.createElement('a');a.href=url;a.download='life-map-recovery.txt';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);};

  window.LifeMapLocal=local;
  S=local.load();render();
})();
