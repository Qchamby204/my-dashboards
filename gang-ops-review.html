<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Gang Ops Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Fraunces:opsz,wght@9..144,400..800&display=swap">
<style>
/* ============================================================
   THE GANG OPERATIONS HUB
   Palette and type pulled from thegangfitness.com
   ============================================================ */
:root{
  /* brand */
  --cream:#FFFAF3;
  --ink:#0F0B09;
  --wine:#840728;
  --red:#E40224;
  --pink:#FF54BF;
  --sky:#D9E7FF;

  /* warm neutrals biased toward the wine */
  --paper:#FFFFFF;
  --sand:#F6EEE3;
  --shell:#F0E4D5;
  --line:#E6D8C7;
  --line-soft:#F0E6DA;
  --stone:#8B7A6D;
  --stone-dk:#5E4F45;

  /* semantic */
  --ok:#2E6B4F;
  --warn:#C25E00;
  --crit:var(--red);

  --r-sm:8px;
  --r-md:14px;
  --r-lg:20px;
  --r-pill:999px;

  --shadow:0 1px 2px rgba(15,11,9,.04), 0 8px 24px -16px rgba(15,11,9,.22);
  --shadow-lift:0 2px 6px rgba(15,11,9,.06), 0 20px 44px -24px rgba(15,11,9,.32);

  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --ui:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;

  --rail:230px;
  color-scheme: light;
}

*,*::before,*::after{box-sizing:border-box;}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--ui);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
a{color:var(--red);}

:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px;}

h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance;letter-spacing:-.01em;}

summary{list-style:none;cursor:pointer;}
summary::-webkit-details-marker{display:none;}
summary::marker{content:"";}

.eyebrow{
  font-family:var(--ui);
  font-stretch:118%;
  font-size:.66rem;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--stone);
}

.num{font-variant-numeric:tabular-nums;}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:flex;min-height:100vh;}

.rail{
  width:var(--rail);
  flex:0 0 var(--rail);
  border-right:1px solid var(--line);
  background:var(--cream);
  padding:26px 18px 20px;
  display:flex;
  flex-direction:column;
  gap:26px;
  position:sticky;
  top:0;
  height:100vh;
}

.brand{display:flex;align-items:center;gap:11px;padding:0 6px;}
.brand-mark{
  width:38px;height:38px;flex:0 0 38px;
  border-radius:var(--r-pill);
  background:var(--wine);
  color:var(--cream);
  display:grid;place-items:center;
  font-family:var(--ui);
  font-stretch:120%;
  font-weight:700;
  font-size:.74rem;
  letter-spacing:.06em;
}
.brand-name{
  font-family:var(--display);
  font-size:1.02rem;
  font-weight:600;
  line-height:1.12;
  letter-spacing:-.015em;
}
.brand-name small{display:block;font-family:var(--ui);font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);margin-top:3px;font-stretch:115%;}

.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;
  border-radius:var(--r-pill);
  text-align:left;
  font-size:.9rem;
  font-weight:500;
  color:var(--stone-dk);
  transition:background .13s ease,color .13s ease;
}
.nav-item:hover{background:var(--sand);color:var(--ink);}
.nav-item[aria-current="page"]{background:var(--wine);color:var(--cream);font-weight:600;}
.nav-item[aria-current="page"] .nav-count{background:rgba(255,250,243,.22);color:var(--cream);}
.nav-count{
  font-size:.68rem;font-weight:700;
  background:var(--shell);color:var(--stone-dk);
  border-radius:var(--r-pill);
  padding:1px 7px;
  font-variant-numeric:tabular-nums;
}
.nav-count--alert{background:var(--red);color:#fff;}

.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;}
.who{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:10px 12px;
  background:var(--paper);
}
.who label{display:block;margin-bottom:5px;}
.who select{
  width:100%;
  border:none;background:none;
  font-family:var(--display);
  font-size:1rem;font-weight:600;
  padding:0;
}
.rail-link{
  font-size:.8rem;color:var(--stone);
  padding:6px 12px;border-radius:var(--r-pill);text-align:left;
}
.rail-link:hover{color:var(--ink);background:var(--sand);}
.rail-link[aria-current="page"]{color:var(--ink);background:var(--sand);font-weight:600;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 34px 90px;}

/* ============================================================
   PAGE HEADER
   ============================================================ */
.pagehead{
  border-bottom:1px solid var(--line);
  background:var(--cream);
  padding:26px 0 20px;
  margin-bottom:26px;
}
.pagehead .wrap{padding-bottom:0;}
.pagehead-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.pagehead h1{font-size:2.1rem;line-height:1.1;}
.pagehead .sub{color:var(--stone-dk);font-size:.92rem;margin-top:6px;}

.status-line{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  font-family:var(--display);
  font-size:2.6rem;
  font-weight:600;
  line-height:1.04;
  letter-spacing:-.025em;
}
.status-line .of{
  font-family:var(--ui);
  font-stretch:118%;
  font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--red);
  border:1px solid currentColor;
  border-radius:var(--r-pill);
  padding:5px 12px;
  align-self:center;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border-radius:var(--r-pill);
  padding:9px 17px;
  font-size:.82rem;font-weight:600;
  font-stretch:106%;
  border:1px solid transparent;
  transition:background .13s ease,color .13s ease,border-color .13s ease,transform .08s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn--primary{background:var(--wine);color:var(--cream);}
.btn--primary:hover{background:#6C0620;}
.btn--red{background:var(--red);color:#fff;}
.btn--red:hover{background:#C10120;}
.btn--ghost{border-color:var(--line);color:var(--stone-dk);background:var(--paper);}
.btn--ghost:hover{border-color:var(--ink);color:var(--ink);}
.btn--quiet{color:var(--stone-dk);padding:7px 12px;}
.btn--quiet:hover{background:var(--sand);color:var(--ink);}
.btn--danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 34%,transparent);background:var(--paper);}
.btn--danger:hover{background:color-mix(in srgb,var(--red) 9%,var(--paper));}
.btn--sm{padding:6px 13px;font-size:.75rem;}
.btn[disabled]{opacity:.42;pointer-events:none;}

/* ============================================================
   CYCLE RIBBON  (Between Programs -> Week 1..14)
   ============================================================ */
.ribbon{
  display:flex;align-items:stretch;gap:4px;
  margin-top:20px;
  overflow-x:auto;
  padding-bottom:6px;
  scrollbar-width:thin;
}
.seg{
  flex:1 1 0;
  min-width:30px;
  height:38px;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--stone);
  font-size:.72rem;font-weight:600;
  font-variant-numeric:tabular-nums;
  display:grid;place-items:center;
  position:relative;
  transition:border-color .13s ease,background .13s ease,color .13s ease;
}
.seg--bp{flex:0 0 118px;min-width:118px;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;font-stretch:112%;}
.seg:hover{border-color:var(--ink);color:var(--ink);}
.seg--past{background:var(--shell);border-color:var(--shell);color:var(--stone-dk);}
.seg--now{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 16px -8px var(--red);}
.seg--sel{border-color:var(--ink);color:var(--ink);border-width:2px;}
.seg--now.seg--sel{border-color:var(--ink);}
.seg .dot{
  position:absolute;top:5px;right:5px;
  width:5px;height:5px;border-radius:50%;
  background:var(--red);
}
.seg--now .dot{background:#fff;}
.ribbon-legend{display:flex;gap:16px;margin-top:8px;}
.ribbon-legend span{font-size:.68rem;color:var(--stone);display:flex;align-items:center;gap:6px;}
.ribbon-legend i{width:9px;height:9px;border-radius:3px;display:block;}

/* ============================================================
   STAT TILES
   ============================================================ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px;}
.stat{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--paper);
  padding:15px 16px 14px;
  position:relative;
  overflow:hidden;
}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stone);opacity:.28;}
.stat--done::before{background:var(--ok);opacity:1;}
.stat--left::before{background:var(--wine);opacity:1;}
.stat--over::before{background:var(--red);opacity:1;}
.stat-n{font-family:var(--display);font-size:2.1rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.stat--over .stat-n{color:var(--red);}
.stat-l{margin-top:7px;}

/* ============================================================
   SECTIONS + CARDS
   ============================================================ */
.section{margin-bottom:34px;}
.section-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-bottom:9px;margin-bottom:12px;
  border-bottom:1px solid var(--line);
}
.section-head h2{font-size:1.22rem;}
.section-head .count{color:var(--stone);font-size:.8rem;font-variant-numeric:tabular-nums;}
.section--alert .section-head{border-bottom-color:color-mix(in srgb,var(--red) 40%,transparent);}
.section--alert .section-head h2{color:var(--red);}

.card{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--paper);
  overflow:hidden;
}

.empty{
  border:1px dashed var(--line);
  border-radius:var(--r-md);
  padding:26px 22px;
  text-align:center;
  color:var(--stone);
  font-size:.88rem;
  background:color-mix(in srgb,var(--sand) 50%,transparent);
}
.empty strong{display:block;font-family:var(--display);font-size:1.05rem;color:var(--stone-dk);margin-bottom:4px;font-weight:600;}

/* ============================================================
   TASK ROW
   ============================================================ */
.tasklist{display:flex;flex-direction:column;}
.task{
  display:flex;align-items:flex-start;gap:13px;
  padding:13px 15px;
  border-bottom:1px solid var(--line-soft);
  background:var(--paper);
  transition:background .12s ease;
}
.tasklist .task:last-child{border-bottom:none;}
.task:hover{background:var(--sand);}
.task--done{background:color-mix(in srgb,var(--sand) 55%,var(--paper));}
.task--done:hover{background:var(--sand);}
.task--over{box-shadow:inset 3px 0 0 var(--red);}

.check{
  flex:0 0 21px;width:21px;height:21px;margin-top:1px;
  border:1.5px solid var(--stone);
  border-radius:6px;
  display:grid;place-items:center;
  transition:background .12s ease,border-color .12s ease;
}
.check:hover{border-color:var(--wine);background:color-mix(in srgb,var(--wine) 8%,transparent);}
.check svg{width:13px;height:13px;opacity:0;transition:opacity .12s ease;}
.task--done .check{background:var(--wine);border-color:var(--wine);}
.task--done .check svg{opacity:1;stroke:var(--cream);}

.task-main{flex:1;min-width:0;}
.task-title{
  font-size:.94rem;font-weight:500;line-height:1.35;
  cursor:pointer;
  word-break:break-word;
}
.task--done .task-title{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--stone) 70%,transparent);color:var(--stone);}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;}
.task-note{margin-top:6px;font-size:.8rem;color:var(--stone);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.task-open{
  flex:0 0 auto;align-self:center;
  color:var(--stone);font-size:1rem;
  padding:4px 6px;border-radius:var(--r-sm);
}
.task-open:hover{background:var(--shell);color:var(--ink);}

/* chips */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.68rem;font-weight:600;
  padding:3px 9px;
  border-radius:var(--r-pill);
  white-space:nowrap;
  font-stretch:104%;
}
.chip--cat{background:color-mix(in srgb,var(--c) 11%,transparent);color:var(--c);}
.chip--cat i{width:6px;height:6px;border-radius:50%;background:var(--c);}
.chip--owner{background:var(--shell);color:var(--stone-dk);}
.chip--owner[data-owner="Unassigned"]{background:transparent;border:1px dashed var(--line);color:var(--stone);}
.chip--owner[data-owner="Shared"]{background:var(--sky);color:#1E3D6B;}
.chip--due{background:transparent;color:var(--stone);border:1px solid var(--line);font-variant-numeric:tabular-nums;}
.chip--due.is-over{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 7%,transparent);}
.chip--st{border:1px solid transparent;}
.chip--st[data-st="not_started"]{background:transparent;border-color:var(--line);color:var(--stone);}
.chip--st[data-st="in_progress"]{background:color-mix(in srgb,var(--pink) 15%,transparent);color:#B0117A;}
.chip--st[data-st="waiting"]{background:var(--sky);color:#1E3D6B;}
.chip--st[data-st="complete"]{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok);}
.chip--recur{background:color-mix(in srgb,var(--wine) 9%,transparent);color:var(--wine);}
.chip--hand{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn);}

/* ============================================================
   FILTER BAR
   ============================================================ */
.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
.filter{
  padding:6px 14px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:var(--paper);
  font-size:.78rem;font-weight:600;color:var(--stone-dk);
  transition:all .12s ease;
}
.filter:hover{border-color:var(--ink);color:var(--ink);}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream);}
.filter-label{margin-right:3px;}

/* ============================================================
   WEEK GROUPS (Program view)
   ============================================================ */
.stage{border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);margin-bottom:11px;overflow:hidden;}
.stage--now{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 10%,transparent);}
.stage--bp{background:color-mix(in srgb,var(--sand) 60%,var(--paper));}
.stage-head{
  display:flex;align-items:center;gap:14px;
  width:100%;padding:14px 16px;text-align:left;
}
.stage-head:hover{background:var(--sand);}
.stage-num{
  flex:0 0 auto;min-width:74px;
  font-family:var(--ui);font-stretch:116%;
  font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--stone);
}
.stage--now .stage-num{color:var(--red);}
.stage-title{flex:1;font-family:var(--display);font-size:1.06rem;font-weight:600;}
.stage-bar{flex:0 0 92px;height:5px;border-radius:var(--r-pill);background:var(--shell);overflow:hidden;}
.stage-bar i{display:block;height:100%;background:var(--wine);border-radius:var(--r-pill);}
.stage-meta{flex:0 0 auto;font-size:.76rem;color:var(--stone);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}
.stage-caret{color:var(--stone);transition:transform .16s ease;}
.stage[open] .stage-caret{transform:rotate(90deg);}
.stage-body{border-top:1px solid var(--line-soft);}
.stage-add{padding:10px 15px;border-top:1px solid var(--line-soft);}
.runup{padding:11px 15px 8px;background:var(--sand);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}
.stage-body > .runup:first-child{border-top:none;}

/* ============================================================
   PEOPLE / RESPONSIBILITIES
   ============================================================ */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:30px;}
.person{
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);
  padding:17px 17px 15px;
  display:flex;flex-direction:column;gap:12px;
}
.person-top{display:flex;align-items:center;gap:11px;}
.avatar{
  width:40px;height:40px;flex:0 0 40px;border-radius:var(--r-pill);
  display:grid;place-items:center;
  font-family:var(--ui);font-stretch:118%;
  font-weight:700;font-size:.82rem;
  background:var(--wine);color:var(--cream);
}
.avatar[data-owner="Shared"]{background:var(--sky);color:#1E3D6B;}
.avatar[data-owner="Unassigned"]{background:transparent;border:1.5px dashed var(--line);color:var(--stone);}
.person-name{font-family:var(--display);font-size:1.16rem;font-weight:600;}
.person-sub{font-size:.76rem;color:var(--stone);}
.load{height:7px;border-radius:var(--r-pill);background:var(--shell);overflow:hidden;display:flex;}
.load i{display:block;height:100%;}
.person-nums{display:flex;gap:16px;}
.person-nums div{flex:1;}
.person-nums b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.person-nums span{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);font-weight:600;}
.person-nums .over b{color:var(--red);}
.catbars{display:flex;flex-direction:column;gap:5px;}
.catbar{display:flex;align-items:center;gap:9px;font-size:.76rem;}
.catbar-n{margin-left:auto;color:var(--stone);font-variant-numeric:tabular-nums;}
.catbar-t{flex:1;height:6px;border-radius:var(--r-pill);background:var(--shell);overflow:hidden;}
.catbar-t i{display:block;height:100%;background:var(--c);border-radius:var(--r-pill);}

/* ============================================================
   MODAL / DRAWER
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(15,11,9,.32);
  backdrop-filter:blur(2px);
  z-index:60;
  display:flex;justify-content:flex-end;
  animation:fade .16s ease;
}
.scrim--center{align-items:center;justify-content:center;padding:22px;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes popin{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}

.drawer{
  width:min(520px,100%);
  background:var(--cream);
  height:100%;
  overflow-y:auto;
  border-left:1px solid var(--line);
  animation:slidein .18s ease;
  display:flex;flex-direction:column;
}
.modal{
  width:min(560px,100%);
  max-height:calc(100vh - 44px);
  overflow-y:auto;
  background:var(--cream);
  border-radius:var(--r-lg);
  border:1px solid var(--line);
  box-shadow:var(--shadow-lift);
  animation:popin .16s ease;
}
@media (prefers-reduced-motion:reduce){
  .scrim,.drawer,.modal{animation:none;}
  *{transition-duration:.01ms !important;}
}
.dhead{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:20px 22px 16px;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--cream);z-index:2;
}
.dhead h2{font-size:1.35rem;line-height:1.22;}
.dbody{padding:20px 22px;display:flex;flex-direction:column;gap:18px;flex:1;}
.dfoot{
  padding:15px 22px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  position:sticky;bottom:0;background:var(--cream);
}
.dfoot .spacer{flex:1;}
.x{width:32px;height:32px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--stone);flex:0 0 32px;}
.x:hover{background:var(--shell);color:var(--ink);}

/* ============================================================
   FORM
   ============================================================ */
.field{display:flex;flex-direction:column;gap:6px;}
.field > label{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);font-stretch:112%;}
.inp,.sel,.ta{
  width:100%;
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  background:var(--paper);
  padding:9px 11px;
  font-size:.9rem;
  transition:border-color .12s ease,box-shadow .12s ease;
}

<script>
/* ============================================================
   THE GANG OPERATIONS HUB — review copy
   Read the whole operating system, mark it up, send your notes.
   Everything is stored in your own browser. Nothing is shared
   until someone exports and hands the file over.
   ============================================================ */
(function(){
"use strict";

const SLUG = "gangreview";
const SCHEMA = 1;
const WEEKS = 14;
const ONGOING = 99;
const PEOPLE = ["Jo","Sam","Stacey","Quinton"];
const OWNERS = ["Jo","Sam","Stacey","Shared","Unassigned"];
const FLAGS = [
  {id:"keep",   label:"Keep as is"},
  {id:"change", label:"Needs changing"},
  {id:"drop",   label:"Drop it"},
  {id:"unsure", label:"Not sure"}
];

/* ------------------------------------------------------------
   utilities
   ------------------------------------------------------------ */
const $ = s=>document.querySelector(s);
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normTitle(s){ return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }
function uid(p){ return (p||"n")+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7); }
function initials(n){ const p=String(n).trim().split(/\s+/); return (p.length>1?p[0][0]+p[1][0]:String(n).slice(0,2)).toUpperCase(); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function plural(n,one,many){ return n+" "+(n===1?one:(many||one+"s")); }

function toast(m){
  const t=$("#toast"); if(!t) return;
  t.textContent=m; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2600);
}

/* localStorage, namespaced to this tool. Degrades to memory if blocked. */
const mem={};
const LS={
  get(k,d){
    try{ const v=localStorage.getItem(SLUG+":"+k); return v==null?(k in mem?mem[k]:d):JSON.parse(v); }
    catch(e){ return (k in mem)?mem[k]:d; }
  },
  set(k,v){
    mem[k]=v;
    try{ localStorage.setItem(SLUG+":"+k, JSON.stringify(v)); }catch(e){}
  },
  del(k){ delete mem[k]; try{ localStorage.removeItem(SLUG+":"+k); }catch(e){} }
};

function cat(id){
  return SEED_CATEGORIES.find(c=>c.id===id) || {id:id,name:"Uncategorised",color:"#8B7A6D"};
}
function stageName(w){ return w===ONGOING ? "Ongoing" : (w===0 ? "Between Programs" : "Week "+w); }
function stageOrder(w){ return w===ONGOING ? -1 : Number(w||0); }
function timingText(week, weeksBefore){
  if(week===ONGOING) return "Every day, all program";
  if(week===0) return weeksBefore==null ? "Between programs, no fixed timing" : weeksBefore+" week"+(weeksBefore===1?"":"s")+" before the program starts";
  return "Week "+week+" of "+WEEKS;
}

/* ------------------------------------------------------------
   state
   ------------------------------------------------------------ */
const ITEMS = SEED_TEMPLATE.map((r,i)=>({
  key:normTitle(r[0]), title:r[0], cat:r[1], week:r[2],
  weeksBefore:(r[3]==null?null:r[3]), notes:r[4]||"", order:i
}));

let mine = LS.get("mine", null);
if(!mine || mine.schema!==SCHEMA){
  mine = { schema:SCHEMA, reviewer:"", updated:null, items:{}, additions:[] };
}
let merged = LS.get("merged", {});          /* reviewer name -> their whole review */

const UI = {
  mode: "review",                            /* review | merge */
  q: "", cat:"all", stage:"all", flag:"all",
  open: {},                                  /* item key -> expanded */
  out: ""                                    /* text shown in the export box */
};

function saveMine(){
  mine.updated = new Date().toISOString();
  LS.set("mine", mine);
}
function entry(key){
  if(!mine.items[key]) mine.items[key]={};
  return mine.items[key];
}
function hasReview(e){
  return !!(e && (e.flag || (e.note&&e.note.trim()) || e.owner || e.timing));
}
function reviewedCount(){
  let n=0;
  Object.keys(mine.items).forEach(k=>{ if(hasReview(mine.items[k])) n++; });
  return n;
}

/* ------------------------------------------------------------
   filtering + grouping
   ------------------------------------------------------------ */
function visibleItems(){
  const q=UI.q.trim().toLowerCase();
  const all = ITEMS.concat(mine.additions.map(a=>Object.assign({}, a, {isNew:true, key:a.id})));
  return all.filter(it=>{
    if(UI.cat!=="all" && it.cat!==UI.cat) return false;
    if(UI.stage!=="all" && String(it.week)!==UI.stage) return false;
    const e=mine.items[it.key];
    if(UI.flag==="todo" && (hasReview(e)||it.isNew)) return false;
    if(UI.flag==="done" && !hasReview(e) && !it.isNew) return false;
    if(UI.flag!=="all" && UI.flag!=="todo" && UI.flag!=="done"){
      if(!e || e.flag!==UI.flag) return false;
    }
    if(q){
      const hay=(it.title+" "+(it.notes||"")+" "+cat(it.cat).name+" "+((e&&e.note)||"")).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}
function groupByStage(list){
  const groups={};
  list.forEach(it=>{
    const k = it.week===ONGOING ? "ongoing" : (it.week===0 ? "b"+(it.weeksBefore==null?"x":it.weeksBefore) : "w"+it.week);
    (groups[k]=groups[k]||{week:it.week, weeksBefore:it.weeksBefore, items:[]}).items.push(it);
  });
  return Object.keys(groups).map(k=>groups[k]).sort((a,b)=>{
    const ao=stageOrder(a.week), bo=stageOrder(b.week);
    if(ao!==bo) return ao-bo;
    const av=a.weeksBefore==null?-1:a.weeksBefore, bv=b.weeksBefore==null?-1:b.weeksBefore;
    return bv-av;                              /* furthest out first */
  });
}
function groupLabel(g){
  if(g.week===ONGOING) return "Ongoing";
  if(g.week===0) return g.weeksBefore==null ? "Between programs" : g.weeksBefore+" week"+(g.weeksBefore===1?"":"s")+" out";
  return "Week "+g.week;
}
function groupWhen(g){
  if(g.week===ONGOING) return "every day, the whole program";
  if(g.week===0) return g.weeksBefore==null ? "no fixed timing" : "before the program starts";
  return "of the 14 week program";
}

/* ------------------------------------------------------------
   rendering — review mode
   ------------------------------------------------------------ */
function chip(text, style){
  return '<span class="chip '+(style||"")+'">'+text+'</span>';
}
function catChip(id){
  const c=cat(id);
  return '<span class="chip chip--cat" style="--c:'+esc(c.color)+'"><i></i>'+esc(c.name)+'</span>';
}

function itemBlock(it){
  const e = mine.items[it.key] || {};
  const open = !!UI.open[it.key];
  return '<details class="item'+(it.isNew?" item--new":"")+'"'+(e.flag?' data-flag="'+esc(e.flag)+'"':"")+
      ' data-key="'+esc(it.key)+'"'+(open?" open":"")+'>'+
    '<summary class="item-head">'+
      '<span class="item-caret">&rsaquo;</span>'+
      '<span class="item-title">'+esc(it.title)+
        (it.isNew?' <span class="chip chip--recur">You added this</span>':"")+
        '<span class="item-chips">'+catChip(it.cat)+
          '<span class="chip chip--due">'+esc(timingText(it.week,it.weeksBefore))+'</span>'+
        '</span>'+
        (it.notes?'<span class="item-note">'+esc(it.notes)+'</span>':"")+
      '</span>'+
      (e.flag?'<span class="item-mine" data-f="'+esc(e.flag)+'">'+esc((FLAGS.find(f=>f.id===e.flag)||{}).label||"")+'</span>':
       (e.note||e.owner||e.timing?'<span class="item-mine" data-f="unsure">Noted</span>':""))+
    '</summary>'+
    '<div class="review">'+
      '<div class="flags" style="margin-bottom:13px">'+
        FLAGS.map(f=>'<button class="flag" data-act="flag" data-key="'+esc(it.key)+'" data-f="'+f.id+'" aria-pressed="'+(e.flag===f.id)+'">'+f.label+'</button>').join("")+
        (e.flag?'<button class="btn btn--quiet btn--sm" data-act="clearflag" data-key="'+esc(it.key)+'">Clear</button>':"")+
      '</div>'+
      '<div class="row">'+
        '<div class="field"><label>Who should own this</label>'+
          '<select class="sel" data-act="setowner" data-key="'+esc(it.key)+'">'+
            '<option value="">No suggestion</option>'+
            OWNERS.map(o=>'<option value="'+esc(o)+'"'+(e.owner===o?" selected":"")+'>'+esc(o)+'</option>').join("")+
          '</select></div>'+
        '<div class="field"><label>Different timing?</label>'+
          '<input class="inp" data-act="settiming" data-key="'+esc(it.key)+'" placeholder="e.g. week 5, not week 8" value="'+esc(e.timing||"")+'"></div>'+
      '</div>'+
      '<div class="field"><label>Your note</label>'+
        '<textarea class="ta" data-act="setnote" data-key="'+esc(it.key)+'" placeholder="What would you change, and why? Anything the others need to know?">'+esc(e.note||"")+'</textarea></div>'+
      (it.isNew?'<div style="margin-top:11px"><button class="btn btn--danger btn--sm" data-act="delnew" data-key="'+esc(it.key)+'">Remove this suggestion</button></div>':"")+
    '</div>'+
  '</details>';
}

function reviewBody(){
  if(!mine.reviewer){
    return '<div class="empty" style="margin-top:30px"><strong>Say who you are first</strong>'+
      'Pick your name above and the list opens up. Your notes are saved as you type, in this browser only.</div>';
  }
  const list=visibleItems();
  if(!list.length){
    return '<div class="empty" style="margin-top:22px"><strong>Nothing matches</strong>Clear the filters to see the rest.</div>';
  }
  const groups=groupByStage(list);
  return groups.map(g=>{
    const done=g.items.filter(it=>hasReview(mine.items[it.key])||it.isNew).length;
    return '<section class="stagegroup">'+
      '<div class="stagebar"><h2>'+esc(groupLabel(g))+'</h2>'+
        '<span class="when">'+esc(groupWhen(g))+'</span>'+
        '<span class="tally">'+done+' of '+g.items.length+' marked</span></div>'+
      g.items.map(itemBlock).join("")+
      '<div class="addbox"><button class="btn btn--ghost btn--sm" data-act="addnew" data-week="'+g.week+'" data-wb="'+(g.weeksBefore==null?"":g.weeksBefore)+'">+ Something is missing from '+esc(groupLabel(g).toLowerCase())+'</button></div>'+
    '</section>';
  }).join("");
}

/* ------------------------------------------------------------
   rendering — merge mode
   ------------------------------------------------------------ */
function mergedItemKeys(){
  const keys={};
  Object.keys(merged).forEach(who=>{
    const r=merged[who];
    Object.keys(r.items||{}).forEach(k=>{ if(hasReview(r.items[k])) keys[k]=true; });
  });
  return Object.keys(keys);
}
function verdictFor(key){
  const flags=[];
  Object.keys(merged).forEach(who=>{
    const e=(merged[who].items||{})[key];
    if(e && e.flag) flags.push(e.flag);
  });
  const uniq=flags.filter((f,i)=>flags.indexOf(f)===i);
  if(uniq.length>1) return {id:"split", label:"They disagree", rank:0};
  if(uniq[0]==="drop")   return {id:"drop",   label:"Drop it", rank:1};
  if(uniq[0]==="change") return {id:"change", label:"Needs changing", rank:2};
  if(uniq[0]==="unsure") return {id:"split",  label:"Nobody is sure", rank:3};
  const anyOwner=Object.keys(merged).some(w=>{ const e=(merged[w].items||{})[key]; return e&&e.owner; });
  if(uniq[0]==="keep") return anyOwner ? {id:"owner",label:"Keep, owner suggested",rank:5} : {id:"keep",label:"Everyone says keep",rank:6};
  return {id:"owner", label:"Comments only", rank:4};
}
function voicesFor(key){
  return Object.keys(merged).map(who=>{
    const e=(merged[who].items||{})[key];
    if(!hasReview(e)) return "";
    const bits=[];
    if(e.flag) bits.push('<em>'+esc((FLAGS.find(f=>f.id===e.flag)||{}).label||e.flag)+'</em>');
    if(e.note) bits.push(esc(e.note));
    const sug=[];
    if(e.owner) sug.push("owner &rarr; "+esc(e.owner));
    if(e.timing) sug.push("timing &rarr; "+esc(e.timing));
    return '<div class="voice"><span class="av">'+esc(initials(who))+'</span>'+
      '<span class="said">'+(bits.join(" &middot; ")||"<em>no comment</em>")+
      (sug.length?'<span class="suggest">'+sug.join(" &middot; ")+'</span>':"")+'</span></div>';
  }).join("");
}

function mergeBody(){
  const who=Object.keys(merged);
  const head = '<div class="mergehead">'+
    '<h2>Everyone&rsquo;s notes in one place</h2>'+
    '<p class="hint">Load each person&rsquo;s exported file. Items where they disagree come first, then anything marked to change or drop, then the rest. Work down it and make the edits in the real Hub as you go.</p>'+
    (who.length?'<div class="who-pills">'+who.map(w=>{
      const n=Object.keys(merged[w].items||{}).filter(k=>hasReview(merged[w].items[k])).length;
      const adds=(merged[w].additions||[]).length;
      return '<span class="who-pill"><b>'+esc(w)+'</b><span>'+n+' marked'+(adds?", "+adds+" added":"")+'</span>'+
        '<button data-act="dropwho" data-who="'+esc(w)+'" title="Remove">&times;</button></span>';
    }).join("")+'</div>':"")+
    '<div class="filedrop" id="drop" style="margin-top:16px">'+
      '<b>Drop their exported files here</b>'+
      'or <button class="btn btn--ghost btn--sm" data-act="pickfiles">choose files</button>'+
      '<input type="file" id="fileInput" accept="application/json,.json" multiple>'+
    '</div>'+
    (who.length?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">'+
      '<button class="btn btn--primary btn--sm" data-act="buildsummary">Build the decision list</button>'+
      '<button class="btn btn--ghost btn--sm" data-act="clearmerge">Clear everyone</button>'+
    '</div>':"")+
    (UI.out?'<div class="outbox">'+esc(UI.out)+'</div>'+
      '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+
      '<button class="btn btn--ghost btn--sm" data-act="copyout">Copy it</button>'+
      '<button class="btn btn--ghost btn--sm" data-act="downloadout">Download as .md</button></div>':"")+
  '</div>';

  if(!who.length) return head+'<div class="empty"><strong>No notes loaded yet</strong>Ask Jo, Sam and Stacey to hit Export in their own copy and send you the file.</div>';

  const keys=mergedItemKeys();
  const byKey={};
  ITEMS.forEach(it=>byKey[it.key]=it);
  Object.keys(merged).forEach(w=>{
    (merged[w].additions||[]).forEach(a=>{ if(!byKey[a.id]) byKey[a.id]=Object.assign({},a,{key:a.id,isNew:true,by:w}); });
  });

  const rows=keys.map(k=>({key:k, item:byKey[k], v:verdictFor(k)}))
                 .filter(r=>r.item)
                 .sort((a,b)=> a.v.rank-b.v.rank || stageOrder(a.item.week)-stageOrder(b.item.week));

  const adds=[];
  Object.keys(merged).forEach(w=>{
    (merged[w].additions||[]).forEach(a=>adds.push(Object.assign({},a,{by:w})));
  });

  let out=head;

  if(adds.length){
    out+='<section class="stagegroup"><div class="stagebar"><h2>Proposed additions</h2>'+
      '<span class="tally">'+adds.length+'</span></div>'+
      adds.map(a=>'<div class="item item--new"><div class="item-head">'+
        '<span class="item-title">'+esc(a.title)+
          '<span class="item-chips">'+catChip(a.cat)+
          '<span class="chip chip--due">'+esc(timingText(a.week,a.weeksBefore))+'</span>'+
          '<span class="verdict verdict--new">from '+esc(a.by)+'</span></span>'+
          (a.note?'<span class="item-note">'+esc(a.note)+'</span>':"")+
        '</span></div></div>').join("")+
    '</section>';
  }

  out+='<section class="stagegroup"><div class="stagebar"><h2>Everything they marked</h2>'+
    '<span class="tally">'+rows.length+'</span></div>'+
    rows.map(r=>'<div class="item"><div class="item-head">'+
      '<span class="item-title">'+esc(r.item.title)+
        '<span class="item-chips">'+
          '<span class="verdict verdict--'+r.v.id+'">'+esc(r.v.label)+'</span>'+
          catChip(r.item.cat)+
          '<span class="chip chip--due">'+esc(stageName(r.item.week))+'</span>'+
        '</span>'+
        '<div class="voices">'+voicesFor(r.key)+'</div>'+
      '</span></div></div>').join("")+
  '</section>';

  return out;
}

/* ------------------------------------------------------------
   the decision list, as plain markdown
   ------------------------------------------------------------ */
function buildSummary(){
  const who=Object.keys(merged);
  const byKey={}; ITEMS.forEach(it=>byKey[it.key]=it);
  const keys=mergedItemKeys();
  const rows=keys.map(k=>({key:k,item:byKey[k],v:verdictFor(k)})).filter(r=>r.item)
                 .sort((a,b)=>a.v.rank-b.v.rank || stageOrder(a.item.week)-stageOrder(b.item.week));

  const L=[];
  L.push("# The Gang Operations Hub — review decisions");
  L.push("");
  L.push("Notes from " + who.join(", ") + ", pulled together " + today() + ".");
  L.push(rows.length + " of " + ITEMS.length + " responsibilities were marked.");
  L.push("");

  const buckets=[
    ["They disagree", r=>r.v.id==="split"],
    ["Marked to drop", r=>r.v.id==="drop"],
    ["Needs changing", r=>r.v.id==="change"],
    ["Keep, with an owner suggested", r=>r.v.id==="owner"],
    ["Agreed keep as is", r=>r.v.id==="keep"]
  ];

  buckets.forEach(b=>{
    const set=rows.filter(b[1]);
    if(!set.length) return;
    L.push("## "+b[0]+" ("+set.length+")");
    L.push("");
    set.forEach(r=>{
      L.push("### "+r.item.title);
      L.push("_"+cat(r.item.cat).name+" · "+timingText(r.item.week,r.item.weeksBefore)+"_");
      who.forEach(w=>{
        const e=(merged[w].items||{})[r.key];
        if(!hasReview(e)) return;
        const bits=[];
        if(e.flag) bits.push((FLAGS.find(f=>f.id===e.flag)||{}).label||e.flag);
        if(e.note) bits.push(e.note);
        if(e.owner) bits.push("owner → "+e.owner);
        if(e.timing) bits.push("timing → "+e.timing);
        L.push("- **"+w+":** "+bits.join(" · "));
      });
      L.push("");
    });
  });

  const adds=[];
  who.forEach(w=>(merged[w].additions||[]).forEach(a=>adds.push(Object.assign({},a,{by:w}))));
  if(adds.length){
    L.push("## Proposed additions ("+adds.length+")");
    L.push("");
    adds.forEach(a=>{
      L.push("### "+a.title);
      L.push("_"+cat(a.cat).name+" · "+timingText(a.week,a.weeksBefore)+" · from "+a.by+"_");
      if(a.note) L.push("- "+a.note);
      if(a.owner) L.push("- owner → "+a.owner);
      L.push("");
    });
  }
  return L.join("\n");
}

/* ------------------------------------------------------------
   export / import
   ------------------------------------------------------------ */
function download(name, text, type){
  try{
    const b=new Blob([text],{type:type||"application/json"});
    const u=URL.createObjectURL(b);
    const a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); },1500);
    return true;
  }catch(e){ return false; }
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){ return false; }
}

function exportMine(){
  if(!mine.reviewer){ toast("Pick your name first"); return; }
  const n=reviewedCount();
  if(!n && !mine.additions.length){ toast("Nothing marked yet"); return; }
  const body=JSON.stringify(Object.assign({}, mine, {tool:"gang-ops-review", exported:new Date().toISOString()}), null, 2);
  const name = SLUG+"-"+mine.reviewer.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+today()+".json";
  if(download(name, body)) toast("Saved "+name);
  else { UI.out=body; render(); toast("Download blocked. Copy the text instead."); }
}

function loadFiles(files){
  let added=0, bad=0;
  const jobs=[...files].map(f=>new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d || !d.items || !d.reviewer) throw new Error("not a review file");
        merged[d.reviewer]=d; added++;
      }catch(e){ bad++; }
      res();
    };
    r.onerror=()=>{ bad++; res(); };
    r.readAsText(f);
  }));
  Promise.all(jobs).then(()=>{
    LS.set("merged", merged);
    UI.out="";
    render();
    toast(added?("Loaded "+plural(added,"review")+(bad?", "+bad+" skipped":"")):"Those files did not look like review exports");
  });
}

/* ------------------------------------------------------------
   shell
   ------------------------------------------------------------ */
function head(){
  const n=reviewedCount(), total=ITEMS.length;
  const pct=total?Math.round(n/total*100):0;
  return '<header class="masthead">'+
    '<div class="eyebrow">The Gang Fitness &middot; leadership review</div>'+
    '<h1>The operating system,<br>up for review</h1>'+
    '<p class="lede">Every recurring responsibility we have written down, '+total+' of them, laid out across the run-up to a program and its fourteen weeks. '+
    'Go through it and say what you would <b>keep</b>, <b>change</b> or <b>drop</b>, who you think should own it, and anything missing. '+
    'When you are done, hit Export and send Quinton the file. He merges everyone&rsquo;s notes and we make the changes in one pass.</p>'+

    '<div class="whobar">'+
      '<div class="field"><label>You are</label>'+
        '<select class="sel" data-act="setwho">'+
          '<option value="">Choose&hellip;</option>'+
          PEOPLE.map(p=>'<option value="'+esc(p)+'"'+(mine.reviewer===p?" selected":"")+'>'+esc(p)+'</option>').join("")+
        '</select></div>'+
      (mine.reviewer?'<div class="meter"><span class="meter-track"><i style="width:'+pct+'%"></i></span>'+
        '<span class="meter-n">'+n+' of '+total+' marked</span></div>':"")+
      '<span class="spacer"></span>'+
      '<div class="modes">'+
        '<button data-act="mode" data-m="review" aria-pressed="'+(UI.mode==="review")+'">Review</button>'+
        '<button data-act="mode" data-m="merge" aria-pressed="'+(UI.mode==="merge")+'">Merge notes</button>'+
      '</div>'+
      (UI.mode==="review"?'<button class="btn btn--primary btn--sm" data-act="export">Export my notes</button>':"")+
    '</div>'+
    (UI.mode==="review"&&UI.out?'<div class="outbox">'+esc(UI.out)+'</div>'+
      '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn--ghost btn--sm" data-act="copyout">Copy it</button>'+
      '<button class="btn btn--quiet btn--sm" data-act="closeout">Hide</button></div>':"")+
  '</header>';
}

function toolbar(){
  if(UI.mode!=="review" || !mine.reviewer) return "";
  const stages=[["all","Every stage"],[String(ONGOING),"Ongoing"],["0","Between programs"]]
    .concat(Array.from({length:WEEKS},(_,i)=>[String(i+1),"Week "+(i+1)]));
  return '<div class="toolbar"><div class="toolbar-in">'+
    '<input class="search" data-act="search" placeholder="Search the list&hellip;" value="'+esc(UI.q)+'">'+
    '<select class="sel" data-act="fcat" style="width:auto;min-width:150px"><option value="all">Every category</option>'+
      SEED_CATEGORIES.map(c=>'<option value="'+esc(c.id)+'"'+(UI.cat===c.id?" selected":"")+'>'+esc(c.name)+'</option>').join("")+
    '</select>'+
    '<select class="sel" data-act="fstage" style="width:auto;min-width:150px">'+
      stages.map(s=>'<option value="'+s[0]+'"'+(UI.stage===s[0]?" selected":"")+'>'+s[1]+'</option>').join("")+
    '</select>'+
    '<select class="sel" data-act="fflag" style="width:auto;min-width:150px">'+
      [["all","Everything"],["todo","Not looked at yet"],["done","Marked"],["keep","Keep"],["change","Change"],["drop","Drop"],["unsure","Not sure"]]
        .map(f=>'<option value="'+f[0]+'"'+(UI.flag===f[0]?" selected":"")+'>'+f[1]+'</option>').join("")+
    '</select>'+
    '<button class="btn btn--quiet btn--sm" data-act="reset">Start over</button>'+
  '</div></div>';
}

function render(){
  const y=window.scrollY;
  $("#root").innerHTML =
    '<div class="page page--top">'+head()+'</div>'+
    toolbar()+
    '<div class="page">'+(UI.mode==="merge" ? mergeBody() : reviewBody())+'</div>';
  window.scrollTo(0,y);
  wireDrop();
}

function wireDrop(){
  const d=document.getElementById("drop");
  if(!d) return;
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{ e.preventDefault(); d.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{ e.preventDefault(); d.classList.remove("over"); }));
  d.addEventListener("drop",e=>{ if(e.dataTransfer&&e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });
  const inp=document.getElementById("fileInput");
  if(inp) inp.addEventListener("change",e=>{ if(e.target.files.length) loadFiles(e.target.files); });
}

/* ------------------------------------------------------------
   events
   ------------------------------------------------------------ */
document.addEventListener("click",async function(ev){
  const el=ev.target.closest("[data-act]");
  if(!el) return;
  const act=el.getAttribute("data-act");
  const tag=el.tagName;
  if(tag==="SELECT"||tag==="INPUT"||tag==="TEXTAREA") return;

  const key=el.getAttribute("data-key");

  if(act==="flag"){
    ev.preventDefault();
    const e=entry(key);
    e.flag = e.flag===el.getAttribute("data-f") ? null : el.getAttribute("data-f");
    UI.open[key]=true; saveMine(); render(); return;
  }
  if(act==="clearflag"){ ev.preventDefault(); const e=entry(key); e.flag=null; UI.open[key]=true; saveMine(); render(); return; }
  if(act==="delnew"){
    ev.preventDefault();
    mine.additions=mine.additions.filter(a=>a.id!==key);
    delete mine.items[key]; saveMine(); render(); toast("Removed"); return;
  }
  if(act==="addnew"){
    ev.preventDefault();
    const week=Number(el.getAttribute("data-week"));
    const wbRaw=el.getAttribute("data-wb");
    const title=window.prompt("What is missing?");
    if(!title || !title.trim()) return;
    const a={ id:uid("add"), title:title.trim(), cat:SEED_CATEGORIES[0].id,
              week:week, weeksBefore:(wbRaw===""?null:Number(wbRaw)), note:"", owner:"" };
    mine.additions.push(a);
    UI.open[a.id]=true;
    saveMine(); render(); toast("Added. Open it to say more."); return;
  }
  if(act==="mode"){ ev.preventDefault(); UI.mode=el.getAttribute("data-m"); UI.out=""; render(); return; }
  if(act==="export"){ ev.preventDefault(); exportMine(); return; }
  if(act==="pickfiles"){ ev.preventDefault(); const i=document.getElementById("fileInput"); if(i) i.click(); return; }
  if(act==="dropwho"){
    ev.preventDefault();
    const w=el.getAttribute("data-who");
    delete merged[w]; LS.set("merged",merged); UI.out=""; render(); return;
  }
  if(act==="clearmerge"){
    ev.preventDefault();
    if(!window.confirm("Remove everyone's loaded notes? Their exported files are untouched.")) return;
    merged={}; LS.set("merged",merged); UI.out=""; render(); return;
  }
  if(act==="buildsummary"){ ev.preventDefault(); UI.out=buildSummary(); render(); return; }
  if(act==="copyout"){
    ev.preventDefault();
    const ok=await copyText(UI.out);
    toast(ok?"Copied":"Could not copy. Select the text and copy it by hand.");
    return;
  }
  if(act==="downloadout"){
    ev.preventDefault();
    download(SLUG+"-decisions-"+today()+".md", UI.out, "text/markdown");
    return;
  }
  if(act==="closeout"){ ev.preventDefault(); UI.out=""; render(); return; }
  if(act==="reset"){
    ev.preventDefault();
    if(!window.confirm("Clear your own notes and start over? This does not touch anyone else's.")) return;
    mine={ schema:SCHEMA, reviewer:mine.reviewer, updated:null, items:{}, additions:[] };
    saveMine(); render(); toast("Cleared"); return;
  }
});

/* keep track of which items are expanded, so a re-render does not close them */
document.addEventListener("toggle",function(ev){
  const d=ev.target;
  if(d && d.tagName==="DETAILS" && d.classList.contains("item")){
    UI.open[d.getAttribute("data-key")]=d.open;
  }
},true);

document.addEventListener("change",function(ev){
  const el=ev.target.closest("[data-act]");
  if(!el) return;
  const act=el.getAttribute("data-act");
  const key=el.getAttribute("data-key");
  if(act==="setwho"){ mine.reviewer=el.value; saveMine(); render(); return; }
  if(act==="fcat"){ UI.cat=el.value; render(); return; }
  if(act==="fstage"){ UI.stage=el.value; render(); return; }
  if(act==="fflag"){ UI.flag=el.value; render(); return; }
  if(act==="setowner"){ entry(key).owner=el.value||null; saveMine(); render(); return; }
});

/* typing: save quietly without redrawing under the cursor */
document.addEventListener("input",function(ev){
  const el=ev.target.closest("[data-act]");
  if(!el) return;
  const act=el.getAttribute("data-act");
  const key=el.getAttribute("data-key");
  if(act==="search"){
    UI.q=el.value;
    clearTimeout(render._q);
    render._q=setTimeout(()=>{ const v=el.value; render(); const s=document.querySelector(".search"); if(s){ s.focus(); s.value=v; s.setSelectionRange(v.length,v.length); } },260);
    return;
  }
  if(act==="setnote"){ entry(key).note=el.value; clearTimeout(render._n); render._n=setTimeout(saveMine,400); return; }
  if(act==="settiming"){ entry(key).timing=el.value; clearTimeout(render._t); render._t=setTimeout(saveMine,400); return; }
});

window.addEventListener("beforeunload",saveMine);

render();
})();
</script>
