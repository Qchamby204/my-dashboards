<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Downtown Extra Sessions (test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Fraunces:opsz,wght@9..144,400..800&display=swap">
<style>
/* ============================================================
   THE GANG OPERATIONS HUB
   Palette and type pulled from thegangfitness.com
   ============================================================ */
:root{
  /* brand */
  --cream:#FFFAF3;
  --ink:#0F0B09;
  --wine:#840728;
  --red:#E40224;
  --pink:#FF54BF;
  --sky:#D9E7FF;

  /* warm neutrals biased toward the wine */
  --paper:#FFFFFF;
  --sand:#F6EEE3;
  --shell:#F0E4D5;
  --line:#E6D8C7;
  --line-soft:#F0E6DA;
  --stone:#8B7A6D;
  --stone-dk:#5E4F45;

  /* semantic */
  --ok:#2E6B4F;
  --warn:#C25E00;
  --crit:var(--red);

  --r-sm:8px;
  --r-md:14px;
  --r-lg:20px;
  --r-pill:999px;

  --shadow:0 1px 2px rgba(15,11,9,.04), 0 8px 24px -16px rgba(15,11,9,.22);
  --shadow-lift:0 2px 6px rgba(15,11,9,.06), 0 20px 44px -24px rgba(15,11,9,.32);

  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --ui:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;

  --rail:230px;
  color-scheme: light;
}

*,*::before,*::after{box-sizing:border-box;}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--ui);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
a{color:var(--red);}

:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px;}

h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance;letter-spacing:-.01em;}

summary{list-style:none;cursor:pointer;}
summary::-webkit-details-marker{display:none;}
summary::marker{content:"";}

.eyebrow{
  font-family:var(--ui);
  font-stretch:118%;
  font-size:.66rem;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--stone);
}

.num{font-variant-numeric:tabular-nums;}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:flex;min-height:100vh;}

.rail{
  width:var(--rail);
  flex:0 0 var(--rail);
  border-right:1px solid var(--line);
  background:var(--cream);
  padding:26px 18px 20px;
  display:flex;
  flex-direction:column;
  gap:26px;
  position:sticky;
  top:0;
  height:100vh;
}

.brand{display:flex;align-items:center;gap:11px;padding:0 6px;}
.brand-mark{
  width:38px;height:38px;flex:0 0 38px;
  border-radius:var(--r-pill);
  background:var(--wine);
  color:var(--cream);
  display:grid;place-items:center;
  font-family:var(--ui);
  font-stretch:120%;
  font-weight:700;
  font-size:.74rem;
  letter-spacing:.06em;
}
.brand-name{
  font-family:var(--display);
  font-size:1.02rem;
  font-weight:600;
  line-height:1.12;
  letter-spacing:-.015em;
}
.brand-name small{display:block;font-family:var(--ui);font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);margin-top:3px;font-stretch:115%;}

.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;
  border-radius:var(--r-pill);
  text-align:left;
  font-size:.9rem;
  font-weight:500;
  color:var(--stone-dk);
  transition:background .13s ease,color .13s ease;
}
.nav-item:hover{background:var(--sand);color:var(--ink);}
.nav-item[aria-current="page"]{background:var(--wine);color:var(--cream);font-weight:600;}
.nav-item[aria-current="page"] .nav-count{background:rgba(255,250,243,.22);color:var(--cream);}
.nav-count{
  font-size:.68rem;font-weight:700;
  background:var(--shell);color:var(--stone-dk);
  border-radius:var(--r-pill);
  padding:1px 7px;
  font-variant-numeric:tabular-nums;
}
.nav-count--alert{background:var(--red);color:#fff;}

.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;}
.who{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:10px 12px;
  background:var(--paper);
}
.who label{display:block;margin-bottom:5px;}
.who select{
  width:100%;
  border:none;background:none;
  font-family:var(--display);
  font-size:1rem;font-weight:600;
  padding:0;
}
.rail-link{
  font-size:.8rem;color:var(--stone);
  padding:6px 12px;border-radius:var(--r-pill);text-align:left;
}
.rail-link:hover{color:var(--ink);background:var(--sand);}
.rail-link[aria-current="page"]{color:var(--ink);background:var(--sand);font-weight:600;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 34px 90px;}

/* ============================================================
   PAGE HEADER
   ============================================================ */
.pagehead{
  border-bottom:1px solid var(--line);
  background:var(--cream);
  padding:26px 0 20px;
  margin-bottom:26px;
}
.pagehead .wrap{padding-bottom:0;}
.pagehead-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.pagehead h1{font-size:2.1rem;line-height:1.1;}
.pagehead .sub{color:var(--stone-dk);font-size:.92rem;margin-top:6px;}

.status-line{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  font-family:var(--display);
  font-size:2.6rem;
  font-weight:600;
  line-height:1.04;
  letter-spacing:-.025em;
}
.status-line .of{
  font-family:var(--ui);
  font-stretch:118%;
  font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--red);
  border:1px solid currentColor;
  border-radius:var(--r-pill);
  padding:5px 12px;
  align-self:center;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border-radius:var(--r-pill);
  padding:9px 17px;
  font-size:.82rem;font-weight:600;
  font-stretch:106%;
  border:1px solid transparent;
  transition:background .13s ease,color .13s ease,border-color .13s ease,transform .08s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn--primary{background:var(--wine);color:var(--cream);}
.btn--primary:hover{background:#6C0620;}
.btn--red{background:var(--red);color:#fff;}
.btn--red:hover{background:#C10120;}
.btn--ghost{border-color:var(--line);color:var(--stone-dk);background:var(--paper);}
.btn--ghost:hover{border-color:var(--ink);color:var(--ink);}
.btn--quiet{color:var(--stone-dk);padding:7px 12px;}
.btn--quiet:hover{background:var(--sand);color:var(--ink);}
.btn--danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 34%,transparent);background:var(--paper);}
.btn--danger:hover{background:color-mix(in srgb,var(--red) 9%,var(--paper));}
.btn--sm{padding:6px 13px;font-size:.75rem;}
.btn[disabled]{opacity:.42;pointer-events:none;}

/* ============================================================
   CYCLE RIBBON  (Between Programs -> Week 1..14)
   ============================================================ */
.ribbon{
  display:flex;align-items:stretch;gap:4px;
  margin-top:20px;
  overflow-x:auto;
  padding-bottom:6px;
  scrollbar-width:thin;
}
.seg{
  flex:1 1 0;
  min-width:30px;
  height:38px;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--stone);
  font-size:.72rem;font-weight:600;
  font-variant-numeric:tabular-nums;
  display:grid;place-items:center;
  position:relative;
  transition:border-color .13s ease,background .13s ease,color .13s ease;
}
.seg--bp{flex:0 0 118px;min-width:118px;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;font-stretch:112%;}
.seg:hover{border-color:var(--ink);color:var(--ink);}
.seg--past{background:var(--shell);border-color:var(--shell);color:var(--stone-dk);}
.seg--now{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 16px -8px var(--red);}
.seg--sel{border-color:var(--ink);color:var(--ink);border-width:2px;}
.seg--now.seg--sel{border-color:var(--ink);}
.seg .dot{
  position:absolute;top:5px;right:5px;
  width:5px;height:5px;border-radius:50%;
  background:var(--red);
}
.seg--now .dot{background:#fff;}
.ribbon-legend{display:flex;gap:16px;margin-top:8px;}
.ribbon-legend span{font-size:.68rem;color:var(--stone);display:flex;align-items:center;gap:6px;}
.ribbon-legend i{width:9px;height:9px;border-radius:3px;display:block;}

/* ============================================================
   STAT TILES
   ============================================================ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px;}
.stat{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--paper);
  padding:15px 16px 14px;
  position:relative;
  overflow:hidden;
}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stone);opacity:.28;}
.stat--done::before{background:var(--ok);opacity:1;}
.stat--left::before{background:var(--wine);opacity:1;}
.stat--over::before{background:var(--red);opacity:1;}
.stat-n{font-family:var(--display);font-size:2.1rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.stat--over .stat-n{color:var(--red);}
.stat-l{margin-top:7px;}

/* ============================================================
   SECTIONS + CARDS
   ============================================================ */
.section{margin-bottom:34px;}
.section-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-bottom:9px;margin-bottom:12px;
  border-bottom:1px solid var(--line);
}
.section-head h2{font-size:1.22rem;}
.section-head .count{color:var(--stone);font-size:.8rem;font-variant-numeric:tabular-nums;}
.section--alert .section-head{border-bottom-color:color-mix(in srgb,var(--red) 40%,transparent);}
.section--alert .section-head h2{color:var(--red);}

.card{
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--paper);
  overflow:hidden;
}

.empty{
  border:1px dashed var(--line);
  border-radius:var(--r-md);
  padding:26px 22px;
  text-align:center;
  color:var(--stone);
  font-size:.88rem;
  background:color-mix(in srgb,var(--sand) 50%,transparent);
}
.empty strong{display:block;font-family:var(--display);font-size:1.05rem;color:var(--stone-dk);margin-bottom:4px;font-weight:600;}

/* ============================================================
   TASK ROW
   ============================================================ */
.tasklist{display:flex;flex-direction:column;}
.task{
  display:flex;align-items:flex-start;gap:13px;
  padding:13px 15px;
  border-bottom:1px solid var(--line-soft);
  background:var(--paper);
  transition:background .12s ease;
}
.tasklist .task:last-child{border-bottom:none;}
.task:hover{background:var(--sand);}
.task--done{background:color-mix(in srgb,var(--sand) 55%,var(--paper));}
.task--done:hover{background:var(--sand);}
.task--over{box-shadow:inset 3px 0 0 var(--red);}

.check{
  flex:0 0 21px;width:21px;height:21px;margin-top:1px;
  border:1.5px solid var(--stone);
  border-radius:6px;
  display:grid;place-items:center;
  transition:background .12s ease,border-color .12s ease;
}
.check:hover{border-color:var(--wine);background:color-mix(in srgb,var(--wine) 8%,transparent);}
.check svg{width:13px;height:13px;opacity:0;transition:opacity .12s ease;}
.task--done .check{background:var(--wine);border-color:var(--wine);}
.task--done .check svg{opacity:1;stroke:var(--cream);}

.task-main{flex:1;min-width:0;}
.task-title{
  font-size:.94rem;font-weight:500;line-height:1.35;
  cursor:pointer;
  word-break:break-word;
}
.task--done .task-title{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--stone) 70%,transparent);color:var(--stone);}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;}
.task-note{margin-top:6px;font-size:.8rem;color:var(--stone);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.task-open{
  flex:0 0 auto;align-self:center;
  color:var(--stone);font-size:1rem;
  padding:4px 6px;border-radius:var(--r-sm);
}
.task-open:hover{background:var(--shell);color:var(--ink);}

/* chips */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.68rem;font-weight:600;
  padding:3px 9px;
  border-radius:var(--r-pill);
  white-space:nowrap;
  font-stretch:104%;
}
.chip--cat{background:color-mix(in srgb,var(--c) 11%,transparent);color:var(--c);}
.chip--cat i{width:6px;height:6px;border-radius:50%;background:var(--c);}
.chip--owner{background:var(--shell);color:var(--stone-dk);}
.chip--owner[data-owner="Unassigned"]{background:transparent;border:1px dashed var(--line);color:var(--stone);}
.chip--owner[data-owner="Shared"]{background:var(--sky);color:#1E3D6B;}
.chip--due{background:transparent;color:var(--stone);border:1px solid var(--line);font-variant-numeric:tabular-nums;}
.chip--due.is-over{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 7%,transparent);}
.chip--st{border:1px solid transparent;}
.chip--st[data-st="not_started"]{background:transparent;border-color:var(--line);color:var(--stone);}
.chip--st[data-st="in_progress"]{background:color-mix(in srgb,var(--pink) 15%,transparent);color:#B0117A;}
.chip--st[data-st="waiting"]{background:var(--sky);color:#1E3D6B;}
.chip--st[data-st="complete"]{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok);}
.chip--recur{background:color-mix(in srgb,var(--wine) 9%,transparent);color:var(--wine);}
.chip--hand{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn);}

/* ============================================================
   FILTER BAR
   ============================================================ */
.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
.filter{
  padding:6px 14px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:var(--paper);
  font-size:.78rem;font-weight:600;color:var(--stone-dk);
  transition:all .12s ease;
}
.filter:hover{border-color:var(--ink);color:var(--ink);}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream);}
.filter-label{margin-right:3px;}

/* ============================================================
   WEEK GROUPS (Program view)
   ============================================================ */
.stage{border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);margin-bottom:11px;overflow:hidden;}
.stage--now{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 10%,transparent);}
.stage--bp{background:color-mix(in srgb,var(--sand) 60%,var(--paper));}
.stage-head{
  display:flex;align-items:center;gap:14px;
  width:100%;padding:14px 16px;text-align:left;
}
.stage-head:hover{background:var(--sand);}
.stage-num{
  flex:0 0 auto;min-width:74px;
  font-family:var(--ui);font-stretch:116%;
  font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--stone);
}
.stage--now .stage-num{color:var(--red);}
.stage-title{flex:1;font-family:var(--display);font-size:1.06rem;font-weight:600;}
.stage-bar{flex:0 0 92px;height:5px;border-radius:var(--r-pill);background:var(--shell);overflow:hidden;}
.stage-bar i{display:block;height:100%;background:var(--wine);border-radius:var(--r-pill);}
.stage-meta{flex:0 0 auto;font-size:.76rem;color:var(--stone);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}
.stage-caret{color:var(--stone);transition:transform .16s ease;}
.stage[open] .stage-caret{transform:rotate(90deg);}
.stage-body{border-top:1px solid var(--line-soft);}
.stage-add{padding:10px 15px;border-top:1px solid var(--line-soft);}
.runup{padding:11px 15px 8px;background:var(--sand);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}
.stage-body > .runup:first-child{border-top:none;}

/* ============================================================
   PEOPLE / RESPONSIBILITIES
   ============================================================ */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:30px;}
.person{
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);
  padding:17px 17px 15px;
  display:flex;flex-direction:column;gap:12px;
}
.person-top{display:flex;align-items:center;gap:11px;}
.avatar{
  width:40px;height:40px;flex:0 0 40px;border-radius:var(--r-pill);
  display:grid;place-items:center;
  font-family:var(--ui);font-stretch:118%;
  font-weight:700;font-size:.82rem;
  background:var(--wine);color:var(--cream);
}
.avatar[data-owner="Shared"]{background:var(--sky);color:#1E3D6B;}
.avatar[data-owner="Unassigned"]{background:transparent;border:1.5px dashed var(--line);color:var(--stone);}
.person-name{font-family:var(--display);font-size:1.16rem;font-weight:600;}
.person-sub{font-size:.76rem;color:var(--stone);}
.load{height:7px;border-radius:var(--r-pill);background:var(--shell);overflow:hidden;display:flex;}
.load i{display:block;height:100%;}
.person-nums{display:flex;gap:16px;}
.person-nums div{flex:1;}
.person-nums b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.person-nums span{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);font-weight:600;}
.person-nums .over b{color:var(--red);}
.catbars{display:flex;flex-direction:column;gap:5px;}
.catbar{display:flex;align-items:center;gap:9px;font-size:.76rem;}
.catbar-n{margin-left:auto;color:var(--stone);font-variant-numeric:tabular-nums;}
.catbar-t{flex:1;height:6px;border-radius:var(--r-pill);background:var(--shell);overflow:hidden;}
.catbar-t i{display:block;height:100%;background:var(--c);border-radius:var(--r-pill);}

/* ============================================================
   MODAL / DRAWER
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(15,11,9,.32);
  backdrop-filter:blur(2px);
  z-index:60;
  display:flex;justify-content:flex-end;
  animation:fade .16s ease;
}
.scrim--center{align-items:center;justify-content:center;padding:22px;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes popin{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}

.drawer{
  width:min(520px,100%);
  background:var(--cream);
  height:100%;
  overflow-y:auto;
  border-left:1px solid var(--line);
  animation:slidein .18s ease;
  display:flex;flex-direction:column;
}
.modal{
  width:min(560px,100%);
  max-height:calc(100vh - 44px);
  overflow-y:auto;
  background:var(--cream);
  border-radius:var(--r-lg);
  border:1px solid var(--line);
  box-shadow:var(--shadow-lift);
  animation:popin .16s ease;
}
@media (prefers-reduced-motion:reduce){
  .scrim,.drawer,.modal{animation:none;}
  *{transition-duration:.01ms !important;}
}
.dhead{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:20px 22px 16px;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--cream);z-index:2;
}
.dhead h2{font-size:1.35rem;line-height:1.22;}
.dbody{padding:20px 22px;display:flex;flex-direction:column;gap:18px;flex:1;}
.dfoot{
  padding:15px 22px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  position:sticky;bottom:0;background:var(--cream);
}
.dfoot .spacer{flex:1;}
.x{width:32px;height:32px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--stone);flex:0 0 32px;}
.x:hover{background:var(--shell);color:var(--ink);}

/* ============================================================
   FORM
   ============================================================ */
.field{display:flex;flex-direction:column;gap:6px;}
.field > label{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);font-stretch:112%;}
.inp,.sel,.ta{
  width:100%;
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  background:var(--paper);
  padding:9px 11px;
  font-size:.9rem;
  transition:border-color .12s ease,box-shadow .12s ease;
}

    let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; const e=new Error((label||"That")+" got no answer after "+Math.round(ms/1000)+" seconds."); e.timeout=true; rej(e); } }, ms);
    Promise.resolve(p).then(v=>{ if(!done){done=true;clearTimeout(t);res(v);} },e=>{ if(!done){done=true;clearTimeout(t);rej(e);} });
  });
}
function friendly(e){
  const m=String((e&&e.message)||"");
  if(e&&e.timeout) return m;
  if(/SESSION_FULL/.test(m)) return "That session filled up while you were looking. Pick another.";
  if(/WEEK_LIMIT/.test(m)) return "You already have "+PER_CLIENT_PER_WEEK+" extra sessions booked that week.";
  if(/duplicate key|23505/.test(m)) return "You are already booked into that session.";
  if(/relation .* does not exist|42P01|function .* does not exist|PGRST202/i.test(m))
    return "The booking tables are not set up yet. Run the setup SQL in Supabase.";
  if(/row-level security|42501/i.test(m)) return "The database refused that. Check the security policies from the setup SQL.";
  if(/Invalid login/i.test(m)) return "That passcode is not right.";
  if(/Failed to fetch|NetworkError/i.test(m)) return "Could not reach the booking system. Check your connection.";
  return m || "Something went wrong.";
}

/* ------------------------------------------------------------
   the schedule, expanded into real dates
   ------------------------------------------------------------ */
function sessionsOn(iso){
  const d=dow(iso);
  const out=[];
  GYM.teams.forEach(t=>{
    t.slots.forEach(s=>{
      if(s.days.indexOf(d)>=0) out.push({ id:t.id, trainer:t.trainer, time:s.time, date:iso });
    });
  });
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function inProgram(iso){ return iso>=GYM.programStart && iso<=GYM.programEnd; }

/* the seven days a client may book: tomorrow through a week out */
function clientWindow(){
  const out=[];
  for(let i=1;i<=7;i++){
    const iso=addDays(todayISO(),i);
    if(TEST_MODE || inProgram(iso)) out.push(iso);
  }
  return out;
}

const TRAINERS = (function(){
  const seen={}, out=[];
  GYM.teams.forEach(t=>{ if(!seen[t.trainer]){ seen[t.trainer]=1; out.push(t.trainer); } });
  return out.sort();
})();

   sandbox store — used only by the test build. Same surface and

const Sandbox = {
  sb:true, ready:false, log:[], trainer:false, spots:{}, rows:[],

  note(m){ this.log.push(new Date().toTimeString().slice(0,8)+"  "+m); if(this.log.length>60) this.log.shift(); },
  connect(){ return true; },
  all(){ return LS.get("sandbox",[]); },
  save(rows){ LS.set("sandbox",rows); },

  async loadSpots(from,to){
    const map={};
    this.all().forEach(r=>{
      if(r.session_date>=from && r.session_date<=to){
        const k=r.session_id+"|"+r.session_date;
        map[k]=(map[k]||0)+1;
      }
    });
    this.spots=map;
  },

  async book(sess, who){
    const rows=this.all();
    const nk=nameKey(who.first,who.last);
    const here=rows.filter(r=>r.session_id===sess.id && r.session_date===sess.date);
    if(here.some(r=>r.name_key===nk)) throw new Error("duplicate key");
    if(here.length>=SPOTS_PER_SESSION) throw new Error("SESSION_FULL");
    const wk=mondayOf(sess.date), wkEnd=addDays(wk,6);
    if(rows.filter(r=>r.name_key===nk && r.session_date>=wk && r.session_date<=wkEnd).length>=PER_CLIENT_PER_WEEK)
      throw new Error("WEEK_LIMIT");
    rows.push({
      id:"s-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      gym:GYM.id, session_id:sess.id, session_date:sess.date, session_time:sess.time,
      trainer:sess.trainer, first_name:who.first, last_name:who.last,
      regular_trainer:who.regular, name_key:nk, created_at:new Date().toISOString()
    });
    this.save(rows);
  },

  async cancel(sess, who){
    const nk=nameKey(who.first,who.last);
    const rows=this.all();
    const kept=rows.filter(r=>!(r.session_id===sess.id && r.session_date===sess.date && r.name_key===nk));
    this.save(kept);
    return rows.length-kept.length;
  },

  async signIn(code){
    if(String(code)!==GYM.testPasscode) throw new Error("Invalid login credentials");
    this.trainer=true; LS.set("sandboxTrainer",true);
  },
  async signOut(){ this.trainer=false; LS.set("sandboxTrainer",false); this.rows=[]; },
  async session(){ this.trainer = !!LS.get("sandboxTrainer",false); },

  async loadRows(from,to){
    this.rows=this.all()
      .filter(r=>r.session_date>=from && r.session_date<=to)
      .sort((a,b)=> a.session_date.localeCompare(b.session_date)
                 || a.session_time.localeCompare(b.session_time)
                 || String(a.created_at).localeCompare(String(b.created_at)));
  },
  async remove(id){ this.save(this.all().filter(r=>r.id!==id)); },

  wipe(){ LS.set("sandbox",[]); this.spots={}; this.rows=[]; }
};

/* ------------------------------------------------------------
   live store
   ------------------------------------------------------------ */
const Live = {
  sb:null, ready:false, log:[], trainer:false,
  spots:{},                 /* "id|date" -> booked count */
  rows:[],                  /* trainer view: full booking rows */

  note(m){ this.log.push(new Date().toTimeString().slice(0,8)+"  "+m); if(this.log.length>60) this.log.shift(); },

  connect(){
    const c=conn();
    if(!c.url||!c.key||!window.supabase) return false;
    this.sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});
    this.note("connected to "+c.url.replace(/^https?:\/\//,""));
    return true;
  },

  async loadSpots(from,to){
    const { data, error } = await withTimeout(
      this.sb.rpc("session_spots",{ p_gym:GYM.id, p_from:from, p_to:to }), 20000, "Loading spots");
    if(error) throw error;
    const map={};
    (data||[]).forEach(r=>{ map[r.session_id+"|"+r.session_date]=Number(r.booked)||0; });
    this.spots=map;
    this.note("spots loaded for "+from+" to "+to);
  },

  async book(sess, who){
    const { error } = await withTimeout(this.sb.from("bookings").insert({
      gym: GYM.id,
      session_id: sess.id,
      session_date: sess.date,
      session_time: sess.time,
      trainer: sess.trainer,
      first_name: who.first,
      last_name: who.last,
      regular_trainer: who.regular
    }), 20000, "Booking");
    if(error) throw error;
  },

  async cancel(sess, who){
    const { data, error } = await withTimeout(this.sb.rpc("cancel_booking",{
      p_gym:GYM.id, p_session_id:sess.id, p_date:sess.date,
      p_first:who.first, p_last:who.last
    }), 20000, "Cancelling");
    if(error) throw error;
    return Number(data)||0;
  },

  async signIn(code){
    const { error } = await withTimeout(
      this.sb.auth.signInWithPassword({ email:GYM.trainerEmail, password:code }), 20000, "Signing in");
    if(error) throw error;
    this.trainer=true;
    this.note("trainer signed in");
  },
  async signOut(){ try{ await this.sb.auth.signOut(); }catch(e){} this.trainer=false; this.rows=[]; },
  async session(){
    try{
      const { data } = await withTimeout(this.sb.auth.getSession(), 12000, "Checking session");
      this.trainer = !!(data && data.session);
    }catch(e){ this.trainer=false; }
  },

  async loadRows(from,to){
    const { data, error } = await withTimeout(
      this.sb.from("bookings").select("id,session_id,session_date,session_time,trainer,first_name,last_name,regular_trainer,created_at")
        .eq("gym",GYM.id).gte("session_date",from).lte("session_date",to)
        .order("session_date").order("session_time").order("created_at"),
      25000, "Loading sign ups");
    if(error) throw error;
    this.rows=data||[];
    this.note("loaded "+this.rows.length+" sign ups");
  },
  async remove(id){
    const { error } = await withTimeout(this.sb.from("bookings").delete().eq("id",id), 20000, "Removing");
    if(error) throw error;
  }
};

function slotRow(s, opts){
  opts=opts||{};
  const key=s.id+"|"+s.date;
  const booked=Store.spots[key]||0;
  const left=Math.max(0,SPOTS_PER_SESSION-booked);
  const mine=!!UI.mine[key];
  const full=left<=0 && !mine;

  let pips='<span class="pips">';
  for(let i=0;i<SPOTS_PER_SESSION;i++){
    pips += '<i class="'+(i<booked?(mine&&i===booked-1?"taken mine":"taken"):"")+'"></i>';
  }
  pips+='</span>';

  let right;
  if(mine){
    right='<span class="spots" style="color:var(--ok);font-weight:600">You are in</span>'+
      '<button class="btn btn--ghost btn--sm" data-act="cancel" data-id="'+esc(s.id)+'" data-date="'+esc(s.date)+'" data-time="'+esc(s.time)+'" data-trainer="'+esc(s.trainer)+'">Cancel</button>';
  }else if(full){
    right='<span class="spots none">Full</span>';
  }else{
    right='<span class="spots">'+left+' of '+SPOTS_PER_SESSION+' left</span>'+
      '<button class="btn btn--primary btn--sm" data-act="book" data-id="'+esc(s.id)+'" data-date="'+esc(s.date)+'" data-time="'+esc(s.time)+'" data-trainer="'+esc(s.trainer)+'"'+(opts.disabled?" disabled":"")+'>Book</button>';
  }

  return '<div class="slot'+(full?" slot--full":"")+(mine?" slot--mine":"")+'">'+
    '<div class="slot-time">'+esc(fmtTime(s.time))+'</div>'+
    '<div class="slot-main"><div class="slot-trainer">'+esc(s.trainer)+'</div>'+
      '<div class="slot-sub">Lead trainer</div></div>'+
    '<div class="slot-right">'+pips+right+'</div>'+
  '</div>';
}

async function act(name, el, ev){
  switch(name){

  case "testconn": {
    const card=el.closest(".setup-card");
    const url=card.querySelector('[data-field="url"]').value.trim().replace(/\/+$/,"");
    const key=card.querySelector('[data-field="key"]').value.trim();
    if(!url||!key){ UI.err="Both the project URL and the anon key are needed."; render(); return; }
    LS.set("conn",{url:url,key:key});
    UI.busy=true; UI.err=""; UI.checks=[["wait","Reaching the project"],["wait","Finding the bookings table"],["wait","Checking the spot counter"]];
    render();
    try{
      if(!Store.connect()) throw new Error("Could not start the client. Check the URL.");
      UI.checks[0]=["ok","Reached the project"]; render();
      const t=todayISO();
      await Store.loadSpots(t, addDays(t,7));
      UI.checks[1]=["ok","Found the bookings table"];
      UI.checks[2]=["ok","Spot counter works"];
      UI.busy=false; UI.view="client"; UI.err="";
      render(); toast("Connected");
    }catch(e){
      UI.busy=false;
      UI.checks[1]=["bad",friendly(e)];
      UI.err=friendly(e);
      Store.note("test failed: "+(e&&e.message));
      render();
    }
    return;
  }

  case "saveme": {
    const card=el.closest(".youare");
    UI.me={
      first:card.querySelector('[data-field="first"]').value.trim(),
      last:card.querySelector('[data-field="last"]').value.trim(),
      regular:card.querySelector('[data-field="regular"]').value
    };
    if(!UI.me.first||!UI.me.last){ UI.err="First and last name, please."; render(); return; }
    if(!UI.me.regular){ UI.err="Pick your regular lead trainer."; render(); return; }
    UI.err=""; UI.editing=false; saveMe(); render();
    return;
  }
  case "editme": UI.editing=true; UI.err=""; render(); return;

  case "book": {
    if(!haveMe()){ UI.err="Fill in your name first."; render(); return; }
    const sess={ id:el.getAttribute("data-id"), date:el.getAttribute("data-date"),
                 time:el.getAttribute("data-time"), trainer:el.getAttribute("data-trainer") };
    if(myWeekCount(sess.date)>=PER_CLIENT_PER_WEEK){
      UI.err="You already have "+PER_CLIENT_PER_WEEK+" extra sessions that week."; render(); return;
    }
    el.disabled=true; el.textContent="Booking…";
    try{
      await Store.book(sess, UI.me);
      UI.mine[sess.id+"|"+sess.date]=true; saveMine();
      UI.err=""; UI.ok="Booked. "+fmtFull(sess.date)+" at "+fmtTime(sess.time)+" with "+sess.trainer+".";
      await refreshSpots();
      render();
      toast("You are in");
    }catch(e){
      UI.ok=""; UI.err=friendly(e);
      Store.note("booking failed: "+(e&&e.message));
      try{ await refreshSpots(); }catch(e2){}
      render();
    }
    return;
  }

  case "cancel": {
    const sess={ id:el.getAttribute("data-id"), date:el.getAttribute("data-date") };
    el.disabled=true; el.textContent="…";
    try{
      const n=await Store.cancel(sess, UI.me);
      delete UI.mine[sess.id+"|"+sess.date]; saveMine();
      UI.err=""; UI.ok = n ? "Cancelled. That spot is free again." : "That booking was already gone.";
      await refreshSpots(); render();
    }catch(e){ UI.ok=""; UI.err=friendly(e); render(); }
    return;
  }

  case "refresh":
    try{ await refreshSpots(); UI.err=""; toast("Up to date"); }
    catch(e){ UI.err=friendly(e); }
    render();
    return;

  case "gate": UI.view="gate"; UI.err=""; render(); return;
  case "toclient": UI.view="client"; UI.err=""; render(); return;

  case "signin": {
    if(ev&&ev.preventDefault) ev.preventDefault();
    if(UI.busy) return;
    const code=document.getElementById("gateForm").querySelector('[data-field="code"]').value;
    if(!code){ UI.err="Enter the passcode."; render(); return; }
    UI.busy=true; UI.err=""; render();
    try{
      await Store.signIn(code);
      UI.busy=false; UI.view="trainer"; UI.weekStart=mondayOf(todayISO());
      await refreshRows(); render();
    }catch(e){
      UI.busy=false; UI.err=friendly(e);
      Store.note("sign in failed: "+(e&&e.message));
      render();
    }
    return;
  }
  case "wipe":
    Store.wipe();
    await refreshRows();
    UI.err=""; render(); toast("Cleared");
    return;

  case "signout":
    await Store.signOut();
    UI.view="client"; UI.err="";
    try{ await refreshSpots(); }catch(e){}
    render();
    return;

  case "week": {
    UI.weekStart=addDays(UI.weekStart||mondayOf(todayISO()), Number(el.getAttribute("data-d")));
    try{ await refreshRows(); UI.err=""; }catch(e){ UI.err=friendly(e); }
    render(); return;
  }
  case "thisweek":
    UI.weekStart=mondayOf(todayISO());
    try{ await refreshRows(); UI.err=""; }catch(e){ UI.err=friendly(e); }
    render(); return;

  case "remove": {
    const id=el.getAttribute("data-id");
    el.disabled=true; el.textContent="…";
    try{ await Store.remove(id); await refreshRows(); UI.err=""; toast("Removed"); }
    catch(e){ UI.err=friendly(e); }
    render(); return;
  }
  }
}

document.addEventListener("click",function(ev){
  const el=ev.target.closest("[data-act]");
  if(!el) return;
  const tag=el.tagName;
  if(tag==="SELECT"||tag==="INPUT") return;
  ev.preventDefault();
  Promise.resolve(act(el.getAttribute("data-act"),el,ev)).catch(e=>{
    console.error(e); UI.err=friendly(e); render();
  });
});
document.addEventListener("submit",function(ev){
  const f=ev.target.closest("[data-act]");
  if(!f) return;
  ev.preventDefault();
  Promise.resolve(act(f.getAttribute("data-act"),f,ev)).catch(e=>{ console.error(e); });
});
document.addEventListener("change",function(ev){
  const el=ev.target.closest("[data-act]");
  if(!el) return;
  if(el.getAttribute("data-act")==="tfilter"){ UI.tfilter=el.value; render(); }
});

/* ------------------------------------------------------------
   boot
   ------------------------------------------------------------ */
(async function boot(){
  if(TEST_MODE){
    render();
    await Store.session();
    if(Store.trainer){ UI.view="trainer"; UI.weekStart=mondayOf(todayISO()); await refreshRows(); }
    else { await refreshSpots(); }
    render();
    return;
  }
  const c=conn();
  if(!c.url||!c.key||!window.supabase){
    UI.view="setup";
    Store.note(window.supabase?"no connection settings yet":"the Supabase library did not load");
    render();
    return;
  }
  render();
  try{
    Store.connect();
    await Store.session();
    if(Store.trainer){
      UI.view="trainer"; UI.weekStart=mondayOf(todayISO());
      await refreshRows();
    }else{
      await refreshSpots();
    }
  }catch(e){
    UI.err=friendly(e);
    Store.note("startup: "+(e&&e.message));
  }
  render();
})();

})();
</script>
</body>
</html>
