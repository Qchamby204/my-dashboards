<style>
:root{--bg:#0c0e1a;--txt:#eef0fb;--muted:#8089a8;--dim:#6f7798;--line:rgba(120,130,180,.16);
  --gold:#f0b73e;--green:#2fd180;--blue:#4ea3e0;--violet:#9d7bff;--rose:#f0628a;--amber:#f0683e;--cyan:#45c8d8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1100px 600px at 50% -10%,rgba(240,183,62,.07),transparent 60%),var(--bg);
  color:var(--txt);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
#app{max-width:640px;margin:0 auto;
  padding:0 max(14px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}

  padding:calc(env(safe-area-inset-top,0px) + 11px) max(14px,env(safe-area-inset-left)) 11px;
  background:rgba(12,14,26,.90);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.appbar-title{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:#f3f4fb;letter-spacing:.05em;white-space:nowrap}

<body>
<div id="app"></div>
<script>
"use strict";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}
function J(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtM(n){ return "$"+(Math.round(n/1e5)/10)+"M"; }

/* Read each tool's real state. Same origin, so this is their live data.
   Every read is defensive: a tool you have not opened yet just shows a dash. */
function readLedger(){
  var days=J("lifeledger:v2",[]);
  if(!Array.isArray(days)||!days.length) return {v:"\u2014",s:"Not started",c:"var(--dim)"};
  var logged=days.some(function(d){return d.date===todayISO();});
  return {v:days.length+"d", s:logged?"Logged today":"Not logged today", c:logged?"var(--green)":"var(--amber)"};
}
function readForge(){
  var s=J("forge:sessions:v2",[]);
  if(!Array.isArray(s)||!s.length) return {v:"\u2014",s:"No sessions",c:"var(--dim)"};
  var wk=new Date(); wk.setDate(wk.getDate()-6); wk.setHours(0,0,0,0);
  var n=s.filter(function(x){ var p=String(x.date).split("-"); return new Date(+p[0],+p[1]-1,+p[2])>=wk; }).length;
  return {v:n+"/wk", s:s.length+" sessions", c:n>0?"var(--green)":"var(--amber)"};
}
/* Chambers Wealth HQ folded into The Aqueduct (the Book tab); its legacy keys
   are still captured by the Vault's whole-origin backup. */
function readProspect(){
  var log=J("qc3_log",[]);
  if(!Array.isArray(log)) log=[];
  var t=todayISO();
  var sends=log.filter(function(a){ return (a.to==="messaged"||a.to==="followup") && String(a.ts||"").slice(0,10)===t; }).length;
  return {v:sends+"/20", s:sends>=20?"Target hit":"Sends today", c:sends>=20?"var(--green)":(sends>0?"var(--gold)":"var(--amber)")};
}
function readCadence(){
  var st=J("operationsCadence.v1",null);
  if(!st) return {v:"\u2014",s:"Not started",c:"var(--dim)"};
  var checks=st.checks||st.checked||{};
  var n=Object.keys(checks).filter(function(k){ return checks[k]; }).length;
  return {v:n?String(n):"0", s:"tasks checked", c:n>0?"var(--green)":"var(--amber)"};
}
function readHerald(){
  var s=J("herald:v1",null);
  if(!s) return {v:"\u2014",s:"Not started",c:"var(--dim)"};
  var pub=(s.videos||[]).filter(function(v){return v.status==="published";}).length;
  var leads=(s.leads||[]).length;
  return {v:pub+" pub", s:leads+" leads captured", c:"var(--cyan)"};
}
function readComm(){
  var reps=J("mc_reps",[]);
  if(!Array.isArray(reps)||!reps.length) return {v:"\u2014",s:"No drills yet",c:"var(--dim)"};
  var t=todayISO();
  var today=reps.filter(function(r){ return String(r.date||"").slice(0,10)===t; }).length;
  return {v:reps.length+" reps", s:today?"Drilled today":"Not drilled today", c:today?"var(--green)":"var(--amber)"};
}
function readAqueduct(){
  var w=J("aqueduct:v2",null)||J("aqueduct:v1",null);
  if(!w) return {v:"\u2014", s:"Not started", c:"var(--dim)"};
  if(w.pub && +w.pub.netMo>0){
    var bits=[];
    if(+w.pub.aum>0) bits.push("$"+(Math.round(+w.pub.aum/1e5)/10)+"M book");
    if(w.pub.spendMo!=null) bits.push("$"+Math.round(+w.pub.spendMo).toLocaleString()+" to spend");
    return {v:"$"+Math.round(+w.pub.netMo).toLocaleString()+"/mo", s:bits.join(" \u00b7 ")||"net take-home", c:"var(--cyan)"};
  }
  if(!(+w.aum>0)) return {v:"\u2014", s:"Not started", c:"var(--dim)"};
  var fee=(+w.feeRate||1)/100, ref=Math.max(0,Math.min(100,+w.refPct||0))/100;
  var rev=(+w.aum)*fee*(1-0.25*ref);
  var grid;
  if(w.gridMode==="low") grid=(+w.gridLow||35)/100;
  else if(w.gridMode==="high") grid=(+w.gridHigh||45)/100;
  else grid= rev>=(+w.cliffRev||650000) ? (+w.gridHigh||45)/100 : (+w.gridLow||35)/100;
  var gross=rev*grid;
  return {v:"$"+Math.round(gross/1000)+"K", s:"gross \u00b7 "+Math.round(grid*100)+"% grid", c:"var(--cyan)"};
}
/* The Summit folded into The Aqueduct (aqueduct:v2); its legacy key is
   still captured by the Vault's whole-origin backup. */
/* The Waterfall merged into The Aqueduct (aqueduct:v2); its legacy key is
   still captured by the Vault's whole-origin backup. */
function readMap(){
  var s=J("lifemap_v1",null);
  if(!s||!Array.isArray(s.projects)) return {v:"\u2014",s:"Not started",c:"var(--dim)"};
  var open=s.projects.filter(function(p){return p.status!=="Done";}).length;
  var over=s.projects.filter(function(p){
    if(p.status==="Done"||!p.due) return false;
    var q=String(p.due).split("-"); var d=new Date(+q[0],+q[1]-1,+q[2]); d.setHours(0,0,0,0);
    var t=new Date(); t.setHours(0,0,0,0);
    return d<t;
  }).length;
  return {v:open+" open", s:over?(over+" overdue"):"nothing overdue", c:over?"var(--amber)":"var(--green)"};
}

var TOOLS=[
  {g:"The Practice", items:[
    {f:"prospecting-command-center.html", n:"Prospecting Command Center", d:"The pipeline \u00b7 3,719 contacts", i:"\u25ce", c:"var(--gold)", r:readProspect},
    {f:"operations-cadence.html", n:"Operations Cadence", d:"Back-office rhythms", i:"\u21bb", c:"var(--green)", r:readCadence},
    {f:"the-herald.html", n:"The Herald", d:"Content \u00b7 lead generation", i:"\u2691", c:"var(--cyan)", r:readHerald}
  ]},
  {g:"The Person", items:[
    {f:"life-ledger.html", n:"Life Ledger", d:"Daily habits \u00b7 the season", i:"\u269c", c:"var(--gold)", r:readLedger},
    {f:"workout-forge.html", n:"The Forge", d:"Training \u00b7 live workouts", i:"\u2692", c:"var(--amber)", r:readForge},
    {f:"communication-trainer.html", n:"Master Communicator", d:"Speaking \u00b7 sales \u00b7 technical mastery", i:"\u25c8", c:"var(--violet)", r:readComm},
    {f:"life-map.html", n:"Life Map", d:"22 areas \u00b7 projects & chores", i:"\u2732", c:"var(--gold)", r:readMap},
    {f:"the-aqueduct.html", n:"The Aqueduct", d:"Money, end to end \u00b7 book, paycheque, plan, wealth", i:"\u25c8", c:"var(--cyan)", r:readAqueduct}
  ]}
];

/* ---------- The Vault: one backup for the whole suite ----------
   Every tool stores its data in this browser under its own keys. Clearing the
   browser wipes all eight at once, so the backup has to be all-or-nothing too.
   We snapshot the entire origin rather than a hand-written key list, so a tool
   that adds a new key later is still captured without touching this code. */
var LASTBK="atlas:lastBackup";
var TOOL_KEYS=[
  {n:"Life Ledger",              p:["lifeledger:"]},
  {n:"The Forge",                p:["forge:"]},
  {n:"Prospecting Command Center",p:["qc3_","qc_reengage"]},
  {n:"Operations Cadence",       p:["operationsCadence"]},
  {n:"The Herald",               p:["herald:"]},
  {n:"Master Communicator",      p:["mc_"]},
  {n:"Life Map",                 p:["lifemap_"]},
  {n:"The Aqueduct",             p:["aqueduct:","waterfall:","summit:","climb_"]}
];
function allKeys(){ var a=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k && k!=="__t") a.push(k); } }catch(e){} return a; }
function keysFor(t){ return allKeys().filter(function(k){ return t.p.some(function(pre){ return k.indexOf(pre)===0; }); }); }
function bytes(ks){ var n=0; ks.forEach(function(k){ try{ n+=(localStorage.getItem(k)||"").length; }catch(e){} }); return n; }
function fmtBytes(n){ return n<1024?(n+" B"):n<1048576?((n/1024).toFixed(0)+" KB"):((n/1048576).toFixed(1)+" MB"); }
function daysSinceBackup(){
  var v=null; try{ v=localStorage.getItem(LASTBK); }catch(e){}
  if(!v) return null;
  var t=Date.parse(v); if(isNaN(t)) return null;
  return Math.floor((Date.now()-t)/86400000);
}
function backupAll(){
  try{
    var data={};
    allKeys().forEach(function(k){ if(k===LASTBK) return; try{ data[k]=localStorage.getItem(k); }catch(e){} });
    var n=Object.keys(data).length;
    if(!n){ vaultMsg("Nothing to back up yet. Use a tool first.","bad"); return; }
    var payload={app:"atlas",version:1,exportedAt:new Date().toISOString(),keys:n,data:data};
    var blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="atlas-backup-"+todayISO()+".json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },600);
    try{ localStorage.setItem(LASTBK,new Date().toISOString()); }catch(e){}
    render();
  }catch(e){ vaultMsg("Backup failed: "+e.message,"bad"); }
}
/* iOS blocks confirm() and alert() in home-screen apps: they return instantly
   as if cancelled, so the restore silently did nothing on the phone. Every
   dialog here is now in-page. Restore arms on the first tap, fires on the
   second. */
var PENDING=null;   /* {data, n, src} waiting for the second tap */
function vaultMsg(txt,kind){
  var el=document.getElementById("vaultMsg"); if(!el) return;
  el.textContent=txt;
  el.style.color = kind==="bad" ? "var(--amber)" : (kind==="good" ? "var(--green)" : "var(--dim)");
}
function parseBackup(raw){
  try{
    var o=JSON.parse(raw);
    var d=(o && o.data) ? o.data : (o && typeof o==="object" && !o.data ? o : null);
    if(!d || typeof d!=="object" || !Object.keys(d).length) return null;
    return d;
  }catch(e){ return null; }
}
function armRestore(d,src){
  PENDING={data:d,n:Object.keys(d).length,src:src};
  render();
}
function applyRestore(){
  if(!PENDING) return;
  var d=PENDING.data, n=PENDING.n;
  var before={}; Object.keys(d).forEach(function(k){ before[k]=localStorage.getItem(k); });
  Object.keys(d).forEach(function(k){ try{ localStorage.setItem(k,d[k]); }catch(e){} });
  PENDING=null;
  render();
  vaultMsg("\u2713 Restored "+n+" keys. Every tool now holds the backed-up data.","good");
  undoToast("Restored "+n+" keys", function(){
    Object.keys(before).forEach(function(k){
      try{ if(before[k]===null) localStorage.removeItem(k); else localStorage.setItem(k,before[k]); }catch(e){}
    });
    render(); vaultMsg("Restore undone. This browser is back to what it had.","");
  });
}
function cancelRestore(){ PENDING=null; render(); vaultMsg("Restore cancelled. Nothing changed.",""); }
function restoreAll(file){
  var r=new FileReader();
  r.onload=function(){
    var d=parseBackup(r.result);
    if(!d){ vaultMsg("That is not an Atlas backup file.","bad"); return; }
    armRestore(d,"file");
  };
  r.onerror=function(){ vaultMsg("Could not read that file.","bad"); };
  r.readAsText(file);
}
/* Clipboard transfer: no file to shuttle between devices. */
function copyVault(){
  try{
    var payload={app:"atlas",v:1,at:new Date().toISOString(),data:{}};
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k===LASTBK) continue;
      payload.data[k]=localStorage.getItem(k);
    }
    var txt=JSON.stringify(payload);
    var done=function(){
      try{ localStorage.setItem(LASTBK,new Date().toISOString()); }catch(e){}
      render();
      vaultMsg("\u2713 Whole suite copied ("+fmtBytes(txt.length)+"). Paste it into the Vault on the other device.","good");
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopy(txt,done); });
    } else fallbackCopy(txt,done);
  }catch(e){ vaultMsg("Copy failed: "+e.message,"bad"); }
}
function fallbackCopy(txt,done){
  var ta=document.createElement("textarea");
  ta.value=txt; ta.style.cssText="position:fixed;left:-9999px;top:0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ vaultMsg("Copy failed. Use the file backup instead.","bad"); }
  ta.remove();
}
function pasteVault(){
  var el=document.getElementById("vaultPaste");
  var raw=(el && el.value || "").trim();
  if(!raw){ vaultMsg("Paste the copied text into the box first.","bad"); return; }
  var d=parseBackup(raw);
  if(!d){ vaultMsg("That text is not a valid Atlas backup.","bad"); return; }
  armRestore(d,"paste");
}
var __vt=null;
function undoToast(msg, restore){
  var t=document.getElementById("undoToast");
  if(!t){ t=document.createElement("div"); t.id="undoToast"; document.body.appendChild(t); }
  t.style.cssText="position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:95;"
   +"background:rgba(20,23,38,.97);border:1px solid rgba(240,183,62,.5);color:#f6e2ad;padding:10px 16px;border-radius:12px;"
   +"font-family:inherit;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.55);display:flex;align-items:center;gap:12px;max-width:92vw";
  t.textContent="";
  var sp=document.createElement("span"); sp.textContent=msg; t.appendChild(sp);
  if(restore){
    var b=document.createElement("button"); b.textContent="Undo";
    b.style.cssText="background:rgba(240,183,62,.16);border:1px solid rgba(240,183,62,.5);color:#f0b73e;font-family:inherit;"
     +"font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer;flex-shrink:0";
    b.onclick=function(){ try{ restore(); }catch(e){} t.remove(); };
    t.appendChild(b);
  }
  clearTimeout(__vt); __vt=setTimeout(function(){ if(t&&t.parentNode) t.remove(); },9000);
}
function vaultPanel(){
  var live=TOOL_KEYS.map(function(t){ var ks=keysFor(t); return {n:t.n,k:ks.length,b:bytes(ks)}; });
  var used=live.filter(function(x){ return x.k>0; });
  var totalB=live.reduce(function(a,x){ return a+x.b; },0);
  var ds=daysSinceBackup();
  var warn = ds===null || ds>=7;

  var h='<div class="eyebrow" style="margin:22px 2px 9px">The Vault \u00b7 one backup, everything</div>';
  h+='<div style="padding:15px;border-radius:15px;background:linear-gradient(180deg,rgba(26,31,58,.9),rgba(20,24,48,.9));border:1px solid '+(warn?"rgba(240,104,62,.4)":"var(--line)")+'">';

  h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">';
  h+='<div style="min-width:0"><div style="font-size:13px;color:var(--txt);font-weight:600">'+used.length+' of '+TOOL_KEYS.length+' tools hold data</div>';
  h+='<div style="font-size:10.5px;color:'+(warn?"var(--amber)":"var(--dim)")+';margin-top:2px">'
     + (ds===null ? "Never backed up" : (ds===0 ? "Backed up today" : ("Last backup "+ds+" day"+(ds===1?"":"s")+" ago")))
     + ' \u00b7 '+fmtBytes(totalB)+'</div></div>';
  h+='<div class="mono" style="font-size:15px;font-weight:700;color:'+(warn?"var(--amber)":"var(--green)")+'">'+(warn?"\u26a0":"\u2713")+'</div>';
  h+='</div>';

  if(used.length){
    h+='<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:11px">';
    used.forEach(function(x){
      h+='<span style="font-size:9.5px;padding:3px 8px;border-radius:99px;background:rgba(47,209,128,.1);border:1px solid rgba(47,209,128,.28);color:var(--green);white-space:nowrap">'+esc(x.n)+'</span>';
    });
    h+='</div>';
  }

  if(PENDING){
    h+='<div style="margin-top:13px;padding:12px;border-radius:12px;background:rgba(240,104,62,.08);border:1px solid rgba(240,104,62,.45)">';
    h+='<div style="font-size:12px;color:#f6b39e;line-height:1.5;margin-bottom:9px">Restore <b>'+PENDING.n+' keys</b> across every tool?<br>This <b>overwrites</b> what this browser holds right now. If the newer work is here, back up first.</div>';
    h+='<div style="display:flex;gap:8px">';
    h+='<button onclick="applyRestore()" style="flex:1;padding:10px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;color:#0c0e1a;background:linear-gradient(180deg,#f6a06a,#e2622f)">Yes, overwrite</button>';
    h+='<button onclick="cancelRestore()" style="flex:1;padding:10px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line)">Cancel</button>';
    h+='</div></div>';
  }

  h+='<div style="display:flex;gap:8px;margin-top:13px">';
  h+='<button onclick="backupAll()" style="flex:1;padding:11px;border-radius:11px;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:#0c0e1a;background:linear-gradient(180deg,#f6cf6a,#e2a32f)">\u2913 Back up to file</button>';
  h+='<button onclick="document.getElementById(\'atlasRestore\').click()" style="flex:1;padding:11px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line)">\u2911 Restore from file</button>';
  h+='<input type="file" id="atlasRestore" accept="application/json,.json" style="display:none" onchange="if(this.files&&this.files[0])restoreAll(this.files[0])"/>';
  h+='</div>';

  h+='<div class="eyebrow" style="font-size:9px;margin:15px 0 7px">Device to device, no file</div>';
  h+='<div style="display:flex;gap:8px">';
  h+='<button onclick="copyVault()" style="flex:1;padding:10px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--cyan);background:rgba(69,200,216,.08);border:1px solid rgba(69,200,216,.35)">\u29c9 Copy the whole suite</button>';
  h+='<button onclick="pasteVault()" style="flex:1;padding:10px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--cyan);background:rgba(69,200,216,.08);border:1px solid rgba(69,200,216,.35)">\u2913 Load pasted suite</button>';
  h+='</div>';
  h+='<textarea id="vaultPaste" placeholder="Paste the copied suite here, then tap Load" style="width:100%;margin-top:8px;min-height:46px;background:rgba(10,12,22,.7);color:var(--txt);border:1px solid rgba(120,130,180,.25);border-radius:11px;font-family:monospace;font-size:10px;padding:9px;outline:none;resize:vertical"></textarea>';
  h+='<div id="vaultMsg" style="font-size:11px;color:var(--dim);margin-top:8px;min-height:15px;line-height:1.5"></div>';

  h+='<div style="font-size:10px;color:var(--dim);margin-top:6px;line-height:1.55">Data lives in each browser, not on GitHub, so devices do not sync themselves. Copy the suite on the device you just worked on, paste it on the other, and they match. Keep a file backup too: clearing your browser or Safari evicting site data wipes every tool at once.</div>';
  h+='</div>';
  return h;
}

function stats0(){
  var used=TOOL_KEYS.filter(function(t){ return keysFor(t).length>0; }).length;
  return {used:used, ds:daysSinceBackup()};
}
function backupBanner(st){
  if(!st.used) return '';                 // nothing to lose yet
  if(st.ds!==null && st.ds<7) return '';  // backed up recently
  var never = st.ds===null;
  var h='<div style="padding:13px 14px;border-radius:14px;margin-bottom:14px;background:rgba(240,104,62,.09);border:1px solid rgba(240,104,62,.45);display:flex;align-items:center;gap:11px">';
  h+='<span style="font-size:17px;flex-shrink:0">\u26a0</span>';
  h+='<div style="flex:1;min-width:0">';
  h+='<div style="font-size:12.5px;color:#f6d0be;font-weight:600;line-height:1.3">'+(never?"Your data has never been backed up":("Last backup was "+st.ds+" days ago"))+'</div>';
  h+='<div style="font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4">'+(st.used===1?"1 tool holds data in this browser":("All "+st.used+" tools live in this browser"))+'. One clear and it is gone.</div>';
  h+='</div>';
  h+='<button onclick="backupAll()" style="flex-shrink:0;padding:8px 13px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:700;color:#0c0e1a;background:linear-gradient(180deg,#f6cf6a,#e2a32f)">Back up</button>';
  h+='</div>';
  return h;
}
function render(){
  var st=stats0();
  var h='';
  h+='<div class="appbar"><div style="min-width:0">';
  h+='<div class="appbar-title">The Atlas</div><div class="appbar-sub">Everything is connected</div></div>';
  var lg=readLedger();
  h+='<div class="appbar-pill">'+esc(lg.v)+'</div></div>';

  h+='<div style="text-align:center;margin-bottom:16px"><div style="font-size:12px;color:var(--muted);font-style:italic;line-height:1.45">Eight tools, one life. Tap in.</div></div>';

  h+=backupBanner(st);

  TOOLS.forEach(function(grp){
    h+='<div class="eyebrow" style="margin:18px 2px 9px">'+esc(grp.g)+'</div>';
    h+='<div style="display:flex;flex-direction:column;gap:9px">';
    grp.items.forEach(function(t){
      var st={v:"\u2014",s:"",c:"var(--dim)"};
      try{ st=t.r()||st; }catch(e){}
      h+='<a class="tool" href="'+t.f+'">';
      h+='<div class="ic" style="background:radial-gradient(circle at 30% 25%,'+t.c+'33,transparent 72%);border:1px solid '+t.c+'55;color:'+t.c+'">'+t.i+'</div>';
      h+='<div style="flex:1;min-width:0">';
      h+='<div style="font-size:14px;font-weight:600;color:var(--txt);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.n)+'</div>';
      h+='<div style="font-size:10.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.d)+'</div>';
      h+='</div>';
      h+='<div style="text-align:right;flex-shrink:0"><div class="stat" style="color:'+st.c+'">'+esc(st.v)+'</div>';
      if(st.s) h+='<div style="font-size:9px;color:var(--dim);margin-top:2px;white-space:nowrap">'+esc(st.s)+'</div>';
      h+='</div>';
      h+='<span class="chev">\u203a</span>';
      h+='</a>';
    });
    h+='</div>';
  });

  h+=vaultPanel();

  h+='<div class="mono" style="text-align:center;margin-top:16px;font-size:10px;color:#4e5573">Quinton Chambers \u00b7 Everything is connected. So the advice has to be too.</div>';

  document.getElementById("app").innerHTML=h;
}
render();
/* Re-read when you come back from a tool, so the numbers are never stale. */
document.addEventListener("visibilitychange",function(){ if(!document.hidden) render(); });
window.addEventListener("pageshow",function(){ render(); });
window.addEventListener("focus",render);

/* Ask the browser to treat this data as persistent. Browsers evict storage from
   sites you have not visited recently, and all eight tools live in that storage.
   This is a request, not a guarantee, which is why the Vault backup still matters. */
(function(){
  try{
    if(navigator.storage && navigator.storage.persist && navigator.storage.persisted){
      navigator.storage.persisted().then(function(already){
        if(!already) navigator.storage.persist();
      }).catch(function(){});
    }
  }catch(e){}
})();


/* ---------- in-page dialogs ----------
   iOS blocks confirm(), prompt() and alert() inside home-screen web apps: they
   return instantly as if cancelled, so any button behind one silently does
   nothing. Everything here renders in the page instead. */
function uiClose(){ var o=document.getElementById("uiDlg"); if(o) o.remove(); }
function uiShell(inner){
  uiClose();
  var w=document.createElement("div");
  w.id="uiDlg";
  w.style.cssText="position:fixed;inset:0;z-index:9000;background:rgba(6,7,14,.72);backdrop-filter:blur(3px);"
   +"display:flex;align-items:center;justify-content:center;padding:18px";
  w.innerHTML='<div style="max-width:420px;width:100%;background:#141830;border:1px solid rgba(120,130,180,.28);'
   +'border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);font-family:inherit;color:#eef0fb;'
   +'max-height:86vh;overflow-y:auto">'+inner+'</div>';
  w.addEventListener("click",function(e){ if(e.target===w) uiClose(); });
  document.body.appendChild(w);
  return w;
}
function uiNote(msg){
  uiShell('<div style="font-size:13.5px;line-height:1.55;margin-bottom:14px">'+msg+'</div>'
   +'<button id="uiOk" style="width:100%;padding:11px;border-radius:11px;border:none;cursor:pointer;font-family:inherit;'
   +'font-size:13px;font-weight:700;color:#0c0e1a;background:linear-gradient(180deg,#f6cf6a,#e2a32f)">OK</button>');
  document.getElementById("uiOk").onclick=uiClose;
}
function uiConfirm(title, body, okLabel, onOk, danger){
  var col=danger?"linear-gradient(180deg,#f6889e,#e2456a)":"linear-gradient(180deg,#f6cf6a,#e2a32f)";
  uiShell('<div style="font-size:15px;font-weight:700;margin-bottom:6px">'+title+'</div>'
   +(body?'<div style="font-size:12.5px;line-height:1.55;color:#9aa2c0;margin-bottom:14px">'+body+'</div>':'<div style="height:8px"></div>')
   +'<div style="display:flex;gap:8px">'
   +'<button id="uiCancel" style="flex:1;padding:11px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:12.5px;'
   +'font-weight:600;color:#9aa2c0;background:rgba(255,255,255,.05);border:1px solid rgba(120,130,180,.25)">Cancel</button>'
   +'<button id="uiOk" style="flex:1;padding:11px;border-radius:11px;border:none;cursor:pointer;font-family:inherit;'
   +'font-size:12.5px;font-weight:700;color:#0c0e1a;background:'+col+'">'+(okLabel||"Confirm")+'</button></div>');
  document.getElementById("uiCancel").onclick=uiClose;
  document.getElementById("uiOk").onclick=function(){ uiClose(); try{ onOk(); }catch(e){} };
}
/* fields: [{k,label,type:'text'|'number'|'date'|'select',value,options:[[val,label]]}]
   onOk receives an object keyed by k. Returning false keeps the sheet open. */
function uiAsk(title, fields, onOk, okLabel){
  var body='<div style="font-size:15px;font-weight:700;margin-bottom:12px">'+title+'</div>';
  fields.forEach(function(f){
    var st="width:100%;background:rgba(10,12,22,.7);color:#eef0fb;border:1px solid rgba(120,130,180,.28);"
      +"border-radius:10px;padding:10px 11px;font-size:14px;outline:none;margin-top:5px;-webkit-appearance:none;min-height:44px";
    body+='<div style="margin-bottom:11px"><label style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;'
      +'color:#8089a8;font-weight:600">'+f.label+'</label>';
    if(f.type==="select"){
      body+='<select id="uiF_'+f.k+'" style="'+st+'">'+(f.options||[]).map(function(o){
        return '<option value="'+String(o[0]).replace(/"/g,"&quot;")+'"'+(String(f.value)===String(o[0])?" selected":"")+'>'+o[1]+'</option>';
      }).join("")+'</select>';
    } else {
      body+='<input id="uiF_'+f.k+'" type="'+(f.type||"text")+'"'
        +(f.type==="number"?' inputmode="decimal"':'')
        +' value="'+String(f.value==null?"":f.value).replace(/"/g,"&quot;")+'" style="'+st+'"/>';
    }
    body+='</div>';
  });
  body+='<div id="uiErr" style="font-size:11.5px;color:#f0683e;min-height:14px;margin-bottom:8px"></div>';
  body+='<div style="display:flex;gap:8px">'
   +'<button id="uiCancel" style="flex:1;padding:11px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:12.5px;'
   +'font-weight:600;color:#9aa2c0;background:rgba(255,255,255,.05);border:1px solid rgba(120,130,180,.25)">Cancel</button>'
   +'<button id="uiOk" style="flex:1;padding:11px;border-radius:11px;border:none;cursor:pointer;font-family:inherit;'
   +'font-size:12.5px;font-weight:700;color:#0c0e1a;background:linear-gradient(180deg,#f6cf6a,#e2a32f)">'+(okLabel||"Save")+'</button></div>';
  uiShell(body);
  document.getElementById("uiCancel").onclick=uiClose;
  document.getElementById("uiOk").onclick=function(){
    var out={};
    fields.forEach(function(f){ var el=document.getElementById("uiF_"+f.k); out[f.k]=el?el.value:""; });
    var res;
    try{ res=onOk(out); }catch(e){ res=undefined; }
    if(res===false){ return; }
    uiClose();
  };
  var first=document.getElementById("uiF_"+fields[0].k);
  if(first){ first.focus(); if(first.select) first.select(); }
}
function uiErr(msg){ var e=document.getElementById("uiErr"); if(e) e.textContent=msg; }

</script>
</body>
