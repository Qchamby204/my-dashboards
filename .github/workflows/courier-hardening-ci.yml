name: Courier hardening CI

on:
  push:
    branches: [courier-hardening-2026-09-14]
    paths:
      - scripts/courier/**
      - .github/workflows/courier-hardening-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests mutagen
      - run: python -m unittest discover -s scripts/courier/tests
      - run: python -m py_compile scripts/courier/*.py
