name: Courier Repeat CI

on:
  push:
    branches: [courier-repeat-fix-20260916]
    paths:
      - scripts/courier/**
      - .github/workflows/courier-repeat-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install feedparser requests mutagen
      - name: Run Courier safeguards
        run: python -m unittest discover -s scripts/courier/tests -p 'test_*.py'
      - name: Compile Courier modules
        run: python -m py_compile scripts/courier/*.py
