name: Review CI

on:
  push:
    branches: [review-v1]
    paths:
      - review.html
      - index.html
      - shared/atlas-activity-core.mjs
      - shared/atlas-activity.js
      - shared/atlas-mobile.js
      - shared/review.css
      - shared/review.js
      - atlas/tests/review.test.mjs
      - .github/workflows/review-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check shared/atlas-activity-core.mjs
      - run: node --check shared/atlas-activity.js
      - run: node --check shared/atlas-mobile.js
      - run: node --check shared/review.js
