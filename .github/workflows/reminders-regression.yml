name: Reminder regression checks
on:
  push:
    branches: [main]
    paths: ['.github/actions/setup-test-browsers/**', '.github/scripts/install-test-browsers.mjs', '.github/browser-tooling.json', 'reminders-service/**', 'shared/reminder*', 'reminders*', 'atlas/tests/reminders*', '.github/workflows/reminders-regression.yml']
  pull_request:
    paths: ['.github/actions/setup-test-browsers/**', '.github/scripts/install-test-browsers.mjs', '.github/browser-tooling.json', 'reminders-service/**', 'shared/reminder*', 'reminders*', 'atlas/tests/reminders*', '.github/workflows/reminders-regression.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix reminders-service --ignore-scripts
      - run: npm test --prefix reminders-service
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: ${{ matrix.engine }}
      - run: node atlas/tests/reminders.browser.mjs
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reminders-${{ matrix.engine }}
          path: artifacts/reminders
