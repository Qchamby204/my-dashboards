name: Reminder regression checks
on:
  push:
    branches: [main]
    paths: ['reminders-service/**', 'shared/reminder*', 'reminders*', 'atlas/tests/reminders*', '.github/workflows/reminders-regression.yml']
  pull_request:
    paths: ['reminders-service/**', 'shared/reminder*', 'reminders*', 'atlas/tests/reminders*', '.github/workflows/reminders-regression.yml']
permissions:
  contents: read
jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix reminders-service --ignore-scripts
      - run: npm test --prefix reminders-service
      - run: |
          npm install --prefix /tmp/atlas-browser --no-save playwright
          /tmp/atlas-browser/node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - run: node atlas/tests/reminders.browser.mjs
        env:
          NODE_PATH: /tmp/atlas-browser/node_modules
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reminders-${{ matrix.engine }}
          path: artifacts/reminders
