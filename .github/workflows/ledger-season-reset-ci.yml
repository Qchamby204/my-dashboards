name: Ledger Season Reset CI

on:
  push:
    branches: [ledger-season-reset-20260915]
    paths:
      - shared/ledger-season-reset-20260915.js
      - shared/ledger-reward-hotfix-20260916.js
      - atlas/tests/ledger-season-reset.test.mjs
      - atlas/tests/ledger-original.test.mjs
      - atlas/tests/ledger-reward-animation.test.mjs
      - .github/workflows/ledger-season-reset-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify Life Ledger season reset
        run: node --test atlas/tests/ledger-season-reset.test.mjs atlas/tests/ledger-original.test.mjs atlas/tests/ledger-reward-animation.test.mjs
      - run: node --check shared/ledger-season-reset-20260915.js
      - run: node --check shared/ledger-reward-hotfix-20260916.js
