name: The Courier daily briefing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/courier.yml
      - scripts/courier/publication.py
  schedule:
    # Off-hour schedules reduce contention; scheduled execution can still be delayed.
  - cron: "17 10 * * 1-5"
  - cron: "43 11 * * 1-5"  # backstop: reuse generated content, always check publication
  workflow_dispatch:
    inputs:
      publish_only:
        description: Verify and republish the latest existing edition without generating content
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: courier-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The backstop reuses existing content. Manual dispatch rebuilds unless
      # publish_only is selected; publishing-code pushes only verify existing content.
      - name: Has today already been built?
        id: today
        env:
          PUBLISH_ONLY: ${{ inputs.publish_only || github.event_name == 'push' }}
        run: |
          TODAY=$(date -u -d '5 hours ago' +%F)
          if [ "$PUBLISH_ONLY" = "true" ]; then
            TODAY=$(python scripts/courier/publication.py latest)
          fi
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          BUILT=$(python scripts/courier/publication.py check --date "$TODAY")
          echo "built=$BUILT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests
        if: github.event_name != 'push' && inputs.publish_only != true && (steps.today.outputs.built != 'yes' || github.event_name == 'workflow_dispatch')

      - name: Build today's briefing
        if: github.event_name != 'push' && inputs.publish_only != true && (steps.today.outputs.built != 'yes' || github.event_name == 'workflow_dispatch')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE }}
          OPENAI_TTS_INSTRUCTIONS: ${{ vars.OPENAI_TTS_INSTRUCTIONS }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY }}
          ELEVENLABS_STYLE: ${{ vars.ELEVENLABS_STYLE }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          COURIER_MAIL_USER: ${{ secrets.COURIER_MAIL_USER }}
          COURIER_MAIL_PASSWORD: ${{ secrets.COURIER_MAIL_PASSWORD }}
          REPO: ${{ github.repository }}
        run: python scripts/courier/build.py

      - name: Publish audio to the courier-audio branch
        if: github.event_name != 'push' && inputs.publish_only != true && (steps.today.outputs.built != 'yes' || github.event_name == 'workflow_dispatch')
        env:
          REPO: ${{ github.repository }}
          COURIER_DATE: ${{ steps.today.outputs.date }}
        run: |
          git config user.name "courier-bot"
          git config user.email "courier-bot@users.noreply.github.com"
          rm -rf /tmp/audio && mkdir -p /tmp/audio
          # keep the previous days that the manifest still references
          if git fetch origin courier-audio 2>/dev/null; then
            git --work-tree=/tmp/audio checkout origin/courier-audio -- . 2>/dev/null || true
          fi
          for d in $(ls out | grep -E '^[0-9]{4}-'); do rm -rf /tmp/audio/$d; cp -r out/$d /tmp/audio/$d; done
          for d in $(ls /tmp/audio); do grep -qx "$d" out/keep-days.txt || rm -rf /tmp/audio/$d; done
          cd /tmp/audio && git init -q && git checkout -q --orphan courier-audio && git add -A
          git -c user.name=courier-bot -c user.email=courier-bot@users.noreply.github.com commit -q -m "Courier audio $(date -u +%F)"
          AUDIO_SHA=$(git rev-parse HEAD)
          # Reuse checkout's scoped credential without putting a token in a remote URL.
          AUTH_HEADER=$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push -q -f "https://github.com/${{ github.repository }}.git" courier-audio
          cd "$GITHUB_WORKSPACE" && git reset -q
          # Immutable URLs prevent a same-day rebuild from playing cached older audio.
          python scripts/courier/publication.py pin --date "$COURIER_DATE" --audio-sha "$AUDIO_SHA"

      - name: Commit manifest
        if: github.event_name != 'push' && inputs.publish_only != true && (steps.today.outputs.built != 'yes' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "courier-bot"
          git config user.email "courier-bot@users.noreply.github.com"
          git add courier/manifest.json courier/feed.xml courier/progress.json
          git diff --cached --quiet || git commit -m "Courier: $(date -u +%F)"
          # A dashboard edit may land while generation runs. Rebase instead of losing it.
          git pull --rebase origin main
          git push origin HEAD:main

      # GITHUB_TOKEN commits do not trigger the normal Pages build. Request it explicitly,
      # including on backstop runs where content already exists, then verify what is live.
      - name: Publish and verify the live edition
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COURIER_DATE: ${{ steps.today.outputs.date }}
        run: python scripts/courier/publication.py publish --date "$COURIER_DATE"
