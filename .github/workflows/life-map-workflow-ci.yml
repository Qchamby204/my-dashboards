name: Life Map baseline verification
on:
  push:
    branches: [life-map-workflow-20260917]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b1c804a317b644c9c5e62afe2331bf01040a9f09
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact base and upgraded sources
        run: |
          for dir in baseline candidate; do
            (cd "$dir" && npm ci --ignore-scripts && npm run build)
          done
      - name: Strict Life Map and shared regression gate
        working-directory: candidate
        run: |
          mkdir -p artifacts/life-map-baseline
          node --test atlas/tests/life-map-*.test.mjs atlas/tests/connected-*.test.mjs atlas/tests/appearance.test.mjs atlas/tests/mobile-baseline.test.mjs atlas/tests/refinements.test.mjs atlas/tests/review.test.mjs | tee artifacts/life-map-baseline/focused-tests.txt
      - name: Compare full-suite failures against unchanged base
        run: |
          mkdir -p candidate/artifacts/life-map-baseline
          (cd baseline && npm test > ../candidate/artifacts/life-map-baseline/baseline-tests.txt 2>&1) || echo 'Base suite has failures; comparing exact test names below.'
          (cd candidate && npm test > artifacts/life-map-baseline/candidate-tests.txt 2>&1) || echo 'Candidate suite has failures; comparing exact test names below.'
          python - <<'PY'
          import pathlib,re,json
          root=pathlib.Path('candidate/artifacts/life-map-baseline')
          def failures(name):
              text=(root/name).read_text()
              tests=re.search(r'^# tests (\d+)$',text,re.M)
              fail=re.search(r'^# fail (\d+)$',text,re.M)
              if not tests or not fail:raise RuntimeError('Test suite did not finish')
              names=re.findall(r'^not ok \d+ - (.+)$',text,re.M)
              if len(names)!=int(fail.group(1)):raise RuntimeError('Failure report is incomplete')
              return int(tests.group(1)),set(names)
          b,bf=failures('baseline-tests.txt');c,cf=failures('candidate-tests.txt')
          extra=sorted(cf-bf)
          result={'baselineTests':b,'baselineFailures':sorted(bf),'candidateTests':c,'candidateFailures':sorted(cf),'newFailures':extra}
          (root/'comparison.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          if extra:raise RuntimeError('New full-suite failures were introduced')
          print('No new failures compared with unchanged main. Existing failures remain explicit in this report.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: life-map-baseline-report
          path: candidate/artifacts/life-map-baseline/
          retention-days: 7
