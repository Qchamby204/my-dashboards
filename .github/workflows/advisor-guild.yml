name: Advisor Guild checks
on:
  push:
    branches: [main]
    paths: ['advisor-guild*', 'shared/advisor*', 'shared/record-guard.js', 'shared/atlas-theme.js', 'shared/atlas-neumorphism.css', 'shared/atlas-palette.css', 'atlas/tests/advisor-guild*', '.github/workflows/advisor-guild.yml']
  pull_request:
    paths: ['advisor-guild*', 'shared/advisor*', 'shared/record-guard.js', 'shared/atlas-theme.js', 'shared/atlas-neumorphism.css', 'shared/atlas-palette.css', 'atlas/tests/advisor-guild*', '.github/workflows/advisor-guild.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  advisor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test atlas/tests/advisor-guild.test.mjs
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Check Advisor Guild records and responsive screens
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/advisor-guild
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node atlas/tests/advisor-guild.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advisor-guild-${{ matrix.engine }}
          path: artifacts/advisor-guild
