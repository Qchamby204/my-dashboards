name: Library regression checks
on:
  push:
    branches: [main]
    paths:
      - 'the-library.html'
      - 'library.webmanifest'
      - 'shared/library*'
      - 'shared/icons/library*'
      - 'shared/icons/catalog.json'
      - 'atlas/sync-icons.mjs'
      - 'atlas/tests/library-install.test.mjs'
      - '.github/workflows/library-regression.yml'
  pull_request:
    paths:
      - 'the-library.html'
      - 'library.webmanifest'
      - 'shared/library*'
      - 'shared/icons/library*'
      - 'shared/icons/catalog.json'
      - 'atlas/sync-icons.mjs'
      - 'atlas/tests/library-install.test.mjs'
      - '.github/workflows/library-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test atlas/tests/library-install.test.mjs
