name: Library regression checks
on:
  push:
    branches: [main]
    paths:
      - '.github/actions/setup-test-browsers/**'
      - '.github/scripts/install-test-browsers.mjs'
      - '.github/browser-tooling.json'
      - 'the-library.html'
      - 'library.webmanifest'
      - 'shared/library*'
      - 'shared/icons/library*'
      - 'shared/icons/catalog.json'
      - 'atlas/sync-icons.mjs'
      - 'atlas/tests/library-*'
      - '.github/workflows/library-regression.yml'
  pull_request:
    paths:
      - '.github/actions/setup-test-browsers/**'
      - '.github/scripts/install-test-browsers.mjs'
      - '.github/browser-tooling.json'
      - 'the-library.html'
      - 'library.webmanifest'
      - 'shared/library*'
      - 'shared/icons/library*'
      - 'shared/icons/catalog.json'
      - 'atlas/sync-icons.mjs'
      - 'atlas/tests/library-*'
      - '.github/workflows/library-regression.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test atlas/tests/library-*.test.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: ${{ matrix.browser }}
      - run: NODE_PATH="${{ steps.browsers.outputs.node-path }}" LIBRARY_BROWSER=${{ matrix.browser }} node atlas/tests/library-interactions.browser.mjs
