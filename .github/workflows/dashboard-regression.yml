name: Dashboard regression checks
on:
  push:
    branches: [main]
    paths:
      - '.github/actions/setup-test-browsers/**'
      - '.github/scripts/install-test-browsers.mjs'
      - '.github/browser-tooling.json'
      - 'atlas/**'
      - 'northplan/**'
      - 'yourwealth/**'
      - 'shared/**'
      - '*.html'
      - '*.webmanifest'
      - 'drizzle/**'
      - 'package*.json'
      - '.github/workflows/dashboard-regression.yml'
  pull_request:
    paths:
      - '.github/actions/setup-test-browsers/**'
      - '.github/scripts/install-test-browsers.mjs'
      - '.github/browser-tooling.json'
      - 'atlas/**'
      - 'northplan/**'
      - 'yourwealth/**'
      - 'shared/**'
      - '*.html'
      - '*.webmanifest'
      - 'drizzle/**'
      - 'package*.json'
      - '.github/workflows/dashboard-regression.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  core-large-text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Verify core views at 200 percent text and increased contrast
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/core-large-text
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node atlas/tests/core-large-text.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-large-text-${{ matrix.engine }}
          path: artifacts/core-large-text
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:generated
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: chromium
      - name: Check suite views and saves in Chromium
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/dashboard-experience
        run: |
          node atlas/tests/dashboard-experience.browser.mjs
          node atlas/tests/runtime-idle.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-experience
          path: artifacts/dashboard-*
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {theme: light, width: 393, textSize: 16}
          - {theme: dark, width: 393, textSize: 16}
          - {theme: dark, width: 320, textSize: 16}
          - {theme: light, width: 844, textSize: 16}
          - {theme: dark, width: 393, textSize: 20}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:generated
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: chromium
      - name: Check populated screens and editors
        timeout-minutes: 8
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/dashboard-layout
          ATLAS_LAYOUT_CASE: '["${{ matrix.theme }}", ${{ matrix.width }}, ${{ matrix.textSize }}]'
        run: node atlas/tests/dashboard-layout.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-layout-${{ matrix.theme }}-${{ matrix.width }}-${{ matrix.textSize }}
          path: artifacts/dashboard-layout

  life-map-craft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:generated
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Verify every Life Map opening, category, editor and task journey
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/life-map-craft
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node atlas/tests/life-map-craft.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: life-map-craft-${{ matrix.engine }}
          path: artifacts/life-map-craft

  forge-craft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:generated
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Verify every Forge opening, goal editor and regular workout
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/forge-craft
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node atlas/tests/forge-craft.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-craft-${{ matrix.engine }}
          path: artifacts/forge-craft

  communicator-craft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:generated
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Verify every Communicator opening, reference and saved practice
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/communicator-craft
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node atlas/tests/communicator-craft.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: communicator-craft-${{ matrix.engine }}
          path: artifacts/communicator-craft

  content-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:generated
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Check cards and standalone phone layouts
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/card-hierarchy
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          node atlas/tests/card-hierarchy.browser.mjs
          node atlas/tests/chef-openings.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-cards-${{ matrix.engine }}
          path: artifacts/card-hierarchy

  core-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:generated
      - uses: ./.github/actions/setup-test-browsers
        id: browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Verify core app saves, drafts, keyboard and accessible chrome
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/core-acceptance
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          node atlas/tests/core-acceptance.browser.mjs
          node atlas/tests/ledger-sections.browser.mjs
          node atlas/tests/ledger-updates.browser.mjs
          node atlas/tests/private-assets.browser.mjs
          node atlas/tests/map-forge-flow.browser.mjs
          node atlas/tests/communicator-learning.browser.mjs
          node atlas/tests/storage-recovery.browser.mjs
          node atlas/tests/planning-release.browser.mjs
          node atlas/tests/suite-accessibility.browser.mjs
      - name: Verify saving, failed-save recovery and feedback materials
        if: ${{ !cancelled() }}
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/core-acceptance
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node atlas/tests/core-feedback.browser.mjs
      - name: Verify floating navigation and scroll behavior across the suite
        env:
          NODE_PATH: ${{ steps.browsers.outputs.node-path }}
          ATLAS_SCREENSHOTS: artifacts/glass-navigation
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node atlas/tests/glass-navigation.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-acceptance-${{ matrix.engine }}
          path: artifacts/core-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-navigation-${{ matrix.engine }}
          path: artifacts/glass-navigation
