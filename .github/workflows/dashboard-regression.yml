name: Dashboard regression checks
on:
  push:
    branches: [main]
    paths:
      - 'atlas/**'
      - 'shared/**'
      - '*.html'
      - '*.webmanifest'
      - 'drizzle/**'
      - 'package*.json'
      - '.github/workflows/dashboard-regression.yml'
  pull_request:
    paths:
      - 'atlas/**'
      - 'shared/**'
      - '*.html'
      - '*.webmanifest'
      - 'drizzle/**'
      - 'package*.json'
      - '.github/workflows/dashboard-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: npm test
      - name: Install browser checks
        run: |
          npm install --prefix /tmp/atlas-browser --no-save playwright
          /tmp/atlas-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check suite views and saves in Chromium
        env:
          NODE_PATH: /tmp/atlas-browser/node_modules
          ATLAS_SCREENSHOTS: artifacts/dashboard-experience
        run: node atlas/tests/dashboard-experience.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-experience
          path: artifacts/dashboard-experience
