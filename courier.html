<!DOCTYPE html>
<html class="atlas-neumo" data-atlas-app="courier" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Courier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="shared/atlas-theme.js"></script>
<style>
  :root{
    --void:#0A0E11; --deep:#0E1418; --surface:#141D22;
    --bone:#ECE7DE; --mute:#7E8F93;
    --faint:rgba(236,231,222,.10); --fainter:rgba(236,231,222,.06);
    --ember:#E1743C; --jade:#7FA98C;
    --ui:"Instrument Sans",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --ed:"Newsreader",Georgia,"Times New Roman",serif;
    --data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --shell:1120px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--void); color:var(--bone); font-family:var(--ui);
        font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:var(--data); }

  /* masthead */
  header{ max-width:var(--shell); margin:0 auto; padding:44px 32px 26px;
          display:flex; align-items:flex-end; justify-content:space-between; gap:28px; flex-wrap:wrap; }
  h1{ margin:0; font-family:var(--ed); font-optical-sizing:auto; font-weight:400;
      font-size:34px; letter-spacing:-.015em; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  h1 small{ font-family:var(--data); font-size:10px; font-weight:400; letter-spacing:.15em;
            text-transform:uppercase; color:var(--mute); }
  .bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .bar label{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--mute); }

  select,button,input[type=file]{ font:inherit; }
  select,button{ font-family:var(--ui); font-size:13px; font-weight:500; color:var(--bone);
    background:transparent; border:1px solid var(--faint); border-radius:2px;
    padding:8px 13px; cursor:pointer;
    transition:border-color .15s ease,color .15s ease,background .15s ease; }
  button:hover,select:hover{ border-color:rgba(236,231,222,.28); }
  button.primary{ background:var(--ember); border-color:var(--ember); color:#160B05; font-weight:600; }
  button.primary:hover{ background:#EC8149; border-color:#EC8149; }
  button.ghost{ border-color:transparent; color:var(--mute); padding:8px 7px; }
  button.ghost:hover{ color:var(--bone); }
  :where(a,button,select,input,[tabindex]):focus-visible{ outline:2px solid var(--ember); outline-offset:3px; }

  /* layout */
  main{ max-width:var(--shell); margin:0 auto; padding:0 32px 190px;
        display:grid; grid-template-columns:196px 1fr; gap:72px; align-items:start; }
  .rail{ position:sticky; top:36px; }
  .feed{ min-width:0; }

  /* time rail */
  .rail-total{ font-family:var(--data); font-size:26px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .rail-cap{ font-family:var(--data); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
             color:var(--mute); margin-top:5px; }
  .axis{ position:relative; margin:26px 0 0; padding-left:44px; height:520px; }
  .tick{ position:absolute; left:0; width:52px; display:flex; align-items:center; gap:8px; pointer-events:none; }
  .tick span{ font-family:var(--data); font-size:10px; color:var(--mute); opacity:.75;
              font-variant-numeric:tabular-nums; width:36px; }
  .tick i{ flex:1; height:1px; background:var(--fainter); }
  .ladder{ position:relative; list-style:none; margin:0; padding:0; height:100%;
           display:flex; flex-direction:column; gap:2px; width:11px; }
  .rung{ flex-grow:var(--m); flex-basis:0; background:rgba(236,231,222,.13); border-radius:1px;
         cursor:pointer; transition:background .18s ease,transform .18s ease; transform-origin:left center; }
  .rung:hover{ background:rgba(236,231,222,.34); transform:scaleX(1.5); }
  .rung.done{ background:rgba(127,169,140,.42); }
  .rung.live{ background:var(--ember); transform:scaleX(1.9); }
  .rail-now{ margin-top:22px; font-family:var(--data); font-size:10px; letter-spacing:.13em;
             text-transform:uppercase; color:var(--mute); line-height:1.75; }
  .rail-now b{ display:block; color:var(--ember); font-weight:500; }
  .rail-now .idle{ display:block; color:rgba(236,231,222,.55); }

  /* notices */
  .notice{ border-left:2px solid var(--ember); background:rgba(225,116,60,.06);
           padding:12px 16px; margin:0 0 22px; color:var(--bone); font-size:14px; }

  /* dispatches */
  .block{ border-top:1px solid var(--fainter); }
  .block:first-child{ border-top:0; }
  .head{ display:grid; grid-template-columns:46px 1fr; gap:22px;
         padding:30px 0 32px; cursor:pointer; align-items:start; }
  .block:first-child .head{ padding-top:4px; }
  .block.open .head{ padding-bottom:22px; }
  .seat{ padding-top:3px; }

  .play{ width:42px; height:42px; border-radius:50%; padding:0;
         border:1px solid rgba(236,231,222,.22); background:transparent; color:var(--bone);
         display:grid; place-items:center; font-size:11px;
         transition:border-color .16s ease,background .16s ease,color .16s ease; }
  .play:hover{ border-color:var(--bone); background:var(--bone); color:var(--void); }
  .block.active .play{ border-color:var(--ember); background:var(--ember); color:#160B05; }

  .eyebrow{ display:flex; align-items:center; gap:11px; flex-wrap:wrap;
            font-family:var(--data); font-size:10px; letter-spacing:.17em;
            text-transform:uppercase; color:var(--mute); }
  .eyebrow .n{ color:rgba(236,231,222,.30); font-variant-numeric:tabular-nums; }
  .block.active .eyebrow{ color:var(--ember); }
  .block.active .eyebrow .n{ color:var(--ember); opacity:.55; }
  .tag{ margin-left:auto; color:var(--jade); letter-spacing:.13em; }
  .tag.resume{ margin-left:0; color:var(--ember); }
  .tag.textonly{ margin-left:0; color:var(--mute); }
  .block.mute .play{ opacity:.32; cursor:default; }
  .block.mute .play:hover{ background:transparent; color:var(--bone); border-color:rgba(236,231,222,.22); }
  .rail-cap b{ color:rgba(236,231,222,.55); font-weight:400; }

  .title{ margin:9px 0 0; max-width:22em; font-family:var(--ed); font-optical-sizing:auto;
          font-weight:400; font-size:27px; line-height:1.24; letter-spacing:-.012em;
          text-wrap:balance; transition:color .15s ease; }
  .block:not(.active) .head:hover .title{ color:#fff; }

  .runline{ display:flex; align-items:center; gap:14px; margin-top:14px; flex-wrap:wrap; }
  .mins{ font-family:var(--data); font-size:11px; letter-spacing:.06em; color:var(--bone);
         font-variant-numeric:tabular-nums; white-space:nowrap; }
  .block.active .mins{ color:var(--ember); }
  .startat,.words{ font-family:var(--data); font-size:10px; color:var(--mute);
                   letter-spacing:.08em; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* opened body */
  .body{ display:none; padding:0 0 38px 68px; }
  .block.open .body{ display:block; }
  .tabs{ display:flex; gap:26px; align-items:center; margin-bottom:22px; }
  .tabs button{ border:0; background:none; padding:0 0 9px; border-bottom:1px solid transparent;
                border-radius:0; font-family:var(--data); font-size:10px; letter-spacing:.16em;
                text-transform:uppercase; color:var(--mute); }
  .tabs button:hover{ color:var(--bone); border-bottom-color:var(--faint); }
  .tabs button.on{ color:var(--bone); border-bottom-color:var(--ember); }
  .tabs button.ghost{ margin-left:auto; padding:0 0 9px; }

  .pane{ display:none; }
  .pane.on{ display:block; }
  .pane.script{ font-family:var(--ed); font-optical-sizing:auto; font-weight:300;
                font-size:18px; line-height:1.72; color:rgba(236,231,222,.90); }
  .pane.script p{ margin:0 0 19px; max-width:62ch; }

  ul.points{ list-style:none; margin:0; padding:0; max-width:62ch; counter-reset:pt; }
  ul.points li{ display:grid; grid-template-columns:26px 1fr; gap:4px; padding:11px 0;
                border-bottom:1px solid var(--fainter); font-size:15px; margin:0; }
  ul.points li:last-child{ border-bottom:0; }
  ul.points li::before{ content:counter(pt,decimal-leading-zero); counter-increment:pt;
                        font-family:var(--data); font-size:10px; color:var(--mute); padding-top:5px; }

  ul.sources{ list-style:none; margin:0; padding:0; }
  ul.sources li{ padding:10px 0; border-bottom:1px solid var(--fainter); margin:0; }
  ul.sources li:last-child{ border-bottom:0; }
  ul.sources a{ color:var(--bone); text-decoration:none; border-bottom:1px solid transparent; font-size:15px; }
  ul.sources a:hover{ color:var(--ember); border-bottom-color:rgba(225,116,60,.45); }
  ul.sources span{ display:block; font-family:var(--data); font-size:10px; letter-spacing:.12em;
                   text-transform:uppercase; color:var(--mute); margin-top:4px; }

  /* player deck */
  #player{ position:fixed; left:0; right:0; bottom:0; display:none;
           background:rgba(14,20,24,.94);
           -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2);
           border-top:1px solid var(--faint); }
  #player.on{ display:block; }
  .pwrap{ max-width:var(--shell); margin:0 auto; padding:14px 32px 16px;
          display:grid; grid-template-columns:auto 1fr auto auto; gap:20px; align-items:center; }
  #player .play{ width:38px; height:38px; }
  .pnow{ font-family:var(--ed); font-size:16px; white-space:nowrap; overflow:hidden;
         text-overflow:ellipsis; margin-bottom:7px; }
  .ptime{ font-family:var(--data); font-size:11px; color:var(--mute);
          font-variant-numeric:tabular-nums; white-space:nowrap; }

  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:3px;
                     background:var(--fainter); border-radius:0; accent-color:var(--ember); cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:11px; height:11px;
                     border-radius:50%; background:var(--ember); border:0; cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:11px; height:11px; border-radius:50%;
                     background:var(--ember); border:0; cursor:pointer; }

  footer{ margin-top:44px; padding-top:18px; border-top:1px solid var(--fainter);
          display:flex; gap:8px; flex-wrap:wrap; align-items:center;
          font-family:var(--data); font-size:10px; letter-spacing:.13em;
          text-transform:uppercase; color:var(--mute); }
  footer button.ghost{ font-family:var(--data); font-size:10px; letter-spacing:.13em; text-transform:uppercase; }

  @media (max-width:900px){
    header{ padding:30px 22px 20px; }
    h1{ font-size:27px; }
    main{ grid-template-columns:1fr; gap:0; padding:0 22px 180px; }
    .rail{ position:static; display:flex; align-items:center; gap:18px;
           padding-bottom:24px; margin-bottom:6px; border-bottom:1px solid var(--fainter); }
    .rail-total{ font-size:20px; }
    .rail-cap{ margin-top:2px; }
    .axis{ display:none; }
    .rail-now{ margin:0 0 0 auto; text-align:right; }
    .title{ font-size:22px; }
    .body{ padding-left:0; }
    .pane.script{ font-size:17px; }
    .pwrap{ grid-template-columns:auto 1fr; gap:14px; padding:12px 22px 14px; }
    .ptime{ grid-column:1 / -1; }
    #pNext{ grid-row:1; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
    .rung:hover{ transform:none; }
  }
</style>

  #editionStatus { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:16px 18px; margin:0 0 22px; border:1px solid var(--fainter); border-radius:16px; font-size:1rem; }
  #editionStatus strong { font-size:1rem; }
  #editionDetail { flex:1 1 240px; line-height:1.5; }
  #refreshEdition { min-height:44px; font-size:1rem; }

<body>
<header>
  <h1>The Courier <small id="stamp"></small></h1>
  <div class="bar">
    <select id="day"></select>
    <label>Speed <select id="rate">
      <option value="0.9">0.9×</option><option value="1">1×</option><option value="1.1">1.1×</option>
      <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select></label>
    <button class="primary" id="playAll">Play all</button>
    <button id="resumeListening" type="button" hidden>Resume listening</button>
  </div>
</header>
<main>
  <aside class="rail">
    <div>
      <div class="rail-total" id="railTotal">0:00</div>
      <div class="rail-cap" id="railCap">Total run time</div>
    </div>
    <div id="editionProgress" class="courier-progress"></div>
    <div class="axis" id="axis"><ol class="ladder" id="ladder"></ol></div>
    <div class="rail-now" id="railNow"></div>
  </aside>
  <div class="feed">
    <div id="notices"></div>
    <div id="editionStatus" role="status" aria-live="polite" data-state="updating">
      <strong id="editionState">Updating</strong><span id="editionDetail">Checking the published edition.</span>
      <button id="refreshEdition" type="button">Refresh</button>
    </div>
    <section id="courier-practice" aria-label="Courier practice"></section>
    <div id="blocks"></div>
    <footer>
      <span>Listening history</span>
      <button class="ghost" id="export">Export</button>
      <button class="ghost" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="ghost" id="reset">Reset</button>
    </footer>
  </div>
</main>
<div id="player" role="region" aria-label="Courier audio player">
  <div class="pwrap">
    <div class="ptransport">
      <button class="play" id="pToggle" type="button" aria-label="Play section">▶</button>
      <button class="ghost" id="pNext" type="button" aria-label="Next audio section">Next <span aria-hidden="true">›</span></button>
    </div>
    <div class="ptrack">
      <div class="pnow" id="pNow"></div>
      <input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="Seek within section" disabled>
      <div class="ptime"><span id="pTime">0:00 elapsed</span><span id="pRemaining">Loading duration…</span></div>
    </div>
    <div class="poptions">
      <label><input type="checkbox" id="pContinue" checked> Continue to next section</label>
      <span class="ptime" id="pQueueTime"></span>
    </div>
    <p id="pStatus" role="status" aria-live="polite"></p>
  </div>
</div>
<audio id="audio" preload="none" playsinline></audio>

<script>
// ---------- constants ----------
const TOOL = 'courier';
const SCHEMA_VERSION = 1;
const MANIFEST_URL = 'courier/manifest.json';

// ---------- state and storage ----------
const store = {
  key(n) { return `${TOOL}:${n}`; },
  get(n, fallback = null) { try { const r = localStorage.getItem(this.key(n)); return r === null ? fallback : JSON.parse(r); } catch (e) { return fallback; } },
  set(n, v) { try { localStorage.setItem(this.key(n), JSON.stringify(v)); return true; } catch (e) { return false; } },
  keys() { try { return Object.keys(localStorage).filter(k => k.startsWith(`${TOOL}:`)); } catch (e) { return []; } },
  clearTool() { ['state', 'schema-version'].forEach(k => localStorage.removeItem(this.key(k))); },
  available() { try { localStorage.setItem(this.key('probe'), '1'); localStorage.removeItem(this.key('probe')); return true; } catch (e) { return false; } }
};

const migrations = {};

function defaultState() { return { rate: 1, listened: {}, positions: {}, durations: {}, continueNext: true }; }

function loadState() {
  const stored = store.get('state');
  if (stored === null) return defaultState();
  let version = store.get('schema-version', 1);
  let data = stored;
  while (version < SCHEMA_VERSION) {
    const m = migrations[version];
    if (!m) return defaultState();
    data = m(data); version += 1;
  }
  store.set('state', data); store.set('schema-version', SCHEMA_VERSION);
  return { ...defaultState(), ...data, rate: [0.9,1,1.1,1.25,1.5].includes(data.rate)?data.rate:1 };
}

let state = loadState();
let manifest = null;           // fetched, never stored
let ui = { day: null, current: null, queue: state.continueNext !== false }; // transient
window.getCourierContext = () => ({ day: day(), manifest });

function setState(patch) { state = { ...state, ...patch }; store.set('state', state); store.set('schema-version', SCHEMA_VERSION); render(); }

function exportState() {
  const payload = { tool: TOOL, schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${TOOL}-${new Date().toISOString().slice(0, 10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}

function importState(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let p;
    try { p = JSON.parse(reader.result); } catch (e) { notice('That file is not valid JSON.'); return; }
    if (p.tool !== TOOL) { notice(`That file is from ${p.tool || 'another tool'}, not ${TOOL}.`); return; }
    if (!confirm('This replaces everything currently saved in this tool. Continue?')) return;
    store.set('state', p.state); store.set('schema-version', p.schemaVersion || 1);
    state = loadState(); render();
  };
  reader.readAsText(file);
}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';
const hm = m => { const n=Math.max(0,Math.round(Number(m)||0)); return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`; };
const escapeText = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const playIcon = paused => paused ? '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>' : '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" fill="currentColor"/></svg>';
const posKey = (date, id) => `${date}/${id}`;
function notice(msg) { $('notices').innerHTML = `<div class="notice">${msg}</div>`; }
function day() { return manifest && manifest.days.find(d => d.date === ui.day); }

// Every block shows its estimated length and starting point in the full edition.
function schedule(blocks) {
  let at = 0;
  const rows = blocks.map(b => {
    const mins = Number(b.minutes) || 0;
    const row = { id: b.id, mins, startsAt: at };
    at += mins;
    return row;
  });
  const total = at;
  return { rows, total, by: Object.fromEntries(rows.map(r => [r.id, r])) };
}

// ---------- rendering ----------
function render() {
  $('rate').value = String(state.rate);
  if ($('audio').playbackRate !== state.rate) $('audio').playbackRate = state.rate;
  const d = day();
  if (!d) return;
  window.CourierPublication?.render(d);
  $('stamp').textContent = `generated ${d.generatedAt.replace('T', ' ').slice(0, 16)} UTC`;

  const plan = schedule(d.blocks);
  const listened = state.listened[d.date] || [];
  const resumable = resumeBlock();
  $('resumeListening').hidden = !resumable;
  $('resumeListening').title = resumable ? `Continue ${resumable.label} from your saved position` : '';

  $('blocks').innerHTML = d.blocks.map((b, i) => {
    const done = listened.includes(b.id);
    const pos = state.positions[posKey(d.date, b.id)] || 0;
    const open = ui.open === b.id ? 'open' : '';
    const active = ui.current === b.id ? 'active' : '';
    const s = plan.by[b.id];
    const mute = b.audio ? '' : 'mute';
    return `<section class="block ${done ? 'done' : ''} ${open} ${active} ${mute}" data-id="${b.id}">
      <div class="head" data-act="toggle">
        <div class="seat"><button class="play" data-act="play" aria-label="${b.audio ? (ui.current === b.id && !$('audio').paused ? 'Pause ' : 'Play ') + escapeText(b.label) : 'Read ' + escapeText(b.label) + ' (text only)'}">${playIcon(ui.current !== b.id || $('audio').paused)}</button></div>
        <div>
          <div class="eyebrow">
            <span class="n">${String(i + 1).padStart(2, '0')}</span>
            <span>${b.label}</span>
            ${b.audio ? '' : '<span class="tag textonly">Text only</span>'}
            ${pos > 5 ? `<span class="tag resume">Resume ${fmt(pos)}</span>` : ''}
            ${done ? '<span class="tag">Heard</span>' : ''}
          </div>
          <h2 class="title"><button class="courier-title-toggle" data-act="toggle" aria-expanded="${ui.open === b.id}" aria-controls="courier-body-${i}"><span>${escapeText(b.title)}</span><span class="courier-chevron" aria-hidden="true">⌄</span></button></h2>
          <div class="runline">
            <span class="mins">≈ ${s.mins} min</span>
            <span class="startat">starts ${hm(s.startsAt)}</span>
            <span class="words">${b.words.toLocaleString()} words</span>
          </div>
        </div>
      </div>
      <div class="body" id="courier-body-${i}">
        <div class="tabs">
          <button class="on" data-pane="points">Talking points</button>
          <button data-pane="script">Script</button>
          <button data-pane="sources">Sources</button>
          <button class="ghost" data-act="copy">Copy talking points</button>
        </div>
        <div class="pane on" data-pane="points"><ul class="points">${b.talkingPoints.map(p => `<li>${p}</li>`).join('')}</ul></div>
        <div class="pane script" data-pane="script">${b.script.split(/\n\s*\n/).map(p => `<p>${p}</p>`).join('')}</div>
        <div class="pane" data-pane="sources"><ul class="sources">${b.sources.map(s2 => `<li><a href="${s2.url}" target="_blank" rel="noopener">${s2.title}</a><span>${s2.outlet}</span></li>`).join('')}</ul></div>
      </div>
    </section>`;
  }).join('');

  renderRail(d, plan, listened);
  updatePlayback();
  if (window.AtlasPractice) window.AtlasPractice.mount({ day: d, manifest });
}

function renderRail(d, plan, listened) {
  // Display the existing heard flags; never infer completion from a resume position.
  const audioBlocks = d.blocks.filter(b => b.audio);
  const heard = audioBlocks.filter(b => listened.includes(b.id)).length;
  const percent = audioBlocks.length ? Math.round(heard / audioBlocks.length * 100) : 0;
  $('editionProgress').innerHTML = audioBlocks.length
    ? `<div class="courier-progress-label">Edition progress</div><div class="courier-progress-value">${percent}<small>%</small></div><div class="courier-progress-track" role="progressbar" aria-label="Audio sections heard" aria-valuemin="0" aria-valuemax="${audioBlocks.length}" aria-valuenow="${heard}"><span style="width:${percent}%"></span></div><div class="courier-progress-caption">${heard} of ${audioBlocks.length} audio sections heard</div>`
    : '<div class="courier-progress-label">Text-only edition</div>';

  $('railTotal').textContent = hm(plan.total);
  $('railCap').innerHTML = d.budgetMinutes
    ? `Run time <b>· cap ${hm(d.budgetMinutes)}</b>`
    : 'Total run time';

  const axis = $('axis');
  axis.querySelectorAll('.tick').forEach(t => t.remove());
  if (plan.total > 0) {
    for (let t = 0; t <= plan.total; t += 60) {
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.top = (t / plan.total * 100) + '%';
      tick.innerHTML = `<span>${hm(t)}</span><i></i>`;
      axis.appendChild(tick);
    }
  }

  $('ladder').innerHTML = d.blocks.map(b => {
    const s = plan.by[b.id];
    const cls = ui.current === b.id ? 'live' : (listened.includes(b.id) ? 'done' : '');
    return `<li class="rung ${cls}" data-id="${b.id}" style="--m:${s.mins || 1}" title="${b.label} · ${s.mins} min"></li>`;
  }).join('');

  if (!ui.current) $('railNow').innerHTML = `${d.blocks.length} sections<span class="idle">Not started</span>`;

}

function renderDays() {
  $('day').innerHTML = manifest.days.map(d => `<option value="${d.date}">${d.date}</option>`).join('');
  $('day').value = ui.day;
}

// ---------- playback ----------
// One audio element keeps user-initiated playback across section changes.
let sourceEpoch = 0, resumeListener = null, lastSave = 0;
const measuredDurations = new Map(Object.entries(state.durations||{}).filter(([,v])=>Number.isFinite(v)&&v>0));
const durationKey = (d,b) => `${d.date}/${b.id}/${b.audio}`;
function currentBlock() { return day()?.blocks.find(b => b.id === ui.current); }
function resumeBlock() {
  const d=day();if(!d)return null;
  return d.blocks.find(b=>b.audio&&state.lastPlayed?.day===d.date&&state.lastPlayed.id===b.id&&!(state.listened[d.date]||[]).includes(b.id))
    ||d.blocks.find(b=>b.audio&&state.positions[posKey(d.date,b.id)]>0&&!(state.listened[d.date]||[]).includes(b.id));
}
function nextAudio() {
  const d=day(); if(!d)return null;
  const index=d.blocks.findIndex(b=>b.id===ui.current);
  return d.blocks.slice(index+1).find(b=>b.audio)||null;
}
function savePosition() {
  const a=$('audio'),d=day();
  if(!d||!ui.current||resumeListener||a.ended||!Number.isFinite(a.currentTime)||!Number.isFinite(a.duration)||a.duration<=0)return;
  state.positions[posKey(d.date,ui.current)]=a.currentTime;
  store.set('state',state);
}
function clearResume() {
  if(resumeListener)$('audio').removeEventListener('loadedmetadata',resumeListener);
  resumeListener=null;
}
function playbackMessage(message) { $('pStatus').textContent=message; }
function requestPlay() {
  const a=$('audio'),ticket=sourceEpoch;
  playbackMessage('');
  // A denied request leaves a clear manual resume action, including on mobile.
  let attempt;try{attempt=a.play();}catch(error){attempt=Promise.reject(error);}
  return Promise.resolve(attempt).catch(error=>{
    if(ticket!==sourceEpoch||error?.name==='AbortError')return;
    playbackMessage(error?.name==='NotAllowedError' ? 'Tap Play to continue listening.' : 'This audio could not play. Try Play again, or choose Next.');
    updatePlayback();
  });
}
function play(id,{resume=true,restart=false}={}) {
  const d=day(),b=d?.blocks.find(x=>x.id===id),a=$('audio');
  if(!b)return;
  if(!b.audio){ui.open=id;render();return;}
  if(ui.current===id&&!restart&&!a.error){
    if(a.paused||a.ended)requestPlay();else{a.pause();savePosition();}
    updatePlayback();return;
  }
  savePosition();clearResume();sourceEpoch++;
  ui.current=id;ui.open=id;
  state.lastPlayed={day:d.date,id};store.set('state',state);
  const ticket=sourceEpoch,pos=resume?Number(state.positions[posKey(d.date,id)])||0:0;
  a.src=b.audio;a.playbackRate=state.rate;
  resumeListener=()=>{
    if(ticket!==sourceEpoch)return;
    clearResume();
    if(Number.isFinite(a.duration)&&a.duration>0){
      measuredDurations.set(durationKey(d,b),a.duration);
      state.durations=Object.fromEntries([...measuredDurations].filter(([key])=>manifest.days.some(entry=>entry.blocks.some(block=>durationKey(entry,block)===key))));
      store.set('state',state);
      if(pos>0&&pos<a.duration-2)a.currentTime=pos;
    }
    updatePlayback();
  };
  a.addEventListener('loadedmetadata',resumeListener);
  $('player').classList.add('on');
  $('pNow').textContent=`${b.label}: ${b.title}`;
  updateMediaMetadata();
  requestPlay();render();
}
function next() {
  const b=nextAudio();
  if(b)play(b.id,{resume:false});
  else{$('audio').pause();updatePlayback();}
}
function playbackTiming() {
  const d=day(),b=currentBlock(),a=$('audio');if(!d||!b)return null;
  const duration=Number.isFinite(a.duration)&&a.duration>0?a.duration:null;
  if(duration)measuredDurations.set(durationKey(d,b),duration);
  const elapsed=Math.max(0,Math.min(Number(a.currentTime)||0,duration??Infinity));
  const rate=Number(a.playbackRate)>0?Number(a.playbackRate):1;
  const later=d.blocks.slice(d.blocks.findIndex(x=>x.id===b.id)+1).filter(x=>x.audio);
  const lengths=[b,...later].map(x=>measuredDurations.get(durationKey(d,x))??null);
  const estimated=lengths.some(x=>x===null);
  const total=[b,...later].reduce((sum,x,i)=>sum+(lengths[i]??Math.max(0,Number(x.minutes)||0)*60),0);
  return {elapsed,duration,rate,remaining:duration===null?null:Math.max(0,duration-elapsed)/rate,
    queueRemaining:Math.max(0,total-elapsed)/rate,estimated};
}
function updatePlayback() {
  const a=$('audio'),d=day(),b=currentBlock(),t=playbackTiming();if(!t)return;
  const paused=a.paused||a.ended;
  $('pToggle').innerHTML=playIcon(paused);
  $('pToggle').setAttribute('aria-label',paused?'Play section':'Pause section');
  $('pNext').disabled=!nextAudio();
  $('pContinue').checked=ui.queue;
  $('pTime').textContent=`${fmt(t.elapsed)} elapsed${t.duration===null?'':` / ${fmt(t.duration)}`}`;
  $('pRemaining').textContent=t.remaining===null?'Loading duration…':`${fmt(t.remaining)} left${t.rate===1?'':` at ${t.rate}×`}`;
  $('pSeek').disabled=t.duration===null;
  $('pSeek').value=t.duration===null?0:Math.round(t.elapsed/t.duration*1000);
  $('pSeek').setAttribute('aria-valuetext',`${fmt(t.elapsed)} of ${t.duration===null?'unknown duration':fmt(t.duration)}`);
  $('pQueueTime').textContent=`${t.estimated?'About ':''}${fmt(t.queueRemaining)} left in edition${t.rate===1?'':` at ${t.rate}×`}`;
  $('railTotal').textContent=`${t.estimated?'≈ ':''}${fmt(t.queueRemaining)}`;
  $('railCap').textContent='Audio left in edition';
  $('railNow').innerHTML=`${a.ended?'Finished':paused?'Paused':'Now playing'}<b>${escapeText(b.label)}</b>${t.duration===null?'Loading section time':`${fmt(t.elapsed)} played · ${fmt(t.remaining)} left`}`;
  updateMediaPosition(t);
}
// Native media controls are progressive enhancement; the on-page player always works.
function updateMediaMetadata() {
  const session=globalThis.navigator?.mediaSession,b=currentBlock();if(!session)return;
  try{session.metadata=b&&globalThis.MediaMetadata?new MediaMetadata({title:`${b.label}: ${b.title}`,artist:'The Courier',album:ui.day}):null;}catch{}
}
function updateMediaPosition(t) {
  const session=globalThis.navigator?.mediaSession;if(!session)return;
  try{session.playbackState=ui.current?($('audio').paused||$('audio').ended?'paused':'playing'):'none';
    if(t?.duration)session.setPositionState?.({duration:t.duration,playbackRate:t.rate,position:t.elapsed});
    else session.setPositionState?.();
  }catch{}
}
function wireMediaControls() {
  const session=globalThis.navigator?.mediaSession;if(!session?.setActionHandler)return;
  const seek=seconds=>{const a=$('audio');if(Number.isFinite(a.duration)&&a.duration>0&&Number.isFinite(seconds)){a.currentTime=Math.max(0,Math.min(a.duration,seconds));onTick();savePosition();}};
  const handlers={play:()=>{if(ui.current&&($('audio').paused||$('audio').error))play(ui.current);},pause:()=>{$('audio').pause();savePosition();},
    nexttrack:next,seekbackward:event=>seek($('audio').currentTime-(event.seekOffset||15)),seekforward:event=>seek($('audio').currentTime+(event.seekOffset||15)),seekto:event=>seek(event.seekTime)};
  for(const [action,handler]of Object.entries(handlers)){try{session.setActionHandler(action,handler);}catch{}}
}
function onTick() {
  updatePlayback();
  if(Date.now()-lastSave>5000){lastSave=Date.now();savePosition();}
}
function onEnded() {
  const a=$('audio'),d=day();
  if(!a.ended||!d||!currentBlock())return;
  const listened={...state.listened,[d.date]:Array.from(new Set([...(state.listened[d.date]||[]),ui.current]))};
  const positions={...state.positions};delete positions[posKey(d.date,ui.current)];
  setState({listened,positions});
  if(ui.queue&&nextAudio())next();
  else{updatePlayback();playbackMessage(nextAudio()?'Section finished. Choose Next when you are ready.':'End of this edition’s audio.');}
}

// ---------- event wiring ----------
function wireEvents() {
  $('blocks').addEventListener('click', e => {
    const sec = e.target.closest('.block'); if (!sec) return;
    const id = sec.dataset.id; const act = e.target.closest('[data-act]')?.dataset.act; const pane = e.target.closest('[data-pane]')?.dataset.pane;
    if (act === 'play') { e.stopPropagation(); play(id); return; }
    if (act === 'copy') {
      const b = day().blocks.find(x => x.id === id);
      const button=e.target.closest('[data-act="copy"]');
      if(!navigator.clipboard?.writeText){notice('Copy unavailable. Select the talking points and copy them manually.');return;}
      navigator.clipboard.writeText(b.talkingPoints.map(p => `• ${p}`).join('\n')).then(()=>{
        if(button?.isConnected){button.textContent='Copied';setTimeout(()=>{if(button.isConnected)button.textContent='Copy talking points';},1500);}
      }).catch(()=>notice('Could not copy. Select the talking points and copy them manually.'));return;
    }
    if (pane) {
      sec.querySelectorAll('.tabs [data-pane]').forEach(x => x.classList.toggle('on', x.dataset.pane === pane));
      sec.querySelectorAll('.pane').forEach(x => x.classList.toggle('on', x.dataset.pane === pane)); return;
    }
    if (e.target.closest('.head')) { ui.open = ui.open === id ? null : id; render(); }
  });
  $('ladder').addEventListener('click', e => {
    const rung = e.target.closest('.rung'); if (!rung) return;
    const sec = $('blocks').querySelector(`.block[data-id="${rung.dataset.id}"]`);
    if (sec) sec.scrollIntoView({ behavior:window.matchMedia?.("(prefers-reduced-motion: reduce)").matches?"instant":"smooth", block: 'center' });
  });
  $('day').addEventListener('change', e => {
    const a = $('audio'); savePosition();clearResume();sourceEpoch++;a.pause();ui.current=null;a.removeAttribute('src');a.load();
    playbackMessage('');ui.current = null; ui.day = e.target.value; ui.open = null;
    $('player').classList.remove('on'); render();
    updateMediaMetadata();updateMediaPosition();
  });
  $('rate').addEventListener('change', e => setState({ rate: Number(e.target.value) }));
  $('playAll').addEventListener('click', () => { const first=day()?.blocks.find(b=>b.audio);if(!first){notice('This edition has no audio. Open a section to read it.');return;}ui.queue=true;play(first.id,{resume:false,restart:true}); });
  $('resumeListening').addEventListener('click',()=>{const b=resumeBlock();if(b&&(ui.current!==b.id||$('audio').paused||$('audio').error))play(b.id);});
  $('pToggle').addEventListener('click', () => { if(ui.current)play(ui.current); });
  $('pContinue').addEventListener('change',e=>{ui.queue=e.target.checked;state.continueNext=ui.queue;store.set('state',state);});
  $('pNext').addEventListener('click', next);
  $('pSeek').addEventListener('input', e => { const a = $('audio'); if (Number.isFinite(a.duration)&&a.duration>0){a.currentTime=e.target.value/1000*a.duration;updatePlayback();savePosition();} });
  const a = $('audio');
  a.addEventListener('timeupdate', onTick); a.addEventListener('ended', onEnded);
  a.addEventListener('play',()=>{playbackMessage('');render();});
  a.addEventListener('pause',()=>{savePosition();render();});
  a.addEventListener('durationchange',updatePlayback);a.addEventListener('ratechange',updatePlayback);a.addEventListener('seeked',onTick);
  a.addEventListener('error',()=>{if(ui.current){playbackMessage('This audio is unavailable. Try Play again, or choose Next.');updatePlayback();}});
  a.addEventListener('waiting',()=>{if(ui.current&&!a.paused)playbackMessage('Buffering audio…');});
  a.addEventListener('playing',()=>{playbackMessage('');updatePlayback();});
  wireMediaControls();
  window.addEventListener('pagehide',savePosition);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)savePosition();});
  $('export').addEventListener('click', exportState);
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => { if (e.target.files[0]) importState(e.target.files[0]); e.target.value = ''; });
  $('reset').addEventListener('click', () => { if (confirm('Clear all Courier listening history on this browser?')) { store.clearTool(); state = defaultState(); measuredDurations.clear();ui.queue=true;render(); } });
}

// ---------- init ----------
async function init() {
  wireEvents();
  $('refreshEdition').addEventListener('click', async () => {
    const button = $('refreshEdition'); button.disabled = true;
    $('editionState').textContent = 'Updating';
    $('editionDetail').textContent = 'Checking the published edition.';
    try {
      const response = await fetch(MANIFEST_URL, {cache:'no-store', signal:AbortSignal.timeout(15000)});
      if (!response.ok) throw new Error('Publication unavailable');
      const updated = await response.json();
      if (!Array.isArray(updated.days) || !updated.days.length) throw new Error('No edition available');
      manifest = updated;
      if (!day()) ui.day = manifest.days[0].date;
      await window.CourierPublication?.load();
      renderDays(); render();
    } catch {
      $('editionState').textContent = 'Unable to update';
      $('editionDetail').textContent = 'Could not check for updates. Your loaded edition is still available.';
    } finally { button.disabled = false; }
  });
  if (!store.available()) notice('Storage is unavailable in this browser, so positions and listened marks will not be saved.');
  try {
    const r = await fetch(MANIFEST_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    manifest = await r.json();
    await window.CourierPublication?.load();
  } catch (e) {
    $('editionState').textContent = 'Unavailable';
    $('editionDetail').textContent = 'The published edition could not be loaded. Try Refresh.';
    notice(`Could not load ${MANIFEST_URL}. This tool needs to be served from the Pages URL, and the daily workflow must have run at least once.`);
    return;
  }
  if (!manifest.days.length) { notice('No briefings published yet. Run the Courier workflow.'); return; }
  const requestedDay = new URLSearchParams(location.search).get('day');
  ui.day = manifest.days.some(d => d.date === requestedDay) ? requestedDay : manifest.days[0].date;
  if (requestedDay && ui.day !== requestedDay) notice('That edition is no longer available. Showing the latest published edition.');
  renderDays(); render();
}
document.addEventListener('DOMContentLoaded', init);
</script>
