<style>
:root{--bg:#0c0e1a;--panel:#141830;--panel2:#1a1f3a;--txt:#eef0fb;--muted:#8089a8;--dim:#6f7798;
  --line:rgba(120,130,180,.16);--gold:#f0b73e;--gold2:#f6cf6a;--green:#2fd180;--green2:#9af0c6;
  --blue:#4ea3e0;--violet:#9d7bff;--rose:#f0628a;--amber:#f0683e;--cyan:#45c8d8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:
  radial-gradient(1100px 600px at 50% -10%,rgba(240,183,62,.06),transparent 60%),
  radial-gradient(900px 500px at 85% 8%,rgba(69,200,216,.05),transparent 55%),

#app{max-width:640px;margin:0 auto;

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:rgba(12,14,26,.92);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);
  border-top:1px solid var(--line);
  padding:7px max(10px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right))}
.tabbar button{flex:1;background:none;border:none;cursor:pointer;padding:5px 2px;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:#5a627e;font-family:'Outfit',sans-serif}
.tabbar button .tglyph{font-size:16px;line-height:1}

.bar i{display:block;height:100%;border-radius:99px}
/* the weeks grid */
.grid-wrap{overflow-x:auto}
.grid-row{display:flex;align-items:center;gap:2px;margin-bottom:1.6px}
.gut{width:16px;font-size:7px;line-height:1;color:var(--dim);text-align:right;flex-shrink:0;font-family:'Space Mono',monospace}
.cells{display:flex;gap:1.6px;flex:1}
.cell{flex:1;aspect-ratio:1;border-radius:1px;background:rgba(255,255,255,.045)}

.cell.now{background:#fff;box-shadow:0 0 5px rgba(255,255,255,.9);animation:pulse 1.6s ease-in-out infinite}

  font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer}

<body>
<div id="app"></div>
<script>
/* ===================== THE HOURGLASS =====================
   A memento mori. Not a countdown to dread, a mirror for attention. It takes
   three honest numbers, when you were born, how long you intend to stay healthy,
   and when you mean to be free, and it shows the time between here and there as
   something you can see all at once. The point is not the arithmetic. The point
   is that a life looks small on a screen, and small things get protected.

   Single file, localStorage, no dependencies, no native dialogs, same
   conventions as the rest of the suite. */

var KEY="hourglass:v1";
function J(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }

var MS_DAY=86400000, MS_WEEK=604800000, DAYS_YR=365.2425, WEEKS_YR=52.1775;

var DEF={
  birth:"1994-02-24",
  healthyAge:90,
  retireAge:50,
  milestones:[
    {id:"m1", label:"First child arrives", date:"2026-12-01", emoji:"👶"}
  ],
  fin:{ currentAUM:"", pace:"", paceUnit:"month", growthPct:6, target:100000000 },
  companions:[
    {id:"c1", label:"Marriage", start:"2022-07-29", end:"", color:"#f0628a", emoji:"💍"},
    {id:"c2", label:"Hudson", start:"2018-11-27", end:"2033-11-27", color:"#4ea3e0", emoji:"🐕"}
  ],
  tab:null, created:null
};
function guessEmoji(label, isBond){
  var l=(label||"").toLowerCase();
  if(/child|baby|born|\bson\b|daughter|\bkid/.test(l)) return "👶";
  if(/marria|wedding|\bwife\b|husband|spouse|\bring\b|engaged/.test(l)) return "💍";
  if(/hudson|\bdog\b|\bpup|hound|\bpuppy/.test(l)) return "🐕";
  if(/\bcat\b|kitten/.test(l)) return "🐈";
  if(/house|home|mortgage/.test(l)) return "🏡";
  if(/job|work|business|career|firm/.test(l)) return "💼";
  if(/graduat|degree|school/.test(l)) return "🎓";
  return isBond?"🤝":"📌";
}
var S=J(KEY,null)||JSON.parse(JSON.stringify(DEF));
(function migrate(){
  Object.keys(DEF).forEach(function(k){ if(S[k]===undefined) S[k]=JSON.parse(JSON.stringify(DEF[k])); });
  if(!Array.isArray(S.milestones)) S.milestones=[];
  S.milestones.forEach(function(m){ if(!m.emoji) m.emoji=guessEmoji(m.label,false); });
  if(!Array.isArray(S.companions)) S.companions=JSON.parse(JSON.stringify(DEF.companions));
  S.companions.forEach(function(c){ if(!c.emoji) c.emoji=guessEmoji(c.label,true); });
  if(!S.fin||typeof S.fin!=="object") S.fin=JSON.parse(JSON.stringify(DEF.fin));
  Object.keys(DEF.fin).forEach(function(k){ if(S.fin[k]===undefined) S.fin[k]=DEF.fin[k]; });
  if(!S.created) S.created=new Date().toISOString().slice(0,10);
  /* v2: the Johanna relationship starts in 2017, not at the wedding, and the
     practice deserves its own mark. Runs once, and only touches the seeded
     marriage bond if it has not been customised, so nothing hand-edited is lost. */
  if(!S.__v2){
    var mar=(S.companions||[]).filter(function(c){ return c.id==="c1"; })[0];
    if(mar && mar.label==="Marriage" && mar.start==="2022-07-29"){
      mar.label="Johanna"; mar.start="2017-01-15"; mar.emoji="❤️";
    }
    if(!S.milestones.some(function(m){ return /met johanna|dating/i.test(m.label||""); }))
      S.milestones.push({id:uid(), label:"Met Johanna", date:"2017-01-15", emoji:"✨"});
    if(!S.milestones.some(function(m){ return /married|wedding/i.test(m.label||""); }))
      S.milestones.push({id:uid(), label:"Married Johanna", date:"2022-07-29", emoji:"💍"});
    if(!S.milestones.some(function(m){ return /practice/i.test(m.label||""); }))
      S.milestones.push({id:uid(), label:"Started my practice", date:"2023-05-01", emoji:"💼"});
    S.__v2=true;
  }
})();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
/* persist the seeded defaults on first load so the Atlas card is live from the
   start, not blank until the first edit */
try{ if(localStorage.getItem(KEY)==null) save(); }catch(e){}

var __tt=null;
function toast(msg, actionLabel, action){
  var t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.className="toast"; t.textContent="";
  var sp=document.createElement("span"); sp.textContent=msg; t.appendChild(sp);
  if(action){
    var b=document.createElement("button"); b.textContent=actionLabel||"Undo";
    b.onclick=function(){ t.remove(); try{ action(); }catch(e){} };
    t.appendChild(b);
  }
  clearTimeout(__tt); __tt=setTimeout(function(){ if(t&&t.parentNode) t.remove(); },6000);
}
function uiClose(){ var o=document.getElementById("uiDlg"); if(o) o.remove(); }
function uiConfirm(title, body, okLabel, onOk, danger){
  uiClose();
  var col=danger?"linear-gradient(180deg,#f6889e,#e2456a)":"linear-gradient(180deg,#f6cf6a,#f0b73e)";
  var w=document.createElement("div"); w.id="uiDlg";
  w.style.cssText="position:fixed;inset:0;z-index:9000;background:rgba(6,7,14,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px";
  w.innerHTML='<div style="max-width:400px;width:100%;background:#141830;border:1px solid rgba(120,130,180,.28);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)">'
    +'<div style="font-size:15px;font-weight:700;margin-bottom:6px">'+title+'</div>'
    +(body?'<div style="font-size:12.5px;line-height:1.55;color:#9aa2c0;margin-bottom:14px">'+body+'</div>':'<div style="height:8px"></div>')
    +'<div style="display:flex;gap:8px">'
    +'<button id="uiCancel" style="flex:1;padding:11px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:#9aa2c0;background:rgba(255,255,255,.05);border:1px solid rgba(120,130,180,.25)">Cancel</button>'
    +'<button id="uiOk" style="flex:1;padding:11px;border-radius:11px;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;color:#0c0e1a;background:'+col+'">'+(okLabel||"Confirm")+'</button></div></div>';
  w.addEventListener("click",function(e){ if(e.target===w) uiClose(); });
  document.body.appendChild(w);
  document.getElementById("uiCancel").onclick=uiClose;
  document.getElementById("uiOk").onclick=function(){ uiClose(); try{ onOk(); }catch(e){} };
}

/* ---------- formatting ---------- */
function comma(n){ return Math.round(+n||0).toLocaleString("en-CA"); }
function esc(t){ return String(t==null?"":t).replace(/[<>&"]/g,function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function toNum(v){ if(v===""||v==null) return ""; v=String(v).replace(/[^0-9.]/g,""); if(v===""||v===".") return ""; var n=parseFloat(v); return isNaN(n)?"":n; }
function niceDate(d){ try{ return d.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}); }catch(e){ return ""; } }
function monthYear(d){ try{ return d.toLocaleDateString("en-CA",{month:"long",year:"numeric"}); }catch(e){ return ""; } }
function fmtMoney(n){ n=+n||0;
  if(Math.abs(n)>=1e6) return "$"+(n/1e6).toFixed(Math.abs(n)>=1e7?0:1)+"M";
  if(Math.abs(n)>=1e3) return "$"+Math.round(n/1e3)+"K";
  return "$"+comma(n);
}

/* ---------- the climb ----------
   Current book, a steady gathering pace, and whatever the market adds, walked
   forward one month at a time until it crosses the target. Iterating rather than
   using a closed form keeps it honest when growth is zero (pure gathering) and
   when it is not. */
function projFin(){
  var F=S.fin||{}, cur=+F.currentAUM||0, target=+F.target||0;
  if(target<=0||!(cur>0||(+F.pace||0)>0)) return null;
  var perMonth=(F.paceUnit==="week") ? (+F.pace||0)*WEEKS_YR/12 : (+F.pace||0);
  var gM=Math.pow(1+(+F.growthPct||0)/100, 1/12)-1;
  if(cur>=target) return {reached:true, already:true, months:0};
  var aum=cur, months=0, cap=1200;
  while(aum<target && months<cap){ aum=aum*(1+gM)+perMonth; months++; }
  if(aum<target) return {reached:false, perMonth:perMonth};
  var date=new Date(); date.setMonth(date.getMonth()+months);
  var age=ageNow()+months/12;
  var gathered=perMonth*months;
  var fromGrowth=Math.max(0,(target-cur)-gathered);
  var gatheredNet=Math.min(gathered, target-cur);
  return {reached:true, months:months, date:date, age:age, perMonth:perMonth,
          gathered:gatheredNet, fromGrowth:fromGrowth, target:target, cur:cur};
}
/* ---------- companions ----------
   A bond has a start and, sometimes, an end. Marriage runs to the edge of your
   own life if you let it. A dog does not. Seeing the shared span against the
   whole grid is the point: some windows are wide open, and some are closing. */
function companionInfo(c){
  if(!c||!c.start) return null;
  var b=birthDate().getTime(), H=healthyAge();
  var sd=new Date(c.start+"T00:00:00"); if(isNaN(sd.getTime())) return null;
  var startAge=(sd.getTime()-b)/(DAYS_YR*MS_DAY);
  var ongoing=!c.end;
  var ed = ongoing ? deathDate() : new Date(c.end+"T00:00:00");
  if(isNaN(ed.getTime())) ed=deathDate();
  var endAge=(ed.getTime()-b)/(DAYS_YR*MS_DAY);
  var nowA=ageNow();
  var ended=!ongoing && ed.getTime()<=Date.now();
  var yearsSoFar=Math.max(0, Math.min(nowA,endAge)-Math.max(0,startAge));
  var yearsLeft=Math.max(0, endAge-Math.max(nowA,startAge));
  return {
    label:c.label||"Bond", color:c.color||"var(--rose)", ongoing:ongoing, ended:ended,
    startDate:sd, endDate:ed, startAge:startAge, endAge:Math.min(endAge,H), rawEndAge:endAge,
    nowA:nowA, yearsSoFar:yearsSoFar, yearsLeft:yearsLeft,
    startWeek:Math.floor(startAge*52), endWeek:Math.floor(endAge*52)
  };
}
function companionCells(){
  var cells={}, H=healthyAge();
  (S.companions||[]).forEach(function(c){
    var ci=companionInfo(c); if(!ci) return;
    if(ci.startWeek>=0 && ci.startWeek<H*52 && ci.startAge>=0) cells[ci.startWeek]={color:ci.color, label:ci.label+" begins"};
    if(!ci.ongoing && ci.endWeek>=0 && ci.endWeek<H*52) cells[ci.endWeek]={color:ci.color, label:ci.label+" ends", end:true};
  });
  return cells;
}
function goalWeekIdx(){
  var pf=projFin();
  if(!pf||!pf.reached||pf.already||!pf.date) return null;
  var wk=Math.floor(pf.age*52);
  return (wk>=0 && wk < healthyAge()*52) ? wk : null;
}

/* ---------- the math ---------- */
function birthDate(){ var d=new Date((S.birth||"1994-02-24")+"T00:00:00"); return isNaN(d.getTime())?new Date("1994-02-24T00:00:00"):d; }
function plusYears(base, yrs){ var d=new Date(base.getTime()); d.setFullYear(d.getFullYear()+Math.round(yrs)); return d; }
function healthyAge(){ return Math.max(1, +S.healthyAge||90); }
function retireAge(){ return Math.max(0, +S.retireAge||50); }
function deathDate(){ return plusYears(birthDate(), healthyAge()); }
function retireDate(){ return plusYears(birthDate(), retireAge()); }
function ageNow(){ return (Date.now()-birthDate().getTime())/(DAYS_YR*MS_DAY); }
function span(){ return deathDate().getTime()-birthDate().getTime(); }
function lived(){ return Date.now()-birthDate().getTime(); }
function pctLived(){ return Math.max(0, Math.min(1, lived()/span())); }
function daysLeft(){ return Math.max(0, (deathDate().getTime()-Date.now())/MS_DAY); }
function weeksLeft(){ return Math.max(0, (deathDate().getTime()-Date.now())/MS_WEEK); }
function yearsLeft(){ return daysLeft()/DAYS_YR; }
function weeksToRetire(){ return (retireDate().getTime()-Date.now())/MS_WEEK; }
function yearsToRetire(){ return (retireDate().getTime()-Date.now())/(DAYS_YR*MS_DAY); }

/* ---------- wallpaper ----------
   The single biggest lever is how often you see this. A tool you have to open
   loses every day you forget. On the lock screen it finds you. Drawn at phone
   resolution so it is crisp, and laid out low enough that the clock does not
   sit on the grid. */
function markerEmojis(){
  /* one emoji per special week, drawn on top of the grid so it reads at a glance */
  var m={}, H=healthyAge(), gWeek=goalWeekIdx(), aN=ageNow();
  (S.milestones||[]).forEach(function(ml){
    if(!ml.date) return;
    var d=new Date(ml.date+"T00:00:00"); if(isNaN(d.getTime())) return;
    var wk=Math.floor((d.getTime()-birthDate().getTime())/MS_WEEK);
    if(wk>=0 && wk<H*52) m[wk]=ml.emoji||"📌";
  });
  (S.companions||[]).forEach(function(c){
    var ci=companionInfo(c); if(!ci) return;
    if(ci.startAge>=0 && ci.startWeek<H*52) m[ci.startWeek]=c.emoji||"🤝";
    if(!ci.ongoing && ci.endWeek>=0 && ci.endWeek<H*52) m[ci.endWeek]="🌈";
  });
  if(gWeek!=null) m[gWeek]="💰";
  m[Math.floor(aN*52)]="📍";
  return m;
}
function buildWallpaperCanvas(){
  var W=1170, Hh=2532, cv=document.createElement("canvas"); cv.width=W; cv.height=Hh;
  var x=cv.getContext("2d");
  var g=x.createLinearGradient(0,0,0,Hh);
  g.addColorStop(0,"#0b0d18"); g.addColorStop(.5,"#0c0e1a"); g.addColorStop(1,"#090a12");
  x.fillStyle=g; x.fillRect(0,0,W,Hh);

  var H=healthyAge(), R=retireAge(), aN=ageNow(), nowWeek=Math.floor(aN*52);
  var emo=markerEmojis();
  var EMOJI_FONT="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";

  /* header */
  x.textAlign="center"; x.textBaseline="alphabetic";
  x.fillStyle="#f0b73e"; x.font="600 40px 'Cinzel', Georgia, serif";
  x.fillText("THE HOURGLASS", W/2, 250);
  x.fillStyle="#f6cf6a"; x.font="700 120px 'Space Mono', monospace";
  x.fillText(comma(weeksLeft()), W/2, 388);
  x.fillStyle="#8089a8"; x.font="400 32px 'Outfit', sans-serif";
  x.fillText("weeks remaining, "+Math.round(pctLived()*100)+" percent of a life lived", W/2, 442);

  /* grid: phase colours underneath, emoji markers on top */
  var gap=4, cell=14, pitch=cell+gap, marg=(W-(52*cell+51*gap))/2, gridY=520, rowsCap=Math.min(H,120);
  for(var yy=0; yy<rowsCap; yy++){
    for(var w=0; w<52; w++){
      var idx=yy*52+w, cellAge=yy+w/52, col;
      if(cellAge<aN) col="#f0b73e";
      else if(cellAge<R) col="rgba(69,200,216,.30)";
      else col="rgba(47,209,128,.26)";
      x.fillStyle=col;
      var cx=marg+w*pitch, cy=gridY+yy*pitch;
      x.beginPath();
      if(x.roundRect) x.roundRect(cx,cy,cell,cell,1.5); else x.rect(cx,cy,cell,cell);
      x.fill();
    }
  }
  /* emoji markers, drawn oversized and centred on their week */
  x.textAlign="center"; x.textBaseline="middle"; x.font="26px "+EMOJI_FONT;
  Object.keys(emo).forEach(function(k){
    var idx=+k, yy=Math.floor(idx/52), w=idx%52;
    if(yy>=rowsCap) return;
    var cx=marg+w*pitch+cell/2, cy=gridY+yy*pitch+cell/2;
    x.fillText(emo[k], cx, cy);
  });
  var gridBottom=gridY+rowsCap*pitch;

  /* legend, two columns, so nothing needs decoding */
  x.textBaseline="alphabetic";
  var ly=gridBottom+66, step=46;
  var colL=marg+6, colR=W/2+40;
  function swatchRow(cx0, yy, color, label){
    x.fillStyle=color; x.beginPath();
    if(x.roundRect) x.roundRect(cx0, yy-24, 30, 30, 4); else x.rect(cx0,yy-24,30,30);
    x.fill();
    x.fillStyle="#c9cee6"; x.textAlign="left"; x.font="400 29px 'Outfit', sans-serif";
    x.fillText(label, cx0+46, yy);
  }
  function emojiRow(cx0, yy, emoji, label){
    x.textAlign="left"; x.font="32px "+EMOJI_FONT; x.fillStyle="#fff";
    x.fillText(emoji, cx0, yy);
    x.fillStyle="#c9cee6"; x.font="400 29px 'Outfit', sans-serif";
    x.fillText(label, cx0+52, yy);
  }
  /* left column: the phases */
  swatchRow(colL, ly,        "#f0b73e", "Lived so far");
  swatchRow(colL, ly+step,   "#3f8fb0", "Years to retiring at "+R);
  swatchRow(colL, ly+step*2, "#2f9d6a", "Free years, "+R+" to "+H);
  emojiRow (colL, ly+step*3, "📍", "This week");
  /* right column: the people and the marks */
  var rightItems=[];
  (S.milestones||[]).forEach(function(ml){ if(ml.date) rightItems.push([ml.emoji||"📌", ml.label||"Milestone"]); });
  (S.companions||[]).forEach(function(c){
    var ci=companionInfo(c); if(!ci) return;
    rightItems.push([c.emoji||"🤝", c.label||"Bond"]);
    if(!ci.ongoing) rightItems.push(["🌈", "Goodbye to "+(c.label||"them")]);
  });
  if(goalWeekIdx()!=null) rightItems.push(["💰", "Reach "+fmtMoney((S.fin&&S.fin.target)||0)]);
  rightItems.slice(0,7).forEach(function(it, i){ emojiRow(colR, ly+step*i, it[0], it[1]); });

  /* tagline, clear of the legend */
  var legendBottom=ly+step*Math.max(4, Math.min(7,rightItems.length));
  x.textAlign="center"; x.fillStyle="#f6cf6a"; x.font="italic 600 34px 'Outfit', sans-serif";
  x.fillText("Spend them on purpose.", W/2, Math.max(legendBottom+58, Hh-90));
  return cv;
}
function showWallpaper(){

    w.innerHTML='<img src="'+url+'" alt="Your life in weeks" style="max-width:78%;max-height:64vh;border-radius:14px;border:1px solid rgba(120,130,180,.3);box-shadow:0 20px 60px rgba(0,0,0,.6)">'
      +'<div style="font-size:12.5px;color:#9aa2c0;text-align:center;line-height:1.5;max-width:330px">On iPhone, press and hold the image, then Save to Photos, and set it as your lock screen. On a computer, use Download.</div>'
      +'<div style="display:flex;gap:9px">'

      +'<button id="wallClose" style="padding:11px 18px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#9aa2c0;background:rgba(255,255,255,.06);border:1px solid rgba(120,130,180,.25)">Close</button>'
      +'</div>';
    w.addEventListener("click",function(e){ if(e.target===w) uiClose(); });

    document.getElementById("wallDl").onclick=function(){ downloadCanvas(cv); };

/* A Blob and an object URL download far more reliably than a giant data-URI
   anchor, which iOS ignores outright. On a phone that blocks the download we
   open the image in a new tab so it can still be saved to Photos. */
function downloadCanvas(cv){
  var name="hourglass-"+(new Date().toISOString().slice(0,10))+".png";
  var handoff=function(url, revoke){
    var a=document.createElement("a"); a.href=url; a.download=name;
    a.style.display="none"; document.body.appendChild(a);
    var clicked=false;
    try{ a.click(); clicked=true; }catch(e){}
    setTimeout(function(){
      document.body.removeChild(a);
      if(revoke) try{ URL.revokeObjectURL(url); }catch(e){}
    }, 4000);
    /* standalone iOS home-screen apps ignore download: fall back to opening it */
    if(navigator.standalone || (!clicked)){
      try{ window.open(url,"_blank"); }catch(e){}
    }
  };
  if(cv.toBlob){
    cv.toBlob(function(blob){
      if(!blob){ handoff(cv.toDataURL("image/png"), false); return; }
      handoff(URL.createObjectURL(blob), true);
    }, "image/png");
  } else {
    handoff(cv.toDataURL("image/png"), false);
  }
}

    +'<div class="mono" style="font-size:19px;font-weight:700;color:var(--green2);margin-top:3px">'+freeYears+'y</div>'
    +'<div style="font-size:9.5px;color:var(--dim);margin-top:2px">from '+R+' to '+H+', healthy</div></div>';

      +'The window that decides the whole back half is the smaller one, and it is running right now.</div>';
  }
  h+='<div style="font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:10px">Whether the numbers behind retirement actually hold is a question for The Summit and The Aqueduct. This tool only counts the time.</div>';
  h+='</div>';

  /* what is left, in things you can feel */
  var summers=Math.max(0, Math.round(H-aN));
  var kidMile=(S.milestones||[]).filter(function(m){ return m.date && /child|baby|born|son|daughter|kid/i.test(m.label||""); })[0];
  h+='<div class="panel fadeUp">';
  h+='<div class="eyebrow" style="margin-bottom:4px">What is left, in things you can feel</div>';
  h+='<div style="font-size:11px;color:var(--dim);line-height:1.5;margin-bottom:11px">Weeks are abstract. These are not.</div>';
  h+=feelRow(comma(summers), "summers", "if the leaves changing is something you want to be awake for");
  h+=feelRow(comma(Math.round(daysLeft())), "days", "each one a decision about where your attention goes");
  if(!retired) h+=feelRow(comma(Math.max(0,Math.round(weeksToRetire()))), "weekends until you are free", "the count between now and retiring at "+R);
  if(kidMile && kidMile.date){
    var kb=new Date(kidMile.date+"T00:00:00");
    if(!isNaN(kb.getTime())){
      var kidLeavesHome=plusYears(kb,18);
      var yrsAtHome=(kidLeavesHome.getTime()-Math.max(Date.now(),kb.getTime()))/(DAYS_YR*MS_DAY);
      if(yrsAtHome>0) h+=feelRow(Math.max(0,Math.round(yrsAtHome)), "years with your child at home", "before they are grown and the house is quieter");
    }
  }
  h+='</div>';

  /* the people, and the time with them */
  var comps=(S.companions||[]).map(companionInfo).filter(function(x){ return x; });
  if(comps.length){
    var H=healthyAge();
    h+='<div class="panel fadeUp">';
    h+='<div class="eyebrow" style="margin-bottom:4px">The time you have with them</div>';
    h+='<div style="font-size:11px;color:var(--dim);line-height:1.5;margin-bottom:13px">Each bar is a life laid over yours. The solid part is shared already, the faint part is what remains if the years hold.</div>';
    comps.forEach(function(ci){
      var s0=Math.max(0,ci.startAge)/H*100, e0=Math.min(H,ci.endAge)/H*100, nowP=Math.min(H,ci.nowA)/H*100;

      h+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">'
        +'<span style="font-size:13px;color:var(--txt);font-weight:600">'+esc(ci.label)+'</span>'
        +'<span class="mono" style="font-size:11px;color:'+ci.color+'">'+(ci.ended?"complete":Math.round(ci.yearsLeft)+" years left")+'</span></div>';

      h+='<div style="position:absolute;left:'+s0+'%;width:'+Math.max(0,e0-s0)+'%;top:0;bottom:0;background:'+ci.color+';opacity:.22"></div>';
      /* shared (solid) */
      h+='<div style="position:absolute;left:'+s0+'%;width:'+Math.max(0,sharedEnd-s0)+'%;top:0;bottom:0;background:'+ci.color+'"></div>';
      h+='</div>';
      /* now marker line */
      h+='<div style="position:relative;height:0">'
        +'<div style="position:absolute;left:'+nowP+'%;top:-16px;width:2px;height:16px;background:#fff;opacity:.7"></div></div>';
      h+='<div style="font-size:11px;color:var(--muted);line-height:1.5;margin-top:7px">'+companionLine(ci)+'</div>';
      h+='</div>';
    });
    h+='<div style="font-size:10px;color:var(--dim);line-height:1.5;margin-top:2px">The white tick on each bar is now. Marriage is capped at your own healthy years here, since only your date is set.</div>';
    h+='</div>';
  }

  /* the reframe */
  h+='<div class="panel fadeUp" style="border-color:rgba(240,183,62,.25);background:linear-gradient(180deg,rgba(240,183,62,.05),rgba(20,24,48,.4))">';
  h+='<div style="font-size:12.5px;color:var(--gold2);line-height:1.65;font-style:italic">'
    +'"You could leave life right now. Let that determine what you do and say and think." The point of counting is not fear. It is that a finite thing, seen clearly, gets spent on purpose. This is the tool that answers the question you started with.</div>';
  h+='</div>';
  return h;
}
function companionLine(ci){
  if(ci.ended) return "That window has closed. "+Math.round(ci.yearsSoFar)+" years shared.";
  var soFar=Math.round(ci.yearsSoFar), left=Math.round(ci.yearsLeft), ageEnd=Math.round(ci.rawEndAge);
  var weekendsLeft=Math.round(ci.yearsLeft*52);
  if(ci.ongoing){
    var possible=Math.round(ci.endAge-Math.max(0,ci.startAge));
    var pctAhead=possible>0?Math.round(ci.yearsLeft/possible*100):0;
    return "Begun at age "+Math.round(ci.startAge)+". Up to about "+possible+" years together if you reach "+healthyAge()+", and you are roughly "+soFar+" in. Close to "+pctAhead+" percent of it is still ahead.";
  }
  return "About "+soFar+" years in already. Around "+left+" years remain, and you will be about "+ageEnd+" at the end. That is close to "+comma(weekendsLeft)+" weekends left, so spend them outside.";
}
function feelRow(big, unit, sub){
  return '<div style="display:flex;align-items:baseline;gap:9px;padding:9px 0;border-bottom:1px solid rgba(120,130,180,.08)">'
    +'<span class="mono" style="font-size:17px;font-weight:700;color:var(--gold2);flex-shrink:0;min-width:58px">'+big+'</span>'
    +'<div style="min-width:0"><div style="font-size:12.5px;color:var(--txt)">'+unit+'</div>'
    +'<div style="font-size:10.5px;color:var(--dim);line-height:1.4">'+sub+'</div></div></div>';
}

function startTicker(){
  clearTicker();
  TICKER=setInterval(function(){
    var dd=document.getElementById("tickDays"), tc=document.getElementById("tickClock");
    if(!dd||!tc){ clearTicker(); return; }
    var msLeft=Math.max(0, deathDate().getTime()-Date.now());
    var days=Math.floor(msLeft/MS_DAY);
    var rem=msLeft-days*MS_DAY;
    var hh=Math.floor(rem/3600000), mm=Math.floor((rem%3600000)/60000), ss=Math.floor((rem%60000)/1000);
    dd.textContent=comma(days);
    tc.textContent=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0")+" of today's turn";
  },1000);
  /* prime it immediately */
  var tc=document.getElementById("tickClock");
  if(tc){ var msLeft=Math.max(0,deathDate().getTime()-Date.now()); var rem=msLeft-Math.floor(msLeft/MS_DAY)*MS_DAY;
    var hh=Math.floor(rem/3600000),mm=Math.floor((rem%3600000)/60000),ss=Math.floor((rem%60000)/1000);
    tc.textContent=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0")+" of today's turn"; }
}

/* ===================== WIRING ===================== */
function wire(){
  var app=document.getElementById("app");
  app.querySelectorAll("[data-tab]").forEach(function(b){
    b.onclick=function(){ S.tab=b.dataset.tab; save(); window.scrollTo(0,0); render(); };
  });

  /* text fields do not rebuild while typing; date/select reconcile on change */
  app.querySelectorAll("[data-s]").forEach(function(el){
    var k=el.dataset.s;
    if(el.type==="date"){ el.onchange=function(){ S[k]=el.value; save(); render(); }; }
    else {
      el.oninput=function(){ S[k]=toNum(el.value); save(); refreshPill(); };
      el.onchange=function(){ save(); render(); };
    }
  });
  app.querySelectorAll("[data-m]").forEach(function(el){
    var m=S.milestones.filter(function(x){ return x.id===el.dataset.m; })[0]; if(!m) return;
    if(el.type==="date"){ el.onchange=function(){ m.date=el.value; save(); render(); }; }
    else { el.oninput=function(){ m.label=el.value; save(); }; el.onchange=function(){ save(); render(); }; }
  });
  app.querySelectorAll("[data-f]").forEach(function(el){
    var k=el.dataset.f;
    if(el.tagName==="SELECT"){ el.onchange=function(){ S.fin[k]=el.value; save(); render(); }; }
    else {
      el.oninput=function(){ S.fin[k]=(k==="growthPct")?toNum(el.value):toNum(el.value); save(); };
      el.onchange=function(){ save(); render(); };
    }
  });
  app.querySelectorAll("[data-c]").forEach(function(el){
    var c=S.companions.filter(function(x){ return x.id===el.dataset.c; })[0]; if(!c) return;
    var k=el.dataset.k;
    if(el.type==="date"){ el.onchange=function(){ c[k]=el.value; save(); render(); }; }
    else { el.oninput=function(){ c[k]=el.value; save(); }; el.onchange=function(){ save(); render(); }; }
  });
  var addC=document.getElementById("addComp");
  if(addC) addC.onclick=function(){ S.companions.push({id:uid(),label:"",start:"",end:"",color:"#9d7bff"}); save(); render(); };
  app.querySelectorAll("[data-delc]").forEach(function(b){
    b.onclick=function(){
      var snap=JSON.stringify(S.companions);
      S.companions=S.companions.filter(function(x){ return x.id!==b.dataset.delc; });
      save(); render(); toast("Bond removed","Undo",function(){ S.companions=JSON.parse(snap); save(); render(); });
    };
  });
  var mw=document.getElementById("makeWall");
  if(mw) mw.onclick=showWallpaper;
  var am=document.getElementById("addMile");
  if(am) am.onclick=function(){ S.milestones.push({id:uid(),label:"",date:""}); save(); render(); };
  app.querySelectorAll("[data-delm]").forEach(function(b){
    b.onclick=function(){
      var snap=JSON.stringify(S.milestones);
      S.milestones=S.milestones.filter(function(x){ return x.id!==b.dataset.delm; });
      save(); render(); toast("Milestone removed","Undo",function(){ S.milestones=JSON.parse(snap); save(); render(); });
    };
  });
  var ra=document.getElementById("resetAll");
  if(ra) ra.onclick=function(){
    uiConfirm("Reset the Hourglass?","This clears your dates and milestones back to the defaults.","Reset",function(){
      var snap=JSON.stringify(S);
      S=JSON.parse(JSON.stringify(DEF)); S.created=new Date().toISOString().slice(0,10); save(); render();
      toast("Reset","Undo",function(){ S=JSON.parse(snap); save(); render(); });
    }, true);
  };
}
function refreshPill(){
  var pill=document.querySelector(".appbar-pill");
  if(pill) pill.innerHTML=comma(weeksLeft())+' <span style="font-size:9px;color:var(--dim);font-weight:400">weeks left</span>';
}

render();
(function(){
  try{
    if(navigator.storage && navigator.storage.persist && navigator.storage.persisted){
      navigator.storage.persisted().then(function(a){ if(!a) navigator.storage.persist(); });
    }
  }catch(e){}
})();
</script>
