:root{--ink:#182c27;--ink-light:#38544b;--muted:#546861;--paper:#f3f5f0;--surface:#fff;--stroke:#dce5de;--green:#1d6651;--leaf:#def1e6;--amber:#8b4f25;--amber-bg:#fff2e1;--red:#9a3f38;--red-bg:#f9e9e6;--hero:#183b33;--hero-light:#adc9bc;--shadow:0 3px 14px #17412609;--radius:18px;font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #3d9279;outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.8rem,3.8vw,2.9rem);letter-spacing:-.05em;line-height:1.05;font-weight:750}
h2{font-size:1.25rem;line-height:1.2;letter-spacing:-.027em}
h3{font-size:1rem;line-height:1.3}
p{color:var(--muted)}
small,.small{font-size:.82rem;color:var(--muted)}
strong{font-weight:700}
.money,.numeral{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top);z-index:5;background:#fff;border-bottom:1px solid var(--stroke)}
.top-inner{max-width:1240px;margin:auto;padding:14px 28px 0}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.16rem;font-weight:770;letter-spacing:-.05em}
.brand-mark{width:33px;height:33px;border-radius:10px;background:#246a56;display:grid;place-items:center;position:relative;color:white;flex:none}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;border:2px solid currentColor;border-top-left-radius:18px;border-top-right-radius:18px;border-bottom:0;width:15px;height:12px;bottom:9px}
.brand-mark:after{width:7px;height:8px;color:#bce7d2}
.nav{display:flex;gap:16px;overflow:auto;margin-top:13px;scrollbar-width:thin}
.nav button{background:transparent;border:0;border-bottom:3px solid transparent;padding:9px 3px 10px;white-space:nowrap;font-weight:650;font-size:.87rem;color:var(--muted)}
.nav button[aria-current="page"]{border-color:#26745f;color:var(--green)}
main{max-width:1240px;margin:0 auto;padding:28px 28px 64px}
.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:0 0 20px}
.page-head h1+p{margin-top:8px}
.banner{display:flex;gap:10px;align-items:start;background:var(--leaf);color:#244f42;border:1px solid #c8e6d6;padding:11px 14px;border-radius:12px;margin-bottom:16px}
.banner.warning{background:var(--amber-bg);border-color:#f0ddc1;color:var(--amber)}
.banner.error{background:var(--red-bg);border-color:#f1d3cf;color:var(--red)}
.banner p{color:inherit}
.panel{padding:20px;background:var(--surface);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.panel+.panel,.section-gap{margin-top:15px}
.panel-title{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-title p{font-size:.86rem;margin-top:5px}
.hero{background:var(--hero);color:white;padding:24px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.hero p,.hero .small{color:#cce0d6}
.hero h2{color:#dbece4;font-size:.87rem;font-weight:680;letter-spacing:.015em}
.hero-grid{display:grid;grid-template-columns:1.04fr 1fr;align-items:center;gap:20px}
.hero-value{font-size:clamp(2.4rem,6vw,4rem);line-height:1.12;letter-spacing:-.075em;margin:6px 0;font-weight:750}
.hero canvas{display:block;width:100%;height:142px}
.hero-key{display:flex;justify-content:space-between;font-size:.77rem;color:#cce0d6}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 17px}
.stat{background:#fff;border:1px solid var(--stroke);border-radius:14px;padding:13px 15px}
.stat h3{font-size:.8rem;color:var(--muted);font-weight:660}
.stat .value{font-size:1.35rem;font-weight:740;letter-spacing:-.04em;margin-top:3px;overflow-wrap:anywhere}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:start}
.grid-2>.panel{margin:0}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions.end{justify-content:flex-end}
.btn{border:1px solid var(--stroke);padding:7px 12px;color:var(--ink);background:#fff;min-height:39px;border-radius:9px;line-height:1.25;font-weight:650;white-space:normal}
.btn:hover,.btn[aria-pressed="true"]{background:#ebf3ee;border-color:#c6ddcf}
.btn.primary{color:white;background:var(--green);border-color:var(--green)}
.btn.primary:hover{background:#154f3e}
.btn.quiet{background:transparent}
.btn.danger{color:var(--red)}
.btn.mini{font-size:.8rem;min-height:32px;padding:4px 8px}
.link-button{border:0;background:transparent;padding:0;text-align:left;font-weight:680;color:var(--green);text-decoration:underline;text-underline-offset:2px}
.pill{display:inline-flex;align-items:center;white-space:nowrap;border-radius:999px;padding:3px 8px;color:#285846;background:var(--leaf);font-size:.74rem;font-weight:700}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.dim{background:#eef1ee;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:grid;gap:4px;font-size:.84rem;font-weight:650;align-content:start;min-width:0}
.field small{font-size:.74rem;font-weight:500}
.field.wide{grid-column:1/-1}
input:not([type=checkbox]),select,textarea{width:100%;min-height:40px;border:1px solid #c9d8cf;border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
input[type=checkbox]{height:17px;width:17px;accent-color:var(--green);flex:none}
input[type=file]{padding:5px;max-width:100%}
input[type=file]::file-selector-button{font:inherit;border:0;background:var(--leaf);color:#204f42;padding:6px 10px;border-radius:5px;margin-right:7px;cursor:pointer}
textarea{resize:vertical;min-height:70px}
.check{display:flex;align-items:center;gap:7px;font-size:.85rem;font-weight:570}
.stack>*+*{margin-top:10px}
.list{list-style:none;padding:0;margin:0}
.list>li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #e9efea}
.list>li:last-child{border-bottom:0}
.list>li>div{min-width:0;overflow-wrap:anywhere}
.list .small{display:block}
.empty{padding:13px;background:#f6f8f5;color:var(--muted);border-radius:10px;font-size:.87rem}
.table-wrap{overflow:auto;max-width:100%;scrollbar-width:thin}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.87rem}
th{font-size:.75rem;letter-spacing:.015em;color:var(--muted);background:#f4f7f3;text-align:left;font-weight:720}
th,td{padding:9px 10px;border-bottom:1px solid #e8eeea;vertical-align:middle}
td:first-child{min-width:104px}
th:first-child{border-top-left-radius:7px}
th:last-child{border-top-right-radius:7px}
td.money,th.money{text-align:right;white-space:nowrap}
td.desc{min-width:210px;overflow-wrap:anywhere}
td.muted{color:var(--muted)}
td.negative,.negative{color:var(--red)}
.table-controls{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:10px}
hr{border:0;border-top:1px solid var(--stroke);margin:15px 0}
details.subtle{border:1px solid var(--stroke);border-radius:10px;padding:9px 11px}
details.subtle+details{margin-top:8px}
summary{cursor:pointer;font-weight:650}
details[open]>summary{margin-bottom:9px}
dialog{color:var(--ink);border:1px solid var(--stroke);border-radius:17px;padding:20px;max-height:calc(100dvh - 36px);width:min(720px,calc(100% - 25px));box-shadow:0 14px 65px #182e294a}
dialog::backdrop{background:#122d276f}
.dialog-title{display:flex;align-items:start;justify-content:space-between;gap:10px;margin-bottom:13px}
.form-error{color:var(--red);font-size:.85rem;font-weight:620}
.toast{position:fixed;bottom:16px;right:16px;max-width:min(430px,calc(100vw - 32px));background:#183b33;color:#fff;padding:12px 15px;border-radius:12px;z-index:20;box-shadow:0 5px 25px #1235}
.toast.error{background:#752e2a}
.welcome{min-height:100vh;display:grid;place-items:center;padding:22px}
.welcome .panel{max-width:580px;width:100%;padding:clamp(17px,5vw,30px)}
.welcome h1{margin:16px 0 10px}
.welcome .actions{margin-top:12px}
.welcome hr{margin:19px 0}
.tag{font-size:.78rem;display:inline-block;border:1px solid var(--stroke);border-radius:8px;padding:3px 7px;margin:0 3px 3px 0;color:var(--muted)}
.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.plan{border:1px solid var(--stroke);border-radius:12px;padding:13px;background:#f9fbf8;min-width:0}
.plan.selected{background:#eff8f2;border-color:#b9d9c8}
.plan h3{margin-bottom:5px}
.plan .list>li{align-items:start;font-size:.83rem}
.row-actions{display:flex;gap:5px;justify-content:flex-end;align-items:center}
.calendar-label{white-space:nowrap}
.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
@media(max-width:760px){.top-inner{padding:11px 14px 0}.nav{gap:13px;margin-top:8px}.nav button{font-size:.83rem}.brand-row .small{display:none}main{padding:19px 14px 50px}.page-head{align-items:start;flex-direction:column;gap:9px;margin-bottom:13px}.panel,.hero{padding:15px}.grid-2,.hero-grid,.plan-grid{grid-template-columns:1fr}.hero-grid{gap:12px}.hero canvas{height:106px}.form-grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:9px}.stat .value{font-size:1.05rem}}
@media(max-width:390px){.brand{font-size:1.05rem}.brand-row{gap:4px}.form-grid,.form-grid.cols-3{grid-template-columns:1fr}.stat-grid{gap:5px}.stat .value{font-size:.95rem}.btn.mini{padding:5px 6px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media print{.top,.btn,.link-button,.actions,.toast,dialog{display:none!important}main{padding:0}.panel,.hero{break-inside:avoid}}

@media(max-width:600px){
  .top-inner{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  main{padding-bottom:max(50px, env(safe-area-inset-bottom))}
  .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px 6px;margin-top:8px;overflow:visible}
  .nav button{min-height:42px;padding:5px 2px;white-space:normal;line-height:1.15}
  .btn,.btn.mini{min-height:42px}
  input:not([type=checkbox]),select,textarea{font-size:16px}
  .toast{bottom:max(16px,env(safe-area-inset-bottom))}
}

.atlas-return{display:inline-flex;align-items:center;min-height:42px;padding:4px 8px;font-weight:650;color:var(--green);text-decoration:none;border-radius:9px}
.atlas-return:hover,.btn:active{background:#ebf3ee}
.btn.primary:active{background:#154f3e}
@media(max-width:600px){.btn,.btn.mini,.nav button,.atlas-return{min-height:44px}}

.chat-start{display:grid;gap:9px;justify-items:start;margin:14px 0 18px}
.manual-import{margin-bottom:15px}
.welcome .atlas-return{display:inline;min-height:0}

/* Household dashboard */
:root {
  --paper:#f7f6f1;
  --ink:#192e27;
  --hero:#133d30;
  --stroke:#dce4dc;
  --radius:20px;
}
body { font-size:15px; }
.top { background:#fff; }
.top-inner, main { max-width:1140px; }
.nav { display:flex; gap:20px; overflow:visible; margin-top:8px; }
.nav button { min-height:44px; }
.panel, .stat { box-shadow:none; }
.page-head h1 { font-weight:760; }
.home-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; }
.home-grid > .panel { margin-top:0; }
.home-secondary { margin-top:16px; }
.spending-hero {
  display:flex; flex-direction:column; justify-content:center;
  min-height:260px; padding:clamp(22px, 4vw, 38px);
  background:linear-gradient(138deg,#11372c,#19533f);
}
.spending-hero h2 { color:#d1eadd; font-size:1rem; }
.hero-value { font-size:clamp(2.65rem, 6vw, 4.65rem); letter-spacing:-.068em; overflow-wrap:anywhere; }
.hero-value.value-waiting { font-size:clamp(1.9rem,5vw,3.4rem); }
.hero-baseline {
  margin-top:24px; padding-top:16px; border-top:1px solid #bce7d24c;
  display:flex; align-items:end; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.hero-baseline span, .hero-baseline p { color:#d1eadd; font-size:.82rem; }
.hero-baseline strong { display:block; font-size:1.5rem; letter-spacing:-.03em; }
.hero-link.btn { color:white; background:#ffffff14; border:1px solid #bce7d268; min-height:44px; }
.hero-link.btn:hover, .hero-link.btn:active { background:#ffffff26; }
.event-list > li { padding:10px 0; align-items:start; }
.event-list > li:first-child { padding-top:0; }
.event-list strong { max-width:43%; text-align:right; }
.event-list small { display:block; }
.event-list .link-button, .category-title .link-button { font-size:1rem; text-align:left; }
.event-list .deposit { color:var(--green); }
.secondary-value { font-size:1.28rem; font-weight:740; margin-bottom:4px; }
.cash-visual { margin-top:14px; padding:12px; background:#eef5ee; border-radius:13px; }
.cash-visual canvas { display:block; width:100%; height:76px; }
.cash-alert { color:var(--amber); margin-top:8px; }
.review-strip {
  margin:14px 0; padding:12px 14px; border:1px solid var(--stroke); border-radius:14px;
  display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fff;
}
.review-strip p { font-size:.86rem; }
.categories { margin:0; padding:0; list-style:none; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.category, .debt-card { border:1px solid var(--stroke); border-radius:14px; padding:12px; min-width:0; }
.category-title { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.category-title strong { text-align:right; }
.category-title .btn { flex:none; }
.category-numbers, .debt-terms {
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin:8px 0 0;
}
.category-numbers small, .category-numbers strong, .debt-terms small { display:block; }
.category-numbers strong { font-size:.93rem; overflow-wrap:anywhere; }
.category progress { width:100%; height:5px; border:0; border-radius:6px; background:#e4ebe5; overflow:hidden; appearance:none; }
.category progress::-webkit-progress-bar { background:#e4ebe5; }
.category progress::-moz-progress-bar { background:#43876f; }
.category progress::-webkit-progress-value { background:#43876f; }
.debt-terms { grid-template-columns:repeat(auto-fit,minmax(min(100%,95px),1fr)); margin:12px 0 8px; }
.debt-terms dt { color:var(--muted); font-size:.8rem; }
.debt-terms dd { margin:0; font-weight:650; }
.section-tools { margin-bottom:12px; }
#spending-projects, #ledger-filters, #settings-accounts { scroll-margin-top:128px; }
.transaction-list > li > div { overflow-wrap:anywhere; }
@media(max-width:740px) {
  .nav { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:0; }
  .nav button { font-size:clamp(.71rem, 2.9vw, .86rem); padding-inline:0; white-space:nowrap; }
  .home-grid, .categories { grid-template-columns:minmax(0,1fr); }
  .home-grid, .home-secondary { gap:12px; }
  .home-secondary { margin-top:12px; }
  .spending-hero { min-height:0; }
  .category-title .link-button, .event-list .link-button, .home-grid .list .link-button { min-height:44px; }
  .spending-totals .stat { padding:10px 8px; }
  .spending-totals .stat .money { font-size:clamp(.88rem, 3.8vw, 1.2rem); overflow-wrap:anywhere; }
}

:root {
  --paper:#f5f1e8;
  --surface:#fffefa;
  --ink:#202638;
  --ink-light:#41495a;
  --muted:#596071;
  --hero:#142136;
  --green:#22694e;
  --stroke:#e3ddd1;
  --bronze:#83502b;
  --radius:24px;
}
body { font-size:16px; }
.top { background:#fffdf7f5; }
.top-inner, main { max-width:1160px; }
.top-inner { padding-top:12px; }
.brand { font-size:1.25rem; }
.brand-mark { background:#203447; }
.nav {
  display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:4px; overflow:visible;
  max-width:640px; margin:10px auto 0;
}
.nav .nav-tab {
  min-height:50px; display:flex; gap:5px; align-items:center; justify-content:center;
  border-radius:12px 12px 0 0; border-bottom-width:2px; padding:6px 2px;
}
.nav-tab svg { width:18px; height:18px; flex:none; }
.nav button[aria-current="page"] { border-color:#935d35; background:#f2e9db; color:#683e23; }
.page-head { margin-bottom:20px; }
.page-head h1 { font-weight:700; }
.page-head h1+p:empty { display:none; }
h2 { font-size:1.39rem; }
.panel, .stat { box-shadow:none; }
.panel-title { align-items:center; }
.btn { border-radius:999px; min-height:44px; }
.btn.mini { min-height:44px; padding:6px 12px; }
.btn.primary { color:#fff; background:var(--bronze); border-color:var(--bronze); }
.btn.primary:hover, .btn.primary:active { background:#663b22; border-color:#663b22; }
.link-button { text-decoration:none; min-height:44px; }
.link-button:hover { text-decoration:underline; }
input:not([type=checkbox]),select,textarea { border-radius:14px; min-height:44px; }
details.subtle { border-radius:15px; }
details.subtle summary { min-height:44px; align-content:center; }

.home-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; }
.home-grid > .panel { margin-top:0; }
.home-secondary { margin-top:16px; }
.spending-hero {
  isolation:isolate; position:relative; display:flex; flex-direction:column; justify-content:center;
  min-height:285px; padding:clamp(22px, 4vw, 38px); background:#102b25;
}

<script>'use strict';
const Engine = (() => {

  const cad = new Intl.NumberFormat('en-CA', {style:'currency',currency:'CAD'});

  const clean = s => String(s ?? '').trim();

  const empty = () => ({
    version:1, accounts:[], transactions:[], imports:[], rules:[], projects:[], bills:[], billStatus:{},
    loans:[], goals:[], targets:{}, excludedMonths:[], config:{window:45,floor:0,surplus:0,debtShare:70,flex:0,flexAccount:'',focus:'Highest rate'},
    updated:''

  function money(value) {
    let number = clean(value).replace(/[\u00a0\u202f\s]/g,'').replace(/[−–]/g,'-').replace(/CAD|USD|CA\$/gi,'').replace(/[$']/g,'');
    if (!number || /^[-—]$/.test(number)) return null;
    let polarity = 1;
    if (/^\(.*\)$/.test(number)) { polarity = -1; number = number.slice(1,-1); }
    if (/\s*DR$/i.test(number)) { polarity = -1; number = number.replace(/DR$/i,''); }
    if (/\s*CR$/i.test(number)) number = number.replace(/CR$/i,'');
    if (number.endsWith('-')) { polarity = -1; number = number.slice(0,-1); }

    if (!/^[+-]?(?:\d+(?:\.\d{1,2})?|\.\d{1,2})$/.test(number)) return null;
    const cents=round(Number(number)*100*polarity);
    return Number.isSafeInteger(cents) ? cents : null;
  }
  function dateValue(raw, order) {
    const value = clean(raw);
    const period = value.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})(?:[T ].*)?$/);
    const compact = value.match(/^(\d{4})(\d{2})(\d{2})$/);
    const numeric = value.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})$/);

    if (period || compact) [,y,m,d]=period || compact;
    else if (numeric) {
      y=numeric[3].length===2 ? String(2000+Number(numeric[3])) : numeric[3];
      [m,d]=order==='DMY' ? [numeric[2],numeric[1]] : [numeric[1],numeric[2]];

      const time=Date.parse(value+' UTC');
      if (Number.isFinite(time)) return new Date(time).toISOString().slice(0,10);
    }
    if (!y) return null;
    const result=y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0');
    return validDate(result) ? result : null;
  }
  function parseDelimited(input, delimiter) {
    const text=input.replace(/^\uFEFF/,'');
    const rows=[];
    let row=[], field='', quoted=false;
    for (let index=0; index<text.length; index++) {
      const c=text[index];
      if (c==='"') {
        if (quoted && text[index+1]==='"') { field+='"'; index++; }
        else if (quoted || field==='') quoted=!quoted;
        else field+=c;
      } else if (!quoted && c===delimiter) { row.push(field); field=''; }
      else if (!quoted && (c==='\n'||c==='\r')) {
        if (c==='\r' && text[index+1]==='\n') index++;

        if (row.some(x => clean(x))) rows.push(row);
        row=[]; field='';
      } else field+=c;

    if (quoted) throw new Error('An opening quote has no matching closing quote.');

  }
  const headers = {
    date:/^(?:(?:transaction|posting|posted|post|purchase|activity|operation|value) )?date$|^date (?:of transaction|de transaction|de l operation|d operation|posted)$/,

    amount:/^(?:(?:transaction|signed|cad|net|posted) )?amount(?: (?:cad|cad dollars|in cad|canadian dollars))?$|^montant(?: cad)?$/,
    debit:/^(?:debit|withdrawals?|money out|outflow|charges|spent)(?: (?:amount|cad))?$/,

      return {delimiter, rows, candidate, score};
    }).sort((a,b)=>b.score-a.score);

    if(best.score<0) throw new Error("This export has an unmatched quote.");

    const map=autoMap(probe);

  }
  const likelyTransfer = value => /\b(transfer|tfr|xfer|autopay payment|pmt received|payment received|visa payment|mc payment|mastercard payment|credit card payment|amex payment|online banking payment|thank you payment|payment thank you|paiement recu|paiement merci|payment to)\b/.test(normal(value));
  const transferPairHint = value => likelyTransfer(value) || /\b(payment|pmt|paiement)\b/.test(normal(value));
  const generalPatterns = [
    [/\b(payroll|pay deposit|salary|paycheque|direct deposit payroll|paye)\b/,'Income','Paycheque',1],
    [/\b(interest charge|interest charged|annual fee|bank fee|overdraft fee|service charge|cash advance fee|interet)\b/,'Spending','Interest & fees',-1],
    [/\b(superstore|sobeys|safeway|loblaws|save on foods|no frills|freshco|food fare|whole foods|metro grocery|iga)\b/,'Spending','Groceries',0],
    [/\b(tim hortons|starbucks|doordash|skip the dishes|skipthedishes|uber eats|restaurant|pizzeria|mcdonald|pizza pizza|a w|cafe|coffee shop)\b/,'Spending','Dining',0],
    [/\b(manitoba hydro|city of winnipeg utility|wpg water|shaw|rogers|bell mts|telus|enbridge)\b/,'Spending','Housing & utilities',0],
    [/\b(wawanesa|manitoba public insurance|mpi insurance|intact insurance|insurance premium)\b/,'Spending','Insurance',0],
    [/\b(esso|shell|petro canada|co op gas|winnipeg transit|parkmobile|indigo parking)\b/,'Spending','Transportation',0],
    [/\b(pharmacy|dental|physio|optometry|shoppers drug mart)\b/,'Spending','Health',0],
    [/\b(daycare|childcare|montessori)\b/,'Spending','Family',0],
    [/\b(veterinary|petsmart|pet valu|chewy)\b/,'Spending','Pets',0],
    [/\b(netflix|spotify|apple com bill|disney plus|crave|youtube premium)\b/,'Spending','Subscriptions',0],
    [/\b(air canada|westjet|airbnb|holiday inn|porter airlines)\b/,'Spending','Travel',0]
  ];
  function savedRule(state,row) {
    const merchant=normal(row.description), direction=Math.sign(row.amount);
    return [...state.rules].reverse().find(r=>r.merchant===merchant&&r.direction===direction&&(!r.account||r.account===row.account));
  }
  function classify(state,row) {
    const key=normal(row.description), direction=Math.sign(row.amount);
    const rule=savedRule(state,row);
    if(rule)return {kind:rule.kind,category:rule.category,project:rule.project,why:'Saved rule'};
    if (likelyTransfer(key) || /\b(e transfer|etransfer|interac|e trf|cash withdrawal|atm|home depot|rona|costco|walmart|amazon|amzn|canadian tire)\b/.test(key)) {
      return {kind:'Review',category:'',project:'',why: transferPairHint(key) ? 'Transfer, payment, income or reimbursement?' : 'Which category or project does this belong to?'};
    }
    const match=generalPatterns.find(([pattern,, ,sign])=>pattern.test(key) && (!sign||sign===direction));
    if (!match) return {kind:'Review',category:'',project:'',why:direction>0?'Income, transfer, refund or reimbursement?':'What was this purchase for?'};

  function fingerprint(row) {

  function extract(rows,map,options,state,account) {

      const rawDate=at(row,map.date), description=at(row,map.description);

      let amount=null;

        const debitRaw=at(row,map.debit),creditRaw=at(row,map.credit);

    },(a,b)=>a.type===b.type,(saved,data,raw)=>{

      if(saved.asOf&&data.asOf<saved.asOf)return;
      const fields=['balance','asOf','rate','rateType','method','payment','frequency','minimumPercent','renewal','nextDue','account','rateAfter','rateDate','prepay','source','note'];

      status:option(x.status??'Active',['Active','Planned','Complete'],'project status'),
      unbilled:optionalMoney(x.unbilled,'unbilled project amount'),loan:lookup(loans,x.loan,'project debt',true),
      note:optionalText(x.note,'project note')}),()=>true,(saved,data,raw)=>{
      for(const field of ['status','unbilled','loan','note'])if(Object.hasOwn(raw,field))saved[field]=data[field];
    });

      deadline:date(x.deadline,'goal deadline',true),priority:integer(x.priority??1,'goal priority',1,99)}),
      ()=>true,(saved,data,raw)=>{
        for(const field of ['target','saved','deadline','priority'])if(Object.hasOwn(raw,field))saved[field]=data[field];
      });
    function classification(entry) {
      const kind=option(entry.kind??'Review',E.kinds,'transaction type');
      const project=kind==='Project'?lookup(projects,entry.project,'transaction project'):'';
      const category=['Spending','Reimbursement'].includes(kind)?text(entry.category,'category',60):optionalText(entry.category,'category',60);
      return {kind,category,project};
    }
    function reviewed(entry,amount){
      const base=classification(entry);
      let allocations;
      if(entry.allocations!==undefined) {
        if(!Array.isArray(entry.allocations)||entry.allocations.length!==2)fail('A split needs two amounts.');
        allocations=entry.allocations.map(a=>{
          object(a,'Transaction split');

        delete base.amount;
      }
      return {...base,allocations,manual:base.kind!=='Review',
        why:optionalText(entry.question,'transaction question',240)||(base.kind==='Review'?'Confirm category or project in chat.':'Prepared in chat'),
        note:optionalText(entry.note,'transaction note')};
    }
    const packetKeys=new Set();
    const priorSources=new Set(state.imports.map(x=>x.sourceKey).filter(Boolean));
    for(const packet of list(update.statements,'statements')){
      object(packet,'Statement');
      const sourceKey=key(packet.key,'statement ID'),account=lookup(accounts,packet.account,'statement account');
      if(packetKeys.has(sourceKey))fail('The chat update repeats a statement ID.');
      packetKeys.add(sourceKey);
      const start=date(packet.start,'start of statement'),end=date(packet.end,'end of statement');
      if(end<start||end>today)fail('Check the date range for a statement.');
      const id=E.id(), name=text(packet.label,'statement label',120);
      const issues=integer(packet.issueCount??0,'unresolved rows',0,100_000);
      const coverageConfirmed=flag(packet.coverageConfirmed,false,'confirmed statement coverage')&&!issues;
      const rows=list(packet.transactions,'statement transactions').map(entry=>{
        object(entry,'Transaction');
        const day=date(entry.date,'transaction date');
        if(day<start||day>end)fail('A transaction falls outside its statement dates.');
        const amount=signed(entry.amount,'transaction amount');
        const description=text(entry.description,'transaction description',240);
        const external=optionalText(entry.external,'transaction reference',140);
        const t={id:E.id(),importId:id,account,date:day,amount,description,external,pair:'',...reviewed(entry,amount)};
        const rule=t.kind==='Review'&&!t.allocations?E.savedRule(state,t):null;
        if(rule&&rule.kind!=='Review'&&(rule.kind!=='Project'||state.projects.some(p=>p.id===rule.project))) {
          Object.assign(t,{kind:rule.kind,category:rule.category,project:rule.project,manual:true,why:'Saved rule'});
        }
        return {transaction:t};
      });
      E.duplicateReview(state.transactions,rows);
      const accepted=rows.filter(x=>!x.duplicate).map(x=>x.transaction);
      if(!accepted.length&&priorSources.has(sourceKey)){result.duplicates+=rows.length;continue;}
      for(const t of accepted){state.transactions.push(t);touched.add(t.id);}
      state.imports.push({id,account,name,start,end,coverageConfirmed,balanceCheck:packet.reconciled===true?'Balances tie':'Unverified',
        issueCount:issues,count:accepted.length,approved:today,sourceKey});
      result.added+=accepted.length;
      result.duplicates+=rows.length-accepted.length;
      result.statements++;
    }
    for(const entry of list(update.corrections,'corrections')) {
      object(entry,'Correction');
      const account=lookup(accounts,entry.account,'correction account');
      const d=date(entry.date,'correction date'),amount=signed(entry.amount,'correction amount');
      const description=text(entry.description,'description of the corrected transaction',240);
      const external=optionalText(entry.external,'correction reference',140);
      const matches=state.transactions.filter(t=>t.account===account&&t.date===d&&t.amount===amount&&lower(t.description)===lower(description)&&(!external||external===t.external));
      if(matches.length!==1)fail('A correction does not match one transaction in your ledger.');
      const t=matches[0];
      if(flag(entry.onlyReview,false,'apply to unclassified rows only')&&(t.kind!=='Review'||t.allocations?.length))continue;
      if(t.pair)fail('A correction refers to a linked transfer. Unlink it in the dashboard before reclassifying it.');
      Object.assign(t,reviewed(entry,amount));
      touched.add(t.id);result.corrected++;
    }
    for(const match of E.matchTransfers(state.transactions,state.accounts)) {
      if(!touched.has(match.left.id)&&!touched.has(match.right.id))continue;
      for(const [t,other] of [[match.left,match.right],[match.right,match.left]]) {
        t.beforePair={kind:t.kind,category:t.category,project:t.project,why:t.why,manual:t.manual};
        Object.assign(t,{kind:'Transfer',category:match.label,project:'',pair:other.id,manual:true,why:'Matched to '+other.description});
      }
    }
    for(const t of list(update.targets,'targets')){
      object(t,'Category target');
      const category=text(t.category,'target category',60);
      if(['__proto__','constructor','prototype'].includes(category))fail('Check the target category.');
      const method=option(t.method,['Recent history','Fixed','Annual'],'target method');
      const amount=method==='Recent history'?null:integer(t.amount,'target amount');
      if(!Object.hasOwn(state.targets,category))state.targets[category]={method,amount,note:optionalText(t.note,'target reason',140)};
    }
    for(const m of list(update.excludedMonths,'baseline months')){
      if(typeof m!=='string'||!/^\d{4}-\d{2}$/.test(m)||!E.validDate(m+'-01'))fail('Check the excluded baseline month.');
      if(!state.excludedMonths.includes(m))state.excludedMonths.push(m);
    }
    if(update.config){
      const c=update.config;
      if(Object.hasOwn(c,'surplus'))state.config.surplus=integer(c.surplus,'monthly surplus');
      if(Object.hasOwn(c,'debtShare'))state.config.debtShare=integer(c.debtShare,'debt allocation',0,100);
      if(Object.hasOwn(c,'floor'))state.config.floor=integer(c.floor,'cash buffer');
      if(Object.hasOwn(c,'focus'))state.config.focus=option(c.focus,['Highest rate','Lowest balance'],'debt priority');
    }
    result.review=state.transactions.filter(t=>touched.has(t.id)&&t.kind==='Review').length;
    result.id=update.id;result.date=today;
    state.chatUpdates=[...updates,result];
    return result;
  }
  return {read,apply};
})();

'use strict';
const Vault=(() => {
  const storageKey='aqueduct-offline-v1';
  const encoder=new TextEncoder();
  const decoder=new TextDecoder();
  const ITERATIONS=600000;
  const encode=bytes=>{
    let chars='';
    for(let i=0;i<bytes.length;i+=8192) chars+=String.fromCharCode(...bytes.subarray(i,i+8192));
    return btoa(chars);
  };
  const decode=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
  const random=n=>crypto.getRandomValues(new Uint8Array(n));
  function parse(serialized) {
    let b;
    try { b=JSON.parse(serialized); } catch { throw new Error('Select an Aqueduct encrypted backup.'); }
    if (!b||b.format!=='AqueductVault'||b.version!==1||b.iterations!==ITERATIONS||
        typeof b.data!=='string'||typeof b.salt!=='string'||typeof b.iv!=='string'||b.data.length>100_000_000||
        decode(b.salt).length!==16||decode(b.iv).length!==12) throw new Error('This backup format is invalid or unsupported.');
    return b;
  }
  async function key(password,salt) {
    if(!crypto.subtle) throw new Error('Encryption is unavailable in this browser context. Download the HTML and open it directly in Safari or Chrome.');
    const base=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITERATIONS,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function seal(state,secret,salt) {
    const iv=random(12);
    const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},secret,encoder.encode(JSON.stringify(state)));
    return JSON.stringify({format:'AqueductVault',version:1,iterations:ITERATIONS,salt:encode(salt),iv:encode(iv),data:encode(new Uint8Array(encrypted))});
  }
  function validate(state) {
    if (!state || state.version!==1 || !['accounts','transactions','imports','rules','projects','bills','loans','goals','excludedMonths'].every(k=>Array.isArray(state[k])) ||
        !['config','targets','billStatus'].every(k=>state[k] && typeof state[k]==='object')) throw new Error('The ledger format is unsupported.');
    return state;
  }
  async function open(serialized,password) {
    const b=parse(serialized);
    const salt=decode(b.salt), secret=await key(password,salt);
    let state;
    try {
      const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(b.iv)},secret,decode(b.data));
      state=JSON.parse(decoder.decode(bytes));
    } catch { throw new Error('Incorrect passphrase or the backup was altered.'); }
    return {state:validate(state),secret,salt};
  }
  async function create(state,password) {
    const salt=random(16);
    const secret=await key(password,salt);
    return {state,secret,salt};
  }
  const get=()=>{try{return localStorage.getItem(storageKey);}catch{return null;}};
  const put=serialized=>localStorage.setItem(storageKey,serialized);
  return {storageKey,parse,open,create,seal,get,put};
})();

  async function write(change) {
    if(saving) throw new Error('A save is already in progress. Try again in a moment.');

    saving=true;
    try {
      const next=structuredClone(S);
      change(next);
      next.updated=new Date().toISOString();
      if(!sample) {
        const blob=await Vault.seal(next,session.secret,session.salt);
        if(!memoryOnly) {
          saveToBrowser(blob,lastStored);

  function drawChart() {
    const el=document.getElementById('cash-chart'); if(!el) return;
    const p=E.forecast(S,E.today());
    const ratio=window.devicePixelRatio||1, w=el.clientWidth, h=el.clientHeight;
    el.width=w*ratio;el.height=h*ratio;
    const g=el.getContext('2d');g.scale(ratio,ratio);
    if(!p.verified.length) {
      g.setLineDash([5,5]);g.strokeStyle='#43876f';g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
      return;
    }
    const top=Math.max(...p.points.map(x=>x.total),S.config.floor), bottom=Math.min(p.low,S.config.floor);
    const y=value=>h-12-(value-bottom)/(top-bottom||1)*(h-24);
    const x=date=>5+(w-10)*E.distance(E.today(),date)/S.config.window;
    const points=[...p.points,{date:p.end,total:p.ending}];
    const path=()=>{
      g.beginPath();g.moveTo(x(points[0].date),y(points[0].total));
      for(let i=1;i<points.length;i++){g.lineTo(x(points[i].date),y(points[i-1].total));g.lineTo(x(points[i].date),y(points[i].total));}
    };
    path();g.lineTo(w-5,h);g.lineTo(5,h);g.closePath();
    const gradient=g.createLinearGradient(0,0,0,h);
    gradient.addColorStop(0,'#43876f35');gradient.addColorStop(1,'#43876f04');
    g.fillStyle=gradient;g.fill();
    g.strokeStyle='#276a54';g.lineWidth=2.5;path();g.stroke();
    g.setLineDash([5,4]);g.lineWidth=1;g.strokeStyle='#a86d37';g.beginPath();g.moveTo(5,y(S.config.floor));g.lineTo(w-5,y(S.config.floor));g.stroke();
  }

  function currentReview(id) {

  async function saveQuick(id,classification) {
    const card=currentReview(id);
    const remember=classification?.kind==='Spending'&&card.eligible&&root.querySelector('#quick-remember')?.checked;
    const previous=card.rows.map(t=>structuredClone(t));
    let previousRules=null;
    await write(next=>{
      if(card.type==='pair') {
        applyPair(next,card.rows[0].id,card.rows[1].id,card.label);
        return;
      }
      for(const t of card.rows)Object.assign(byId(next.transactions,t.id),classification,{manual:true,why:'Confirmed in quick review'});
      if(remember) {
        const t=card.rows[0], merchant=E.normal(t.description), direction=Math.sign(t.amount);
        previousRules=structuredClone(next.rules);
        next.rules=next.rules.filter(r=>r.account!==t.account||r.merchant!==merchant||r.direction!==direction);
        next.rules.push({...classification,account:t.account,merchant,direction});
      }
    });
    if(!S)return;
    quickUndo={state:S,previous,previousRules};
    reviewPicker='';
    render();
    root.querySelector('#quick-current')?.focus({preventScroll:true});
    note(card.type==='pair'?'Transfer linked.':card.rows.length===1?'Transaction confirmed.':card.rows.length+' transactions confirmed.');
  }
  async function undoQuick() {

    const {previous,previousRules}=quickUndo;
    await write(next=>{
      previous.forEach(t=>replace(next.transactions,t));
      if(previousRules) next.rules=previousRules;
    });
    quickUndo=null;
    render();
    note('Last review undone.');
  }

  function readMap(form,file) {
    Object.assign(file,{account:val(form,'account'),order:val(form,'order'),header:form.has('header'),reverse:form.has('reverse'),skip:Number(val(form,'skip'))||0});
    for(const key of ['date','description','amount','debit','credit','external']) file.map[key]=Number(val(form,key));

  function stageFile(form) {
    const p=preview;
    if(!p || p.file!==selectedFile) throw new Error('Preview the file first.');
    const start=dateField(form,'period_start'),end=dateField(form,'period_end');
    if(end<start || p.result.some(t=>t.date<start||t.date>end)) throw new Error('The date range must include every parsed row. Check the date order and statement period.');
    if(!p.result.length&&!form.has('coverage')) throw new Error('There are no transactions. Confirm coverage if this is a zero-activity statement.');
    if(p.issues.length&&!form.has('allow_skips')) throw new Error('Review the unreadable rows before staging.');
    const opening=val(form,'opening'),closing=val(form,'closing');
    let balanceCheck='Unverified';
    if(opening||closing) {
      const o=E.money(opening),c=E.money(closing);
      if(o===null||c===null) throw new Error('Enter both a valid opening and closing balance.');
      const account=byId(S.accounts,p.account);
      const delta=(c-o)*(['Credit card','Line of credit or loan'].includes(account.type)?-1:1);
      const net=E.sum(p.result,t=>t.amount);
      if(net!==delta) throw new Error('Statement differs from the parsed rows by '+money(net-delta)+'. Check the signs, columns, or balances.');
      balanceCheck='Balances tie';
    }
    const id=E.id();
    staging.push({id,account:p.account,name:p.name,start,end,balanceCheck,issueCount:p.issues.length,coverageConfirmed:form.has('coverage')&&!p.issues.length,
      items:p.result.map(transaction=>({transaction:{...transaction,importId:id},force:false}))});
    files=files.filter(file=>file.id!==p.file);selectedFile=files[0]?.id||'';preview=null;
    render();
    note(p.issues.length?'Statement staged. Skipped rows leave this coverage unconfirmed.':'Statement staged. Approve the batch when ready.');
  }
  function buildBatch() {
    const existing=structuredClone(S.transactions), stagedRows=[];
    for(const packet of staging) {
      packet.items.forEach(item=>{item.duplicate='';});
      E.duplicateReview(existing,packet.items);
      for(const item of packet.items) {
        if(!item.duplicate||item.force) {
          existing.push(structuredClone(item.transaction));
          stagedRows.push(item.transaction);
        }
      }
    }
    const changed=new Set(stagedRows.map(t=>t.id));
    const pairs=E.matchTransfers(existing,S.accounts).filter(p=>changed.has(p.left.id)||changed.has(p.right.id));
    return {existing,stagedRows,pairs};
  }
  function batchView() {
    const {stagedRows,pairs}=buildBatch();
    const flagged=staging.flatMap(p=>p.items.filter(x=>x.duplicate));

      table(['Date','From','To','$Amount'],pairs.map(p=>row(dateCell(p.left.date),cell(H(alias(p.left.account))),cell(H(alias(p.right.account))),amountCell(-p.left.amount))))+'</details>':'';
    return panel('Staged statements','<div class="stack">'+table(['File','Checks','Rows',''],staging.map(p=>row(cell(H(p.name),'desc'),cell(H(p.balanceCheck)+' · '+H(p.coverageConfirmed?'Coverage confirmed':'Coverage unconfirmed')),cell(p.items.length+' parsed'),cell(btn('Remove','unstage',p.id,'mini danger')))))+
      (flagged.length?'<details class="subtle"><summary>'+flagged.length+' possible duplicate'+(flagged.length===1?'':'s')+'</summary>'+table(['Date','Description','$Amount','Decision'],
        flagged.map(x=>row(dateCell(x.transaction.date),cell(H(x.transaction.description)+'<br><small>'+H(x.duplicate)+'</small>','desc'),amountCell(x.transaction.amount,true),cell(btn(x.force?'Keep this row':'Skip this row','toggle-duplicate',x.transaction.id,'mini',' aria-pressed="'+x.force+'"')))))+'</details>':'')+
      suggested+(pairs.length?'<label class="check"><input type="checkbox" id="include-pairs" checked>Apply suggested transfer matches</label>':'')+
      '<div class="actions">'+btn('Approve '+stagedRows.length+' transaction'+(stagedRows.length===1?'':'s'),'approve','','primary')+'</div></div>','Only approval writes to the ledger. Duplicate rows are skipped by default.');
  }
  async function approve() {
    const pair=Boolean(root.querySelector('#include-pairs')?.checked);
    const {stagedRows,pairs}=buildBatch();
    await write(next=>{
      next.transactions.push(...stagedRows.map(t=>structuredClone(t)));
      for(const packet of staging) {
        const count=stagedRows.filter(t=>t.importId===packet.id).length;
        const {items,...info}=packet;
        next.imports.push({...info,count,approved:E.today()});
      }
      if(pair) pairs.forEach(match=>applyPair(next,match.left.id,match.right.id,match.label));
    });
    staging=[];
    ledger={filter:'Review',account:'',month:'',category:'',project:'',search:''};
    ledgerPage=0;
    render();
    note(stagedRows.length+' transactions approved. Review the remaining questions below.');
  }
  function applyPair(next,left,right,label) {
    const a=byId(next.transactions,left),b=byId(next.transactions,right);
    if(!a||!b||a.pair||b.pair||a.account===b.account||a.amount!==-b.amount||a.allocations||b.allocations) throw new Error('The pair no longer matches.');
    for(const [entry,other] of [[a,b],[b,a]]) {
      entry.beforePair=pick(entry,'kind','category','project','why','manual');
      entry.kind='Transfer';entry.category=label;entry.project='';entry.pair=other.id;entry.why='Matched to '+other.description;entry.manual=true;
    }
  }
  function unpair(next,id) {
    const t=byId(next.transactions,id);
    if(!t?.pair) return;
    const other=byId(next.transactions,t.pair);
    for(const entry of [t,other].filter(Boolean)) {
      Object.assign(entry,entry.beforePair||{kind:'Review',category:'',project:'',why:'Previously linked transfer',manual:false});
      delete entry.beforePair;entry.pair='';
    }
  }

      '<div class="form-grid">'+txTypeFields(t.allocations?.[0]||t)+'</div>'+
      '<details class="subtle"'+(second?' open':'')+'><summary>Split across two uses</summary><div class="form-grid">'+
      field('Amount for second use',f('split_amount',second?inputMoney(Math.abs(second.amount)):'','text','inputmode="decimal"'),'Enter a positive amount smaller than the full transaction.')+txTypeFields(second,'2')+'</div></details>'+
      field('Note',f('note',t.note,'text','maxlength="180"'))+
      check('Remember this exact description and direction for this account','remember')+
      (same.length?check('Apply to '+same.length+' other unreviewed row'+(same.length===1?'':'s')+' with the same description','repeat'):''),
      async data=>{
        const other=val(data,'other');
        if(other)return write(next=>applyPair(next,id,other,'Linked transfer or payment'));
        const main=readType(data);
        const split=dollarsField(data,'split_amount',{optional:true});
        let allocations;
        if(split!==null) {
          const next=readType(data,'2');
          if(split<=0||split>=Math.abs(t.amount)) throw new Error('The split must be smaller than the full transaction.');
          if([main,next].some(x=>!['Spending','Project','Reimbursement','Financing'].includes(x.kind))) throw new Error('Splits support spending, projects, reimbursements and financing.');
          if(data.has('repeat')||data.has('remember')) throw new Error('Save this split without a merchant rule or applying it to other rows.');
          const sign=Math.sign(t.amount);
          allocations=[{...main,amount:t.amount-sign*split},{...next,amount:sign*split}];
        }
        await write(next=>{
          Object.assign(byId(next.transactions,id),main,{manual:true,why:'Reviewed',note:val(data,'note'),allocations});
          if(data.has('repeat')) same.forEach(x=>Object.assign(byId(next.transactions,x.id),main,{manual:true,why:'Reviewed with matching merchant'}));
          if(data.has('remember')) next.rules.push({...main,account:t.account,merchant:E.normal(t.description),direction:Math.sign(t.amount)});
        });
      },'Save review');
    bindTypes(form);
    form.querySelector('[name=other]')?.addEventListener('change',event=>{
      if(event.target.value) {
        const kind=form.querySelector('[name=kind]');
        kind.value='Transfer';
        kind.dispatchEvent(new Event('change'));
      }
    });
  }

  function businessLead(date,n) {
    let back=0, counted=0;
    while(counted<n) {
      back++;
      const day=new Date(E.add(date,-back)+'T00:00:00Z').getUTCDay();
      if(day>0&&day<6)counted++;
    }
    return back;
  }
  function calendarFile(records) {
    const escape=s=>String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
    const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
    const fold=line=>{
      const out=[]; let text='',length=0;
      const encoder=new TextEncoder();
      for(const c of line) {
        const size=encoder.encode(c).length;
        if(length+size>75){out.push(text);text=' ';length=1;}
        text+=c; length+=size;
      }
      out.push(text);return out.join('\r\n');
    };
    const entries=records.flatMap(x=>['BEGIN:VEVENT','UID:'+x.key.replace(/[^A-Za-z0-9-]/g,'-')+'@aqueduct.local',
      'DTSTAMP:'+stamp,'DTSTART:'+x.date.replaceAll('-','')+'T090000','DURATION:PT15M','SUMMARY:'+escape(x.name),'CLASS:PRIVATE','TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:'+(x.lead?'-P'+x.lead+'D':'-PT0M'),'DESCRIPTION:'+escape(x.name),'END:VALARM','END:VEVENT']);
    return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Aqueduct//Offline Reminders//EN','CALSCALE:GREGORIAN',...entries,'END:VCALENDAR'].map(fold).join('\r\n')+'\r\n';
  }

  function restore() {
    if(!localFile||!crypto.subtle)return note('Open Aqueduct directly from Atlas to restore a backup.',true);
    const existing=Vault.get();
    return openDialog('Open encrypted backup',field('Backup file','<input type="file" name="backup" accept=".aqueduct,.json" required>')+
      field('Backup passphrase',f('password','','password','required autocomplete="current-password"'))+
      (existing?check('Replace the saved ledger in this browser','replace'):'')+
      '<p class="small">'+(existing?'Leave Replace unchecked to review the backup in this window. Download a fresh backup before closing if you edit it.':'The restored ledger will be saved in this browser if local storage is available.')+'</p>',
      async data=>{
        const file=data.get('backup');
        if(!file?.size||file.size>100_000_000) throw new Error('Choose an Aqueduct backup file under 100 MB.');
        const content=await file.text();
        const unlocked=await Vault.open(content,data.get('password'));
        const temporary=Boolean(existing&&!data.has('replace'));
        if(!temporary)saveToBrowser(content,existing);
        files=[];staging=[];preview=null;
        enter(unlocked,content,false,temporary);
        note(temporary?'Backup opened for this window.':storageProblem?storageMessage:'Backup restored.',storageProblem&&!temporary);
        await applyChatUpdate();
      },'Unlock backup');
  }

      asOf:now,source:'Fictional term sheet',nextDue:E.add(now,10),account:cashId,note:''},
      {id:E.id(),name:'Line of credit',type:'Line of credit',balance:520000,rate:8.2,rateType:'Variable',method:'Monthly estimate',
        payment:18500,frequency:'Monthly',renewal:'',rateDate:'',rateAfter:null,prepay:null,minimumPercent:null,
        asOf:now,source:'Fictional statement',nextDue:E.add(now,20),account:cashId,note:''});
    state.bills.push(schedule('Line of credit',18500,20,'Monthly','Manual','Bill','',state.loans[1].id));
    state.goals.push({id:E.id(),name:'Cash reserve top-up',target:350000,saved:100000,deadline:E.add(now,225),priority:1},
      {id:E.id(),name:'Travel',target:420000,saved:80000,deadline:E.add(now,360),priority:2});
    state.targets['Housing & utilities']={method:'Annual',amount:222000,note:'Hydro set-aside from annual estimate'};
    state.targets['Insurance']={method:'Fixed',amount:15300,note:'Current home insurance'};
    Object.assign(state.config,{floor:125000,surplus:70000,flex:65000,flexAccount:cashId});
    enter({state},null,true);
  }

  function setLedger(patch) {
    reviewView='Ledger';
    ledger={filter:'All',account:'',month:'',category:'',project:'',search:'',...patch};
    ledgerPage=0;
    go('Import & review');
    document.getElementById('ledger-filters')?.scrollIntoView({block:'start'});
  }
  const actions={
    nav:go,lock:()=>lock(),
    'dialog-close':()=>dialog.close(),demo,restore,backup,summary,
    'chat-update':chooseChatUpdate,'cancel-chat-update':()=>{chatUpdate=null;chatRead++;welcome();},'device-check':deviceCheck,'test-download':testDownload,'share-backup':shareBackup,
    'account-settings':()=>{tab='Settings';settingsJump='settings-accounts';render();settingsJump='';},
    'account-edit':accountEdit,config,'exclude-month':excludeMonth,
    'include-month':id=>write(next=>{next.excludedMonths=next.excludedMonths.filter(m=>m!==id);}),
    'rule-remove':i=>write(next=>{next.rules.splice(Number(i),1);}),
    'select-file':id=>{selectedFile=id;preview=null;render();},
    'drop-file':id=>{files=files.filter(x=>x.id!==id);selectedFile=files[0]?.id||'';preview=null;render();},
    unstage:id=>{staging=staging.filter(x=>x.id!==id);render();},
    'toggle-duplicate':(id)=>{
      const target=staging.flatMap(p=>p.items).find(x=>x.transaction.id===id);
      target.force=!target.force;render();
      const duplicateButton=[...document.querySelectorAll('[data-act="toggle-duplicate"]')].find(x=>x.dataset.id===id);
      if(duplicateButton){duplicateButton.closest('details').open=true;duplicateButton.focus();}
    },
    approve,
    'remove-import':id=>confirmation('Remove statement import?','Transactions that came from this import will be removed, even if reviewed. Any linked payment in another statement will be unlinked.','Remove import',async()=>write(next=>{
      const deleting=next.transactions.filter(t=>t.importId===id);
      deleting.forEach(t=>unpair(next,t.id));
      next.transactions=next.transactions.filter(t=>t.importId!==id);
      next.imports=next.imports.filter(i=>i.id!==id);
    })),
    'open-inbox':()=>{reviewView='Quick review';reviewMonth='';reviewType='All';reviewPicker='';go('Import & review');},
    'month-inbox':m=>{reviewView='Quick review';reviewMonth=m;reviewType='All';reviewPicker='';go('Import & review');},
    'review-view':view=>{reviewView=view;if(view==='Ledger')ledger={filter:'All',account:'',month:'',category:'',project:'',search:''};ledgerPage=0;render();},
    'review-type':type=>{reviewType=type;reviewPicker='';render();},
    'review-all-months':()=>{reviewMonth='';reviewPicker='';render();},
    'review-category':id=>{const [card,category]=JSON.parse(id);return saveQuick(card,{kind:'Spending',category,project:''});},
    'review-confirm-type':id=>{const [card,kind]=JSON.parse(id);return saveQuick(card,{kind,category:kind==='Financing'?'Debt payment':'',project:''});},
    'review-project':id=>{const [card,project]=JSON.parse(id);if(!byId(S.projects,project))throw new Error('That project is no longer available.');return saveQuick(card,{kind:'Project',category:'',project});},
    'review-pair':id=>saveQuick(id),
    'review-picker':id=>{const remember=root.querySelector('#quick-remember')?.checked;reviewPicker=id;render();if(remember)root.querySelector('#quick-remember').checked=true;root.querySelector('.quick-choice')?.focus();},
    'review-later':id=>{setAside.add(id);reviewPicker='';render();root.querySelector('#quick-current')?.focus({preventScroll:true});},
    'review-reset':()=>{setAside.clear();render();},
    'review-undo':undoQuick,
    'spending-drill':category=>setLedger({month,category}),
    'chart-drill':id=>{const [selectedMonth,category]=JSON.parse(id);setLedger({month:selectedMonth,category});},
    'spending-tab':view=>{spendingTab=view;render();},
    'merchant-history':id=>{const t=byId(S.transactions,id);if(t)setLedger({account:t.account,merchant:E.normal(t.description),direction:Math.sign(t.amount),category:t.category});},
    'project-drill':project=>setLedger({project}),
    'open-projects':()=>{spendingTab='Categories';go('Spending');document.getElementById('spending-projects')?.scrollIntoView({block:'start'});},
    'ledger-page':n=>{ledgerPage=Math.max(0,ledgerPage+Number(n));render();document.getElementById('ledger-filters')?.scrollIntoView({block:'nearest'});},
    transaction,'manual-transaction':manualTransaction,'monthly-close':monthlyClose,'target-edit':targetEdit,'project-edit':projectEdit,
    'bill-edit':billEdit, occurrence, calendar,
    'bill-window':()=>{postingWindow=postingWindow?'':E.add(E.today(),90);render();},
    'delete-bill':id=>confirmation('Remove schedule?','Future dates and saved occurrence statuses for this schedule will be removed. Imported transactions stay in your history.','Remove schedule',async()=>write(next=>{
      next.bills=next.bills.filter(b=>b.id!==id);
      for(const key of Object.keys(next.billStatus))if(key.startsWith(id+'/'))delete next.billStatus[key];
    })),
    'loan-edit':loanEdit,'loan-bill':id=>billEdit('',byId(S.loans,id)),'goal-edit':goalEdit
  };
  document.addEventListener('click',async event=>{
    const button=event.target.closest('button[data-act]');
    if(!button||button.disabled) return;
    const run=actions[button.dataset.act];
    if(!run)return;
    try { await run(button.dataset.id||''); } catch(error){note(error.message,true);}
  });
  welcome();
  if(hosted&&localFile&&'serviceWorker' in navigator) {
    navigator.serviceWorker.register('./aqueduct-household-sw.js',{scope:'./aqueduct-household.html'})
      .catch(()=>{ /* The ledger can still open over HTTPS if offline caching is unavailable. */ });
  }
})();
</script>
</body>
</html>
