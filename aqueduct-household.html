:root{--ink:#182c27;--ink-light:#38544b;--muted:#546861;--paper:#f3f5f0;--surface:#fff;--stroke:#dce5de;--green:#1d6651;--leaf:#def1e6;--amber:#8b4f25;--amber-bg:#fff2e1;--red:#9a3f38;--red-bg:#f9e9e6;--hero:#183b33;--hero-light:#adc9bc;--shadow:0 3px 14px #17412609;--radius:18px;font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #3d9279;outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.8rem,3.8vw,2.9rem);letter-spacing:-.05em;line-height:1.05;font-weight:750}
h2{font-size:1.25rem;line-height:1.2;letter-spacing:-.027em}
h3{font-size:1rem;line-height:1.3}
p{color:var(--muted)}
small,.small{font-size:.82rem;color:var(--muted)}
strong{font-weight:700}
.money,.numeral{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top);z-index:5;background:#fff;border-bottom:1px solid var(--stroke)}
.top-inner{max-width:1240px;margin:auto;padding:14px 28px 0}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.16rem;font-weight:770;letter-spacing:-.05em}
.brand-mark{width:33px;height:33px;border-radius:10px;background:#246a56;display:grid;place-items:center;position:relative;color:white;flex:none}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;border:2px solid currentColor;border-top-left-radius:18px;border-top-right-radius:18px;border-bottom:0;width:15px;height:12px;bottom:9px}
.brand-mark:after{width:7px;height:8px;color:#bce7d2}
.nav{display:flex;gap:16px;overflow:auto;margin-top:13px;scrollbar-width:thin}
.nav button{background:transparent;border:0;border-bottom:3px solid transparent;padding:9px 3px 10px;white-space:nowrap;font-weight:650;font-size:.87rem;color:var(--muted)}
.nav button[aria-current="page"]{border-color:#26745f;color:var(--green)}
main{max-width:1240px;margin:0 auto;padding:28px 28px 64px}
.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:0 0 20px}
.page-head h1+p{margin-top:8px}
.banner{display:flex;gap:10px;align-items:start;background:var(--leaf);color:#244f42;border:1px solid #c8e6d6;padding:11px 14px;border-radius:12px;margin-bottom:16px}
.banner.warning{background:var(--amber-bg);border-color:#f0ddc1;color:var(--amber)}
.banner.error{background:var(--red-bg);border-color:#f1d3cf;color:var(--red)}
.banner p{color:inherit}
.panel{padding:20px;background:var(--surface);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.panel+.panel,.section-gap{margin-top:15px}
.panel-title{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-title p{font-size:.86rem;margin-top:5px}
.hero{background:var(--hero);color:white;padding:24px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.hero p,.hero .small{color:#cce0d6}
.hero h2{color:#dbece4;font-size:.87rem;font-weight:680;letter-spacing:.015em}
.hero-grid{display:grid;grid-template-columns:1.04fr 1fr;align-items:center;gap:20px}
.hero-value{font-size:clamp(2.4rem,6vw,4rem);line-height:1.12;letter-spacing:-.075em;margin:6px 0;font-weight:750}
.hero canvas{display:block;width:100%;height:142px}
.hero-key{display:flex;justify-content:space-between;font-size:.77rem;color:#cce0d6}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 17px}
.stat{background:#fff;border:1px solid var(--stroke);border-radius:14px;padding:13px 15px}
.stat h3{font-size:.8rem;color:var(--muted);font-weight:660}
.stat .value{font-size:1.35rem;font-weight:740;letter-spacing:-.04em;margin-top:3px;overflow-wrap:anywhere}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:start}
.grid-2>.panel{margin:0}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions.end{justify-content:flex-end}
.btn{border:1px solid var(--stroke);padding:7px 12px;color:var(--ink);background:#fff;min-height:39px;border-radius:9px;line-height:1.25;font-weight:650;white-space:normal}
.btn:hover,.btn[aria-pressed="true"]{background:#ebf3ee;border-color:#c6ddcf}
.btn.primary{color:white;background:var(--green);border-color:var(--green)}
.btn.primary:hover{background:#154f3e}
.btn.quiet{background:transparent}
.btn.danger{color:var(--red)}
.btn.mini{font-size:.8rem;min-height:32px;padding:4px 8px}
.link-button{border:0;background:transparent;padding:0;text-align:left;font-weight:680;color:var(--green);text-decoration:underline;text-underline-offset:2px}
.pill{display:inline-flex;align-items:center;white-space:nowrap;border-radius:999px;padding:3px 8px;color:#285846;background:var(--leaf);font-size:.74rem;font-weight:700}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.dim{background:#eef1ee;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:grid;gap:4px;font-size:.84rem;font-weight:650;align-content:start;min-width:0}
.field small{font-size:.74rem;font-weight:500}
.field.wide{grid-column:1/-1}
input:not([type=checkbox]),select,textarea{width:100%;min-height:40px;border:1px solid #c9d8cf;border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
input[type=checkbox]{height:17px;width:17px;accent-color:var(--green);flex:none}
input[type=file]{padding:5px;max-width:100%}
input[type=file]::file-selector-button{font:inherit;border:0;background:var(--leaf);color:#204f42;padding:6px 10px;border-radius:5px;margin-right:7px;cursor:pointer}
textarea{resize:vertical;min-height:70px}
.check{display:flex;align-items:center;gap:7px;font-size:.85rem;font-weight:570}
.stack>*+*{margin-top:10px}
.list{list-style:none;padding:0;margin:0}
.list>li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #e9efea}
.list>li:last-child{border-bottom:0}
.list>li>div{min-width:0;overflow-wrap:anywhere}
.list .small{display:block}
.empty{padding:13px;background:#f6f8f5;color:var(--muted);border-radius:10px;font-size:.87rem}
.table-wrap{overflow:auto;max-width:100%;scrollbar-width:thin}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.87rem}
th{font-size:.75rem;letter-spacing:.015em;color:var(--muted);background:#f4f7f3;text-align:left;font-weight:720}
th,td{padding:9px 10px;border-bottom:1px solid #e8eeea;vertical-align:middle}
td:first-child{min-width:104px}
th:first-child{border-top-left-radius:7px}
th:last-child{border-top-right-radius:7px}
td.money,th.money{text-align:right;white-space:nowrap}
td.desc{min-width:210px;overflow-wrap:anywhere}
td.muted{color:var(--muted)}
td.negative,.negative{color:var(--red)}
.table-controls{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:10px}
hr{border:0;border-top:1px solid var(--stroke);margin:15px 0}
details.subtle{border:1px solid var(--stroke);border-radius:10px;padding:9px 11px}
details.subtle+details{margin-top:8px}
summary{cursor:pointer;font-weight:650}
details[open]>summary{margin-bottom:9px}
dialog{color:var(--ink);border:1px solid var(--stroke);border-radius:17px;padding:20px;max-height:calc(100dvh - 36px);width:min(720px,calc(100% - 25px));box-shadow:0 14px 65px #182e294a}
dialog::backdrop{background:#122d276f}
.dialog-title{display:flex;align-items:start;justify-content:space-between;gap:10px;margin-bottom:13px}
.form-error{color:var(--red);font-size:.85rem;font-weight:620}
.toast{position:fixed;bottom:16px;right:16px;max-width:min(430px,calc(100vw - 32px));background:#183b33;color:#fff;padding:12px 15px;border-radius:12px;z-index:20;box-shadow:0 5px 25px #1235}
.toast.error{background:#752e2a}
.welcome{min-height:100vh;display:grid;place-items:center;padding:22px}
.welcome .panel{max-width:580px;width:100%;padding:clamp(17px,5vw,30px)}
.welcome h1{margin:16px 0 10px}
.welcome .actions{margin-top:12px}
.welcome hr{margin:19px 0}
.tag{font-size:.78rem;display:inline-block;border:1px solid var(--stroke);border-radius:8px;padding:3px 7px;margin:0 3px 3px 0;color:var(--muted)}
.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.plan{border:1px solid var(--stroke);border-radius:12px;padding:13px;background:#f9fbf8;min-width:0}
.plan.selected{background:#eff8f2;border-color:#b9d9c8}
.plan h3{margin-bottom:5px}
.plan .list>li{align-items:start;font-size:.83rem}
.row-actions{display:flex;gap:5px;justify-content:flex-end;align-items:center}
.calendar-label{white-space:nowrap}
.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
@media(max-width:760px){.top-inner{padding:11px 14px 0}.nav{gap:13px;margin-top:8px}.nav button{font-size:.83rem}.brand-row .small{display:none}main{padding:19px 14px 50px}.page-head{align-items:start;flex-direction:column;gap:9px;margin-bottom:13px}.panel,.hero{padding:15px}.grid-2,.hero-grid,.plan-grid{grid-template-columns:1fr}.hero-grid{gap:12px}.hero canvas{height:106px}.form-grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:9px}.stat .value{font-size:1.05rem}}
@media(max-width:390px){.brand{font-size:1.05rem}.brand-row{gap:4px}.form-grid,.form-grid.cols-3{grid-template-columns:1fr}.stat-grid{gap:5px}.stat .value{font-size:.95rem}.btn.mini{padding:5px 6px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media print{.top,.btn,.link-button,.actions,.toast,dialog{display:none!important}main{padding:0}.panel,.hero{break-inside:avoid}}

@media(max-width:600px){
  .top-inner{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  main{padding-bottom:max(50px, env(safe-area-inset-bottom))}
  .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px 6px;margin-top:8px;overflow:visible}
  .nav button{min-height:42px;padding:5px 2px;white-space:normal;line-height:1.15}
  .btn,.btn.mini{min-height:42px}
  input:not([type=checkbox]),select,textarea{font-size:16px}
  .toast{bottom:max(16px,env(safe-area-inset-bottom))}
}

.atlas-return{display:inline-flex;align-items:center;min-height:42px;padding:4px 8px;font-weight:650;color:var(--green);text-decoration:none;border-radius:9px}
.atlas-return:hover,.btn:active{background:#ebf3ee}
.btn.primary:active{background:#154f3e}
@media(max-width:600px){.btn,.btn.mini,.nav button,.atlas-return{min-height:44px}}

.chat-start{display:grid;gap:9px;justify-items:start;margin:14px 0 18px}
.manual-import{margin-bottom:15px}
.welcome .atlas-return{display:inline;min-height:0}

/* Household dashboard */
:root {
  --paper:#f7f6f1;
  --ink:#192e27;
  --hero:#133d30;
  --stroke:#dce4dc;
  --radius:20px;
}
body { font-size:15px; }
.top { background:#fff; }
.top-inner, main { max-width:1140px; }
.nav { display:flex; gap:20px; overflow:visible; margin-top:8px; }
.nav button { min-height:44px; }
.panel, .stat { box-shadow:none; }
.page-head h1 { font-weight:760; }
.home-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; }
.home-grid > .panel { margin-top:0; }
.home-secondary { margin-top:16px; }
.spending-hero {
  display:flex; flex-direction:column; justify-content:center;
  min-height:260px; padding:clamp(22px, 4vw, 38px);
  background:linear-gradient(138deg,#11372c,#19533f);
}
.spending-hero h2 { color:#d1eadd; font-size:1rem; }
.hero-value { font-size:clamp(2.65rem, 6vw, 4.65rem); letter-spacing:-.068em; overflow-wrap:anywhere; }
.hero-value.value-waiting { font-size:clamp(1.9rem,5vw,3.4rem); }
.hero-baseline {
  margin-top:24px; padding-top:16px; border-top:1px solid #bce7d24c;
  display:flex; align-items:end; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.hero-baseline span, .hero-baseline p { color:#d1eadd; font-size:.82rem; }
.hero-baseline strong { display:block; font-size:1.5rem; letter-spacing:-.03em; }
.hero-link.btn { color:white; background:#ffffff14; border:1px solid #bce7d268; min-height:44px; }
.hero-link.btn:hover, .hero-link.btn:active { background:#ffffff26; }
.event-list > li { padding:10px 0; align-items:start; }
.event-list > li:first-child { padding-top:0; }
.event-list strong { max-width:43%; text-align:right; }
.event-list small { display:block; }
.event-list .link-button, .category-title .link-button { font-size:1rem; text-align:left; }
.event-list .deposit { color:var(--green); }
.secondary-value { font-size:1.28rem; font-weight:740; margin-bottom:4px; }
.cash-visual { margin-top:14px; padding:12px; background:#eef5ee; border-radius:13px; }
.cash-visual canvas { display:block; width:100%; height:76px; }
.cash-alert { color:var(--amber); margin-top:8px; }
.review-strip {
  margin:14px 0; padding:12px 14px; border:1px solid var(--stroke); border-radius:14px;
  display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fff;
}
.review-strip p { font-size:.86rem; }
.categories { margin:0; padding:0; list-style:none; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.category, .debt-card { border:1px solid var(--stroke); border-radius:14px; padding:12px; min-width:0; }
.category-title { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.category-title strong { text-align:right; }
.category-title .btn { flex:none; }
.category-numbers, .debt-terms {
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin:8px 0 0;
}
.category-numbers small, .category-numbers strong, .debt-terms small { display:block; }
.category-numbers strong { font-size:.93rem; overflow-wrap:anywhere; }
.category progress { width:100%; height:5px; border:0; border-radius:6px; background:#e4ebe5; overflow:hidden; appearance:none; }
.category progress::-webkit-progress-bar { background:#e4ebe5; }
.category progress::-moz-progress-bar { background:#43876f; }
.category progress::-webkit-progress-value { background:#43876f; }
.debt-terms { grid-template-columns:repeat(auto-fit,minmax(min(100%,95px),1fr)); margin:12px 0 8px; }
.debt-terms dt { color:var(--muted); font-size:.8rem; }
.debt-terms dd { margin:0; font-weight:650; }
.section-tools { margin-bottom:12px; }
#spending-projects, #ledger-filters, #settings-accounts { scroll-margin-top:128px; }
.transaction-list > li > div { overflow-wrap:anywhere; }
@media(max-width:740px) {
  .nav { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:0; }
  .nav button { font-size:clamp(.71rem, 2.9vw, .86rem); padding-inline:0; white-space:nowrap; }
  .home-grid, .categories { grid-template-columns:minmax(0,1fr); }
  .home-grid, .home-secondary { gap:12px; }
  .home-secondary { margin-top:12px; }
  .spending-hero { min-height:0; }
  .category-title .link-button, .event-list .link-button, .home-grid .list .link-button { min-height:44px; }
  .spending-totals .stat { padding:10px 8px; }
  .spending-totals .stat .money { font-size:clamp(.88rem, 3.8vw, 1.2rem); overflow-wrap:anywhere; }
}

.review-toolbar { display:flex; flex-wrap:wrap; align-items:start; justify-content:space-between; gap:6px; }
.quick-card {
  display:grid; gap:12px; padding:clamp(15px,4vw,28px); border:1px solid #e1dccf;
  border-radius:20px; background:#faf7ef;
}
.quick-header { display:flex; align-items:start; justify-content:space-between; gap:12px; }
.quick-header h3 { font-size:clamp(1.3rem,3vw,1.9rem); letter-spacing:-.035em; overflow-wrap:anywhere; }
.quick-header h3:focus { outline:none; }
.quick-label { color:#784d28; margin-bottom:5px; font-size:.82rem; font-weight:700; }
.quick-amount { text-align:right; font-weight:700; font-size:clamp(1.12rem,3vw,1.8rem); }
.quick-amount small { display:block; }
.quick-question { font-size:.91rem; }
.quick-category { display:flex; align-items:end; flex-wrap:wrap; gap:8px; }
.quick-category .field { flex:1 1 205px; }
.review-remember { min-height:44px; font-size:.86rem; }
.review-matches { background:#fffdfa; }
.review-matches.list { padding:6px 12px; border-radius:14px; }
.recurring-amount { text-align:right; flex:none; }
.recurring-amount strong { max-width:none; }
.empty { background:#f4f1e9; }

@media(max-width:800px) {
  .nav { max-width:none; }
  .nav .nav-tab { flex-direction:column; font-size:.8rem; gap:2px; }
  .home-grid, .categories { grid-template-columns:minmax(0,1fr); gap:12px; }
  .home-secondary { margin-top:12px; }
  .spending-hero { min-height:0; }
  .pie-layout { grid-template-columns:minmax(100px,.72fr) minmax(0,1.28fr); }
  .spending-totals .stat { padding:10px 8px; }
  .spending-totals .stat .money { font-size:clamp(.88rem, 3.8vw, 1.2rem); overflow-wrap:anywhere; }
}
@media(max-width:490px) {
  .nav { gap:0; }
  .nav .nav-tab { font-size:clamp(.68rem,2.9vw,.84rem); }
  .page-head { align-items:start; gap:8px; }
  .pie-layout { grid-template-columns:minmax(0,1fr); gap:10px; }
  .pie-ring { width:146px; }
  .pie-ring strong { font-size:1rem; }
  .pie-legend li { font-size:.88rem; }
  .segments .btn { padding-inline:7px; }
  .review-strip { flex-wrap:wrap; }
  .quick-header { flex-wrap:wrap; }
  .quick-amount { text-align:left; }
  .quick-amount small { display:inline; margin-left:6px; }
}
@media(prefers-reduced-transparency:reduce),(prefers-contrast:more) {
  .top { background:#fffdf7; }
}
@media(forced-colors:active) {
  .pie-dot, .pie-ring { forced-color-adjust:none; }
  .pie-ring > div { background:#fff; color:#202638; }
  .nav button[aria-current="page"], .segments .btn[aria-pressed="true"] { outline:2px solid ButtonText; outline-offset:-2px; }
}
.quick-picks .actions { margin-top:6px; gap:6px; }
.quick-picks .btn { background:#fffdf7; }
.quick-picks .btn:hover { background:#efe5d6; border-color:#b49270; }

/* Cash flow and debt analysis */
.cash-lead { display:grid; grid-template-columns:minmax(0,1.12fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
.cash-lead > .panel { margin:0; }
.flow-hero .hero-baseline { justify-content:start; gap:10px 33px; }
.flow-hero .hero-baseline > div { flex:0 1 auto; }
.timing-card { align-content:center; min-width:0; }
.timing-card > .small { margin-top:10px; }
.next-pay, .recognized-income {
  display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px;
  color:#275544; background:#e8f0e7; border-radius:12px;
}
.next-pay { margin-bottom:13px; }
.next-pay strong { font-size:1.25rem; }
.recognized-income { margin-bottom:14px; }
.amount-list,.cash-trend,.spending-compare { list-style:none; padding:0; margin:0; }
.amount-list > li { display:grid; gap:4px; padding:8px 0; }
.amount-caption { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:28px; }
.amount-caption .link-button { min-height:42px; }
.amount-caption strong { flex:none; }
.amount-track { display:block; width:100%; height:8px; background:#ebe7dc; border-radius:999px; overflow:hidden; }
.amount-track > span { display:block; height:100%; background:#6f7893; border-radius:inherit; }
.amount-track .in,.key-in::before { background:#28715b; }
.amount-track .out,.key-out::before { background:#a76543; }
.amount-track .rate,.key-rate::before { background:#667398; }
.amount-track .priority { background:#a76543; }
.flow-bucket { background:#f9f6ee; border:1px solid var(--stroke); border-radius:17px; padding:13px 15px; }
.flow-bucket h3 { font-size:1.12rem; margin-bottom:6px; }
.flow-bucket .amount-list li + li { border-top:1px solid var(--stroke); }
.flow-bucket .amount-caption { overflow-wrap:anywhere; }
.flow-bucket .amount-caption .link-button { color:var(--ink); }
.chart-key { display:flex; gap:7px 17px; flex-wrap:wrap; color:var(--muted); font-size:.83rem; margin-bottom:8px; }
.chart-key span::before { display:inline-block; border-radius:3px; width:8px; height:8px; margin-right:5px; }
.chart-key .key-in::before,.chart-key .key-out::before,.chart-key .key-rate::before { content:""; }
.cash-trend > li {
  display:grid; grid-template-columns:105px minmax(0,1fr) minmax(76px,auto);
  gap:12px; align-items:center; border-top:1px solid var(--stroke); min-height:55px; padding:5px 0;
}
.trend-label .link-button { display:block; min-height:32px; }
.trend-label small { display:block; line-height:1.1; }
.trend-pair { display:grid; gap:4px; }
.trend-pair > div,.compare-line { display:grid; grid-template-columns:minmax(0,1fr) minmax(70px,auto); align-items:center; gap:8px; }
.trend-pair .money,.compare-line .money { text-align:right; font-size:.81rem; white-space:nowrap; }
.trend-net { text-align:right; }
.partial .amount-track > span { opacity:.65; }
.forecast-gap { background:#f6eadb; padding:12px 14px; border-radius:14px; margin-bottom:12px; }
.forecast-gap p { font-size:.9rem; margin-top:4px; }
.forecast-tasks { margin-top:10px; }
.cash-visual canvas { height:158px; }
.chart-scale { display:flex; justify-content:space-between; align-items:center; gap:6px; color:var(--muted); font-size:.74rem; }
.cash-reading { display:grid; gap:5px; font-size:.88rem; margin:9px 0; }
#cash-forecast { scroll-margin-top:148px; }
.bill-overview { margin-bottom:15px; }
.spending-compare > li { display:grid; grid-template-columns: minmax(115px,.4fr) minmax(0,1fr); gap:12px; align-items:center; border-top:1px solid var(--stroke); padding:9px 0; }
.spending-compare > li > div { display:grid; gap:3px; }
.debt-guide {
  padding:clamp(17px,3vw,28px); border-radius:var(--radius); background:#202e42; color:#fdf8ed; display:grid;
  grid-template-columns:minmax(200px,.75fr) minmax(0,1fr); gap:20px;
}
.debt-guide p,.debt-guide .debt-steps { color:#f0eadf; }
.debt-guide h2+p { margin-top:9px; }
.debt-steps ol { margin:0 0 9px; padding-left:20px; }
.debt-steps li + li { margin-top:7px; }
.debt-alert { margin-bottom:10px; }
.debt-guide .btn.quiet { background:#fff9ed; color:#283246; border-color:#fff9ed; }
.debt-guide .link-button { color:#fff; text-decoration:underline; }
.ranked-debt li + li { border-top:1px solid var(--stroke); }
.debt-result { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding-top:10px; }
.debt-result > div { display:grid; align-content:start; gap:2px; border-top:1px solid var(--stroke); padding-top:8px; }
.debt-result strong { font-size:clamp(1rem,3vw,1.37rem); }
@media(max-width:800px) {
  .cash-lead,.debt-guide { grid-template-columns:minmax(0,1fr); gap:12px; }
  .debt-stats .stat .money { font-size:clamp(.85rem,3.9vw,1.37rem); overflow-wrap:anywhere; }
}
@media(max-width:490px) {
  .cash-trend > li { grid-template-columns:minmax(72px,.55fr) minmax(0,1fr); gap:6px; padding:8px 0; }
  .trend-net { grid-column:2; font-size:.88rem; }
  .trend-net::before { content:"Net "; font-weight:400; }
  .chart-key span:last-child:not([class]) { display:none; }
  .spending-compare > li { grid-template-columns:minmax(0,1fr); gap:2px; }
  .spending-compare > li .link-button { min-height:40px; }
}

/* Recommendations */
.nav { max-width:760px; }
.nav .short-label,.nav .compact-label { display:none; }
.settings-shortcut { display:inline-grid; width:44px; padding:0; place-items:center; border-color:transparent; }
.settings-shortcut svg { width:18px; height:18px; }
.settings-shortcut[aria-current="page"] { background:#f2e9db; color:#683e23; }
.advice-overview {
  margin-bottom:16px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-radius:19px;
  background:#202e42; color:#fff9ec; padding:13px 8px;
}
.advice-overview div { display:grid; gap:1px; padding:3px clamp(8px,3vw,20px); min-width:0; }
.advice-overview div + div { border-left:1px solid #d9cdb447; }
.advice-overview strong { font-size:clamp(1.5rem,4vw,2.3rem); line-height:1.12; }
.advice-overview span { font-size:.85rem; color:#f1e7d5; }
.advice-list { list-style:none; margin:0; padding:0; }
.advice-list > li { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 0; }
.advice-list > li + li { border-top:1px solid var(--stroke); }
.advice-list h3 { font-size:1.03rem; margin-bottom:4px; }
.advice-list p { font-size:.91rem; overflow-wrap:anywhere; }
@media(max-width:650px) {
  .nav { max-width:none; }
  .nav .wide-label { display:none; }
  .nav .short-label,.nav .compact-label { display:block; }
  .advice-list > li { grid-template-columns:minmax(0,1fr); gap:7px; align-items:start; }
  .advice-list .btn { justify-self:start; }
}

/* Payday plan */
.runway-result {
  display:grid; grid-template-columns:minmax(0,.72fr) minmax(0,1fr); gap:22px; align-items:center;
  background:#202e42; color:#fff9ec; border-radius:var(--radius);
  padding:clamp(18px,4vw,29px); margin-bottom:16px;
}
.runway-result strong { display:block; font-size:clamp(2.15rem,6vw,3.8rem); line-height:1.16; margin-top:5px; letter-spacing:-.05em; }
.runway-result p { color:#f7efe3; }
.runway-result .runway-alert { color:#ffcfad; font-weight:700; margin-top:7px; }
.runway-plot canvas { display:block; width:100%; height:clamp(155px,23vw,235px); }
.runway-readout { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
.runway-readout div { display:grid; gap:3px; padding:9px 12px; background:#f2eee3; border-radius:12px; }
.runway-readout strong { font-size:clamp(1rem,3.9vw,1.33rem); overflow-wrap:anywhere; }
.runway-accounts { padding:0; margin:0; list-style:none; }
.runway-accounts li { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:center; gap:12px; padding:9px 0; }
.runway-accounts li + li { border-top:1px solid var(--stroke); }
.account-lows { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.account-lows span { display:grid; gap:2px; }
.account-lows strong,.stress-deposit strong { font-variant-numeric:tabular-nums; }
.stress-deposit { text-align:right; }
.interest-gap { margin-top:13px; padding:11px 13px; border-radius:13px; background:#f6eadb; }
.interest-gap .list > li { border-color:#e5d8c6; }
@media(max-width:650px) {
  .runway-result,.runway-accounts li { grid-template-columns:minmax(0,1fr); gap:9px; }
  .runway-accounts li { padding:12px 0; }
}

#cash-scenario-result { scroll-margin-top:145px; }

/* Monthly snapshot */
.snapshot-lead {
  display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:24px; align-items:center;
  padding:clamp(17px,4vw,30px); background:#202e42; color:#fff9ec; border-radius:var(--radius);
}
.snapshot-lead h2 { font-size:1.12rem; }
.snapshot-lead strong.money { display:block; font-size:clamp(2rem,6vw,3.5rem); line-height:1.14; letter-spacing:-.05em; margin:6px 0 9px; }
.snapshot-income { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.snapshot-income > div { display:grid; gap:2px; min-width:0; }
.snapshot-income small,.snapshot-lead p { color:#e9e1d4; }
.snapshot-income b { font-variant-numeric:tabular-nums; }
.snapshot-result { border-left:1px solid #dfd4bc61; padding-left:24px; }
.snapshot-example-values,.timeline-outcome { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:10px 0; }
.snapshot-example-values > div,.timeline-outcome > div { padding:10px 12px; background:#f2eee3; border-radius:12px; }
.snapshot-example-values strong,.timeline-outcome strong { display:block; font-size:clamp(1.1rem,3vw,1.38rem); }
.timeline-list { list-style:none; padding:0; margin:0; }
.timeline-list > li { padding:10px 0; }
.timeline-list > li + li { border-top:1px solid var(--stroke); }
.timeline-list .amount-caption { margin-bottom:5px; }
.timeline-list .amount-caption > strong { max-width:45%; text-align:right; }
.timeline-basis { margin-bottom:8px; }
@media(max-width:650px) {
  .snapshot-lead { grid-template-columns:minmax(0,1fr); gap:13px; }
  .snapshot-result { border-left:0; border-top:1px solid #dfd4bc61; padding-left:0; padding-top:13px; }
  .snapshot-income small { font-size:.76rem; }
}

.statement-fix-group { padding:10px; border:1px solid var(--stroke); border-radius:12px; margin-top:7px; }
.statement-fix-group p { overflow-wrap:anywhere; }

.top { border-color:#e7e0d2; backdrop-filter:blur(18px); }
.top-inner { display:grid; grid-template-columns:1fr auto; align-items:center; gap:16px; padding-block:9px; }
.brand-row { display:contents; }
.brand-row .actions { grid-column:2; grid-row:1; justify-content:end; }
.nav { grid-column:1/-1; display:flex; justify-content:center; width:100%; margin:0 auto; }
.nav .nav-tab { flex:1 1 0; min-height:44px; border:0; border-radius:12px; }
.nav button[aria-current="page"] { background:#eee5d7; }
#main { padding-top:28px; }
#main .page-head h1 { font-size:clamp(2rem,4vw,3.35rem); }
#main .page-head { margin-bottom:18px; }
#main > .panel + .panel { margin-top:var(--panel-gap); }
.insight-overview, .spending-layout, .scenario-layout { display:grid; gap:var(--panel-gap); min-width:0; }
.insight-overview { grid-template-columns:minmax(0,1.22fr) minmax(0,1fr); }
.insight-overview .panel { align-content:center; }
.cash-board, .spend-board {
  background:#14273a; color:#fffaf0; border-radius:var(--radius); padding:clamp(18px,3.1vw,34px);
  position:relative; isolation:isolate; overflow:hidden; min-width:0; box-shadow:0 12px 40px #24233c16;
}
.cash-board::before {
  content:""; position:absolute; z-index:-1; inset:0;
  background:linear-gradient(105deg,#122235 34%,#183345de 69%,#1b3c4cd6),
    var(--aqueduct-arch) center 58%/cover;
}
.cash-board-head, .spend-board-top, .budget-result-head { display:flex; align-items:start; justify-content:space-between; gap:16px; }
.cash-board-head>div, .spend-board-top>div, .budget-result-head>div { min-width:0; }
.cash-board h2,.spend-board h2,.budget-result h2 { font-size:1rem; font-weight:650; color:inherit; letter-spacing:0; }
.cash-number {
  display:block; font-size:clamp(2rem,5vw,4.05rem); line-height:1.09;
  letter-spacing:-.062em; margin-block:7px 5px; overflow-wrap:anywhere;
}
.cash-board p,.cash-board-foot,.spend-board-compare span { color:#d3dfdd; font-size:.83rem; }
.cash-board .field,.spend-board .field { color:#e4ecea; flex:0 0 auto; }
.cash-board select,.spend-board input[type=month] { width:auto; max-width:100%; color:#fffaf0; background:#feffff16; border-color:#e0efee46; }
.cash-board option { color:#202638; background:#fffefa; }
.spend-board input[type=month] { color-scheme:dark; }
#main .cash-board-bars { margin:18px 0 12px; }
.cash-board-bars .amount-caption { font-size:.88rem; color:#f7f4eb; }
.cash-board-bars .amount-track { background:#ffffff25; height:9px; }
.cash-board-bars .amount-track .in { background:#83d9bb; }
.cash-board-bars .amount-track .out { background:#edb28d; }
.cash-board-foot { display:flex; justify-content:space-between; align-items:center; gap:8px; border-top:1px solid #ffffff29; padding-top:12px; }
.cash-board-foot b { color:#fffaf0; }
.flow-columns {
  display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:4px; align-items:stretch;
  background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),#eee8dc calc(25% - 1px),#eee8dc 25%);
  background-position:0 0; background-size:100% calc(100% - 32px); background-repeat:no-repeat;
}
.flow-month { border:1px solid transparent; background:transparent; border-radius:12px; display:grid; grid-template-rows:1fr auto;
  font-size:.76rem; font-weight:650; color:var(--muted); min-width:0; padding:5px 2px; gap:6px; }
.flow-month:hover,.flow-month[aria-pressed=true] { border-color:#e2d5bf; background:#dcc8a62c; color:#634220; }
.flow-columns-pair { display:flex; justify-content:center; align-items:end; gap:4px; height:clamp(84px,12vw,144px); }
.flow-columns-pair i { height:var(--size); width:min(30%,19px); border-radius:4px 4px 1px 1px; background:var(--flow-in); }
.flow-columns-pair i+i { background:var(--flow-out); }
.flow-month.partial i { background:repeating-linear-gradient(135deg,#277d66 0 3px,#83bda8 3px 5px); }
.flow-month.partial i+i { background:repeating-linear-gradient(135deg,#a9673e 0 3px,#d8ad8e 3px 5px); }
.chart-caption { margin-top:9px; }
.chart-key .key-in::before { background:var(--flow-in); }
.chart-key .key-out::before { background:var(--flow-out); }
.chart-key .key-average::before { content:""; background:var(--flow-rate); height:2px; border-radius:0; }
.dashboard-shortcuts,.review-summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:var(--panel-gap); }
.dashboard-jump { display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; text-align:left; gap:10px; min-height:69px;
  padding:11px 15px; border-radius:18px; border:1px solid var(--stroke); background:var(--surface); color:var(--ink); }
.dashboard-jump:hover,.category-link:hover { background:#f8f4ea; }
.dashboard-jump small { display:block; margin-top:3px; }
.dashboard-jump b { font-variant-numeric:tabular-nums; color:var(--green); }
.chart-arrow { color:var(--bronze); font-size:1.38rem; line-height:1; }
.review-summary .dashboard-jump { background:#f1ebe0; }
.review-summary .dashboard-jump b { color:#73482a; }
.home-disclosure { margin-top:var(--panel-gap); }
.home-disclosure>summary { min-height:44px; align-content:center; }
.home-disclosure:not([open]) { padding-block:7px; }
.home-disclosure[open]>summary { margin-bottom:15px; }

.spend-board { padding-block:22px; margin-top:16px; background:linear-gradient(121deg,#142236,#253c49); }
.spend-board-compare { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px; }
.spend-board-compare div { border-top:1px solid #ffffff39; padding-top:10px; }
.spend-board-compare b { display:block; font-size:clamp(1rem,3vw,1.36rem); font-variant-numeric:tabular-nums; }
.spending-layout { grid-template-columns:minmax(0,1.42fr) minmax(0,1fr); margin-top:var(--panel-gap); align-items:start; }
.spending-rail { display:grid; gap:12px; min-width:0; }
.spending-rail>.btn { justify-self:start; }
.spending-rail .pie-layout { grid-template-columns:minmax(0,1fr); }
.spending-rail .pie-ring { width:min(168px,100%); margin:4px auto 12px; }
.spending-alerts { display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center; font-size:.83rem; margin-top:10px; color:var(--muted); }
.category-links { list-style:none; padding:0; margin:0; display:grid; }
.category-links li+li { border-top:1px solid var(--stroke); }
.category-link { width:100%; display:grid; gap:7px; border:0; text-align:left; color:var(--ink); background:var(--surface);
  padding:12px 7px; border-radius:9px; min-height:62px; }
.category-line { display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:10px; }
.category-track { position:relative; height:8px; border-radius:10px; background:#eee9dd; }
.category-track i { display:block; height:100%; border-radius:inherit; background:var(--flow-in); }
.category-track .category-marker { height:14px; width:2px; margin-left:-1px; position:absolute; top:-3px; background:var(--flow-rate); border-radius:2px; }
.category-reference { display:flex; flex-wrap:wrap; gap:5px 16px; font-size:.79rem; color:var(--muted); }
.category-reference b { font-variant-numeric:tabular-nums; }
.category-back { margin-bottom:8px; }
.category-total { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:12px 0 var(--panel-gap);
  padding:18px 23px; border-radius:18px; background:#e9eee7; }
.category-total strong { display:block; font-size:clamp(1.65rem,4.4vw,2.65rem); letter-spacing:-.055em; overflow-wrap:anywhere; }
.category-total p { font-size:.86rem; text-align:right; }
.category-transactions { scroll-margin-top:100px; }

.scenario-layout { grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr); align-items:start; }
.scenario-panel { grid-row:1/span 2; }
.scenario-output { min-width:0; }
.scenario-control { display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:10px; align-items:center;
  padding:11px 0 6px; border-top:1px solid var(--stroke); font-weight:650; font-size:.9rem; }
.scenario-control output { color:var(--green); font-variant-numeric:tabular-nums; }
.scenario-control input[type=range] { grid-column:1/-1; appearance:auto; accent-color:var(--flow-in);
  background:transparent; border:0; padding:0; min-height:44px; }
.scenario-strategy { border-top:1px solid var(--stroke); padding-top:12px; }
.scenario-strategy .segments { margin:9px 0 0; }
.scenario-panel .panel-title p { margin-top:3px; }
.scenario-help { margin-top:12px; }
.budget-result { background:#fffdf7; }
.budget-result .cash-number { font-size:clamp(1.9rem,4.6vw,3.25rem); }
.budget-income { display:grid; text-align:right; }
.budget-income span,.budget-sources span,.payoff-stats span { color:var(--muted); font-size:.8rem; }
.budget-income b { font-size:1.2rem; }
.budget-sources { display:flex; flex-wrap:wrap; gap:5px 15px; margin:8px 0 13px; }
.budget-sources b { color:var(--ink); }
.budget-stack { display:flex; border-radius:7px; overflow:hidden; height:13px; background:#eee9dd; }
.budget-stack i,.budget-costs i { background:var(--flow-rate); }
.budget-stack .out,.budget-costs .out { background:var(--flow-out); }
.budget-stack .priority,.budget-costs .priority { background:var(--flow-priority); }
.budget-stack .reserve,.budget-costs .reserve { background:#746782; }
.budget-stack .room { background:#8db6a5; }
.budget-costs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); list-style:none; padding:0; margin:10px 0 0; gap:4px 12px; }
.budget-costs li { display:grid; grid-template-columns:8px minmax(0,1fr); gap:0 7px; align-items:center; font-size:.83rem; }
.budget-costs i { width:8px; height:8px; border-radius:50%; }
.budget-costs b { grid-column:2; font-variant-numeric:tabular-nums; }
.budget-gap { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; font-size:.88rem;
  border-top:1px solid var(--stroke); margin-top:10px; padding-top:9px; }
.budget-gap small { display:block; }
.payoff-stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
.payoff-stats div { display:grid; gap:1px; padding:10px; border-radius:12px; background:#f2eee4; }
.payoff-stats strong { font-size:clamp(1rem,3vw,1.42rem); line-height:1.25; }
.payoff-stats small { color:var(--green); }
.payoff-plot { margin:14px 0 12px; }
.payoff-plot svg { width:100%; display:block; height:clamp(102px,17vw,158px); }
.payoff-plot path,.payoff-plot polyline { fill:none; vector-effect:non-scaling-stroke; }
.plot-grid { stroke:#e2ddd3; stroke-width:1; }
.payoff-base { stroke:var(--flow-rate); stroke-width:1.7; stroke-dasharray:4 4; }
.payoff-live { stroke:var(--flow-in); stroke-width:2.7; }
.payoff-plot figcaption { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:.77rem; }
.advice-more { margin-top:8px; }
.advice-layout { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:start; gap:var(--panel-gap); }
#main .advice-layout>.panel { margin:0; }
.advice-layout .advice-list>li { display:block; padding-top:0; }
.advice-layout .advice-list p { margin:6px 0 8px; }

@media(max-width:800px) {
  :root { --panel-gap:13px; }
  .insight-overview,.spending-layout,.scenario-layout,.advice-layout { grid-template-columns:minmax(0,1fr); }
  .scenario-panel { grid-row:auto; }
  #monthly-budget-result { grid-row:1; }
  .top-inner { gap:8px; }
  .nav .nav-tab { flex-direction:row; }
  .spending-rail .pie-layout { grid-template-columns:minmax(90px,.7fr) minmax(0,1.3fr); }
}
@media(max-width:650px) {
  .top { position:static; backdrop-filter:none; }
  .top-inner { padding-block:6px; }
  #main { padding-block:18px calc(104px + env(safe-area-inset-bottom)); }
  #main .page-head { flex-direction:row; align-items:center; gap:6px 10px; flex-wrap:wrap; }
  #main .page-head h1 { font-size:clamp(1.75rem,7vw,2.4rem); }
  .nav { position:fixed; z-index:6; left:max(8px,env(safe-area-inset-left)); right:max(8px,env(safe-area-inset-right));
    bottom:calc(7px + env(safe-area-inset-bottom)); width:auto; padding:4px; gap:2px;
    border:1px solid #ddd3c4; box-shadow:0 5px 23px #242d3f29; border-radius:21px; background:#fffaf1; }
  .nav .nav-tab { flex-direction:column; font-size:clamp(.63rem,2.9vw,.77rem); min-height:49px; min-width:0; border-radius:16px; }
  .nav-tab svg { width:17px; height:17px; }
  .toast { bottom:calc(74px + env(safe-area-inset-bottom)); }
  .cash-board-head { display:block; }
  .cash-board h2 { max-width:calc(100% - 104px); min-height:33px; align-content:center; }
  .cash-board-head .field { position:absolute; top:15px; right:15px; }
  .cash-board-head .field span { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
  .cash-board-head .field select { padding-inline:7px; font-size:.84rem; }
  #main .cash-board-bars { margin:13px 0 9px; }
  .cash-board-bars > li { padding:5px 0; }
  .cash-number { font-size:clamp(2.2rem,9vw,3.25rem); }
  .dashboard-shortcuts,.review-summary { grid-template-columns:minmax(0,1fr); gap:7px; }
  .dashboard-jump { min-height:58px; }
  .spend-board-top { flex-wrap:wrap; gap:6px; }
  .category-total { padding:13px 15px; }
  .budget-costs { gap:4px 9px; }
  .scenario-control input[type=range] { min-height:44px; }
  .home-disclosure,#ledger-filters,#settings-accounts { scroll-margin-top:20px; }
}
@media(max-width:360px) {
  .spending-rail .pie-layout { grid-template-columns:minmax(0,1fr); }
  .budget-sources { gap:4px 7px; }
}
@media(prefers-reduced-transparency:reduce),(prefers-contrast:more) {
  .top { backdrop-filter:none; }
  .cash-board::before { background:#152a3b; }
}
@media print { .nav,.scenario-panel { display:none!important; } }

.review-summary:has(>.dashboard-jump:only-child) { grid-template-columns:minmax(0,1fr); }
.category-months { margin-bottom:var(--panel-gap); }
.debt-lead {
  background:linear-gradient(115deg,#17293b,#253c49); color:#fffaf0; border-radius:var(--radius);
  display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:end; padding:clamp(16px,3vw,27px);
}
.debt-lead h2 { font-size:.9rem; color:#dce4e3; }
.debt-lead strong { display:block; font-size:clamp(1.35rem,4vw,2.2rem); letter-spacing:-.04em; }
.debt-lead p,.debt-lead .link-button { color:#f2e8da; font-size:.85rem; }
.debt-lead .btn { background:#fffaf0; }
.debt-lead .btn.quiet { background:transparent; color:#fffaf0; border-color:#fffaf052; }

/* Today, spending drivers and repayment decisions */
.decision-layout { display:grid; grid-template-columns:minmax(0,1.22fr) minmax(0,1fr); gap:var(--panel-gap); align-items:start; }
.cash-position {
  color:#fffaf0; padding:clamp(15px,3vw,30px); min-width:0; border-radius:var(--radius);
  background:#182b3d; overflow:hidden; position:relative; isolation:isolate;
}
.cash-position-top { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-bottom:14px; border-bottom:1px solid #ffffff32; }
.cash-position-top h2 { font-size:clamp(1rem,3vw,1.35rem); letter-spacing:-.015em; }
.cash-position-top>span { color:#e1e8e8; font-size:.81rem; text-align:right; }
.cash-position-main { display:grid; gap:1px; padding-block:13px; }
.cash-position-main>span { font-size:.88rem; color:#dce6e7; }
.cash-position-main strong { font-size:clamp(2rem,6vw,3.7rem); letter-spacing:-.065em; line-height:1.1; overflow-wrap:anywhere; }
.cash-position-facts {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 13px; padding:9px 0 0;
  border-top:1px solid #ffffff32; margin:0;
}
.cash-position-facts div { min-width:0; }
.cash-position-facts dt { color:#dce6e7; font-size:.77rem; }
.cash-position-facts dd { margin:0; font-size:clamp(.95rem,3vw,1.15rem); font-weight:700; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.cash-position-actions { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:11px; }
.cash-position .position-primary { padding-inline:14px; background:#fff4de; color:#382b20; border-color:#fff4de; }
.cash-position .position-primary:hover { background:#eaddc3; }
.cash-position .position-secondary { padding-inline:11px; color:#fff7e9; background:transparent; border-color:#ffffff52; }
.cash-position .position-secondary:hover { background:#ffffff16; }
.cash-next-note { margin-top:10px; color:#f8debb; font-size:.83rem; }
.decision-list { display:grid; gap:9px; min-width:0; }
.decision-list .dashboard-jump { min-height:78px; border-radius:19px; box-shadow:none; }
.decision-list .dashboard-jump>b { color:var(--ink); max-width:10ch; overflow-wrap:anywhere; text-align:right; }
.decision-list .dashboard-jump strong { font-size:1.05rem; }
.decision-list .dashboard-jump:nth-child(-n+2) { background:#fffdf6; }
.decision-tools { display:flex; flex-wrap:wrap; gap:3px 18px; margin-top:10px; }
.decision-payday { align-items:start; }
.decision-payday .event-list { max-height:360px; overflow:auto; padding:2px; }
.change-date { max-width:230px; margin-bottom:12px; }
.month-movement { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:14px; }
.month-movement>div { display:grid; align-content:start; gap:2px; padding:clamp(13px,3vw,23px); background:#182b3d; color:#fffdf5; border-radius:18px; }
.month-movement>div+div { background:#eee8da; color:var(--ink); }
.month-movement strong { font-size:clamp(1.45rem,4.1vw,2.5rem); letter-spacing:-.035em; overflow-wrap:anywhere; margin-bottom:1px; line-height:1.12; }
.month-movement span,.month-movement small { font-size:.81rem; }
.month-movement>div:first-child small { color:#dce6e7; }
.month-movement .link-button { font-size:.79rem; }
.change-layout { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--panel-gap); align-items:start; }
.change-layout > .panel { margin:0; }
.change-review { font-size:.86rem; color:var(--muted); margin-bottom:9px; }
.driver-list { list-style:none; margin:0; padding:0; }
.driver-list>li+li { border-top:1px solid var(--stroke); }
.driver-row {
  width:100%; display:grid; gap:5px; border:0; background:transparent; color:var(--ink);
  text-align:left; min-height:50px; padding:9px 5px; border-radius:8px;
}
.driver-row:hover,.driver-row:active { background:#f4efe4; }
.driver-title { display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:8px; }
.driver-row .amount-track { height:6px; }
.driver-row small { font-variant-numeric:tabular-nums; }
.change-cash-totals { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:0 0 13px; }
.change-cash-totals>div { padding:8px; background:#f1ede4; border-radius:10px; }
.change-cash-totals dt { color:var(--muted); font-size:.8rem; }
.change-cash-totals dd { margin:0; font-weight:700; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.change-layout h3 { padding:11px 0 4px; }
.scenario-layout { grid-template-columns:minmax(0,1fr) minmax(0,1.23fr); align-items:start; }
.scenario-left,.scenario-right { display:grid; gap:var(--panel-gap); min-width:0; align-content:start; }
.scenario-left .scenario-panel { grid-row:auto; }
.scenario-layout .decision-funding .panel+.panel { margin-top:var(--panel-gap); }
.funding-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
.funding-grid div { display:grid; align-content:start; gap:1px; padding:8px; background:#f3efe6; border-radius:10px; min-width:0; }
.funding-grid div:first-child { background:#e9efea; }
.funding-grid span,.funding-grid small { font-size:.76rem; color:var(--muted); }
.funding-grid b { letter-spacing:-.024em; font-size:clamp(.96rem,2.3vw,1.22rem); overflow-wrap:anywhere; }
.funding-check { display:flex; flex-wrap:wrap; gap:4px 9px; justify-content:space-between; align-items:center; margin-top:10px; font-size:.88rem; }
.funding-flags { margin-top:6px; }
.decision-options { display:grid; gap:5px; }
.repayment-option { display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:7px; min-height:57px; text-align:left;
  border:1px solid var(--stroke); border-radius:12px; background:var(--surface); color:var(--ink); padding:7px 9px; }
.repayment-option small { display:block; font-size:.76rem; }
.repayment-option b { font-size:.78rem; color:#66472c; text-align:right; }
.repayment-option[aria-pressed=true] { background:#ece5d7; border-color:#c3ab8b; }
.repayment-option:hover { background:#f4eee2; }
@media(max-width:800px) {
  .decision-layout,.change-layout,.scenario-layout { grid-template-columns:minmax(0,1fr); }
  .scenario-left,.scenario-right { display:contents; }
  #monthly-budget-result { grid-row:2; }
  .decision-list .dashboard-jump { min-height:61px; padding:8px 12px; }
  .decision-payday .event-list { max-height:none; }
}
@media(max-width:650px) {
  .cash-position-top { padding-bottom:8px; }
  .cash-position-facts { gap:5px 10px; }
  .cash-position-main { padding-block:9px; }
  .decision-list { gap:6px; }
  .decision-list .dashboard-jump strong { font-size:.96rem; }
  .decision-list .dashboard-jump small { font-size:.76rem; }
  .month-movement { gap:8px; }
}
.cash-position-meter { display:flex; gap:2px; height:8px; border-radius:6px; overflow:hidden; background:#ffffff20; margin-bottom:10px; }
.cash-position-meter i { flex:0 1 auto; }
.cash-position-meter .due { background:#e3ad8c; }
.cash-position-meter .everyday { background:#bdcadc; }
.cash-position-meter .buffer { background:#647e9a; }
.cash-position-meter .available { background:#86d2b7; }

        bills:list(update.bills,'bills').filter(x=>!existing(state.bills,x)),

    const result={added:0,duplicates:0,review:0,corrected:0,statements:0};
    const touched=new Set();
    function merge(group,label,fields,matchesEntry,updateExisting) {

          const available=matches.filter(v=>!v.chatKey);

          if(group==='accounts'&&matches.some(v=>v.chatKey))fail('Use the existing chat account ID for '+data.name+'.');

        }

        } else {

      }
      for(const item of state[group])if(item.chatKey&&!known.has(item.chatKey))known.set(item.chatKey,item);

    }
    const lookup=(map,value,label,optional=false)=>{

      const entry=map.get(key(value,label));

    };
    const nickname=(x,label)=>text(x.name,label+' name',80);
    const accounts=merge('accounts','account',x=>{
      const type=option(x.type,accountTypes,'account type');
      const balance=x.balance===undefined||x.balance===null?null:signed(x.balance,'account balance');
      const balanceDate=balance===null?'':date(x.balanceDate,'balance date');
      const openDate=date(x.openDate,'account opening date',true),closeDate=date(x.closeDate,'account closing date',true);
      if(balanceDate>today||(openDate&&closeDate&&openDate>closeDate))fail('The chat update contains an invalid account date.');
      return {name:nickname(x,'account'),type,balance,balanceDate,openDate,closeDate,
        floor:optionalMoney(x.floor,'account buffer')??0,history:flag(x.history,true,'statement coverage'),
        forecast:['Chequing','Savings'].includes(type)&&flag(x.forecast,balance!==null&&type==='Chequing','cash forecast')};
    },(a,b)=>a.type===b.type,(saved,data)=>{

    });
    const loans=merge('loans','debt',x=>{
      const asOf=date(x.asOf,'debt balance date');
      const rateAfter=rate(x.rateAfter,'replacement interest rate'),rateDate=date(x.rateDate,'promo expiry or rate change date',true);
      if(asOf>today||(rateAfter!==null&&!rateDate))fail('The chat update contains an invalid debt date.');
      const type=option(x.type,['Mortgage','Credit card','Line of credit','Auto loan','Other'],'debt type');
      return {name:nickname(x,'debt'),type,asOf,balance:integer(x.balance,'debt balance'),rate:rate(x.rate,'annual interest rate'),
        rateType:option(x.rateType??'Fixed',['Fixed','Variable','Promotional'],'rate type'),
        method:option(x.method??'Monthly estimate',['Monthly estimate','Canadian mortgage'],'interest convention'),
        payment:optionalMoney(x.payment,'required debt payment'),frequency:option(x.frequency??'Monthly',[...recurrence.slice(1),'Semimonthly'],'debt payment frequency'),
        minimumPercent:rate(x.minimumPercent,'minimum percentage'),renewal:date(x.renewal,'renewal date',true),nextDue:date(x.nextDue,'next payment date',true),
        account:lookup(accounts,x.account,'funding account',true),rateAfter,rateDate,
        prepay:optionalMoney(x.prepay,'annual prepayment limit')??(type==='Mortgage'?0:null),
        source:optionalText(x.source,'debt source',120),note:optionalText(x.note,'debt note')};
    },(a,b)=>a.type===b.type,(saved,data,raw)=>{
      if(saved.type!==data.type)fail(data.name+' has a different debt type on the dashboard.');
      if(saved.asOf&&data.asOf<saved.asOf)return;
      const fields=['balance','asOf','rate','rateType','method','payment','frequency','minimumPercent','renewal','nextDue','account','rateAfter','rateDate','prepay','source','note'];
      for(const f of fields)if(Object.hasOwn(raw,f))saved[f]=data[f];

    const projects=merge('projects','project',x=>({name:nickname(x,'project'),
      status:option(x.status??'Active',['Active','Planned','Complete'],'project status'),
      unbilled:optionalMoney(x.unbilled,'unbilled project amount'),loan:lookup(loans,x.loan,'project debt',true),
      note:optionalText(x.note,'project note')}),()=>true,(saved,data,raw)=>{
      for(const field of ['status','unbilled','loan','note'])if(Object.hasOwn(raw,field))saved[field]=data[field];
    });
    merge('bills','bill or payday',x=>{
      const direction=option(x.direction,['Bill','Income','Transfer'],'bill type');
      const account=lookup(accounts,x.account,'funding account',true);
      const toAccount=direction==='Transfer'?lookup(accounts,x.toAccount,'destination account'):'';
      if(direction==='Transfer'&&(!account||account===toAccount))fail('A planned transfer needs two different accounts.');
      const start=date(x.start,'first payment date'),end=date(x.end,'final payment date',true);
      if(end&&end<start)fail('The end of a schedule must follow its start date.');
      return {name:nickname(x,'schedule'),direction,account,toAccount,start,end,
        frequency:option(x.frequency??'Monthly',recurrence,'schedule frequency'),amount:optionalMoney(x.amount,'scheduled payment'),
        mode:direction==='Income'?'Deposit':option(x.mode??'Manual',['Manual','Autopay'],'payment method'),
        variable:flag(x.variable,false,'variable payment'),project:direction==='Bill'?lookup(projects,x.project,'project',true):'',
        loan:direction==='Bill'?lookup(loans,x.loan,'scheduled debt',true):'',note:optionalText(x.note,'payment note')};
    },(a,b)=>a.account===b.account&&a.direction===b.direction,(saved,data,raw)=>{
      if(saved.direction!==data.direction)fail('The chat update changes the type of '+saved.name+'.');
      for(const field of ['account','toAccount','amount','frequency','start','end','mode','variable','project','loan','note'])if(Object.hasOwn(raw,field))saved[field]=data[field];
    });
    merge('goals','goal',x=>({name:nickname(x,'goal'),target:integer(x.target,'goal amount',1),saved:optionalMoney(x.saved,'saved amount')??0,
      deadline:date(x.deadline,'goal deadline',true),priority:integer(x.priority??1,'goal priority',1,99)}),
      ()=>true,(saved,data,raw)=>{
        for(const field of ['target','saved','deadline','priority'])if(Object.hasOwn(raw,field))saved[field]=data[field];
      });
    function classification(entry) {
      const kind=option(entry.kind??'Review',E.kinds,'transaction type');
      const project=kind==='Project'?lookup(projects,entry.project,'transaction project'):'';
      const category=['Spending','Reimbursement'].includes(kind)?text(entry.category,'category',60):optionalText(entry.category,'category',60);
      return {kind,category,project};
    }
    function reviewed(entry,amount){
      const base=classification(entry);
      let allocations;
      if(entry.allocations!==undefined) {
        if(!Array.isArray(entry.allocations)||entry.allocations.length!==2)fail('A split needs two amounts.');
        allocations=entry.allocations.map(a=>{
          object(a,'Transaction split');
          const amountPart=signed(a.amount,'split amount'),fields=classification(a);
          if(!amountPart||Math.sign(amountPart)!==Math.sign(amount)||!['Spending','Reimbursement','Project','Financing'].includes(fields.kind))fail('Check the parts of the split transaction.');
          return {amount:amountPart,...fields};

        if(E.sum(allocations,a=>a.amount)!==amount)fail('A split does not match its original amount.');

      }
      return {...base,allocations,manual:base.kind!=='Review',
        why:optionalText(entry.question,'transaction question',240)||(base.kind==='Review'?'Confirm category or project in chat.':'Prepared in chat'),
        note:optionalText(entry.note,'transaction note')};
    }
    if(update.repair)result.corrected+=repairRows(state,update,accounts,projects,reviewed,touched);
    const packetKeys=new Set();
    const priorSources=new Set(state.imports.map(x=>x.sourceKey).filter(Boolean));
    for(const packet of list(update.statements,'statements')){
      object(packet,'Statement');

      if(packetKeys.has(sourceKey))fail('The chat update repeats a statement ID.');
      packetKeys.add(sourceKey);
      const start=date(packet.start,'start of statement'),end=date(packet.end,'end of statement');
      if(end<start||end>today)fail('Check the date range for a statement.');
      const id=E.id(), name=text(packet.label,'statement label',120);
      const issues=integer(packet.issueCount??0,'unresolved rows',0,100_000);
      const coverageConfirmed=flag(packet.coverageConfirmed,false,'confirmed statement coverage')&&!issues;
      const rows=list(packet.transactions,'statement transactions').map(entry=>{
        object(entry,'Transaction');
        const day=date(entry.date,'transaction date');
        if(day<start||day>end)fail('A transaction falls outside its statement dates.');
        const amount=signed(entry.amount,'transaction amount');
        const description=text(entry.description,'transaction description',240);
        const external=optionalText(entry.external,'transaction reference',140);
        const t={id:E.id(),importId:id,account,date:day,amount,description,external,pair:'',...reviewed(entry,amount)};
        if(E.compoundDescription(t))Object.assign(t,E.classify(state,t),{manual:false,allocations:undefined});
        const rule=t.kind==='Review'&&!t.allocations?E.savedRule(state,t):null;
        if(rule&&rule.kind!=='Review'&&(rule.kind!=='Project'||state.projects.some(p=>p.id===rule.project))) {
          Object.assign(t,{kind:rule.kind,category:rule.category,project:rule.project,manual:true,why:'Saved rule'});
        }
        return {transaction:t};
      });
      E.duplicateReview(state.transactions,rows);
      const accepted=rows.filter(x=>!x.duplicate).map(x=>x.transaction);
      if(!accepted.length&&priorSources.has(sourceKey)){result.duplicates+=rows.length;continue;}
      for(const t of accepted){state.transactions.push(t);touched.add(t.id);}
      state.imports.push({id,account,name,start,end,coverageConfirmed,balanceCheck:packet.reconciled===true?'Balances tie':'Unverified',
        issueCount:issues,count:accepted.length,approved:today,sourceKey});
      result.added+=accepted.length;
      result.duplicates+=rows.length-accepted.length;
      result.statements++;
    }
    for(const entry of list(update.corrections,'corrections')) {
      object(entry,'Correction');
      const account=lookup(accounts,entry.account,'correction account');
      const d=date(entry.date,'correction date'),amount=signed(entry.amount,'correction amount');
      const description=text(entry.description,'description of the corrected transaction',240);
      const external=optionalText(entry.external,'correction reference',140);
      const matches=state.transactions.filter(t=>t.account===account&&t.amount===amount&&(!external||external===t.external)&&
        (t.date===d&&lower(t.description)===lower(description)||t.sourceDescription&&(t.sourceDate||t.date)===d&&lower(t.sourceDescription)===lower(description)));
      if(matches.length!==1)fail('A correction does not match one transaction in your ledger.');

      if(flag(entry.onlyReview,false,'apply to unclassified rows only')&&(t.kind!=='Review'||t.allocations?.length))continue;
      if(t.pair)fail('A correction refers to a linked transfer. Unlink it in the dashboard before reclassifying it.');

      if(!touched.has(match.left.id)&&!touched.has(match.right.id))continue;
      for(const [t,other] of [[match.left,match.right],[match.right,match.left]]) {
        t.beforePair={kind:t.kind,category:t.category,project:t.project,why:t.why,manual:t.manual};
        Object.assign(t,{kind:'Transfer',category:match.label,project:'',pair:other.id,manual:true,why:'Matched to '+other.description});
      }
    }
    if(update.reviewPass)applyReviewPass(state,update.reviewPass,accounts,reviewed,result,touched);
    for(const t of list(update.targets,'targets')){
      object(t,'Category target');
      const category=text(t.category,'target category',60);
      if(['__proto__','constructor','prototype'].includes(category))fail('Check the target category.');
      const method=option(t.method,['Recent history','Fixed','Annual'],'target method');
      const amount=method==='Recent history'?null:integer(t.amount,'target amount');

    }
    for(const m of list(update.excludedMonths,'baseline months')){

      if(!state.excludedMonths.includes(m))state.excludedMonths.push(m);
    }
    if(update.config){
      const c=update.config;
      if(Object.hasOwn(c,'surplus'))state.config.surplus=integer(c.surplus,'monthly surplus');
      if(Object.hasOwn(c,'debtShare'))state.config.debtShare=integer(c.debtShare,'debt allocation',0,100);
      if(Object.hasOwn(c,'floor'))state.config.floor=integer(c.floor,'cash buffer');

    }
    result.review=state.transactions.filter(t=>touched.has(t.id)&&t.kind==='Review').length;
    result.id=update.id;result.date=today;
    state.chatUpdates=[...updates,result];
    return result;
  }
  return {read,apply};
})();

'use strict';
const Vault=(() => {
  const storageKey='aqueduct-offline-v1';
  const encoder=new TextEncoder();
  const decoder=new TextDecoder();
  const ITERATIONS=600000;
  const encode=bytes=>{
    let chars='';
    for(let i=0;i<bytes.length;i+=8192) chars+=String.fromCharCode(...bytes.subarray(i,i+8192));
    return btoa(chars);
  };
  const decode=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
  const random=n=>crypto.getRandomValues(new Uint8Array(n));
  function parse(serialized) {
    let b;
    try { b=JSON.parse(serialized); } catch { throw new Error('Select an Aqueduct encrypted backup.'); }
    if (!b||b.format!=='AqueductVault'||b.version!==1||b.iterations!==ITERATIONS||
        typeof b.data!=='string'||typeof b.salt!=='string'||typeof b.iv!=='string'||b.data.length>100_000_000||
        decode(b.salt).length!==16||decode(b.iv).length!==12) throw new Error('This backup format is invalid or unsupported.');
    return b;
  }
  async function key(password,salt) {
    if(!crypto.subtle) throw new Error('Encryption is unavailable in this browser context. Download the HTML and open it directly in Safari or Chrome.');
    const base=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITERATIONS,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function seal(state,secret,salt) {
    const iv=random(12);
    const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},secret,encoder.encode(JSON.stringify(state)));
    return JSON.stringify({format:'AqueductVault',version:1,iterations:ITERATIONS,salt:encode(salt),iv:encode(iv),data:encode(new Uint8Array(encrypted))});
  }
  function validate(state) {
    if (!state || state.version!==1 || !['accounts','transactions','imports','rules','projects','bills','loans','goals','excludedMonths'].every(k=>Array.isArray(state[k])) ||
        !['config','targets','billStatus'].every(k=>state[k] && typeof state[k]==='object')) throw new Error('The ledger format is unsupported.');
    return state;
  }
  async function open(serialized,password) {
    const b=parse(serialized);
    const salt=decode(b.salt), secret=await key(password,salt);
    let state;
    try {
      const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(b.iv)},secret,decode(b.data));
      state=JSON.parse(decoder.decode(bytes));
    } catch { throw new Error('Incorrect passphrase or the backup was altered.'); }
    return {state:validate(state),secret,salt};
  }
  async function create(state,password) {
    const salt=random(16);
    const secret=await key(password,salt);
    return {state,secret,salt};
  }
  const get=()=>{try{return localStorage.getItem(storageKey);}catch{return null;}};
  const put=serialized=>localStorage.setItem(storageKey,serialized);
  return {storageKey,parse,open,create,seal,get,put};
})();

  async function applyChatUpdate() {
    if(!chatUpdate||!S||sample)return;

      chatUpdate=null;
      note('This chat update is already in your ledger.');
      return;
    }
    let result;
    try{
      await write(next=>{result=ChatUpdate.apply(next,update,E.today());});

  function timingAction(position) {
    const {plan,buffer,pay}=position;
    const account=plan.missing[0]||plan.stale[0];
    const funding=plan.unassigned.find(e=>!e.key.startsWith('flex/'));
    if(account)return {label:'Update cash balance',action:'account-edit',id:account.id,why:'Refresh '+account.name+' to use today’s cash.'};
    if(!plan.verified.length)return {label:'Set up cash accounts',action:'account-settings',id:'',why:'Choose which accounts pay your bills.'};
    if(funding)return {label:'Check upcoming payment',action:'occurrence',id:funding.key,why:funding.name+' needs an amount or funding account.'};
    if(plan.missingLoanPayments.length){const loan=plan.missingLoanPayments[0];return {label:'Add debt payment date',action:'loan-bill',id:loan.id,why:loan.name+' is missing a payment schedule.'};}
    if(!buffer||plan.unassigned.some(e=>e.key.startsWith('flex/')))return {label:'Set cash assumptions',action:'config',id:'cash',why:!buffer?'Enter a cash buffer to measure what’s available.':'Choose an account for everyday spending.'};
    if(!pay)return {label:'Open payday plan',action:'nav',id:'Cash plan',why:'Add a paycheque date to plan through payday.'};
    if(position.gap||position.accountGap)return {label:'Open payday plan',action:'nav',id:'Cash plan',why:position.gap?
      money(position.gap)+' below the household buffer.':'A bill account falls below its own buffer.'};
    return {label:'Open payday plan',action:'nav',id:'Cash plan',why:confirmedCashCosts(position)?'':plan.livingReserve?'Confirm everyday costs before using this estimate.':'Confirm remaining everyday costs.'};
  }
  function paydayTimeline(position) {
    const {plan,pay,cutoff,buffer}=position;
    const start=plan.points[0].date;
    const range=Math.max(1,E.distance(start,cutoff));
    const span=573;
    const x=date=>12+E.distance(start,date)/range*span;
    const min=Math.min(buffer,plan.low), max=Math.max(buffer,...plan.points.map(point=>point.total));
    const y=total=>108-(total-min)/Math.max(1,max-min)*89;
    const drawn=plan.points.map((point,i)=>i?`H${x(point.date)}V${y(point.total)}`:`M${x(point.date)} ${y(point.total)}`).join('');
    const path=drawn+'H'+(12+span);
    const billPoints=plan.points.filter(p=>p.event?.direction==='Bill'&&!p.event.key.startsWith('flex/'))
      .sort((a,b)=>b.event.forecastAmount-a.event.forecastAmount).slice(0,2).sort((a,b)=>a.date.localeCompare(b.date));
    const paydayLabel=pay?'Payday':'Window ends';
    return `<figure class="cash-timeline">
      <div class="cash-timeline-values">
        <span>Projected low <b>${money(plan.low)}</b> <small>${H(dateLabel(plan.lowDate))}</small></span>
        <span>Buffer <b>${money(buffer)}</b></span>
      </div>
      <svg viewBox="0 0 600 122" preserveAspectRatio="none" aria-hidden="true">
        <path class="cash-floor-line" d="M12 ${y(buffer)}H${12+span}"/>
        <path class="cash-forecast-line" d="${path}"/>
        ${billPoints.map(p=>`<path class="cash-bill-mark" d="M${x(p.date)-4} ${y(p.total)}h8 M${x(p.date)} ${y(p.total)-4}v8"/>`).join('')}
        <path class="cash-low-mark" d="M${x(plan.lowDate)-5} ${y(plan.low)-5}h10v10h-10Z"/>
      </svg>
      <figcaption><span>Today · ${H(dateLabel(start))}</span><span>${paydayLabel} · ${H(dateLabel(cutoff))}</span></figcaption>
      ${billPoints.length?`<ul class="cash-timeline-bills" aria-label="Major bills in this window">${billPoints.map(({date,event})=>
        `<li><span>${H(dateLabel(date))} · ${link(event.name,'occurrence',event.key)}</span><b class="money">${money(event.forecastAmount)}</b></li>`).join('')}</ul>`:''}
    </figure>`;
  }
  function cashPositionCard(position,showTimeline=false) {
    const {plan,room,bills,buffer,cutoff,pay,unknownBills}=position;
    const next=timingAction(position);
    const heading=pay?'Before payday':'Next 14 days';
    const hasCosts=plan.livingReserve>0||confirmedCashCosts(position);
    const opening=Math.max(1,plan.opening);
    const components=[[bills,'due'],[plan.livingReserve,'everyday'],[buffer,'buffer'],[room,'available']];
    let remaining=100;
    const meter=room!==null&&plan.opening>0?`<div class="cash-position-meter" aria-hidden="true">${components.map(([amount,tone])=>{
      const width=Math.max(0,Math.min(remaining,amount/opening*100));
      remaining-=width;
      return `<i class="${tone}" style="width:${width}%"></i>`;
    }).join('')}</div>`:'';
    const title=room===null?'Cash room pending':hasCosts?'Estimated cash available':'Cash available before everyday costs';
    const why=next.why?`<p class="cash-next-note">${H(next.why)}</p>`:'';
    const action=tab==='Cash plan'&&next.id==='Cash plan'?{label:'Check funding',action:'cash-controls',id:''}:next;
    return `<section class="cash-position" aria-label="${heading}">
      <div class="cash-position-top"><h2>${heading}</h2><span>Through ${H(dateLabel(cutoff))}</span></div>
      <div class="cash-position-main"><span>${title}</span><strong class="money">${money(room)}</strong></div>
      ${showTimeline&&room!==null?paydayTimeline(position):meter}<dl class="cash-position-facts">
        <div><dt>${plan.stale.length||plan.missing.length?'Cash on file':'Cash on hand'}</dt><dd>${money(plan.verified.length?plan.opening:null)}</dd></div>
        <div><dt>${unknownBills?'Known bills due':'Bills due'}</dt><dd>${money(bills)}</dd></div>
        <div><dt>Everyday costs</dt><dd>${money(plan.livingReserve||null)}</dd></div>
        <div><dt>Cash buffer</dt><dd>${money(buffer||null)}</dd></div>
      </dl>
      ${why}<div class="cash-position-actions">${btn(action.label,action.action,action.id,'position-primary')}

  function changesSummary(changes) {
    if(!changes.purchasesComparable&&changes.cashComparable) {
      const outgoing=changes.moneyOut[0], incoming=changes.moneyIn[0];
      const driver=outgoing||incoming;
      const delta=outgoing?changes.cash.outflow-changes.priorCash.outflow:changes.cash.inflow-changes.priorCash.inflow;
      const label=outgoing?'Withdrawals':'Deposits';
      return {value:signedMoney(delta),detail:driver?label+' · '+driver.name+' '+(driver.delta>0?'rose ':'fell ')+money(Math.abs(driver.delta)):'Cash movement was steady'};
    }
    const top=changes.spending[0];
    if(!top)return {value:changes.purchasesComparable?money(changes.purchaseTotal):'—',detail:changes.purchasesComparable?
      'Categorized purchases were steady':changes.cash.available?'See recorded cash activity':'Add statements to see what changed'};
    if(!changes.purchasesComparable)return {value:money(top.recent),detail:categoryName(top.name||'Unassigned')+' led recorded spending'};
    const change=changes.purchaseTotal-changes.priorPurchases;
    return {value:signedMoney(change),detail:'Purchases · '+categoryName(top.name||'Unassigned')+' '+(top.delta>0?'rose ':'fell ')+money(Math.abs(top.delta))};
  }

    const target=E.debtProfile(S,now).target;

  function statementFixes(rows) {
    if(!rows.length)return panel('Statement fixes',no('There are no combined descriptions to verify.'));
    const byStatement=new Map();
    for(const t of rows) {
      const key=t.importId||t.account;
      if(!byStatement.has(key))byStatement.set(key,[]);
      byStatement.get(key).push(t);
    }
    const statements=[...byStatement.values()].sort((a,b)=>(byId(S.imports,b[0].importId)?.end||b[0].date).localeCompare(byId(S.imports,a[0].importId)?.end||a[0].date));
    return panel('Statement fixes',statements.map(entries=>{
      const imported=byId(S.imports,entries[0].importId);
      const label=imported?.name||alias(entries[0].account);
      const byDescription=new Map();
      for(const t of entries) {
        if(!byDescription.has(t.description))byDescription.set(t.description,[]);
        byDescription.get(t.description).push(t);
      }
      return '<details class="subtle section-gap"><summary>'+H(label)+' · '+entries.length+' to verify</summary>'+
        [...byDescription].map(([description,group])=>'<div class="statement-fix-group"><p class="small">'+H(description)+'</p><ul class="list">'+
        group.map(t=>'<li><div><strong>'+money(t.amount)+'</strong><small class="small">'+H(t.date)+'</small></div>'+
        btn('Fix this row','fix-statement-row',t.id,'mini quiet')+'</li>').join('')+'</ul></div>').join('')+'</details>';
    }).join(''),'Compare each row to the original statement. These amounts stay in the ledger while their categories are in review.');

  async function saveQuick(id,classification) {
    const card=currentReview(id);
    const remember=classification?.kind==='Spending'&&card.eligible&&root.querySelector('#quick-remember')?.checked;
    const previous=card.rows.map(t=>structuredClone(t));
    let previousRules=null;
    await write(next=>{
      if(card.type==='pair') {
        applyPair(next,card.rows[0].id,card.rows[1].id,card.label);
        return;
      }
      for(const t of card.rows)Object.assign(byId(next.transactions,t.id),classification,{manual:true,why:'Confirmed in quick review'});
      if(remember) {
        const t=card.rows[0], merchant=E.normal(t.description), direction=Math.sign(t.amount);
        previousRules=structuredClone(next.rules);
        next.rules=next.rules.filter(r=>r.account!==t.account||r.merchant!==merchant||r.direction!==direction);
        next.rules.push({...classification,account:t.account,merchant,direction});
      }
    });
    if(!S)return;
    quickUndo={state:S,previous,previousRules};
    reviewPicker='';
    render();
    root.querySelector('#quick-current')?.focus({preventScroll:true});
    note(card.type==='pair'?'Transfer linked.':card.rows.length===1?'Transaction confirmed.':card.rows.length+' transactions confirmed.');
  }
  async function undoQuick() {
    if(quickUndo?.state!==S||!quickUndo)return;
    const {previous,previousRules}=quickUndo;
    await write(next=>{
      previous.forEach(t=>replace(next.transactions,t));
      if(previousRules) next.rules=previousRules;
    });
    quickUndo=null;
    render();
    note('Last review undone.');
  }

  function readMap(form,file) {
    Object.assign(file,{account:val(form,'account'),order:val(form,'order'),header:form.has('header'),reverse:form.has('reverse'),skip:Number(val(form,'skip'))||0});
    for(const key of ['date','description','amount','debit','credit','external']) file.map[key]=Number(val(form,key));
  }
  function stageFile(form) {
    const p=preview;
    if(!p || p.file!==selectedFile) throw new Error('Preview the file first.');
    const start=dateField(form,'period_start'),end=dateField(form,'period_end');
    if(end<start || p.result.some(t=>t.date<start||t.date>end)) throw new Error('The date range must include every parsed row. Check the date order and statement period.');
    if(!p.result.length&&!form.has('coverage')) throw new Error('There are no transactions. Confirm coverage if this is a zero-activity statement.');
    if(p.issues.length&&!form.has('allow_skips')) throw new Error('Review the unreadable rows before staging.');
    const opening=val(form,'opening'),closing=val(form,'closing');
    let balanceCheck='Unverified';
    if(opening||closing) {
      const o=E.money(opening),c=E.money(closing);
      if(o===null||c===null) throw new Error('Enter both a valid opening and closing balance.');
      const account=byId(S.accounts,p.account);
      const delta=(c-o)*(['Credit card','Line of credit or loan'].includes(account.type)?-1:1);
      const net=E.sum(p.result,t=>t.amount);
      if(net!==delta) throw new Error('Statement differs from the parsed rows by '+money(net-delta)+'. Check the signs, columns, or balances.');
      balanceCheck='Balances tie';
    }
    const id=E.id();
    staging.push({id,account:p.account,name:p.name,start,end,balanceCheck,issueCount:p.issues.length,coverageConfirmed:form.has('coverage')&&!p.issues.length,
      items:p.result.map(transaction=>({transaction:{...transaction,importId:id},force:false}))});
    files=files.filter(file=>file.id!==p.file);selectedFile=files[0]?.id||'';preview=null;
    render();
    note(p.issues.length?'Statement staged. Skipped rows leave this coverage unconfirmed.':'Statement staged. Approve the batch when ready.');
  }
  function buildBatch() {
    const existing=structuredClone(S.transactions), stagedRows=[];
    for(const packet of staging) {
      packet.items.forEach(item=>{item.duplicate='';});
      E.duplicateReview(existing,packet.items);
      for(const item of packet.items) {
        if(!item.duplicate||item.force) {
          existing.push(structuredClone(item.transaction));
          stagedRows.push(item.transaction);
        }
      }
    }
    const changed=new Set(stagedRows.map(t=>t.id));
    const pairs=E.matchTransfers(existing,S.accounts).filter(p=>changed.has(p.left.id)||changed.has(p.right.id));
    return {existing,stagedRows,pairs};
  }
  function batchView() {
    const {stagedRows,pairs}=buildBatch();
    const flagged=staging.flatMap(p=>p.items.filter(x=>x.duplicate));
    const suggested=pairs.length?'<details class="subtle"><summary>'+pairs.length+' suggested transfer match'+(pairs.length===1?'':'es')+'</summary>'+
      '<p class="small">Both sides have matching amounts and nearby dates. Clear the checkbox below if you want to review the matches individually later.</p>'+
