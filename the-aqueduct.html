<body>
<div id="app"></div>
<script>
/* ===================== THE AQUEDUCT · v2 =====================
   One tool, end to end. The Aqueduct and The Waterfall, merged.

   Tab 1  PAYCHEQUE  the book becomes take-home: AUM, fee, referral haircut,
                     grid, pension, 2026 federal + Manitoba tax, CPP, EI,
                     ESOP, the charitable gift.
   Tab 2  PLAN       every dollar gets a job before the month starts:
                     categorized expenses, debts with a payoff engine,
                     savings goals with targets, and whatever survives is
                     spending money. Guilt free by construction.
   Tab 3  MONTH      the living layer: this month's spending allowance
                     burning down, a two-tap spend log, and the money-moves
                     checklist with a streak.
   Tab 4  REVIEW     paste a bank statement and the month is parsed,
                     categorized and graded against the plan. Corrections are
                     remembered. Monthly trend underneath.

   Single file, localStorage under aqueduct:v2, migrates aqueduct:v1 and
   waterfall:v1 on first run. No dependencies, no native dialogs. */

var KEY="aqueduct:v2";
function J(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }

/* ---------- 2026 tax constants ---------- */
var FED=[[58523,.14],[117045,.205],[181440,.26],[258482,.29],[Infinity,.33]];
var MB =[[47000,.108],[100000,.1275],[Infinity,.174]];
var FED_BPA_HI=16452, FED_BPA_LO=14829, FED_BPA_START=181440, FED_BPA_END=258482, FED_LOW=.14;
var MB_BPA=15780, MB_BPA_START=200000, MB_BPA_END=400000, MB_LOW=.108;
var CPP_YMPE=74600, CPP_YAMPE=85000, CPP_EXEMPT=3500, CPP_RATE=.0595, CPP_MAX=4230.45, CPP2_RATE=.04, CPP2_MAX=416;
var EI_MAX_INS=68900, EI_RATE=.0163, EI_MAX=1123.07;

var DEFAULT_CATS=["Housing","Transport","Food & Dining","Utilities","Insurance","Debt","Childcare","Health","Lifestyle","Subscriptions","Giving","Savings","Other"];
var STARTER=[
  ["Mortgage or rent","Housing","monthly"],
  ["Property tax","Housing","monthly"],
  ["Hydro and heat","Utilities","monthly"],
  ["Internet and phone","Utilities","monthly"],
  ["Groceries","Food & Dining","weekly"],
  ["Dining out","Food & Dining","monthly"],
  ["Fuel","Transport","monthly"],
  ["Vehicle and insurance","Transport","monthly"],
  ["Daycare","Childcare","monthly"],
  ["Life and disability insurance","Insurance","monthly"],
  ["Health and dental","Health","monthly"],
  ["Subscriptions","Subscriptions","monthly"],
  ["Fun and lifestyle","Lifestyle","monthly"]
];
var CATCOLOR={Housing:"#f0b73e",Transport:"#4ea3e0","Food & Dining":"#2fd180",Food:"#2fd180",Utilities:"#45c8d8",Insurance:"#9d7bff",Debt:"#f0628a",Childcare:"#f6cf6a",Health:"#6ee0ec",Lifestyle:"#f0683e",Subscriptions:"#8089a8",Giving:"#9af0c6",Savings:"#6de0a8",Other:"#7c84a8"};

var DEF={
  aum:"", refPct:"",
  feeRate:1, gridLow:35, gridHigh:45, cliffRev:650000, gridMode:"auto",
  pensionPct:4, esopPct:6, esopCap:10000, charityYr:1000, otherIncMo:"",
  showAssume:false, showCats:false,
  cats:null, starterLoaded:false,
  expenses:[],
  debts:[], strategy:"avalanche",
  goals:[],            /* {id,name,target,due,prio,kind,ret,earmarked,contribMo} */
  accounts:[],         /* {id,name,kind,bal,contribMo} — the balance sheet */
  fi:{lifestyleMode:"auto",lifestyleMo:"",swr:4,otherIncomeMo:"",returnPct:6,ageNow:"",taxRate:30},
  lens:"monthly",      /* the per-pay lens for goal pricing */
  summitImported:false,
  open:null, showNotes:false,
  spends:[],
  exec:{}, acctNames:{committed:"Bills account",debt:"Debt payments",forward:"Savings / investing",enjoy:"Spending account"},
  rules:{}, audit:null,
  hist:[],
  pub:null,
  tab:null, created:null
};
var S=J(KEY,null);
var FRESH=!S;
if(FRESH) S=JSON.parse(JSON.stringify(DEF));

/* ---------- helpers needed by migration ---------- */
function uid(){ return Math.random().toString(36).slice(2,9); }
function normN(s){ return String(s||"").trim().toLowerCase(); }
function guessCat(n){
  n=String(n||"").toLowerCase();
  if(/mortgage|rent|property|condo|strata/.test(n)) return "Housing";
  if(/hydro|heat|water|sewer|internet|phone|cell|util/.test(n)) return "Utilities";
  if(/insur|assur/.test(n)) return "Insurance";
  if(/daycare|child|montessori|nanny/.test(n)) return "Childcare";
  if(/netflix|spotify|subscri|prime|disney|crave|icloud|apple/.test(n)) return "Subscriptions";
  if(/car|vehicle|auto|fuel|gas|lease|transit|parking/.test(n)) return "Transport";
  if(/grocer|food|dining|meal/.test(n)) return "Food & Dining";
  if(/gym|fitness|dental|health|medic|therap/.test(n)) return "Health";
  if(/loan|debt|credit|visa|mastercard|amex/.test(n)) return "Debt";
  if(/church|tithe|giv|donat|charit/.test(n)) return "Giving";
  return "Other";
}

/* ---------- migration: pull v1 Aqueduct + Waterfall forward ----------
   Runs once, only when no v2 state exists. Legacy keys are read, never
   written or deleted, so old backups stay intact and nothing is lost. */
(function migrateLegacy(){
  if(!FRESH) return;
  var a=J("aqueduct:v1",null), w=J("waterfall:v1",null);
  if(a){
    ["aum","refPct","feeRate","gridLow","gridHigh","cliffRev","gridMode","pensionPct","esopPct","esopCap","charityYr","created"]
      .forEach(function(k){ if(a[k]!==undefined&&a[k]!==null) S[k]=a[k]; });
    if(Array.isArray(a.cats)&&a.cats.length) S.cats=a.cats.slice();
    if(Array.isArray(a.expenses)) S.expenses=a.expenses.map(function(e){ return {id:e.id||uid(),name:e.name||"",cat:e.cat||"Other",amt:e.amt,freq:e.freq||"monthly"}; });
    if(a.starterLoaded) S.starterLoaded=true;
    (Array.isArray(a.allocations)?a.allocations:[]).forEach(function(al){
      if(!al||al.src==="waterfall") return;             /* waterfall pulls come back via w.fwd below */
      if(!al.name&&!(+al.amt>0)) return;
      S.goals.push({id:uid(),name:al.name||"Allocation",contribMo:+al.amt||"",target:"",earmarked:"",due:"",prio:"high",kind:"cash",ret:6});
    });
  }
  if(w){
    if(Array.isArray(w.debts)) S.debts=w.debts.map(function(d){ return {id:d.id||uid(),name:d.name||"",balance:d.balance,rate:d.rate,min:d.min,extra:d.extra}; });
    if(w.strategy) S.strategy=w.strategy;
    (Array.isArray(w.fwd)?w.fwd:[]).forEach(function(f){
      if(!f||(!f.name&&!(+f.amt>0))) return;
      if(S.goals.some(function(g){ return normN(g.name)===normN(f.name); })) return;
      S.goals.push({id:uid(),name:f.name||"Goal",contribMo:+f.amt||"",target:f.target||"",earmarked:f.cur||"",due:"",prio:"high",kind:"cash",ret:6});
    });
    (Array.isArray(w.bills)?w.bills:[]).forEach(function(b){
      if(!b||!b.name||b.src==="aqueduct") return;       /* aqueduct pulls already live in expenses */
      if(S.expenses.some(function(e){ return normN(e.name)===normN(b.name); })) return;
      var f=b.freq||"monthly"; if(["monthly","quarterly","semiannual","annual"].indexOf(f)<0) f="monthly";
      S.expenses.push({id:uid(),name:b.name,cat:guessCat(b.name),amt:b.amt,freq:f});
    });
    if(Array.isArray(w.spends)) S.spends=w.spends.slice(-400);
    if(w.rules&&typeof w.rules==="object") S.rules=w.rules;
    if(w.audit) S.audit=w.audit;
    if(w.accounts&&typeof w.accounts==="object"){
      ["committed","debt","forward","enjoy"].forEach(function(k){ if(w.accounts[k]) S.acctNames[k]=w.accounts[k]; });
    }
    (Array.isArray(w.hist)?w.hist:[]).forEach(function(hh){
      S.hist.push({ym:hh.ym,debt:+hh.debt||0,spend:+hh.enjoy||0,net:+hh.inc||0});
    });
  }
})();
(function migrate(){
  Object.keys(DEF).forEach(function(k){ if(S[k]===undefined) S[k]=JSON.parse(JSON.stringify(DEF[k])); });
  if(!S.created) S.created=new Date().toISOString().slice(0,10);
  if(!Array.isArray(S.cats)||!S.cats.length) S.cats=DEFAULT_CATS.slice();
  if(!S.starterLoaded){
    if(!Array.isArray(S.expenses)||!S.expenses.length){
      S.expenses=STARTER.map(function(r){ return {id:uid(),name:r[0],cat:r[1],amt:"",freq:r[2]}; });
    }
    S.starterLoaded=true;
  }
  /* v2.0 → v2.1: the checklist's account names used to live under "accounts";
     that key now belongs to the balance sheet */
  if(S.accounts && !Array.isArray(S.accounts)){
    var an=S.accounts; S.accounts=[];
    ["committed","debt","forward","enjoy"].forEach(function(k){ if(an[k]) S.acctNames[k]=an[k]; });
  }
  /* v2.0 goals {amt,target,cur} become full Summit-grade goals */
  S.goals=(Array.isArray(S.goals)?S.goals:[]).map(function(g){
    if(g && g.contribMo===undefined){
      return {id:g.id||uid(),name:g.name||"",target:g.target||"",due:g.due||"",prio:g.prio||"high",kind:g.kind||"cash",
        ret:(g.ret===undefined?6:g.ret),
        earmarked:(g.earmarked!==undefined?g.earmarked:(g.cur!==undefined?g.cur:(g.saved!==undefined?g.saved:""))),
        contribMo:(g.amt!==undefined?g.amt:"")};
    }
    return g;
  });
  /* The Summit folds in: goals merge by name, accounts and the independence
     picture carry straight over. Legacy key is read, never written. */
  if(!S.summitImported){
    var sm=J("summit:v1",null);
    if(sm){
      (Array.isArray(sm.goals)?sm.goals:[]).forEach(function(g){
        if(!g) return;
        var ear=(g.earmarked!==undefined&&g.earmarked!=="")?g.earmarked:(g.saved!==undefined?g.saved:"");
        var ex=g.name?S.goals.filter(function(x){ return normN(x.name)===normN(g.name); })[0]:null;
        if(ex){
          if(!(+ex.target>0)&&+g.target>0) ex.target=g.target;
          if(!ex.due&&g.due) ex.due=g.due;
          if(g.prio) ex.prio=g.prio;
          if(g.kind) ex.kind=g.kind;
          if(g.ret!==undefined) ex.ret=g.ret;
          if(!(+ex.earmarked>0)&&+ear>0) ex.earmarked=ear;
          if(!(+ex.contribMo>0)&&+g.contribMo>0) ex.contribMo=g.contribMo;
        } else {
          S.goals.push({id:uid(),name:g.name||"",target:g.target||"",due:g.due||"",prio:g.prio||"high",kind:g.kind||"cash",
            ret:(g.ret===undefined?6:g.ret),earmarked:ear,contribMo:g.contribMo||""});
        }
      });
      if((!S.accounts||!S.accounts.length)&&Array.isArray(sm.accounts)){
        S.accounts=sm.accounts.map(function(a){ return {id:a.id||uid(),name:a.name||"",kind:a.kind||"other",bal:a.bal,contribMo:a.contribMo}; });
      }
      if(sm.fi&&typeof sm.fi==="object"){
        Object.keys(sm.fi).forEach(function(k){ if(sm.fi[k]!==undefined&&sm.fi[k]!==null&&sm.fi[k]!=="") S.fi[k]=sm.fi[k]; });
        S.fi.lifestyleMode=(+sm.fi.lifestyleMo>0)?"manual":"auto";
      }
      if(sm.freq&&sm.freq!=="semimonthly") S.lens=sm.freq;
      else if(sm.freq==="semimonthly") S.lens="semimonthly";
    }
    S.summitImported=true;
  }
  Object.keys(DEF.fi).forEach(function(k){ if(S.fi[k]===undefined) S.fi[k]=DEF.fi[k]; });
})();

/* ---------- history ---------- */
var UNDO=[], LASTSIG=null, LASTT=0;
function sig(){ var c=JSON.parse(JSON.stringify(S)); delete c.tab; delete c.showAssume; delete c.showCats; delete c.showNotes; delete c.open; delete c.lens; delete c.pub; return JSON.stringify(c); }
function save(){
  var now=Date.now(), cur=sig();
  if(LASTSIG!==null && LASTSIG!==cur){
    if(now-LASTT>1000) UNDO.push(LASTSIG);
    if(UNDO.length>40) UNDO.shift();
  }
  LASTSIG=cur; LASTT=now;
  /* publish the finished number for sibling tools (The Atlas) */
  try{

/* ---------- the paycheque engine ---------- */
function bookRevenue(){
  var aum=+S.aum||0, fee=(+S.feeRate||0)/100, ref=Math.max(0,Math.min(100,+S.refPct||0))/100;
  return aum*fee*(1 - 0.25*ref);
}
function gridRate(){
  if(S.gridMode==="low") return (+S.gridLow||0)/100;
  if(S.gridMode==="high") return (+S.gridHigh||0)/100;
  return bookRevenue() >= (+S.cliffRev||0) ? (+S.gridHigh||0)/100 : (+S.gridLow||0)/100;
}
function grossIncome(){ return bookRevenue()*gridRate(); }
function progTax(income, brackets){
  var tax=0, prev=0;
  for(var i=0;i<brackets.length;i++){
    var cap=brackets[i][0], rate=brackets[i][1];
    if(income>cap){ tax+=(cap-prev)*rate; prev=cap; }
    else { return tax+(income-prev)*rate; }
  }
  return tax;
}
function fedBPA(t){
  if(t<=FED_BPA_START) return FED_BPA_HI;
  if(t>=FED_BPA_END) return FED_BPA_LO;
  return FED_BPA_HI-(FED_BPA_HI-FED_BPA_LO)*(t-FED_BPA_START)/(FED_BPA_END-FED_BPA_START);
}
function mbBPA(t){
  if(t<=MB_BPA_START) return MB_BPA;
  if(t>=MB_BPA_END) return 0;
  return MB_BPA*(1-(t-MB_BPA_START)/(MB_BPA_END-MB_BPA_START));
}
function fedTax(t){ return Math.max(0, progTax(t,FED)-fedBPA(t)*FED_LOW); }
function mbTax(t){ return Math.max(0, progTax(t,MB)-mbBPA(t)*MB_LOW); }
function cppOn(g){
  var base=Math.min(Math.max(0,Math.min(g,CPP_YMPE)-CPP_EXEMPT)*CPP_RATE, CPP_MAX);
  var c2=Math.min(Math.max(0,Math.min(g,CPP_YAMPE)-CPP_YMPE)*CPP2_RATE, CPP2_MAX);
  return base+c2;
}
function eiOn(g){ return Math.min(Math.min(g,EI_MAX_INS)*EI_RATE, EI_MAX); }
function paycheque(){
  var G=grossIncome();
  var pension=G*(+S.pensionPct||0)/100;
  var taxable=Math.max(0, G-pension);
  var ft=fedTax(taxable), pt=mbTax(taxable);
  var cpp=cppOn(G), ei=eiOn(G);
  var esop=Math.min(G*(+S.esopPct||0)/100, +S.esopCap||0);
  var charity=+S.charityYr||0;
  var incomeTax=ft+pt;
  var afterTax=G-pension-incomeTax-cpp-ei;
  var net=afterTax-esop-charity;
  return {
    aum:+S.aum||0, revenue:bookRevenue(), grid:gridRate(), gross:G,
    pension:pension, taxable:taxable, fed:ft, mb:pt, incomeTax:incomeTax, cpp:cpp, ei:ei,
    esop:esop, charity:charity, net:net, monthly:net/12,
    onHighGrid: gridRate()===((+S.gridHigh||0)/100),
    effTax: G>0 ? incomeTax/G : 0,
    allDeduct: G>0 ? (G-net)/G : 0

}
function takeHomeMo(){ return paycheque().monthly+(+S.otherIncMo||0); }

/* ---------- the plan ---------- */
var FREQ={
  weekly:{label:"Weekly", per:52/12},
  biweekly:{label:"Biweekly", per:26/12},
  monthly:{label:"Monthly", per:1},
  quarterly:{label:"Quarterly", per:1/3},
  semiannual:{label:"Twice a year", per:1/6},
  annual:{label:"Annual", per:1/12}
};
function cats(){ return (S.cats&&S.cats.length)?S.cats:DEFAULT_CATS; }
function catsFor(cur){ var list=cats().slice(); if(cur && list.indexOf(cur)<0) list.push(cur); return list; }
function catColor(c){ return CATCOLOR[c]||"#7c84a8"; }
function expMonthly(e){ return (+e.amt||0)*(FREQ[e.freq]||FREQ.monthly).per; }
function expensesMo(){ return S.expenses.reduce(function(t,e){ return t+expMonthly(e); },0); }
function catTotals(){
  var m={};
  S.expenses.forEach(function(e){ var c=e.cat||"Other"; m[c]=(m[c]||0)+expMonthly(e); });
  return m;
}
function debtMinMo(){ return S.debts.reduce(function(t,d){ return t+(+d.min||0); },0); }
function debtExtraMo(){ return S.debts.reduce(function(t,d){ return t+(+d.extra||0); },0); }
function debtMo(){ return debtMinMo()+debtExtraMo(); }
function debtBal(){ return S.debts.reduce(function(t,d){ return t+(+d.balance||0); },0); }
function goalsMo(){ return S.goals.reduce(function(t,g){ return t+(+g.contribMo||0); },0); }
function fiContribMo(){ return S.accounts.filter(isRetirementAcct).reduce(function(t,a){ return t+(+a.contribMo||0); },0); }
function savingsMo(){ return goalsMo()+fiContribMo(); }
function spendMo(){ return takeHomeMo()-expensesMo()-debtMo()-savingsMo(); }
function setupDone(){ return (+S.aum||0)>0; }

/* ---------- the Summit engine: goals priced per pay ----------
   A goal is a target, a date and what is already earmarked; the required
   contribution falls out. Long invested goals are solved with the future value
   of an annuity; short goals get honest plain division, because money needed
   inside two years should not be counting on markets. */
var HORIZON_YRS=2;
var LENS={
  weekly:{label:"Weekly",per:52,short:"/wk"},
  biweekly:{label:"Biweekly",per:26,short:"/2wk"},
  semimonthly:{label:"Twice a month",per:24,short:"/half"},
  monthly:{label:"Monthly",per:12,short:"/mo"},
  annual:{label:"Annual",per:1,short:"/yr"}
};
function lensInfo(){ return LENS[S.lens]||LENS.monthly; }
function perPeriod(mo){ var f=lensInfo(); return (+mo||0)*12/f.per; }
function fmtDur(months){
  months=Math.round(+months||0);
  if(months<=0) return "now";
  if(months<24) return months+" month"+(months===1?"":"s");
  var y=Math.floor(months/12), m=months%12;
  if(m===0) return y+" year"+(y===1?"":"s");
  return y+" year"+(y===1?"":"s")+", "+m+" month"+(m===1?"":"s");
}
function niceDate(isoD){
  if(!isoD) return "";
  try{ return new Date(isoD+"T12:00").toLocaleDateString("en-CA",{month:"short",year:"numeric"}); }
  catch(e){ return isoD; }
}
function monthsUntil(isoD){
  if(!isoD) return null;
  var t=new Date(isoD+"T12:00"), n=new Date();
  var days=(t-n)/86400000;
  return Math.max(0, Math.round(days/30.44*10)/10);
}
function requiredMonthly(target, current, months, annualRatePct){
  target=+target||0; current=+current||0; months=+months||0;
  if(months<=0) return Math.max(0, target-current);
  var i=(+annualRatePct||0)/100/12;
  if(i<=0) return Math.max(0,(target-current)/months);
  var g=Math.pow(1+i,months);
  var need=target-current*g;
  if(need<=0) return 0;
  return need*i/(g-1);
}
function project(current, monthlyPmt, months, annualRatePct){
  var i=(+annualRatePct||0)/100/12, g=Math.pow(1+i,months||0);
  if(i<=0) return (+current||0)+(+monthlyPmt||0)*(months||0);
  return (+current||0)*g + (+monthlyPmt||0)*(g-1)/i;
}
function monthsToTarget(target, current, monthlyPmt, annualRatePct){
  target=+target||0; current=+current||0; monthlyPmt=+monthlyPmt||0;
  if(current>=target) return 0;
  if(monthlyPmt<=0) return Infinity;
  var i=(+annualRatePct||0)/100/12;
  if(i<=0) return Math.ceil((target-current)/monthlyPmt);
  var num=Math.log((target*i+monthlyPmt)/(current*i+monthlyPmt));
  var den=Math.log(1+i);
  var n=num/den;
  return (isFinite(n)&&n>0)?Math.ceil(n):Infinity;
}
var PRIOS=[
  {k:"critical", label:"Critical",  color:"var(--rose)",  why:"Everything else waits for this"},
  {k:"high",     label:"High",      color:"var(--gold)",  why:"Funded before the nice-to-haves"},
  {k:"medium",   label:"Medium",    color:"var(--cyan)",  why:"Funded from what is left"},
  {k:"someday",  label:"Someday",   color:"var(--dim)",   why:"Named so it stops nagging, not funded yet"}
];
function prio(k){ return PRIOS.filter(function(p){ return p.k===k; })[0]||PRIOS[1]; }
function prioRank(k){ for(var i=0;i<PRIOS.length;i++){ if(PRIOS[i].k===k) return i; } return 1; }
var GOAL_KINDS=[
  {k:"cash",   label:"Cash goal",     icon:"◆", ret:0, note:"Held in cash or a HISA. No growth assumed."},
  {k:"invest", label:"Invested goal", icon:"▲", ret:6, note:"Invested and left alone. Growth does real work here."}
];
function goalKind(k){ return GOAL_KINDS.filter(function(g){ return g.k===k; })[0]||GOAL_KINDS[0]; }
function goalRate(g){
  if(g.kind!=="invest") return 0;
  var m=monthsUntil(g.due);
  if(m!==null && m < HORIZON_YRS*12) return 0;
  return +g.ret||0;
}
function goalMath(g){
  g=g||{};
  var target=+g.target||0, cur=+g.earmarked||0;
  var months=monthsUntil(g.due);
  var rate=goalRate(g);
  var pctDone=target>0?Math.min(1,cur/target):0;
  var need=Math.max(0,target-cur);
  var reqMo=(months===null)?null:requiredMonthly(target,cur,months,rate);
  var atPace=(+g.contribMo||0)>0 ? monthsToTarget(target,cur,+g.contribMo,rate) : Infinity;
  var landing=(months===null)?null:project(cur,+g.contribMo||0,months,rate);
  var landPct=(landing!==null&&target>0)?landing/target:null;
  var shortAt=(landing!==null)?Math.max(0,target-landing):null;
  return {target:target,cur:cur,need:need,months:months,rate:rate,pct:pctDone,reqMo:reqMo,atPace:atPace,

}
function sortedGoals(){
  return S.goals.slice().sort(function(a,b){
    var pa=prioRank(a.prio), pb=prioRank(b.prio);
    if(pa!==pb) return pa-pb;
    var ma=monthsUntil(a.due), mb=monthsUntil(b.due);
    if(ma===null&&mb===null) return 0;

}
function totalRequiredMo(){
  return S.goals.reduce(function(t,g){
    if(g.prio==="someday") return t;

  },0);

/* ---------- the balance sheet ----------
   Accounts are the truth: net worth is what they hold, minus what the debts
   claim. Goals earmark slices of the account pile; RESP money is education,
   not retirement; only what is left free funds independence. One dollar,
   one job. */
var ACCT_KINDS=[
  {k:"rrsp",   label:"RRSP",           note:"Taxed as income on the way out. The biggest pile is usually not the biggest spendable pile."},
  {k:"tfsa",   label:"TFSA",           note:"Comes out tax free. Worth the most per dollar of any account here."},
  {k:"nonreg", label:"Non-registered", note:"Capital gains taxed at half your rate, dividends get a credit. Flexible, partly taxed."},
  {k:"corp",   label:"Corporate",      note:"Passive income inside the corp is taxed hard, and the grind can claw back the small business rate."},
  {k:"fhsa",   label:"FHSA",           note:"Deduction going in, tax free coming out for a first home. The best of both, once."},
  {k:"resp",   label:"RESP",           note:"Earmarked for education, not for you. Tracked here so it does not get double counted."},
  {k:"pension",label:"Pension / DPSP", note:"Employer money. Vesting rules matter more than the balance."},
  {k:"other",  label:"Other",          note:""}
];
function acctKind(k){ return ACCT_KINDS.filter(function(a){ return a.k===k; })[0]||ACCT_KINDS[7]; }
function isRetirementAcct(a){ return a.kind!=="resp"; }
function grossAccounts(){ return S.accounts.reduce(function(t,a){ return t+(+a.bal||0); },0); }
function earmarkedEdu(){ return S.accounts.filter(function(a){ return !isRetirementAcct(a); }).reduce(function(t,a){ return t+(+a.bal||0); },0); }
function claimedByGoals(){ return S.goals.reduce(function(t,g){ return t+(+g.earmarked||0); },0); }
function allocation(){
  var gross=grossAccounts(), edu=earmarkedEdu();
  var spare=Math.max(0,gross-edu);
  var wanted=claimedByGoals();
  var claimed=Math.min(wanted,spare);
  var over=Math.max(0,wanted-spare);
  var free=Math.max(0,spare-claimed);

}
function netWorth(){ return grossAccounts()-debtBal(); }
function acctWeight(kind, taxRate){
  var t=(+taxRate||30)/100;
  if(kind==="tfsa"||kind==="fhsa") return 1;
  if(kind==="rrsp"||kind==="pension") return 1-t;
  if(kind==="nonreg") return 1-t*0.5;
  if(kind==="corp") return 1-t*0.75;
  if(kind==="resp") return 0;
  return 1-t*0.5;
}
function spendableTotal(){
  var t=(+S.fi.taxRate||30);
  return S.accounts.filter(isRetirementAcct).reduce(function(sum,a){ return sum+(+a.bal||0)*acctWeight(a.kind,t); },0);
}

/* ---------- independence ----------
   The lifestyle number comes straight from the plan: expenses plus spending
   money — by the time you are living off the pile, the debts are gone and the
   saving is done. A manual override stays available. */
function lifestyleAuto(){ return expensesMo()+Math.max(0,spendMo()); }
function fiLifestyleMo(){ return S.fi.lifestyleMode==="manual" ? (+S.fi.lifestyleMo||0) : lifestyleAuto(); }
function fiTargetAnnual(){
  var life=fiLifestyleMo()*12;
  var other=(+S.fi.otherIncomeMo||0)*12;
  return Math.max(0, life-other);
}
function fiNumber(){
  var swr=(+S.fi.swr||0)/100;

}
function fiPile(){ return allocation().free; }
function fiProgress(){ var n=fiNumber(); return n>0?Math.min(1,fiPile()/n):0; }
function fiYears(){
  var n=fiNumber(), cur=fiPile(), pmt=fiContribMo(), r=+S.fi.returnPct||0;
  if(n<=0) return null;

/* Debt payoff engine, from The Waterfall. Minimums always paid; the attack
   pool (all extras) hits one debt at a time by strategy. When a debt clears,
   its minimum rolls into the pool. */
function simulate(extraPool,strategy){
  strategy=strategy||S.strategy||"avalanche";
  var ds=S.debts.map(function(d){ return {id:d.id,name:d.name,bal:+d.balance||0,r:(+d.rate||0)/100/12,min:+d.min||0}; })
                .filter(function(d){ return d.bal>0; });
  if(!ds.length) return {months:0,interest:0,order:[],impossible:false};
  var months=0,interest=0,order=[];
  while(ds.length && months<600){
    months++;
    var pool=extraPool;
    ds.sort(strategy==="snowball"?function(a,b){ return a.bal-b.bal; }:function(a,b){ return b.r-a.r; });
    for(var i=0;i<ds.length;i++){
      var d=ds[i], int_=d.bal*d.r; interest+=int_; d.bal+=int_;
      var pay=Math.min(d.bal,d.min); d.bal-=pay;
    }
    for(var i=0;i<ds.length && pool>0;i++){
      var take=Math.min(ds[i].bal,pool); ds[i].bal-=take; pool-=take;
    }
    for(var i=ds.length-1;i>=0;i--){
      if(ds[i].bal<=0.005){ order.push({name:ds[i].name,month:months}); extraPool+=ds[i].min; ds.splice(i,1); }
    }
  }
  return {months:months,interest:Math.round(interest),order:order,impossible:ds.length>0};
}

var AUDIT_RULES=[

  [/\b(amazon|amzn|winners|sportchek|canadian tire|home depot|rona|indigo|lululemon|best buy)\b/i,"enjoy"],
  [/\b(vet|petsmart|pet valu|chewy)\b/i,"enjoy"],
  [/\b(gym|goodlife|planet fitness|ymca)\b/i,"committed"],
  [/\b(transfer to|tfr to|transfer out|payment to.*account)\b/i,"ignore"],
  [/\b(atm|withdrawal|cash)\b/i,"enjoy"],
  [/\b(fee|service charge|nsf|overdraft|interest charge)\b/i,"debt"]
];
function merchKey(desc){
  return String(desc||"").toUpperCase().replace(/[0-9#*]/g,"").replace(/\s+/g," ").trim().slice(0,18);
}
function categorizeTx(desc,inflow){
  var k=merchKey(desc);
  if(S.rules[k]) return S.rules[k];
  if(inflow) return "income";
  for(var i=0;i<AUDIT_RULES.length;i++){ if(AUDIT_RULES[i][0].test(desc)) return AUDIT_RULES[i][1]; }
  return "enjoy";
}
function parseStatement(text){
  var lines=String(text||"").split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  if(!lines.length) return {txns:[],err:"Nothing to parse"};
  var delim=[",","\t",";"].map(function(d){ return [d,(lines[0].split(d).length)]; }).sort(function(a,b){ return b[1]-a[1]; })[0][0];
  function cells(l){
    var out=[],cur="",q=false;
    for(var i=0;i<l.length;i++){ var ch=l[i];
      if(ch==='"'){ q=!q; continue; }
      if(ch===delim&&!q){ out.push(cur); cur=""; } else cur+=ch;
    }
    out.push(cur); return out.map(function(c){ return c.trim(); });
  }
  var head=cells(lines[0]).map(function(c){ return c.toLowerCase(); });
  var hasHeader=head.some(function(c){ return /date|desc|amount|debit|credit|merchant|withdraw|deposit/.test(c); });
  var idx={date:-1,desc:-1,amt:-1,debit:-1,credit:-1};
  if(hasHeader){
    head.forEach(function(c,i){
      if(idx.date<0&&/date/.test(c)) idx.date=i;
      if(idx.desc<0&&/desc|merchant|detail|narrat|memo|transaction/.test(c)) idx.desc=i;
      if(idx.debit<0&&/debit|withdraw/.test(c)) idx.debit=i;
      if(idx.credit<0&&/credit|deposit/.test(c)) idx.credit=i;
      if(idx.amt<0&&/^amount$|^amt$/.test(c)) idx.amt=i;
    });
  }
  function num(v){ if(v==null||v==="") return null; var n=+String(v).replace(/[$,\s]/g,"").replace(/^\((.*)\)$/,"-$1"); return isFinite(n)?n:null; }
  function pdate(v){
    var d=new Date(v); if(!isNaN(d)) return d;
    var m=String(v).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(m){ var a=+m[1],b=+m[2],y=+m[3]; if(y<100)y+=2000; if(a>12) return new Date(y,b-1,a); return new Date(y,a-1,b); }
    return null;
  }
  var txns=[];
  lines.slice(hasHeader?1:0).forEach(function(l){
    var c=cells(l); if(c.length<2) return;
    var date=null,desc="",out=null,inn=null;
    if(hasHeader){
      date=idx.date>=0?pdate(c[idx.date]):null;
      desc=idx.desc>=0?c[idx.desc]:"";
      if(idx.debit>=0||idx.credit>=0){ out=idx.debit>=0?num(c[idx.debit]):null; inn=idx.credit>=0?num(c[idx.credit]):null; }
      else if(idx.amt>=0){ var v=num(c[idx.amt]); if(v!=null){ if(v<0){ out=-v; } else { inn=v; } } }
    }
    if(!hasHeader||(!desc&&out==null&&inn==null)){
      var nums=[],texts=[];
      c.forEach(function(x,i){ var n=num(x); if(n!=null&&!/\d{4}-\d{2}-\d{2}|\//.test(x)) nums.push([i,n]); else texts.push([i,x]); });
      date=null;
      for(var i=0;i<c.length;i++){ var d2=pdate(c[i]); if(d2){ date=d2; break; } }
      texts.sort(function(a,b){ return b[1].length-a[1].length; });
      desc=texts.length?texts[0][1]:"";
      if(nums.length===1){ var v2=nums[0][1]; if(v2<0) out=-v2; else out=v2; }
      else if(nums.length>=2){ out=nums[nums.length-2][1]||null; inn=nums[nums.length-1][1]||null; if(out===0)out=null; if(inn===0)inn=null; }
    }
    if(!desc&&out==null&&inn==null) return;
    var inflow=(inn!=null&&inn>0&&(out==null||out===0));
    var amt=inflow?inn:(out!=null?out:0);
    if(!(amt>0)) return;
    txns.push({id:uid(),d:date?iso(date):null,ym:date?iso(date).slice(0,7):"?",desc:desc||"(no description)",amt:Math.round(amt*100)/100,inflow:inflow,b:categorizeTx(desc,inflow)});
  });
  if(!txns.length) return {txns:[],err:"Could not find transactions. Paste the raw CSV export, headers included."};
  return {txns:txns,err:null};
}
function auditTotals(txns){
  var t={enjoy:0,committed:0,debt:0,forward:0,income:0,ignore:0};
  txns.forEach(function(x){ t[x.b]=(t[x.b]||0)+x.amt; });
  return t;
}
function findRecurring(txns){
  var by={};
  txns.forEach(function(x){ if(x.inflow||x.b==="ignore"||x.b==="income") return; var k=merchKey(x.desc); (by[k]=by[k]||[]).push(x); });
  var out=[];
  Object.keys(by).forEach(function(k){
    var g=by[k]; if(g.length<2) return;
    var avg=g.reduce(function(t,x){ return t+x.amt; },0)/g.length;
    if(avg<5) return;
    var tight=g.every(function(x){ return Math.abs(x.amt-avg)<=Math.max(3,avg*0.15); });
    if(!tight) return;
    var already=S.expenses.some(function(b){ return merchKey(b.name)===k||String(b.name||"").toUpperCase().indexOf(k.split(" ")[0])>=0; });
    if(already) return;
    out.push({key:k,desc:g[0].desc,avg:Math.round(avg*100)/100,n:g.length});
  });
  return out.slice(0,6);
}

function pieSlices(){
  var slices=[], ct=catTotals();
  Object.keys(ct).sort(function(a,b){ return ct[b]-ct[a]; }).forEach(function(c){
    if(ct[c]>0) slices.push({label:c, val:ct[c], color:catColor(c)});
  });
  if(debtMo()>0) slices.push({label:"Debt payments", val:debtMo(), color:"#f0628a"});
  var goalPalette=["#6de0a8","#9d7bff","#f6cf6a","#6ee0ec","#4ea3e0","#9af0c6"];
  S.goals.forEach(function(g,i){
    if((+g.contribMo||0)>0) slices.push({label:g.name||"Goal", val:+g.contribMo, color:goalPalette[i%goalPalette.length]});
  });
  if(fiContribMo()>0) slices.push({label:"Independence investing", val:fiContribMo(), color:"#f0b73e"});
  var enjoy=spendMo();
  if(enjoy>1) slices.push({label:"Spending money", val:enjoy, color:"rgba(157,123,255,.75)"});
  return slices;
}
function drawPie(P){
  var svg=document.getElementById("pie"); if(!svg) return;
  var slices=pieSlices(), total=slices.reduce(function(t,s){ return t+s.val; },0);
  var cx=115, cy=115, r=100, ir=62;
  if(total<=0){
    svg.innerHTML='<circle cx="115" cy="115" r="100" fill="none" stroke="rgba(120,130,180,.2)" stroke-width="38"/>';
    var lg0=document.getElementById("legend");
    if(lg0) lg0.innerHTML='<div style="font-size:11.5px;color:var(--dim);text-align:center">Add expenses, debts or goals to see the split.</div>';
    return;
  }
  var ang=-Math.PI/2, paths="";
  slices.forEach(function(s){
    var frac=s.val/total, a2=ang+frac*Math.PI*2;
    var pad=slices.length>1?0.012:0;
    var x1=cx+r*Math.cos(ang+pad), y1=cy+r*Math.sin(ang+pad);
    var x2=cx+r*Math.cos(a2-pad), y2=cy+r*Math.sin(a2-pad);
    var xi2=cx+ir*Math.cos(a2-pad), yi2=cy+ir*Math.sin(a2-pad);
    var xi1=cx+ir*Math.cos(ang+pad), yi1=cy+ir*Math.sin(ang+pad);
    var large=(a2-ang)>Math.PI?1:0;
    paths+='<path d="M'+x1+','+y1+' A'+r+','+r+' 0 '+large+' 1 '+x2+','+y2+' L'+xi2+','+yi2+' A'+ir+','+ir+' 0 '+large+' 0 '+xi1+','+yi1+' Z" fill="'+s.color+'"/>';
    ang=a2;
  });
  svg.innerHTML=paths;
  var lg=document.getElementById("legend"); if(!lg) return;
  lg.innerHTML=slices.map(function(s){
    var pc=Math.round(s.val/total*100);
    return '<div style="display:flex;align-items:center;gap:9px;padding:5px 0">'
      +'<span style="width:10px;height:10px;border-radius:3px;background:'+s.color+';flex-shrink:0"></span>'
      +'<span style="flex:1;font-size:12px;color:var(--txt);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.label)+'</span>'
      +'<span class="mono" style="font-size:11.5px;color:var(--muted);flex-shrink:0">'+fmt(s.val)+'</span>'
      +'<span class="mono" style="font-size:10px;color:var(--dim);width:34px;text-align:right;flex-shrink:0">'+pc+'%</span></div>';
  }).join('');
}

    h+='<div style="font-size:10.5px;color:var(--dim);line-height:1.5;margin-bottom:10px">A snapshot is taken automatically each month: total debt, and monthly spending money. Debt falling and spending rising is the whole game.</div>';

    } else {
      h+='<svg id="trend" viewBox="0 0 320 90" style="width:100%;height:auto;display:block"></svg>';
      h+='<div id="trendMeta"></div>';

function drawTrend(){
  var svg=document.getElementById("trend"); if(!svg) return;
  var H=S.hist.slice(-12);
  var maxD=Math.max.apply(null,H.map(function(x){return x.debt;}).concat([1]));
  var maxE=Math.max.apply(null,H.map(function(x){return Math.max(0,x.spend);}).concat([1]));
  var W=320,HT=90,pad=6;
  function px(i){ return pad+(W-2*pad)*(H.length===1?0:i/(H.length-1)); }
  function pyD(v){ return pad+(HT-2*pad)*(1-v/maxD); }
  function pyE(v){ return pad+(HT-2*pad)*(1-Math.max(0,v)/maxE); }
  var dLine=H.map(function(x,i){ return (i?'L':'M')+px(i).toFixed(1)+' '+pyD(x.debt).toFixed(1); }).join(' ');
  var eLine=H.map(function(x,i){ return (i?'L':'M')+px(i).toFixed(1)+' '+pyE(x.spend).toFixed(1); }).join(' ');
  svg.innerHTML='<path d="'+dLine+'" fill="none" stroke="var(--rose)" stroke-width="2" stroke-linecap="round"/>'
    +'<path d="'+eLine+'" fill="none" stroke="var(--violet)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>'
    +H.map(function(x,i){ return '<circle cx="'+px(i).toFixed(1)+'" cy="'+pyD(x.debt).toFixed(1)+'" r="2.6" fill="var(--rose)"/>'; }).join('');
  var tm=document.getElementById("trendMeta"); if(!tm) return;
  var first=H[0], last=H[H.length-1];
  tm.innerHTML='<div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);margin-top:2px"><span>'+esc(first.ym)+'</span><span>'+esc(last.ym)+'</span></div>'
    +'<div style="display:flex;gap:14px;margin-top:8px;font-size:10.5px;flex-wrap:wrap">'
    +'<span><span style="display:inline-block;width:14px;height:2px;background:var(--rose);vertical-align:middle;margin-right:5px"></span>Debt '+fmt(last.debt)+(last.debt<first.debt?' <span style="color:var(--green2)">(down '+fmt(first.debt-last.debt)+')</span>':'')+'</span>'
    +'<span><span style="display:inline-block;width:14px;height:2px;background:var(--violet);vertical-align:middle;margin-right:5px"></span>Spending money '+fmt(last.spend)+'/mo</span>'
    +(last.nw!=null?'<span style="color:var(--muted)">Net worth <span class="mono" style="color:var(--gold2)">'+fmtM(last.nw)+'</span>'+(first.nw!=null&&last.nw>first.nw?' <span style="color:var(--green2)">(up '+fmtM(last.nw-first.nw)+')</span>':'')+'</span>':'')+'</div>';
}

    if(delta>0.5){
      h+='<div style="font-size:11px;color:var(--gold2);line-height:1.5;padding-top:8px;margin-top:8px;border-top:1px solid rgba(120,130,180,.12)">'
        +'Waiting a year to start costs '+fmt(perPeriod(delta))+f.short+' more, forever, to land in the same place.</div>';
    }
  }

  if((+g.contribMo||0)>0){
    var atPace=m.atPace;
    var ok=isFinite(atPace)&&atPace<=m.months;
    var gp=isFinite(atPace)?Math.abs(atPace-m.months):null;
    var col=ok?"var(--green2)":"#f6b39e";
    h+='<div style="padding-top:9px;margin-top:9px;border-top:1px solid rgba(120,130,180,.12)">';
    h+='<div style="font-size:11.5px;color:var(--txt);font-weight:600;margin-bottom:5px">At the '+fmt(perPeriod(+g.contribMo))+f.short+' you are putting aside now</div>';
    if(!isFinite(atPace)){
      h+='<div style="font-size:11.5px;color:#f6b39e;line-height:1.5">This never arrives. The contribution is too small to reach the target at all.</div>';
    } else {
      var arrive=new Date(); arrive.setDate(1); arrive.setMonth(arrive.getMonth()+Math.round(atPace));
      var arriveTxt=arrive.toLocaleDateString("en-CA",{month:"short",year:"numeric"});
      h+='<div style="display:flex;justify-content:space-between;gap:9px;align-items:baseline;margin-bottom:6px">'
        +'<span style="font-size:11px;color:var(--dim)">You would arrive</span>'
        +'<span class="mono" style="font-size:13px;font-weight:700;color:'+col+'">'+arriveTxt+'</span></div>';
      h+='<div style="display:flex;justify-content:space-between;gap:9px;align-items:baseline;margin-bottom:7px">'
        +'<span style="font-size:11px;color:var(--dim)">Against your date</span>'
        +'<span class="mono" style="font-size:12px;font-weight:700;color:'+col+'">'+fmtDur(gp)+' '+(ok?"early":"late")+'</span></div>';
      if(!ok){
        h+='<div style="font-size:11.5px;color:#f6b39e;line-height:1.5">'
          +'To hit '+niceDate(g.due)+' instead, bring it to '+fmt(perPeriod(m.reqMo))+f.short+'. '
          +'Or move the date to '+arriveTxt+' and what you are already setting aside is enough.</div>';
      } else {
        h+='<div style="font-size:11.5px;color:var(--green2);line-height:1.5">Ahead of schedule. You could ease off to '+fmt(perPeriod(m.reqMo))+f.short+' and still make the date.</div>';
      }
    }
    h+='</div>';
  }
  if(m.reqMo!==null && m.need>0 && (+g.contribMo||0)<m.reqMo-0.5){
    h+='<button class="btn sm" data-fund="'+g.id+'" style="width:100%;margin-top:10px;background:linear-gradient(180deg,#6de0a8,#2fd180)">Fund this pace · set '+fmt(Math.ceil(m.reqMo))+'/mo in the plan</button>';
  }
  h+='</div>';
  return h;
}

/* ===================== WIRING ===================== */
function wire(){
  var app=document.getElementById("app");
  app.querySelectorAll("[data-tab]").forEach(function(b){
    b.onclick=function(){ S.tab=b.dataset.tab; save(); window.scrollTo(0,0); render(); };
  });
  var ub=document.getElementById("undoBtn"); if(ub) ub.onclick=stepBack;
  var ta=document.getElementById("toggleAssume"); if(ta) ta.onclick=function(){ S.showAssume=!S.showAssume; render(); };

  function groomMoney(el){
    var raw=el.value;
    if(!/^[\s$0-9.,\-]*$/.test(raw)) return;
    var caret=el.selectionStart;
    var digitsBefore=raw.slice(0,caret).replace(/[^0-9]/g,"").length;
    var cleaned=raw.replace(/[$,\s]/g,"");
    if(!/^-?\d*\.?\d*$/.test(cleaned)) return;
    var shown=fmtGroup(cleaned);
    if(shown===raw) return;
    el.value=shown;
    var pos=0,count=0;
    while(pos<shown.length && count<digitsBefore){ if(/[0-9]/.test(shown.charAt(pos))) count++; pos++; }
    try{ el.setSelectionRange(pos,pos); }catch(e){}
  }
  function bindField(sel, apply){
    app.querySelectorAll(sel).forEach(function(el){
      if(el.tagName==="SELECT"){
        el.onchange=function(){ apply(el); save(); render(); };
      } else {
        var money=el.dataset.money==="1";
        el.oninput=function(){ if(money) groomMoney(el); apply(el); save(); liveRefresh(); };
        el.onchange=function(){
          if(money){ var n=toNum(el.value); el.value=(n===""?"":fmtGroup(n)); }
          apply(el); save();
        };
        el.onblur=function(){ scheduleRender(); };
      }
    });
  }
  bindField("[data-s]", function(el){
    var k=el.dataset.s;
    S[k]=(k==="gridMode")?el.value:toNum(el.value);
  });
  bindField("[data-e]", function(el){
    var e=S.expenses.filter(function(x){ return x.id===el.dataset.e; })[0]; if(!e) return;
    var k=el.dataset.k;
    e[k]=(k==="name"||k==="cat"||k==="freq")?el.value:toNum(el.value);
  });
  bindField("[data-d]", function(el){
    var d=S.debts.filter(function(x){ return x.id===el.dataset.d; })[0]; if(!d) return;
    var k=el.dataset.k;
    d[k]=(k==="name")?el.value:toNum(el.value);
  });
  bindField("[data-g]", function(el){
    var g=S.goals.filter(function(x){ return x.id===el.dataset.g; })[0]; if(!g) return;
    var k=el.dataset.k;
    g[k]=(k==="name"||k==="due"||k==="prio"||k==="kind")?el.value:toNum(el.value);
  });
  bindField("[data-a]", function(el){
    var a=S.accounts.filter(function(x){ return x.id===el.dataset.a; })[0]; if(!a) return;
    var k=el.dataset.k;
    a[k]=(k==="name"||k==="kind")?el.value:toNum(el.value);
  });
  bindField("[data-fi]", function(el){
    var k=el.dataset.fi;
    S.fi[k]=(k==="lifestyleMode")?el.value:toNum(el.value);
  });

  var ae=document.getElementById("addExp");
  if(ae) ae.onclick=function(){ S.expenses.push({id:uid(),name:"",cat:"Housing",amt:"",freq:"monthly"}); save(); render();
    setTimeout(function(){ var els=document.querySelectorAll('[data-e][data-k="name"]'); if(els.length) els[els.length-1].focus(); },40); };
  app.querySelectorAll("[data-newexp]").forEach(function(b){
    b.onclick=function(){
      var id=uid();
      S.expenses.push({id:id,name:"",cat:b.dataset.newexp,amt:"",freq:"monthly"});
      save(); render();
      setTimeout(function(){ var el=document.querySelector('[data-e="'+id+'"][data-k="name"]'); if(el) el.focus(); },40);
    };
  });
  var ad=document.getElementById("addDebt");
  if(ad) ad.onclick=function(){ var id=uid(); S.debts.push({id:id,name:"",balance:"",rate:"",min:"",extra:""}); save(); render();
    setTimeout(function(){ var el=document.querySelector('[data-d="'+id+'"][data-k="name"]'); if(el) el.focus(); },40); };
  var ag=document.getElementById("addGoal");
  if(ag) ag.onclick=function(){
    var id=uid();
    S.goals.push({id:id,name:"",target:"",due:"",prio:"high",kind:"cash",ret:6,earmarked:"",contribMo:""});
    S.tab="goals"; S.open=id; save(); window.scrollTo(0,0); render();
    setTimeout(function(){ var el=document.querySelector('[data-g="'+id+'"][data-k="name"]'); if(el) el.focus(); },60);
  };
  var aac=document.getElementById("addAcct");
  if(aac) aac.onclick=function(){
    var id=uid();
    S.accounts.push({id:id,name:"",kind:"tfsa",bal:"",contribMo:""});
    save(); render();
    setTimeout(function(){ var el=document.querySelector('[data-a="'+id+'"][data-k="name"]'); if(el) el.focus(); },40);
  };
  app.querySelectorAll("[data-open]").forEach(function(el){
    el.onclick=function(){ S.open=(S.open===el.dataset.open)?null:el.dataset.open; render(); };
  });
  app.querySelectorAll("[data-close]").forEach(function(b){
    b.onclick=function(){ S.open=null; render(); };
  });
  app.querySelectorAll("[data-gotogoal]").forEach(function(el){
    el.onclick=function(){ S.tab="goals"; S.open=el.dataset.gotogoal; save(); window.scrollTo(0,0); render(); };
  });
  app.querySelectorAll("[data-lens]").forEach(function(el){
    el.onclick=function(e){ e.stopPropagation(); S.lens=el.dataset.lens; save(); render(); };
  });
  app.querySelectorAll("[data-lifemode]").forEach(function(b){
    b.onclick=function(){ S.fi.lifestyleMode=b.dataset.lifemode; save(); render(); };
  });
  app.querySelectorAll("[data-fund]").forEach(function(b){
    b.onclick=function(){
      var g=S.goals.filter(function(x){ return x.id===b.dataset.fund; })[0]; if(!g) return;
      var m=goalMath(g); if(m.reqMo===null) return;
      var prev=g.contribMo;
      g.contribMo=Math.ceil(m.reqMo);
      save(); render();
      toast("Funded: "+fmt(g.contribMo)+"/mo into the plan","Undo",function(){ g.contribMo=prev; save(); render(); });
    };
  });
  app.querySelectorAll("[data-dela]").forEach(function(b){ b.onclick=function(){ delFrom("accounts",b.dataset.dela,"Account"); }; });
  var tn=document.getElementById("toggleNotes");
  if(tn) tn.onclick=function(){ S.showNotes=!S.showNotes; render(); };

  var tc=document.getElementById("toggleCats");
  if(tc) tc.onclick=function(){ S.showCats=!S.showCats; render(); };
  var ac=document.getElementById("addCat"), nc=document.getElementById("newCat");
  function doAddCat(){
    var v=(nc.value||"").trim(); if(!v) { nc.focus(); return; }
    if(cats().indexOf(v)<0){ S.cats=cats().slice(); S.cats.push(v); save(); }
    render();
    setTimeout(function(){ var n=document.getElementById("newCat"); if(n) n.focus(); },30);
  }
  if(ac) ac.onclick=doAddCat;
  if(nc) nc.onkeydown=function(e){ if(e.key==="Enter") doAddCat(); };
  app.querySelectorAll("[data-delcat]").forEach(function(b){
    b.onclick=function(){
      var c=b.dataset.delcat, snap=JSON.stringify(cats());
      S.cats=cats().filter(function(x){ return x!==c; });
      if(!S.cats.length) S.cats=["Other"];
      save(); render();
      toast("Removed "+c,"Undo",function(){ S.cats=JSON.parse(snap); save(); render(); });
    };
  });
  var ls=document.getElementById("loadStarter");
  if(ls) ls.onclick=function(){
    var snap=JSON.stringify(S.expenses);
    STARTER.forEach(function(r){ S.expenses.push({id:uid(),name:r[0],cat:r[1],amt:"",freq:r[2]}); });
    save(); render();
    toast("Loaded "+STARTER.length+" starter lines","Undo",function(){ S.expenses=JSON.parse(snap); save(); render(); });
  };
  app.querySelectorAll("[data-strat]").forEach(function(b){
    b.onclick=function(){ S.strategy=b.dataset.strat; save(); render(); };
  });

  function delFrom(coll,id,label){
    var snap=JSON.stringify(S[coll]);
    S[coll]=S[coll].filter(function(x){ return x.id!==id; });
    save(); render();
    toast(label+" removed","Undo",function(){ S[coll]=JSON.parse(snap); save(); render(); });
  }
  app.querySelectorAll("[data-dele]").forEach(function(b){ b.onclick=function(){ delFrom("expenses",b.dataset.dele,"Expense"); }; });
  app.querySelectorAll("[data-deld]").forEach(function(b){ b.onclick=function(){ delFrom("debts",b.dataset.deld,"Debt"); }; });
  app.querySelectorAll("[data-delg]").forEach(function(b){ b.onclick=function(){ delFrom("goals",b.dataset.delg,"Goal"); }; });
  app.querySelectorAll("[data-delspend]").forEach(function(b){ b.onclick=function(){ delFrom("spends",b.dataset.delspend,"Spend"); }; });

  /* month: spend log */
  var spAdd=document.getElementById("spAdd");
  if(spAdd) spAdd.onclick=function(){
    var a=toNum((document.getElementById("spAmt")||{}).value||"");
    if(!(a>0)){ var f=document.getElementById("spAmt"); if(f) f.focus(); return; }
    var note=((document.getElementById("spNote")||{}).value||"").trim();
    S.spends.push({id:uid(),ds:iso(new Date()),amt:a,note:note});
    if(S.spends.length>400) S.spends=S.spends.slice(-400);
    save(); render();
  };
  ["spAmt","spNote"].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener("keydown",function(e){ if(e.key==="Enter"&&spAdd) spAdd.click(); });
  });
  /* month: moves */
  app.querySelectorAll("[data-exec]").forEach(function(cb){
    cb.onchange=function(){
      var ym=ymNow();
      if(!S.exec[ym]) S.exec[ym]={};
      S.exec[ym][cb.dataset.exec]=cb.checked;
      var keys=Object.keys(S.exec); if(keys.length>60){ keys.sort(); delete S.exec[keys[0]]; }
      save();
      var done=monthExecuted(ym);
      render();
      if(done && cb.checked) toast("⚡ Executed. The month is handled.");
    };
  });
  app.querySelectorAll("[data-acct]").forEach(function(el){
    el.addEventListener("input",function(){ S.accounts[el.dataset.acct]=el.value; save(); });
    el.addEventListener("blur",function(){ scheduleRender(); });
  });

  /* review: analyzer */
  var audRun=document.getElementById("audRun");
  if(audRun) audRun.onclick=function(){
    var r=parseStatement((document.getElementById("audText")||{}).value||"");
    var errEl=document.getElementById("audErr");
    if(r.err){ if(errEl) errEl.textContent=r.err; return; }
    var months={}; r.txns.forEach(function(x){ months[x.ym]=(months[x.ym]||0)+1; });
    var ym=Object.keys(months).sort(function(a,b){ return months[b]-months[a]; })[0];
    S.audit={ym:ym==="?"?"":ym,txns:r.txns.slice(0,400),importedAt:iso(new Date())};
    save(); render();
    toast("Statement check: "+r.txns.length+" transactions read");
  };
  var audPick=document.getElementById("audPick");
  if(audPick) audPick.onclick=function(){ var f=document.getElementById("audFile"); if(f) f.click(); };
  var audFile=document.getElementById("audFile");
  if(audFile) audFile.onchange=function(){
    var f=audFile.files&&audFile.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){ var t=document.getElementById("audText"); if(t){ t.value=String(rd.result||""); } var run=document.getElementById("audRun"); if(run) run.click(); };
    rd.readAsText(f);
  };
  var audClear=document.getElementById("audClear");
  if(audClear) audClear.onclick=function(){
    var snap=JSON.stringify(S.audit);
    S.audit=null; save(); render();
    toast("Check cleared","Undo",function(){ try{ S.audit=JSON.parse(snap); save(); render(); }catch(e){} });
  };
  app.querySelectorAll(".audrow").forEach(function(row){
    row.onclick=function(){
      var tx=(S.audit&&S.audit.txns||[]).filter(function(x){ return x.id===row.dataset.tx; })[0];
      if(!tx) return;
      var i=BUCKET_CYCLE.indexOf(tx.b);
      tx.b=BUCKET_CYCLE[(i<0?0:i+1)%BUCKET_CYCLE.length];
      S.rules[merchKey(tx.desc)]=tx.b;
      save(); render();
    };
  });
  app.querySelectorAll("[data-addrec]").forEach(function(b){
    b.onclick=function(){
      var name=b.dataset.recname;
      S.expenses.push({id:uid(),name:name,cat:guessCat(name),amt:+b.dataset.recamt||0,freq:"monthly"});
      save(); render();
      toast("Added to expenses: "+name,"Undo",function(){ try{ S.expenses.pop(); save(); render(); }catch(e){} });
    };
  });
  var pill=document.getElementById("pill");
  if(pill && setupDone()){ pill.style.cursor="pointer"; pill.onclick=function(){ S.tab="month"; save(); window.scrollTo(0,0); render(); }; }
}

save();   /* persist migrations + publish before first paint */
render();
document.addEventListener("visibilitychange",function(){ if(!document.hidden) scheduleRender(); });
window.addEventListener("pageshow",function(){ scheduleRender(); });
(function(){
  try{
    if(navigator.storage && navigator.storage.persist && navigator.storage.persisted){
      navigator.storage.persisted().then(function(a){ if(!a) navigator.storage.persist(); });
    }
  }catch(e){}
})();
</script>
</body>
</html>
